<script type="application/json" id="study-data">{"kind": "multiple-choice", "questions": [{"lecture": 1, "topic": "design-scope", "slides": "9–13", "answer": 1, "en": {"prompt": "Which example best shows that design extends beyond visual appearance?", "options": ["A green color is replaced with blue.", "A read-receipt rule changes social expectations.", "A heading uses a larger font.", "An icon receives a new outline."], "explain": "Read receipts shape system behavior and relationships, in addition to any visible symbol."}, "de": {"prompt": "Welches Beispiel zeigt, dass Design über das Aussehen hinausgeht?", "options": ["Grün wird durch Blau ersetzt.", "Lesebestätigungen verändern soziale Erwartungen.", "Eine Überschrift erhält eine größere Schrift.", "Ein Symbol bekommt eine neue Kontur."], "explain": "Lesebestätigungen gestalten Systemverhalten und Beziehungen."}}, {"lecture": 1, "topic": "design-scope", "slides": "12–13", "answer": 3, "en": {"prompt": "What is a design decision?", "options": ["A change that always improves every stakeholder’s experience.", "A technical fact with no intended or unintended consequences.", "Only a choice about the final color palette.", "A reasoned or implicit choice among possible ways to shape a product."], "explain": "Design decisions pursue goals under constraints and can have several kinds of effects."}, "de": {"prompt": "Was ist eine Designentscheidung?", "options": ["Eine Änderung, die allen Beteiligten immer hilft.", "Eine technische Tatsache ohne Auswirkungen.", "Nur die Wahl der endgültigen Farben.", "Eine begründete oder implizite Wahl zwischen Gestaltungsmöglichkeiten."], "explain": "Entscheidungen verfolgen Ziele unter Rahmenbedingungen und haben unterschiedliche Folgen."}}, {"lecture": 1, "topic": "decision-areas", "slides": "17", "answer": 2, "en": {"prompt": "Who may add people to a group chat belongs most directly to which decision area?", "options": ["Revenue reporting.", "Typography.", "Rules and boundaries.", "Aesthetic appearance."], "explain": "Permissions establish which actions users are allowed to perform."}, "de": {"prompt": "Wer Personen zu einem Gruppenchat hinzufügen darf, betrifft welchen Bereich?", "options": ["Umsatzberichte.", "Typografie.", "Regeln und Grenzen.", "Ästhetisches Erscheinungsbild."], "explain": "Berechtigungen bestimmen erlaubte Handlungen."}}, {"lecture": 1, "topic": "decision-areas", "slides": "16", "answer": 0, "en": {"prompt": "Placing important chats at the top is primarily a decision about what?", "options": ["Visibility and priority.", "Production tooling.", "Data compression.", "Material selection."], "explain": "Ordering content directs attention and determines what becomes prominent."}, "de": {"prompt": "Wichtige Chats ganz oben anzuzeigen, betrifft hauptsächlich welchen Bereich?", "options": ["Sichtbarkeit und Priorität.", "Produktionswerkzeuge.", "Datenkompression.", "Materialauswahl."], "explain": "Die Reihenfolge lenkt Aufmerksamkeit und hebt Inhalte hervor."}}, {"lecture": 1, "topic": "decision-areas", "slides": "15", "answer": 2, "en": {"prompt": "Why does adding a feature not automatically improve a product?", "options": ["Users always reject products with multiple functions.", "Maintenance effort always decreases with feature count.", "It can increase complexity, errors and cognitive load.", "Every additional feature must remove an existing feature."], "explain": "Added functions can create benefits while also increasing costs and demands."}, "de": {"prompt": "Warum verbessert eine zusätzliche Funktion ein Produkt nicht automatisch?", "options": ["Menschen lehnen grundsätzlich mehrere Funktionen ab.", "Mehr Funktionen senken immer den Wartungsaufwand.", "Sie kann Komplexität, Fehler und kognitive Belastung erhöhen.", "Jede neue Funktion muss eine alte ersetzen."], "explain": "Zusätzlicher Nutzen steht möglichen Kosten und Belastungen gegenüber."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "25", "answer": 1, "en": {"prompt": "“Students miss last-minute room changes” is best classified as what?", "options": ["An economic function.", "A problem statement about an unsatisfactory situation.", "A concrete technical solution.", "A completed prototype specification."], "explain": "It describes what is going wrong for particular people, not a selected intervention."}, "de": {"prompt": "Wie ist „Studierende übersehen kurzfristige Raumänderungen“ einzuordnen?", "options": ["Als ökonomische Funktion.", "Als Problem einer unbefriedigenden Situation.", "Als konkrete technische Lösung.", "Als fertige Prototypspezifikation."], "explain": "Die Aussage beschreibt eine Schwierigkeit für bestimmte Menschen."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "25–26", "answer": 2, "en": {"prompt": "Which statement expresses a need rather than a proposed solution?", "options": ["Build an automatic calendar integration.", "Create a new messenger channel.", "Students require reliable and timely information about changes.", "Add a push-notification system."], "explain": "A need describes what people require; the other options specify interventions."}, "de": {"prompt": "Welche Aussage beschreibt ein Bedürfnis statt einer Lösung?", "options": ["Eine automatische Kalenderintegration entwickeln.", "Einen neuen Messenger-Kanal erstellen.", "Studierende benötigen verlässliche und rechtzeitige Änderungsinformationen.", "Push-Benachrichtigungen einbauen."], "explain": "Das Bedürfnis beschreibt, was Menschen benötigen; die anderen Aussagen nennen Maßnahmen."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "26", "answer": 3, "en": {"prompt": "Which statement expresses the desired goal?", "options": ["The interface displays a blue icon.", "The app contains a settings screen.", "The team implements a notification button.", "Students notice relevant changes in time."], "explain": "A goal describes the preferred outcome, independently of one selected implementation."}, "de": {"prompt": "Welche Aussage beschreibt das gewünschte Ziel?", "options": ["Das Interface zeigt ein blaues Symbol.", "Die App enthält eine Einstellungsseite.", "Das Team programmiert einen Benachrichtigungsbutton.", "Studierende nehmen relevante Änderungen rechtzeitig wahr."], "explain": "Ein Ziel beschreibt einen gewünschten Zustand unabhängig von einer Umsetzung."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "29–30", "answer": 3, "en": {"prompt": "Why should designers identify the stakeholder perspective before solving a problem?", "options": ["The organization’s goals eliminate users’ needs.", "The first feature request identifies all causes.", "All stakeholders must have identical priorities.", "Different stakeholders may evaluate the same situation differently."], "explain": "Members, administrators and organizations can have conflicting needs and interests."}, "de": {"prompt": "Warum muss die Stakeholderperspektive vor der Problemlösung geklärt werden?", "options": ["Unternehmensziele beseitigen die Bedürfnisse der Nutzer.", "Der erste Funktionswunsch erklärt alle Ursachen.", "Alle Beteiligten müssen identische Prioritäten haben.", "Beteiligte können dieselbe Situation unterschiedlich bewerten."], "explain": "Mitglieder, Administration und Organisation können unterschiedliche Interessen haben."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "27–28", "answer": 0, "en": {"prompt": "What can happen after introducing a useful group-chat feature?", "options": ["It can create new problems such as overload or social pressure.", "It guarantees lasting satisfaction for all groups.", "It ends the need for further observation.", "It removes every conflict of interest."], "explain": "Solutions change situations and may create unintended consequences, requiring continued learning."}, "de": {"prompt": "Was kann nach Einführung einer nützlichen Gruppenchatfunktion passieren?", "options": ["Neue Probleme wie Überlastung oder sozialer Druck entstehen.", "Die Zufriedenheit aller Gruppen ist dauerhaft garantiert.", "Weitere Beobachtung wird überflüssig.", "Alle Interessenkonflikte verschwinden."], "explain": "Lösungen verändern Situationen und können neue Probleme erzeugen."}}, {"lecture": 1, "topic": "definitions", "slides": "39", "answer": 2, "en": {"prompt": "Which idea is central to Simon’s definition of design?", "options": ["Copying historical ornaments into every new product.", "Restricting design to industrial objects.", "Transforming existing situations into preferred ones.", "Avoiding all planning and deliberate choices."], "explain": "Simon emphasizes devising courses of action toward a preferred state."}, "de": {"prompt": "Welcher Gedanke ist zentral für Simons Designdefinition?", "options": ["Jedes neue Produkt mit historischen Ornamenten versehen.", "Design auf Industriegegenstände beschränken.", "Bestehende Situationen in bevorzugte Situationen überführen.", "Planung und bewusste Entscheidungen vermeiden."], "explain": "Design entwirft Handlungswege zu einem gewünschten Zustand."}}, {"lecture": 1, "topic": "definitions", "slides": "42", "answer": 1, "en": {"prompt": "Which statement best matches the course working definition?", "options": ["Decorate an interface after all meaningful decisions are finished.", "Deliberately shape possibilities for people within technological, organizational and societal conditions.", "Make every technically possible feature available.", "Choose one universal solution independently of context."], "explain": "The DDP definition combines deliberate choices, people and contextual constraints."}, "de": {"prompt": "Welche Aussage entspricht der Arbeitsdefinition des Kurses?", "options": ["Ein Interface verzieren, nachdem alle wichtigen Entscheidungen gefallen sind.", "Möglichkeiten für Menschen innerhalb technologischer, organisatorischer und gesellschaftlicher Bedingungen bewusst gestalten.", "Jede technisch mögliche Funktion bereitstellen.", "Eine universelle Lösung unabhängig vom Kontext wählen."], "explain": "Die DDP-Definition verbindet bewusste Gestaltung, Menschen und Rahmenbedingungen."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "46–47", "answer": 3, "en": {"prompt": "Which question most directly represents a design perspective on voice messages?", "options": ["How can audio bytes be compressed mathematically?", "How can sound be used as an independent artistic expression?", "How can server uptime be guaranteed operationally?", "When are voice messages helpful, and how should they work for people?"], "explain": "Design emphasizes usefulness, context and the shape of the experience; the other disciplines contribute complementary questions."}, "de": {"prompt": "Welche Frage entspricht der Designperspektive auf Sprachnachrichten?", "options": ["Wie lassen sich Audiodaten mathematisch komprimieren?", "Wie lässt sich Klang unabhängig künstlerisch ausdrücken?", "Wie lässt sich der Serverbetrieb zuverlässig absichern?", "Wann helfen Sprachnachrichten Menschen, und wie sollten sie funktionieren?"], "explain": "Design fragt nach Nutzen, Kontext und Nutzungserfahrung; andere Disziplinen ergänzen dies."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "50–51", "answer": 3, "en": {"prompt": "Which is part of a digital product beyond its interface?", "options": ["Only the colors visible on its home screen.", "Only the shape of its application icon.", "Only the font used in its menus.", "Support processes, moderation and organizational rules."], "explain": "The lecture includes technology, content, interaction, services and organization as product layers."}, "de": {"prompt": "Was gehört über das Interface hinaus zum digitalen Produkt?", "options": ["Nur die Farben der Startseite.", "Nur die Form des App-Symbols.", "Nur die Schrift der Menüs.", "Support, Moderation und organisatorische Regeln."], "explain": "Zum Produkt gehören auch Technik, Inhalte, Interaktionen, Services und Organisation."}}, {"lecture": 1, "topic": "product-language", "slides": "58", "answer": 2, "en": {"prompt": "A check mark indicates that a message was delivered. Which function is most direct?", "options": ["Ecological function.", "Symbolic identity function.", "Indicative function.", "Economic function."], "explain": "The sign communicates a state or use-related condition: Anzeichenfunktion."}, "de": {"prompt": "Ein Häkchen zeigt die Zustellung einer Nachricht. Welche Funktion ist am direktesten betroffen?", "options": ["Ökologische Funktion.", "Symbolische Identitätsfunktion.", "Anzeichenfunktion.", "Ökonomische Funktion."], "explain": "Das Zeichen vermittelt einen Zustand oder einen Nutzungshinweis."}}, {"lecture": 1, "topic": "product-language", "slides": "55–58", "answer": 0, "en": {"prompt": "A product communicates belonging to a community. Which function is most direct?", "options": ["Symbolic function.", "Data-transfer function.", "Indicative system-state function.", "Practical–technical function."], "explain": "Symbolic functions concern social, cultural and emotional meanings."}, "de": {"prompt": "Ein Produkt vermittelt Gemeinschaftszugehörigkeit. Welche Funktion ist am direktesten betroffen?", "options": ["Symbolfunktion.", "Datenübertragungsfunktion.", "Anzeichenfunktion für Systemzustände.", "Praktisch-technische Funktion."], "explain": "Symbolische Funktionen betreffen soziale, kulturelle und emotionale Bedeutungen."}}, {"lecture": 1, "topic": "product-language", "slides": "58", "answer": 1, "en": {"prompt": "Typography, spacing and chat-bubble shapes most directly illustrate what?", "options": ["Server encryption.", "Formal-aesthetic function.", "Organizational governance.", "Business monetization."], "explain": "These elements organize the perceivable form of the interface."}, "de": {"prompt": "Typografie, Abstände und Chat-Bubbles veranschaulichen welche Funktion?", "options": ["Serververschlüsselung.", "Formalästhetische Funktion.", "Organisatorische Steuerung.", "Monetarisierung."], "explain": "Diese Elemente gestalten die wahrnehmbare Erscheinung."}}, {"lecture": 1, "topic": "product-language", "slides": "57", "answer": 2, "en": {"prompt": "A feature strengthens retention and supports future business offerings. Which function is most direct?", "options": ["Indicative function.", "Sensory warning function.", "Economic function.", "Formal-aesthetic function."], "explain": "Economic functions concern business purpose and commercial value."}, "de": {"prompt": "Eine Funktion stärkt die Bindung und unterstützt Geschäftsangebote. Welche Funktion steht im Vordergrund?", "options": ["Anzeichenfunktion.", "Sensorische Warnfunktion.", "Ökonomische Funktion.", "Formalästhetische Funktion."], "explain": "Die ökonomische Funktion betrifft wirtschaftlichen Zweck und Wert."}}, {"lecture": 1, "topic": "good-design", "slides": "62", "answer": 0, "en": {"prompt": "A product claims capabilities it does not provide. Which Rams principle is most directly violated?", "options": ["Honest design.", "Innovative design.", "Aesthetic design.", "Long-lasting design."], "explain": "Honest design does not pretend to have functionality or value it lacks."}, "de": {"prompt": "Ein Produkt verspricht Fähigkeiten, die es nicht besitzt. Welches Rams-Prinzip verletzt es am direktesten?", "options": ["Ehrlichkeit.", "Innovation.", "Ästhetik.", "Langlebigkeit."], "explain": "Ehrliches Design täuscht keine Funktionalität vor."}}, {"lecture": 1, "topic": "good-design", "slides": "63", "answer": 2, "en": {"prompt": "What does “as little design as possible” emphasize?", "options": ["Use fewer resources only when users complain.", "Ignore usability to minimize development time.", "Focus on essentials through simplicity.", "Remove all necessary feedback and instructions."], "explain": "Rams’s principle favors purity and simplicity, not the absence of thoughtful design."}, "de": {"prompt": "Was bedeutet „so wenig Design wie möglich“?", "options": ["Ressourcen nur bei Beschwerden einsparen.", "Benutzbarkeit zugunsten kurzer Entwicklungszeit ignorieren.", "Konzentration auf das Wesentliche durch Einfachheit.", "Alle notwendigen Rückmeldungen und Anleitungen entfernen."], "explain": "Gemeint sind Einfachheit und Wesentlichkeit, nicht fehlende Gestaltung."}}, {"lecture": 1, "topic": "design-scope", "slides": "19–20", "answer": 1, "en": {"prompt": "Which design choice most directly affects the recipient’s workload?", "options": ["Reducing a decorative border.", "Allowing long voice messages that must be listened to.", "Moving the company logo in a presentation.", "Changing the app icon’s outline."], "explain": "Voice messages can reduce sender effort while increasing the recipient’s time and effort."}, "de": {"prompt": "Welche Entscheidung beeinflusst den Aufwand der empfangenden Person am direktesten?", "options": ["Einen dekorativen Rahmen verkleinern.", "Lange Sprachnachrichten erlauben, die angehört werden müssen.", "Das Firmenlogo in einer Präsentation verschieben.", "Die Kontur des App-Symbols ändern."], "explain": "Sprachnachrichten können Aufwand vom Sender zum Empfänger verlagern."}}, {"lecture": 1, "topic": "design-scope", "slides": "20", "answer": 3, "en": {"prompt": "Which trade-off is associated with disappearing messages?", "options": ["Higher contrast versus smaller text.", "More accurate typing versus slower playback.", "Higher speed versus greater storage.", "Privacy support versus reduced traceability."], "explain": "Removing messages can support privacy but makes later reconstruction harder."}, "de": {"prompt": "Welcher Zielkonflikt betrifft selbstlöschende Nachrichten?", "options": ["Höherer Kontrast gegenüber kleinerem Text.", "Genaueres Tippen gegenüber langsamerer Wiedergabe.", "Mehr Geschwindigkeit gegenüber mehr Speicher.", "Unterstützung der Privatsphäre gegenüber geringerer Nachvollziehbarkeit."], "explain": "Gelöschte Nachrichten können die Privatsphäre stärken, aber spätere Rekonstruktion erschweren."}}, {"lecture": 1, "topic": "design-scope", "slides": "9–10,20", "answer": 2, "en": {"prompt": "How does requiring immediate visibility of read status affect design scope?", "options": ["It affects color only.", "It has no effect beyond a single screen.", "It shapes social behavior as well as system feedback.", "It removes organizational decisions."], "explain": "Read status can change accountability, expectations and response pressure."}, "de": {"prompt": "Was bewirkt die verpflichtende Sichtbarkeit des Lesestatus?", "options": ["Sie betrifft ausschließlich Farben.", "Sie wirkt nur innerhalb eines einzelnen Bildschirms.", "Sie gestaltet soziales Verhalten und Systemrückmeldung.", "Sie beseitigt organisatorische Entscheidungen."], "explain": "Lesestatus verändert Verbindlichkeit, Erwartungen und Antwortdruck."}}, {"lecture": 1, "topic": "design-scope", "slides": "12–13", "answer": 2, "en": {"prompt": "Which choice is an example of an implicit design decision?", "options": ["A power failure interrupts all devices.", "A user changes their phone’s wallpaper.", "A default makes online status visible even though the team never explicitly debated it.", "A screen is physically damaged after purchase."], "explain": "Defaults still select one possibility and have consequences even without explicit discussion."}, "de": {"prompt": "Was ist ein Beispiel für eine implizite Designentscheidung?", "options": ["Ein Stromausfall unterbricht alle Geräte.", "Eine Person ändert ihr Handy-Hintergrundbild.", "Der Online-Status ist standardmäßig sichtbar, ohne dass das Team dies bewusst besprochen hat.", "Ein Display wird nach dem Kauf beschädigt."], "explain": "Auch unbesprochene Voreinstellungen wählen Möglichkeiten und haben Folgen."}}, {"lecture": 1, "topic": "decision-areas", "slides": "15", "answer": 1, "en": {"prompt": "Deciding which user group’s needs take priority most directly concerns what?", "options": ["The final file format.", "Purpose and benefit.", "Audio compression.", "Formal-aesthetic consistency only."], "explain": "Purpose includes for whom value is created and which needs or problems are prioritized."}, "de": {"prompt": "Die Bedürfnisse welcher Gruppe bevorzugt werden, betrifft hauptsächlich welchen Bereich?", "options": ["Das endgültige Dateiformat.", "Zweck und Nutzen.", "Audiokompression.", "Nur formalästhetische Einheitlichkeit."], "explain": "Zweck und Nutzen schließen Zielgruppen und priorisierte Bedürfnisse ein."}}, {"lecture": 1, "topic": "decision-areas", "slides": "16", "answer": 3, "en": {"prompt": "Explaining what happens when a message fails to send belongs primarily to what?", "options": ["Manufacturing cost.", "Material selection.", "The product’s symbolic prestige.", "Interaction and behavior."], "explain": "Interaction design includes actions, feedback, errors and system states."}, "de": {"prompt": "Die Erklärung einer fehlgeschlagenen Nachricht gehört hauptsächlich zu welchem Bereich?", "options": ["Herstellungskosten.", "Materialauswahl.", "Symbolisches Prestige.", "Interaktion und Verhalten."], "explain": "Interaction Design umfasst Handlungen, Rückmeldungen, Fehler und Zustände."}}, {"lecture": 1, "topic": "decision-areas", "slides": "17", "answer": 2, "en": {"prompt": "Which design decision may support safety and limit misuse?", "options": ["Adding a decorative gradient.", "Removing explanatory labels from permissions.", "Restricting who can add members to a group.", "Changing all headings to italics."], "explain": "Rules and boundaries can provide safety, orientation and restrictions on misuse."}, "de": {"prompt": "Welche Entscheidung kann Sicherheit fördern und Missbrauch begrenzen?", "options": ["Einen dekorativen Farbverlauf ergänzen.", "Erklärungen bei Berechtigungen entfernen.", "Festlegen, wer Gruppenmitglieder hinzufügen darf.", "Alle Überschriften kursiv setzen."], "explain": "Regeln und Grenzen können Orientierung, Sicherheit und Schutz bieten."}}, {"lecture": 1, "topic": "decision-areas", "slides": "12,16", "answer": 3, "en": {"prompt": "A privacy setting is technically available but very hard to find. Which issue is most direct?", "options": ["The setting is purely an aesthetic matter.", "The feature must therefore be absent from the code.", "Every user necessarily prefers the default.", "Visibility and priority may limit practical control."], "explain": "Prominence and discoverability influence whether people can exercise an available choice."}, "de": {"prompt": "Eine Datenschutzeinstellung existiert, ist aber kaum auffindbar. Was ist das direkte Problem?", "options": ["Die Einstellung ist rein ästhetisch.", "Die Funktion muss deshalb im Code fehlen.", "Alle Menschen bevorzugen zwangsläufig den Standard.", "Sichtbarkeit und Priorität können tatsächliche Kontrolle erschweren."], "explain": "Auffindbarkeit beeinflusst, ob Menschen eine Wahl praktisch nutzen können."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "26", "answer": 2, "en": {"prompt": "Which is an alternative to building an app for missed room changes?", "options": ["Add unrelated engagement features.", "Ignore anyone without a smartphone.", "Improve the organizational communication process.", "Assume the feature request proves the cause."], "explain": "The lecture lists better organizational processes alongside digital notification solutions."}, "de": {"prompt": "Was wäre eine Alternative zu einer neuen App für Raumänderungen?", "options": ["Unpassende Bindungsfunktionen ergänzen.", "Personen ohne Smartphone ignorieren.", "Den organisatorischen Kommunikationsablauf verbessern.", "Annehmen, dass der Funktionswunsch die Ursache beweist."], "explain": "Die Folien nennen auch bessere organisatorische Abläufe als Lösung."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "23–31", "answer": 3, "en": {"prompt": "What should come before selecting one room-change notification solution?", "options": ["Maximize the number of notification channels.", "Choose a technology vendor immediately.", "Finalize the interface colors.", "Understand the situation, affected people and desired change."], "explain": "Observation and problem understanding guide alternatives before selection."}, "de": {"prompt": "Was sollte vor der Wahl eines Benachrichtigungssystems geschehen?", "options": ["Die Zahl der Benachrichtigungskanäle maximieren.", "Sofort einen Technologieanbieter wählen.", "Die Interfacefarben endgültig festlegen.", "Situation, Betroffene und gewünschte Veränderung verstehen."], "explain": "Problemverständnis leitet die Entwicklung und Auswahl von Alternativen."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "24", "answer": 0, "en": {"prompt": "Which situation can count as a design problem even without a broken feature?", "options": ["Stakeholders’ interests conflict in an existing workflow.", "The team has not selected a catchy name.", "The product has no decorative illustration.", "Every screen uses the same font."], "explain": "Design problems include conflicting interests and situations worth improving."}, "de": {"prompt": "Was kann auch ohne defekte Funktion ein Designproblem sein?", "options": ["Widersprüchliche Stakeholderinteressen in einem Ablauf.", "Ein noch fehlender einprägsamer Produktname.", "Eine fehlende dekorative Illustration.", "Dieselbe Schrift auf allen Seiten."], "explain": "Designprobleme umfassen auch Interessenkonflikte und verbesserungswürdige Situationen."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "25–26", "answer": 3, "en": {"prompt": "What distinguishes a goal from a solution?", "options": ["A solution describes only who is affected.", "A goal cannot be evaluated in context.", "A goal always names a specific technology.", "A goal states a desired outcome; a solution proposes a way to achieve it."], "explain": "Several solutions can serve the same desired state."}, "de": {"prompt": "Was unterscheidet Ziel und Lösung?", "options": ["Eine Lösung beschreibt ausschließlich Betroffene.", "Ein Ziel kann im Kontext nicht bewertet werden.", "Ein Ziel nennt immer eine konkrete Technologie.", "Das Ziel beschreibt einen gewünschten Zustand; die Lösung einen möglichen Weg dorthin."], "explain": "Verschiedene Lösungen können denselben gewünschten Zustand unterstützen."}}, {"lecture": 1, "topic": "problem-need-goal", "slides": "29–30", "answer": 0, "en": {"prompt": "Why might more group-chat activity be seen differently by members and the organization?", "options": ["Members may experience overload while the organization values engagement.", "Frequent use proves there are no problems.", "Every stakeholder measures success identically.", "Group members control every business priority."], "explain": "Problems and benefits are perspective-dependent."}, "de": {"prompt": "Warum bewerten Mitglieder und Organisation mehr Chataktivität möglicherweise verschieden?", "options": ["Mitglieder erleben Überlastung, während die Organisation Bindung schätzt.", "Häufige Nutzung beweist die Problemfreiheit.", "Alle Beteiligten messen Erfolg identisch.", "Mitglieder bestimmen sämtliche Geschäftsziele."], "explain": "Probleme und Nutzen hängen von der Perspektive ab."}}, {"lecture": 1, "topic": "definitions", "slides": "34–35", "answer": 3, "en": {"prompt": "Which interpretation best fits the historical breadth of “design”?", "options": ["Only manufacturing physical parts.", "Only choosing a business name.", "Only decorative styling of finished software.", "Drawing, planning, intention and determining form or action."], "explain": "The lecture traces the term through drawing, outlining, planning and purpose."}, "de": {"prompt": "Welche Bedeutung entspricht der historischen Breite von „Design“?", "options": ["Nur Herstellung physischer Teile.", "Nur die Wahl eines Firmennamens.", "Nur dekorative Gestaltung fertiger Software.", "Zeichnung, Planung, Absicht und Bestimmung von Form oder Handlung."], "explain": "Die Begriffsgeschichte umfasst Entwerfen, Umreißen, Planen und Zweck."}}, {"lecture": 1, "topic": "definitions", "slides": "37", "ans , "Only technical implementation independent of use.", "Only the designer’s personal expression."], "explain": "The WDO description links these areas to economic, social and environmental value."}, "de": {"prompt": "Welche Verbindung betont die WDO-Perspektive?", "options": ["Ausschließlich Zeichnungen und dekorative Oberflächen.", "Innovation, Technologie, Forschung, Wirtschaft und Menschen.", "Nur technische Umsetzung unabhängig vom Gebrauch.", "Nur den persönlichen Ausdruck des Designers."], "explain": "Die WDO verbindet diese Bereiche mit wirtschaftlichem, sozialem und ökologischem Wert."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "47", "answer": 0, "en": {"prompt": "Which concern is especially associated with engineering in the voice-message example?", "options": ["Reliable, performant operation across different devices.", "What cultural meaning a recording expresses.", "Which need should have priority for the recipient.", "Why a person prefers asynchronous conversation."], "explain": "Engineering contributes reliability and operational realization; other disciplines address other questions."}, "de": {"prompt": "Welche Frage betrifft im Sprachnachrichtenbeispiel besonders Engineering?", "options": ["Zuverlässiger und leistungsfähiger Betrieb auf verschiedenen Geräten.", "Welche kulturelle Bedeutung eine Aufnahme vermittelt.", "Welches Bedürfnis der empfangenden Person Vorrang hat.", "Warum jemand zeitversetzte Gespräche bevorzugt."], "explain": "Engineering trägt zu zuverlässiger technischer Realisierung und Betrieb bei."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "47", "answer": 3, "en": {"prompt": "Which concern is especially associated with computer science in that example?", "options": ["Determining whether the message creates social pressure.", "Choosing the group’s organizational rules.", "Interpreting a sound artist’s expressive intentions.", "Processing, compressing and transmitting audio data."], "explain": "The lecture separates audio-data processing from questions of use and reliable operation."}, "de": {"prompt": "Welche Frage betrifft besonders die Informatik?", "options": ["Ob die Nachricht sozialen Druck erzeugt.", "Welche organisatorischen Gruppenregeln gelten.", "Welche Ausdrucksabsicht ein Klangkunstwerk hat.", "Verarbeitung, Kompression und Übertragung von Audiodaten."], "explain": "Die Vorlesung trennt Datenverarbeitung von Nutzungs- und Betriebsfragen."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "46", "answer": 3, "en": {"prompt": "Why does art not have to meet the same narrow criterion as task-oriented product design?", "options": ["Art is forbidden to address social questions.", "Art has no relationship to aesthetic experience.", "Art cannot be part of a digital product.", "Art may primarily express, question or make something experienceable."], "explain": "The lecture distinguishes purposes without claiming the disciplines never overlap."}, "de": {"prompt": "Warum muss Kunst nicht dasselbe enge Kriterium wie aufgabenorientiertes Produktdesign erfüllen?", "options": ["Kunst darf keine gesellschaftlichen Fragen behandeln.", "Kunst hat nichts mit ästhetischer Erfahrung zu tun.", "Kunst kann nicht Teil digitaler Produkte sein.", "Sie kann vorrangig ausdrücken, hinterfragen oder erfahrbar machen."], "explain": "Unterschiedliche Schwerpunkte schließen Zusammenarbeit und Überschneidungen nicht aus."}}, {"lecture": 1, "topic": "disciplines-products", "slides": "51", "answer": 2, "en": {"prompt": "Chat history, media and metadata belong most directly to which product layer?", "options": ["Only organizational staffing.", "Only the physical device enclosure.", "Content and information.", "Only the color palette."], "explain": "The product’s content layer concerns what is communicated, sorted and prioritized."}, "de": {"prompt": "Chatverlauf, Medien und Metadaten gehören zu welcher Produktebene?", "options": ["Nur zur Personalorganisation.", "Nur zum physischen Gerätegehäuse.", "Inhalte und Informationen.", "Nur zur Farbpalette."], "explain": "Diese Ebene betrifft, was kommuniziert, sortiert und priorisiert wird."}}, {"lecture": 1, "topic": "product-language", "slides": "55", "answer": 1, "en": {"prompt": "Which pair belongs to practical–technical function?", "options": ["A commemorative object’s personal meaning only.", "Usability and technical safety.", "Company revenue and market reach only.", "Brand prestige and group belonging only."], "explain": "Practical–technical functions include ergonomics, handling, durability, quality and safety."}, "de": {"prompt": "Welches Paar gehört zur praktisch-technischen Funktion?", "options": ["Nur die persönliche Bedeutung eines Erinnerungsstücks.", "Handhabbarkeit und technische Sicherheit.", "Nur Umsatz und Reichweite.", "Nur Prestige und Gruppenzugehörigkeit."], "explain": "Diese Funktion umfasst Ergonomie, Handhabung, Haltbarkeit, Qualität und Sicherheit."}}, {"lecture": 1, "topic": "product-language", "slides": "55", "answer": 3, "en": {"prompt": "Why can symbolic meaning not be fixed completely in advance?", "options": ["Symbols have no relationship to users.", "Every product has exactly one permanent interpretation.", "Designers control all later interpretations.", "People and social or cultural contexts help create it."], "explain": "The lecture notes the roles of manufacturers, owners and users in symbolic meaning."}, "de": {"prompt": "Warum ist symbolische Bedeutung nicht vollständig vorab festlegbar?", "options": ["Symbole haben keinen Bezug zu Menschen.", "Jedes Produkt hat genau eine dauerhafte Interpretation.", "Designer kontrollieren alle späteren Interpretationen.", "Menschen sowie soziale und kulturelle Kontexte gestalten sie mit."], "explain": "Hersteller, Besitzer und Nutzer wirken an symbolischen Bedeutungen mit."}}, {"lecture": 1, "topic": "product-language", "slides": "55", "answer": 3, "en": {"prompt": "Which discipline helps explain sign-related product meaning?", "options": ["Thermodynamics.", "Bookkeeping.", "Network routing.", "Semiotics."], "explain": "Semiotics is the study of signs and meaning, used here to explain symbolic interaction."}, "de": {"prompt": "Welche Disziplin hilft, Zeichenbedeutungen von Produkten zu erklären?", "options": ["Thermodynamik.", "Buchhaltung.", "Netzwerk-Routing.", "Semiotik."], "explain": "Semiotik untersucht Zeichen und Bedeutungen."}}, {"lecture": 1, "topic": "product-language", "slides": "56–58", "answer": 0, "en": {"prompt": "In the Offenbach approach, indicative and symbolic functions sit under which branch?", "options": ["Sign-related product-language functions.", "Only economic production functions.", "Only business-model analysis.", "Only manufacturing tolerances."], "explain": "The diagram subdivides sensory/product-language functions into formal-aesthetic and sign-related functions."}, "de": {"prompt": "Unter welchem Zweig stehen Anzeichen- und Symbolfunktion im Offenbacher Ansatz?", "options": ["Zeichenhafte produktsprachliche Funktionen.", "Ausschließlich ökonomische Produktionsfunktionen.", "Ausschließlich Geschäftsmodellanalyse.", "Ausschließlich Fertigungstoleranzen."], "explain": "Produktsprachliche Funktionen werden in formalästhetische und zeichenhafte Funktionen unterteilt."}}, {"lecture": 1, "topic": "product-language", "slides": "54", "answer": 0, "en": {"prompt": "Which issue most directly belongs to ecological function?", "options": ["Resources and effects associated with production and disposal.", "Whether a symbol represents social status.", "The visual weight of a heading only.", "The product’s market share only."], "explain": "The product-function diagram links ecology to production and disposal."}, "de": {"prompt": "Was gehört am direktesten zur ökologischen Funktion?", "options": ["Ressourcen und Auswirkungen von Produktion und Entsorgung.", "Ob ein Zeichen sozialen Status vermittelt.", "Nur die visuelle Gewichtung einer Überschrift.", "Nur der Marktanteil."], "explain": "Das Diagramm verbindet Ökologie mit Herstellung und Entsorgung."}}, {"lecture": 1, "topic": "good-design", "slides": "63", "answer": 1, "en": {"prompt": "A consistent interface is carefully finished, including small details. Which Rams principle is most direct?", "options": ["Pure novelty for its own sake.", "Thorough down to the last detail.", "Temporary fashionability.", "Visual dominance."], "explain": "The lecture’s “konsequent” principle emphasizes thoroughness and precision."}, "de": {"prompt": "Ein Interface ist bis in kleine Details sorgfältig ausgearbeitet. Welches Rams-Prinzip passt?", "options": ["Reine Neuheit um ihrer selbst willen.", "Gründlichkeit bis ins letzte Detail.", "Kurzfristige Mode.", "Visuelle Dominanz."], "explain": "„Konsequent“ bedeutet in der Vorlesung gründlich und genau."}}, {"lecture": 1, "topic": "good-design", "slides": "63", "answer": 2, "en": {"prompt": "A product avoids short-lived fashion so it remains useful over time. Which principle is most direct?", "options": ["Styling for rapid replacement.", "Decorative complexity.", "Long-lasting design.", "Attention-grabbing design."], "explain": "Rams connects longevity with avoiding fashionable short-term form."}, "de": {"prompt": "Ein Produkt vermeidet kurzfristige Mode. Welches Prinzip passt?", "options": ["Styling für schnellen Ersatz.", "Dekorative Komplexität.", "Langlebigkeit.", "Aufmerksamkeit um jeden Preis."], "explain": "Rams verbindet lange Nutzbarkeit mit dem Vermeiden kurzfristiger Moden."}}, {"lecture": 1, "topic": "good-design", "slides": "62", "answer": 3, "en": {"prompt": "A tool explains its own operation clearly. Which Rams principle is most direct?", "options": ["Makes a product socially exclusive.", "Makes a product collectable.", "Makes a product expensive.", "Makes a product understandable."], "explain": "Understandability concerns explaining what the product is and how it works."}, "de": {"prompt": "Ein Werkzeug erklärt seine Bedienung klar. Welches Prinzip passt?", "options": ["Es macht das Produkt sozial exklusiv.", "Es macht das Produkt sammelwürdig.", "Es macht das Produkt teuer.", "Es macht das Produkt verständlich."], "explain": "Verständliches Design erklärt Produkt und Gebrauch."}}, {"lecture": 1, "topic": "good-design", "slides": "62", "answer": 3, "en": {"prompt": "Why does Rams connect aesthetic quality with more than decoration?", "options": ["It guarantees every user will have the same feeling.", "It makes environmental concerns irrelevant.", "It replaces the need for usability.", "It shapes the environment and influences well-being."], "explain": "The lecture presents aesthetics as an integral aspect of usefulness and lived surroundings."}, "de": {"prompt": "Warum verbindet Rams Ästhetik mit mehr als Dekoration?", "options": ["Sie garantiert allen dieselben Gefühle.", "Sie macht Umweltfragen unwichtig.", "Sie ersetzt Benutzbarkeit.", "Sie prägt die Umgebung und beeinflusst das Wohlbefinden."], "explain": "Ästhetische Qualität wird als Teil der Brauchbarkeit und Lebensumgebung verstanden."}}], "notes": []}</script>
