me?", "options": ["Ein Blickwinkel, der eine Situation als Problem strukturiert.", "Eine Garantie für genau eine richtige Ursache.", "Eine feste Liste von Interfacefarben.", "Ein fertiger Umsetzungsplan."], "explain": "Frames beeinflussen Betroffene, Relevanz, angenommene Ursachen und mögliche Maßnahmen."}}, {"lecture": 4, "topic": "framing", "slides": "13", "answer": 2, "en": {"prompt": "Which question is most useful for reframing?", "options": ["How can we skip research and publish sooner?", "Which feature should we build before understanding users?", "What if our central assumption is wrong?", "How can we protect the first idea from criticism?"], "explain": "Reframing deliberately questions the current perspective and its assumptions."}, "de": {"prompt": "Welche Frage unterstützt Reframing?", "options": ["Wie überspringen wir Forschung und veröffentlichen schneller?", "Welche Funktion bauen wir vor dem Nutzerverständnis?", "Was wäre, wenn unsere zentrale Annahme falsch wäre?", "Wie schützen wir die erste Idee vor Kritik?"], "explain": "Reframing hinterfragt bewusst Perspektive und Annahmen."}}, {"lecture": 4, "topic": "framing", "slides": "12–14", "answer": 2, "en": {"prompt": "A group-chat problem is reframed from “too many messages” to “important decisions are hard to identify.” Which direction fits the new frame?", "options": ["Hide all information after a short period.", "Assume reading speed is the only relevant factor.", "Make important decisions visible and distinguishable.", "Reduce every message to the same fixed length."], "explain": "The new frame emphasizes relevance and structure rather than volume alone."}, "de": {"prompt": "Aus „zu viele Nachrichten“ wird „wichtige Entscheidungen sind schwer erkennbar“. Welche Richtung passt?", "options": ["Alle Informationen nach kurzer Zeit ausblenden.", "Lesegeschwindigkeit als einzigen Faktor annehmen.", "Wichtige Entscheidungen sichtbar und unterscheidbar machen.", "Alle Nachrichten gleich stark verkürzen."], nswer": 2, "en": {"prompt": "What does “no stopping rule” mean?", "options": ["Research is unnecessary because nothing can be known.", "Every intervention must continue forever without review.", "There is no objective criterion proving the problem is completely resolved.", "Teams are forbidden to make practical decisions."], "explain": "Work can pause for practical reasons, but no definitive problem-internal test establishes completion."}, "de": {"prompt": "Was bedeutet „keine Stoppregel“?", "options": ["Forschung ist unnötig, weil nichts erkennbar ist.", "Jede Maßnahme muss ohne Prüfung ewig weiterlaufen.", "Kein objektives Kriterium beweist die vollständige Lösung.", "Teams dürfen keine praktischen Entscheidungen treffen."], "explain": "Praktische Gründe können Arbeit beenden, aber kein eindeutiger Test beweist Abschluss."}}, {"lecture": 4, "topic": "wicked", "slides": "17", "answer": 1, "en": {"prompt": "How are wicked-problem interventions primarily judged?", "options": ["Only by the number of features delivered.", "In terms of better or worse outcomes and stakeholder values.", "By one universal score independent of context.", "Only as mathematically true or false."], "explain": "Rittel and Webber distinguish judgments of quality from definitive true/false answers."}, "de": {"prompt": "Wie werden Maßnahmen bei Wicked Problems hauptsächlich bewertet?", "options": ["Nur anhand der Zahl gelieferter Funktionen.", "Als besser oder schlechter anhand von Folgen und Stakeholderwerten.", "Mit einem universellen kontextfreien Wert.", "Ausschließlich mathematisch wahr oder falsch."], "explain": "Qualitätsurteile unterscheiden sich von endgültigen Wahr/Falsch-Antworten."}}, {"lecture": 4, "topic": "wicked", "slides": "17", "answer": 1, "en": {"prompt": "What is meant by a wicked-problem intervention being a one-shot operation?", "options": ["Only one person is allowed to design it.", "Trying it has real consequences that cannot simply be erased.", "One prototype is guaranteed to solve the entire problem.", "It is forbidden to revise the intervention later."], "explain": "Real-world interventions are not consequence-free experiments, even when later revisions are possible."}, "de": {"prompt": "Was bedeutet eine „one-shot operation“?", "options": ["Nur eine Person darf gestalten.", "Ein Versuch hat reale Folgen, die nicht einfach gelöscht werden können.", "Ein Prototyp löst garantiert das gesamte Problem.", "Spätere Überarbeitung ist verboten."], "explain": "Reale Eingriffe sind auch bei späteren Änderungen keine folgenlosen Experimente."}}, {"lecture": 4, "topic": "wicked", "slides": "19", "answer": 0, "en": {"prompt": "Which statement avoids overusing the label “wicked”?", "options": ["Not every technical or design problem has wicked-problem characteristics.", "All well-specified tasks lack any possible solution.", "Every broken button is automatically a wicked problem.", "A problem becomes wicked whenever a deadline exists."], "explain": "The lecture distinguishes clearer technical tasks from wider sociotechnical and societal problems."}, "de": {"prompt": "Welche Aussage vermeidet eine Überdehnung von „wicked“?", "options": ["Nicht jedes technische oder gestalterische Problem besitzt diese Merkmale.", "Alle klar definierten Aufgaben sind unlösbar.", "Jeder kaputte Button ist ein Wicked Problem.", "Jede Frist macht ein Problem wicked."], "explain": "Die Vorlesung unterscheidet klare technische Aufgaben von komplexen gesellschaftlichen Situationen."}}, {"lecture": 4, "topic": "wicked", "slides": "20–21", "answer": 0, "en": {"prompt": "What does a design process provide?", "options": ["Orientation and decision support under uncertainty.", "Proof that the work is human-centered without user involvement.", "An automatic guarantee of innovation.", "A universal recipe that eliminates judgment."], "explain": "Processes structure inquiry and communication, but outcomes depend on how they are used."}, "de": {"prompt": "Was bietet ein Designprozess?", "options": ["Orientierung und Entscheidungshilfe bei Unsicherheit.", "Menschenzentrierung ohne Nutzerbeteiligung.", "Eine automatische Innovationsgarantie.", "Ein universelles Rezept ohne Urteilsbedarf."], "explain": "Prozesse strukturieren Denken und Kommunikation; Ergebnisse hängen von der Anwendung ab."}}, {"lecture": 4, "topic": "double-diamond", "slides": "22", "answer": 1, "en": {"prompt": "Which action is divergent?", "options": ["Rank three options and commit to one.", "Explore several interpretations and alternatives.", "Select one concept using agreed criteria.", "Reject alternatives after evaluating their trade-offs."], "explain": "Divergence opens the field; convergence focuses it through evaluation and selection."}, "de": {"prompt": "Welche Handlung ist divergent?", "options": ["Drei Optionen priorisieren und sich festlegen.", "Mehrere Interpretationen und Alternativen erkunden.", "Ein Konzept nach Kriterien auswählen.", "Alternativen nach Prüfung ihrer Zielkonflikte verwerfen."], "explain": "Divergenz öffnet Möglichkeiten; Konvergenz fokussiert."}}, {"lecture": 4, "topic": "double-diamond", "slides": "22", "answer": 2, "en": {"prompt": "Which action is convergent?", "options": ["Broaden the range of stakeholder perspectives.", "Generate more alternative ideas without judging them.", "Compare concepts and choose a direction.", "Investigate additional possible causes."], "explain": "Convergence narrows possibilities through prioritization and decision-making."}, "de": {"prompt": "Welche Handlung ist konvergent?", "options": ["Mehr Stakeholderperspektiven einbeziehen.", "Ohne Bewertung zusätzliche Ideen erzeugen.", "Konzepte vergleichen und eine Richtung wählen.", "Weitere mögliche Ursachen untersuchen."], "explain": "Konvergenz verengt Möglichkeiten durch Priorisierung und Entscheidung."}}, {"lecture": 4, "topic": "double-diamond", "slides": "23–24", "answer": 3, "en": {"prompt": "Which is the Double Diamond sequence?", "options": ["Deliver, Define, Develop, Discover.", "Develop, Discover, Deliver, Define.", "Define, Deliver, Discover, Develop.", "Discover, Define, Develop, Deliver."], "explain": "The first diamond explores and focuses the problem; the second explores and focuses solutions."}, "de": {"prompt": "Wie lautet die Double-Diamond-Abfolge?", "options": ["Deliver, Define, Develop, Discover.", "Develop, Discover, Deliver, Define.", "Define, Deliver, Discover, Develop.", "Discover, Define, Develop, Deliver."], "explain": "Erster Diamant: Problem öffnen und fokussieren; zweiter: Lösungen öffnen und fokussieren."}}, {"lecture": 4, "topic": "double-diamond", "slides": "23–24", "answer": 2, "en": {"prompt": "What distinguishes Define from Develop in Double Diamond?", "options": ["Define generates unrelated features; Develop forbids alternatives.", "Define and Develop are both final delivery stages.", "Define focuses the problem; Develop explores possible solutions.", "Define deploys software; Develop observes the original context only."], "explain": "Define is convergent in problem space; Develop is divergent in solution space."}, "de": {"prompt": "Was unterscheidet Define und Develop?", "options": ["Define erzeugt beliebige Funktionen; Develop verbietet Alternativen.", "Beide sind abschließende Lieferphasen.", "Define fokussiert das Problem; Develop erkundet Lösungen.", "Define veröffentlicht Software; Develop beobachtet nur den Ausgangskontext."], "explain": "Define ist konvergent im Problemraum, Develop divergent im Lösungsraum."}}, {"lecture": 4, "topic": "double-diamond", "slides": "25", "answer": 2, "en": {"prompt": "Which practice is one of the Double Diamond principles in the lecture?", "options": ["Use technical feasibility as the only design criterion.", "Avoid iteration after a concept has been selected.", "Communicate visually and inclusively.", "Exclude stakeholders to avoid conflicting perspectives."], "explain": "The principles also include people first, collaboration/co-creation and iteration."}, "de": {"prompt": "Was ist eines der vier Double-Diamond-Prinzipien?", "options": ["Technische Machbarkeit als einziges Kriterium verwenden.", "Iteration nach der Konzeptwahl vermeiden.", "Visuell und inklusiv kommunizieren.", "Stakeholder wegen widersprüchlicher Sichtweisen ausschließen."], "explain": "Weitere Prinzipien: Menschen zuerst, Zusammenarbeit und Iteration."}}, {"lecture": 4, "topic": "discover-methods", "slides": "26–27", "answer": 3, "en": {"prompt": "Which tool helps identify relevant people and groups around a product?", "options": ["High-fidelity mock-up.", "Color palette.", "Impact–effort matrix only.", "Stakeholder map."], "explain": "Stakeholder maps visualize who matters to or is affected by the situation."}, "de": {"prompt": "Welches Werkzeug identifiziert relevante Menschen und Gruppen?", "options": ["Ein High-Fidelity-Mock-up.", "Eine Farbpalette.", "Nur eine Impact-Effort-Matrix.", "Stakeholdermap."], "explain": "Die Stakeholdermap macht Beteiligte und Betroffene sichtbar."}}, {"lecture": 4, "topic": "discover-methods", "slides": "28", "answer": 0, "en": {"prompt": "Which field belongs to the extended Product Vision Board shown?", "options": ["Revenue streams.", "Only screen resolution.", "Only a final test score.", "Only button border radius."], "explain": "The extended board includes business goals, competitors, revenue, costs and channels in addition to vision, users, needs and product."}, "de": {"prompt": "Welches Feld gehört zum erweiterten Product Vision Board?", "options": ["Einnahmequellen.", "Nur Bildschirmauflösung.", "Nur ein abschließender Testwert.", "Nur Buttonradius."], "explain": "Das Board ergänzt Vision, Zielgruppe, Bedürfnisse und Produkt um wirtschaftliche Aspekte."}}, {"lecture": 4, "topic": "discover-methods", "slides": "30", "answer": 3, "en": {"prompt": "What does the lecture’s three-column assumption matrix examine?", "options": ["Positive emotion, relationships and achievement only.", "Color, typography and animation speed.", "Discover, Define and Deliver.", "Attractiveness, use in practice and feasibility."], "explain": "Slide 30 labels the columns Attraktivität, Brauchbarkeit and Realisierbarkeit."}, "de": {"prompt": "Was prüft die dreispaltige Annahmenmatrix der Vorlesung?", "options": ["Nur positive Emotionen, Beziehungen und Zielerreichung.", "Farbe, Typografie und Animationsgeschwindigkeit.", "Discover, Define und Deliver.", "Attraktivität, Brauchbarkeit und Realisierbarkeit."], "explain": "Die Vorlage zeigt genau diese drei Spalten."}}, {"lecture": 4, "topic": "define-methods", "slides": "31", "answer": 0, "en": {"prompt": "What should distinguish a persona from an invented stereotype?", "options": ["It is informed by research data about relevant users.", "It replaces all observation and evaluation.", "It includes an arbitrary name and a decorative photo only.", "It assumes every user has identical goals."], "explain": "The lecture explicitly states that personas must be data-oriented."}, "de": {"prompt": "Was unterscheidet eine Persona von einem erfundenen Stereotyp?", "options": ["Sie beruht auf Forschungsdaten über relevante Nutzer.", "Sie ersetzt jede Beobachtung und Evaluation.", "Ein beliebiger Name und ein dekoratives Foto genügen.", "Alle Nutzer haben identische Ziele."], "explain": "Personas müssen laut Vorlesung datenorientiert sein."}}, {"lecture": 4, "topic": "define-methods", "slides": "32", "answer": 1, "en": {"prompt": "Which structure matches Jobs to Be Done in the lecture?", "options": ["If [technology exists], build [feature], then advertise [benefit].", "When [situation], I want to [action], so I can [outcome].", "First [publish], then [assume], finally [ignore feedback].", "Choose [color], select [font], then draw [icon]."], "explain": "The structure connects context, desired action or progress, and motivation or outcome."}, "de": {"prompt": "Welche Struktur entspricht Jobs to Be Done?", "options": ["Wenn [Technik existiert], baue [Funktion] und bewirb [Nutzen].", "Wenn [Situation], möchte ich [Handlung], damit ich [Ergebnis].", "Zuerst [veröffentlichen], dann [annehmen], zuletzt [Feedback ignorieren].", "Wähle [Farbe], dann [Schrift], dann [Symbol]."], "explain": "Die Struktur verbindet Kontext, gewünschte Handlung und angestrebten Fortschritt."}}, {"lecture": 4, "topic": "define-methods", "slides": "33", "answer": 3, "en": {"prompt": "Which How Might We question leaves room for different solutions?", "options": ["How might we install the push-notification system we already chose?", "How might we implement a chatbot without questioning its purpose?", "How might we add the exact dashboard requested yesterday?", "How might we help students notice relevant room changes in time?"], "explain": "The first question states an outcome without committing to one intervention."}, "de": {"prompt": "Welche HMW-Frage lässt verschiedene Lösungen offen?", "options": ["Wie bauen wir das bereits gewählte Push-System ein?", "Wie implementieren wir einen Chatbot ohne Zweckklärung?", "Wie ergänzen wir genau das gestern verlangte Dashboard?", "Wie könnten wir Studierende rechtzeitig auf relevante Raumänderungen aufmerksam machen?"], "explain": "Die erste Frage nennt einen gewünschten Zustand, ohne eine Maßnahme festzulegen."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "34", "answer": 2, "en": {"prompt": "A concept offers high impact for low effort. Where does it sit in the lecture’s matrix?", "options": ["Efficiency killers.", "Strategic projects.", "Quick wins.", "Nice to have."], "explain": "Quick wins occupy the high-impact, low-effort quadrant."}, "de": {"prompt": "Hohe Wirkung bei geringem Aufwand gehört in welches Feld?", "options": ["Effizienz-Killer.", "Strategische Projekte.", "Quick Wins.", "Nice to Have."], "explain": "Quick Wins liegen bei hoher Wirkung und niedrigem Aufwand."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "34", "answer": 3, "en": {"prompt": "A concept requires high effort but offers low impact. What is its label in the matrix?", "options": ["Quick win.", "Strategic project.", "Personal significance.", "Efficiency killer."], "explain": "The matrix labels low-impact, high-effort concepts as efficiency killers."}, "de": {"prompt": "Hoher Aufwand bei geringer Wirkung wird wie bezeichnet?", "options": ["Quick Win.", "Strategisches Projekt.", "Persönliche Bedeutsamkeit.", "Effizienz-Killer."], "explain": "Das Feld niedriger Wirkung und hohen Aufwands heißt Effizienz-Killer."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "35–36", "answer": 3, "en": {"prompt": "What should a user journey examine?", "options": ["Only the final screen’s visual appearance.", "Only the organization’s monthly revenue.", "Only the source code’s folder structure.", "Experience before, during and after use for a user, scenario and goals."], "explain": "A journey follows experiences and actions over time, including relevant touchpoints and difficulties."}, "de": {"prompt": "Was untersucht eine User Journey?", "options": ["Nur das Aussehen des letzten Bildschirms.", "Nur den Monatsumsatz.", "Nur die Ordnerstruktur des Codes.", "Erfahrung vor, während und nach Nutzung für Person, Szenario und Ziele."], "explain": "Journeys zeigen Handlungen, Kontaktpunkte und Schwierigkeiten im Zeitverlauf."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "37", "answer": 1, "en": {"prompt": "What is a sensible reason to choose a low-fidelity prototype?", "options": ["To avoid making any idea testable.", "To explore a question quickly without building unnecessary detail.", "To prove the final system is already fully reliable.", "To guarantee that no user feedback is needed."], "explain": "Prototype fidelity should match the learning purpose; early detail is not always useful."}, "de": {"prompt": "Warum kann ein Low-Fidelity-Prototyp sinnvoll sein?", "options": ["Verhindern, dass eine Idee testbar wird.", "Eine Frage schnell ohne unnötige Detailarbeit erkunden.", "Beweisen, dass das Endsystem vollständig zuverlässig ist.", "Garantieren, dass kein Nutzerfeedback erforderlich ist."], "explain": "Der Detaillierungsgrad sollte dem Lernziel entsprechen."}}, {"lecture": 4, "topic": "design-thinking", "slides": "44–45", "answer": 0, "en": {"prompt": "Which is the Stanford d.school sequence shown?", "options": ["Empathize, Define, Ideate, Prototype, Test.", "Prototype, Publish, Advertise, Ignore, Repeat.", "Define, Implement, Sell, Regulate, Archive.", "Inspiration, Discover, Deliver, Brand, Test."], "explain": "The five phases emphasize people, synthesis, ideas, making and learning, with iteration between them."}, "de": {"prompt": "Welche Stanford-d.school-Abfolge zeigen die Folien?", "options": ["Empathize, Define, Ideate, Prototype, Test.", "Prototype, Publish, Advertise, Ignore, Repeat.", "Define, Implement, Sell, Regulate, Archive.", "Inspiration, Discover, Deliver, Brand, Test."], "explain": "Die fünf Phasen verbinden Verstehen, Synthese, Ideen, Herstellung und Lernen."}}, {"lecture": 4, "topic": "symptom-feature", "slides": "4", "answer": 2, "en": {"prompt": "Which investigation helps distinguish a checkout symptom from its causes?", "options": ["Choose a popular feature without further evidence.", "Immediately assume one cause from the drop-off rate alone.", "Observe and ask affected users about costs, payment options, trust and technical issues.", "Count only the colors on the checkout screen."], "explain": "Several plausible causes can produce the same observed behavior."}, "de": {"prompt": "Welche Untersuchung trennt Checkout-Symptom und Ursachen?", "options": ["Ohne weitere Evidenz eine beliebte Funktion wählen.", "Aus der Abbruchrate sofort genau eine Ursache annehmen.", "Betroffene beobachten und nach Kosten, Zahlung, Vertrauen und Technik fragen.", "Nur die Farben des Checkouts zählen."], "explain": "Mehrere plausible Ursachen können dasselbe Verhalten erzeugen."}}, {"lecture": 4, "topic": "framing", "slides": "13", "answer": 0, "en": {"prompt": "Which question broadens the stakeholder perspective?", "options": ["Who has not been included in our current view?", "How can we avoid considering competing needs?", "Which icon can represent our already selected feature?", "What is the quickest way to defend our first idea?"], "explain": "Reframing includes asking who is overlooked and whose interpretation differs."}, "de": {"prompt": "Welche Frage erweitert die Stakeholderperspektive?", "options": ["Wer wurde bisher nicht berücksichtigt?", "Wie vermeiden wir konkurrierende Bedürfnisse?", "Welches Symbol zeigt unsere festgelegte Funktion?", "Wie verteidigen wir die erste Idee am schnellsten?"], "explain": "Reframing fragt nach übersehenen Menschen und anderen Deutungen."}}, {"lecture": 4, "topic": "framing", "slides": "12–14", "answer": 1, "en": {"prompt": "What changes when absence rather than message volume becomes the main frame?", "options": ["Every user must receive fewer messages regardless of need.", "The team may focus on restoring context for people returning to a conversation.", "The team no longer needs evidence about real users.", "The problem becomes purely an audio-compression task."], "explain": "The social-participation frame emphasizes reintegration after a communication gap."}, "de": {"prompt": "Was ändert sich, wenn Abwesenheit statt Nachrichtenmenge im Mittelpunkt steht?", "options": ["Alle müssen unabhängig vom Bedarf weniger Nachrichten bekommen.", "Das Team kann auf die Wiederherstellung von Kontext beim Wiedereinstieg fokussieren.", "Evidenz über reale Nutzer wird überflüssig.", "Das Problem wird zur reinen Audiokompression."], "explain": "Soziale Teilhabe betont den Wiedereinstieg nach Kommunikationspausen."}}, {"lecture": 4, "topic": "framing", "slides": "7,12–14", "answer": 0, "en": {"prompt": "Why is “people must read every message” worth questioning?", "options": ["It is an assumption about the goal, not necessarily what people need.", "It prevents any alternative explanation from existing.", "It is a universal requirement of communication.", "It is proven by the unread count alone."], "explain": "People may instead need key decisions, mentions or context; reframing opens other possibilities."}, "de": {"prompt": "Warum sollte „Menschen müssen jede Nachricht lesen“ hinterfragt werden?", "options": ["Es ist eine Zielannahme und nicht zwangsläufig das tatsächliche Bedürfnis.", "Es verhindert jede andere Erklärung.", "Es ist eine universelle Kommunikationsanforderung.", "Die ungelesene Anzahl beweist es."], "explain": "Menschen benötigen möglicherweise nur Entscheidungen, Erwähnungen oder Kontext."}}, {"lecture": 4, "topic": "wicked", "slides": "17", "answer": 2, "en": {"prompt": "What does it mean that there is no ultimate test of a wicked-problem solution?", "options": ["No evidence can ever be gathered.", "All interventions should avoid evaluation.", "Some consequences emerge over time and cannot be settled by one final test.", "Only the initial reaction is relevant."], "explain": "The absence of a conclusive test does not remove the need to study consequences."}, "de": {"prompt": "Was bedeutet, dass kein endgültiger Lösungstest existiert?", "options": ["Es kann keinerlei Evidenz gesammelt werden.", "Maßnahmen dürfen nie bewertet werden.", "Folgen können sich langfristig entfalten und sind nicht durch einen Abschlusstest geklärt.", "Nur die erste Reaktion zählt."], "explain": "Ein fehlender endgültiger Test beseitigt nicht die Pflicht zur Folgenbeobachtung."}}, {"lecture": 4, "topic": "wicked", "slides": "18", "answer": 0, "en": {"prompt": "What follows from a wicked problem being essentially unique?", "options": ["Previous solutions require critical adaptation to the new context.", "No stakeholder research is possible.", "Every previous experience must be ignored.", "Copying a solution guarantees the same outcome."], "explain": "Relevant contextual differences limit direct transfer of earlier interventions."}, "de": {"prompt": "Was folgt aus der wesentlichen Einzigartigkeit eines Wicked Problems?", "options": ["Frühere Lösungen müssen kritisch an den neuen Kontext angepasst werden.", "Stakeholderforschung ist unmöglich.", "Frühere Erfahrungen müssen völlig ignoriert werden.", "Kopieren garantiert dasselbe Ergebnis."], "explain": "Relevante Kontextunterschiede begrenzen die direkte Übertragbarkeit."}}, {"lecture": 4, "topic": "wicked", "slides": "18", "answer": 0, "en": {"prompt": "How can a wicked problem be a symptom of another problem?", "options": ["It may be linked to wider structural conditions.", "It always ends after one interface change.", "It must have exactly one hidden technical cause.", "It cannot have social implications."], "explain": "Problems can be understood at different levels within interconnected systems."}, "de": {"prompt": "Wie kann ein Wicked Problem Symptom eines anderen Problems sein?", "options": ["Es kann mit umfassenderen strukturellen Bedingungen verbunden sein.", "Eine Interfaceänderung beendet es immer.", "Es muss genau eine versteckte technische Ursache haben.", "Es kann keine sozialen Folgen besitzen."], "explain": "Probleme können auf verschiedenen Ebenen zusammenhängender Systeme betrachtet werden."}}, {"lecture": 4, "topic": "wicked", "slides": "18", "answer": 0, "en": {"prompt": "Why do different causal explanations matter for wicked problems?", "options": ["They make different interventions appear appropriate.", "They prove that values never matter.", "They always lead to identical solutions.", "They eliminate the role of framing."], "explain": "The lecture connects multiple explanations and frames to alternative interventions."}, "de": {"prompt": "Warum sind verschiedene Erklärungen für Wicked Problems wichtig?", "options": ["Sie lassen unterschiedliche Maßnahmen sinnvoll erscheinen.", "Sie beweisen die Bedeutungslosigkeit von Werten.", "Sie führen immer zu identischen Lösungen.", "Sie beseitigen Framing."], "explain": "Erklärungen und Frames beeinflussen mögliche Interventionen."}}, {"lecture": 4, "topic": "wicked", "slides": "18", "answer": 0, "en": {"prompt": "What is the practical meaning of the planner’s responsibility for mistakes?", "options": ["Interventions affect real people, so errors cannot be treated as consequence-free.", "A planner must never revise a decision.", "A planner can guarantee no uncertainty exists.", "Testing is ethically irrelevant."], "explain": "The “no right to be wrong” characteristic emphasizes accountability rather than infallibility."}, "de": {"prompt": "Was bedeutet die Verantwortung von Planenden für Fehler praktisch?", "options": ["Maßnahmen betreffen reale Menschen; Fehler sind nicht folgenlos.", "Entscheidungen dürfen nie überarbeitet werden.", "Planende können jede Unsicherheit ausschließen.", "Tests sind ethisch irrelevant."], "explain": "„Kein Recht, falschzuliegen“ betont Verantwortung, nicht Unfehlbarkeit."}}, {"lecture": 4, "topic": "double-diamond", "slides": "26", "answer": 1, "en": {"prompt": "During Discover, what should a team primarily do?", "options": ["Skip existing workarounds.", "Investigate affected people, context, needs and assumptions.", "Commit to a final solution immediately.", "Limit attention to internal opinions only."], "explain": "Discover opens the problem space through inquiry."}, "de": {"prompt": "Was sollte ein Team in Discover hauptsächlich tun?", "options": ["Bestehende Workarounds ignorieren.", "Betroffene, Kontext, Bedürfnisse und Annahmen untersuchen.", "Sofort die endgültige Lösung festlegen.", "Nur interne Meinungen berücksichtigen."], "explain": "Discover öffnet den Problemraum durch Forschung."}}, {"lecture": 4, "topic": "double-diamond", "slides": "37", "answer": 0, "en": {"prompt": "During Deliver, what should a team primarily decide?", "options": ["What works, what is feasible, what risks remain and what to refine.", "Which unrelated problem should be invented.", "How to maximize the initial idea count without evaluation.", "How to avoid any user feedback."], "explain": "Deliver focuses the solution space with prototypes and evaluation."}, "de": {"prompt": "Was sollte in Deliver hauptsächlich entschieden werden?", "options": ["Was funktioniert, was ist machbar, welche Risiken bleiben und was wird verbessert?", "Welches sachfremde Problem erfunden wird.", "Wie ohne Bewertung möglichst viele Erstideen entstehen.", "Wie jedes Nutzerfeedback vermieden wird."], "explain": "Deliver fokussiert den Lösungsraum mit Prototypen und Evaluation."}}, {"lecture": 4, "topic": "double-diamond", "slides": "25", "answer": 0, "en": {"prompt": "Why is iteration important in the Double Diamond principles?", "options": ["It helps reveal errors early, reduce risk and build confidence.", "It makes problem understanding unnecessary.", "It guarantees the first idea is always correct.", "It removes the need for collaboration."], "explain": "The lecture explicitly links iteration to learning, risk and confidence."}, "de": {"prompt": "Warum ist Iteration ein Double-Diamond-Prinzip?", "options": ["Sie hilft, Fehler früh zu erkennen, Risiken zu reduzieren und Vertrauen aufzubauen.", "Sie macht Problemverständnis unnötig.", "Sie garantiert die Richtigkeit der ersten Idee.", "Sie ersetzt Zusammenarbeit."], "explain": "Die Vorlesung verbindet Iteration ausdrücklich mit Lernen, Risiko und Vertrauen."}}, {"lecture": 4, "topic": "double-diamond", "slides": "23–24,46", "answer": 2, "en": {"prompt": "Which phrase best captures the first diamond’s purpose?", "options": ["Choose final interface colors before research.", "Implement the selected feature without questioning it.", "Understand and define the right problem to address.", "Verify only that a prototype opens."], "explain": "The problem space addresses why and what before detailed how."}, "de": {"prompt": "Was ist der Zweck des ersten Diamanten?", "options": ["Vor Forschung die endgültigen Farben wählen.", "Die gewählte Funktion ungeprüft umsetzen.", "Das richtige Problem verstehen und definieren.", "Nur prüfen, ob ein Prototyp startet."], "explain": "Der Problemraum klärt Warum und Was vor dem detaillierten Wie."}}, {"lecture": 4, "topic": "discover-methods", "slides": "29", "answer": 1, "en": {"prompt": "Which question belongs to the mission statement’s “Standouts” field?", "options": ["How many typography variants fit in a menu?", "What makes the product distinctive, and why choose it?", "What is the user’s screen resolution?", "Which maintenance scripts ran last night?"], "explain": "Standouts concerns differentiation and a unique selling proposition."}, "de": {"prompt": "Welche Frage gehört im Mission Statement zu „Standouts“?", "options": ["Wie viele Schriftvarianten passen ins Menü?", "Was macht das Produkt einzigartig, und warum sollte man es wählen?", "Welche Bildschirmauflösung hat die Person?", "Welche Wartungsskripte liefen gestern?"], "explain": "Standouts betrifft Differenzierung und USP."}}, {"lecture": 4, "topic": "discover-methods", "slides": "29", "answer": 3, "en": {"prompt": "Which mission-statement field concerns values and convictions?", "options": ["Channels.", "Interface states.", "Cost factors.", "Beliefs and aspirations."], "explain": "The field asks which underlying values and beliefs the product should communicate."}, "de": {"prompt": "Welches Mission-Statement-Feld betrifft Werte und Überzeugungen?", "options": ["Channels.", "Interfacezustände.", "Cost Factors.", "Beliefs and Aspirations."], "explain": "Dieses Feld fragt nach grundlegenden Werten und vermittelten Überzeugungen."}}, {"lecture": 4, "topic": "discover-methods", "slides": "28", "answer": 0, "en": {"prompt": "A team lists how the product will benefit the organization. Which Vision Board field fits?", "options": ["Business goals.", "Only target-group demographics.", "Only competitors.", "Only technical screen dimensions."], "explain": "The board separates benefits to the business from user needs and product characteristics."}, "de": {"prompt": "Das Team beschreibt den Nutzen für die Organisation. Welches Board-Feld passt?", "options": ["Business Goals.", "Nur Zielgruppendemografie.", "Nur Competitors.", "Nur Bildschirmmaße."], "explain": "Das Board trennt Unternehmensziele von Nutzerbedürfnissen und Produkteigenschaften."}}, {"lecture": 4, "topic": "discover-methods", "slides": "28", "answer": 3, "en": {"prompt": "Which Vision Board field asks how customers will be reached and sold to?", "options": ["Revenue streams.", "Needs.", "Cost factors.", "Channels."], "explain": "Channels concerns routes to market and sale rather than how income is earned."}, "de": {"prompt": "Welches Vision-Board-Feld fragt nach Vermarktung und Vertrieb?", "options": ["Revenue Streams.", "Needs.", "Cost Factors.", "Channels."], "explain": "Kanäle betreffen den Weg zum Markt, nicht die Art der Einnahmen."}}, {"lecture": 4, "topic": "discover-methods", "slides": "30", "answer": 1, "en": {"prompt": "Which assumption best fits feasibility in the lecture’s template?", "options": ["People like its visual appearance.", "We can implement the product because the required capability is available.", "People will use it regularly because it addresses a recurring task.", "People find the product appealing because it fits their values."], "explain": "Feasibility concerns whether the team can realize the proposed product."}, "de": {"prompt": "Welche Annahme passt zur Realisierbarkeit?", "options": ["Menschen mögen sein Aussehen.", "Wir können das Produkt umsetzen, weil die benötigte Fähigkeit verfügbar ist.", "Menschen nutzen es regelmäßig für eine wiederkehrende Aufgabe.", "Menschen finden das Produkt attraktiv, weil es ihren Werten entspricht."], "explain": "Realisierbarkeit betrifft die Möglichkeit der Umsetzung."}}, {"lecture": 4, "topic": "discover-methods", "slides": "30", "answer": 2, "en": {"prompt": "Which assumption best fits regular use in the lecture’s template?", "options": ["The organization has chosen a legal name.", "The required technology can be implemented.", "People will return because the product supports a recurring need.", "The color looks appealing in an advertisement."], "explain": "The Brauchbarkeit column asks why people would use the product regularly."}, "de": {"prompt": "Welche Annahme passt zur regelmäßigen Nutzung?", "options": ["Die Organisation hat einen Rechtsnamen gewählt.", "Die Technik lässt sich implementieren.", "Menschen kommen wieder, weil das Produkt ein wiederkehrendes Bedürfnis unterstützt.", "Die Farbe wirkt in einer Anzeige attraktiv."], "explain": "Brauchbarkeit fragt in dieser Vorlage nach Gründen für regelmäßige Nutzung."}}, {"lecture": 4, "topic": "define-methods", "slides": "31", "answer": 3, "en": {"prompt": "Why is a persona’s fictional name insufficient evidence about users?", "options": ["Names determine actual behavior.", "Every named persona is automatically representative.", "A stock photo guarantees validity.", "Its goals and characteristics still need grounding in research."], "explain": "Personas should summarize data-informed patterns, not decorate unsupported assumptions."}, "de": {"prompt": "Warum ist der erfundene Name einer Persona keine ausreichende Evidenz?", "options": ["Namen bestimmen tatsächliches Verhalten.", "Jede benannte Persona ist automatisch repräsentativ.", "Ein Stockfoto garantiert Gültigkeit.", "Ziele und Eigenschaften müssen weiterhin durch Forschung gestützt sein."], "explain": "Personas bündeln datenbasierte Muster statt unbelegte Annahmen zu dekorieren."}}, {"lecture": 4, "topic": "define-methods", "slides": "32", "answer": 2, "en": {"prompt": "What does the “so I can” part of JTBD express?", "options": ["Only the chosen interface control.", "Only a team deadline.", "The desired outcome or underlying motivation.", "Only the name of the software."], "explain": "The template connects situation, action and the progress or outcome sought."}, "de": {"prompt": "Was drückt der „so I can“-Teil von JTBD aus?", "options": ["Nur t; this quadrant is labelled nice to have."}, "de": {"prompt": "Wo liegen Konzepte mit geringer Wirkung und geringem Aufwand?", "options": ["Nice to Have.", "Effizienz-Killer.", "Quick Wins.", "Strategische Projekte."], "explain": "Geringer Aufwand bedeutet nicht automatisch hohe Wirkung."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "22,34", "answer": 2, "en": {"prompt": "Which activity is convergent even if used within the broader Develop phase?", "options": ["Generating a large set of new alternatives.", "Questioning the initial frame from several viewpoints.", "Prioritizing ideas with an impact–effort matrix.", "Collecting more possible interpretations without selection."], "explain": "Methods can contain their own opening and focusing movements within larger phases."}, "de": {"prompt": "Welche Tätigkeit ist konvergent, auch wenn sie im umfassenderen Develop vorkommt?", "options": ["Viele neue Alternativen erzeugen.", "Den Ausgangsframe aus mehreren Perspektiven hinterfragen.", "Ideen mit einer Impact-Effort-Matrix priorisieren.", "Mehr mögliche Deutungen ohne Auswahl sammeln."], "explain": "Methoden können eigene öffnende und fokussierende Bewegungen enthalten."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "37", "answer": 2, "en": {"prompt": "Which usability question checks orientation in a prototype?", "options": ["Which historical movement is most decorative?", "What is the exact server file name?", "Where am I?", "What is the company’s annual revenue?"], "explain": "Orientation, possible actions and the next step are prototype questions in the lecture."}, "de": {"prompt": "Welche Prototypfrage prüft Orientierung?", "options": ["Welche Stilbewegung ist am dekorativsten?", "Wie heißt die Serverdatei genau?", "Wo befinde ich mich?", "Wie hoch ist der Jahresumsatz?"], "explain": "Die Folien fragen nach Orientierung, Handlungsmöglichkeiten und dem nächsten Schritt."}}, {"lecture": 4, "topic": "develop-deliver", "slides": "37,44", "answer": 0
