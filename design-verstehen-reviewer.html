:root{color-scheme:light;--paper:#f5f3ec;--card:#fffef9;--ink:#24312e;--muted:#526159;--green:#234c3e;--line:#c9d4c9;--pale:#e7efe7;--bad:#812d29;--rose:#f8e8e4;--accent:#a24d35}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:.55rem .85rem;font-weight:650}button:hover:not(:disabled){border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true],button.primary{background:var(--green);border-color:var(--green);color:white}.shell{max-width:980px;margin:auto;padding:0 clamp(16px,4vw,32px)}.top{background:var(--card);border-bottom:1px solid var(--line)}.top .shell{display:flex;justify-content:space-between;align-items:center;padding-block:.75rem;gap:.5rem}.brand{font-size:.84rem;font-weight:750;letter-spacing:.04em}.languages,.row,.sets,.numbers{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.hero{background:var(--green);color:white;padding:clamp(1.8rem,6vw,3.6rem) 0}.hero p{margin:.5rem 0 0;color:#e0eee4}.eyebrow,.meta{font-size:.78rem;font-weight:700;letter-spacing:.065em;text-transform:uppercase}.eyebrow{color:#d0e4d4}h1,h2,h3{line-height:1.23;margin:0}h1{font:clamp(2.2rem,7vw,4rem)/1.08 Georgia,serif;margin:.5rem 0}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:1.3rem;padding-block:1.5rem}.panel,.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px}.panel{padding:1rem;align-self:start}.card{padding:clamp(1rem,4vw,2rem)}.card h2{font:clamp(1.45rem,4vw,2rem)/1.24 Georgia,serif;margin:.6rem 0 1.15rem;overflow-wrap:anywhere}.meta{color:var(--muted)}.between{justify-content:space-between}.sets{margin:.8rem 0}.sets button,.numbers button{min-width:40px;padding:.4rem .55rem}.numbers{margin:1rem 0}.numbers .done:not([aria-pressed=true]){background:var(--pale);border-color:#839e8c}.progress{font-size:.87rem;margin:.6rem 0;color:var(--muted)}progress{width:100%;accent-color:var(--green)}.option{display:flex;align-items:center;width:100%;text-align:left;margin:.55rem 0;gap:.7rem}.option strong{min-width:1.7rem;font-size:.8rem}.option.good{background:var(--pale);border-color:var(--green);color:var(--green)}.option.bad{background:var(--rose);border-color:var(--bad);color:var(--bad)}.response{margin:1rem 0;background:var(--pale);border-left:3px solid var(--green);padding:.75rem 1rem}.response.wrong{background:var(--rose);border-color:var(--bad)}.response p,.card p{margin:.45rem 0}.navigation{margin-top:1rem}textarea{display:block;width:100%;resize:vertical;margin:.4rem 0 .9rem;padding:.65rem;border:1px solid var(--line);background:var(--paper);border-radius:6px}label{font-weight:650}details{padding:1rem;margin:.75rem 0}summary{cursor:pointer;font-weight:700}details details{border-radius:6px}.comparison{width:100%;border-collapse:collapse;margin:.7rem 0}.comparison th,.comparison td{text-align:left;vertical-align:top;padding:.5rem;border-bottom:1px solid var(--line)}.comparison th{width:34%}.warning{color:var(--bad)}footer{border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;padding:1rem 0 2rem}a{color:var(--green)}.skip{position:absolute;left:-9999px}.skip:focus{top:.3rem;left:.3rem;background:white;padding:.5rem}

<script type="application/json" id="study-data">{"kind": "reviewer", "questions": [{"slides": "9–13, 19–20", "de": {"prompt": "Sind das alles gestalterische Entscheidungen? Ordne die Beispiele zu WhatsApp auf Folie 10 ein.", "answer": "Im weiteren Sinn gestalten technische, organisatorische und gestalterische Entscheidungen gemeinsam das Produkt. Eine bewusst gewählte Lesebestätigung ist eine Entscheidung über Systemverhalten. Erwartungsdruck durch Lesebestätigungen ist eine mögliche soziale Folge. Ende-zu-Ende-Verschlüsselung ist eine technische und strategische Entscheidung, die den Datenschutz und damit die Nutzung prägt. Unterscheide die gewählte Regel, ihre technische Umsetzung und ihre Auswirkungen."}, "en": {"prompt": "Are all the WhatsApp examples on slide 10 design decisions? Classify them.", "answer": "In the broad sense, design, technical and organizational choices jointly shape the product. Choosing to show a read receipt is a decision about system behavior. Pressure to reply is a possible social effect. End-to-end encryption is a technical and strategic choice that shapes privacy and use. Distinguish the chosen rule, its implementation and its effects."}}, {"slides": "23–26, 31", "de": {"prompt": "Warum sollte man ein Problem untersuchen, bevor man eine Lösung auswählt?", "answer": "Beobachte die Situation, kläre Problem und Betroffene und hinterfrage Annahmen. Formuliere die gewünschte Veränderung und entwickle mehrere Lösungsoptionen. Wenn Studierende Raumänderungen übersehen, können Kalender, Anzeigen oder organisatorische Änderungen helfen. Die passende Lösung hängt vom tatsächlichen Grund ab."}, "en": {"prompt": "Why investigate a problem before choosing a solution?", "answer": "Observe the situation, identify the problem and people affected, and question assumptions. Define the desired change and develop several options. If students miss room changes, calendars, displays or a process change may help. The cause determines which option fits."}}, {"slides": "39–43", "de": {"prompt": "Vergleiche Simons Sicht auf Design mit der Arbeitsdefinition im Kurs.", "answer": "Bei Simon steht die Veränderung bestehender in bevorzugte Situationen im Mittelpunkt. Die DDP-Arbeitsdefinition betont die bewusste Wahl von Möglichkeiten für Menschen sowie technologische, organisatorische und gesellschaftliche Rahmenbedingungen."}, "en": {"prompt": "Compare Simon’s view of design with the course working definition.", "answer": "Simon emphasizes changing existing situations into preferred ones. The DDP definition emphasizes deliberately shaping possibilities for people within technological, organizational and social constraints."}}, {"slides": "60, 62–63", "de": {"prompt": "Wie lässt sich gutes Design an einem Formular erkennen? Nenne drei prüfbare Kriterien.", "answer": "Prüfe, ob Menschen ihre Aufgabe erfolgreich abschließen, ob sie Eingaberegeln und Rückmeldungen verstehen und ob das Formular seine Folgen ehrlich erklärt, etwa bei optionalen Daten. Das entspricht Brauchbarkeit, Verständlichkeit und Ehrlichkeit."}, "en": {"prompt": "How could you recognize good design in a form? Name three criteria you could check.", "answer": "Check whether people can complete their task, understand input rules and feedback, and see an honest explanation of consequences such as submitting optional data. These checks reflect usefulness, understandability and honesty."}}, {"slides": "5", "de": {"prompt": "Eine App sieht schön aus, aber Menschen können ihre Aufgabe nicht erledigen. Ist sie gut designt? Erkläre Ästhetik gegenüber Funktion und Nutzen.", "answer": "Für diese Aufgabe nein. Ästhetik ist eine Qualitätsdimension, kein Gesamtbeweis. Funktion betrifft Handlungsmöglichkeiten, Nutzen deren Wert für Menschen. Eine schöne Buchungsapp ohne erfolgreichen Abschluss verfehlt ihren Zweck. Prüfe Zielerreichung, Aufwand und Barrieren und verbessere den Ablauf bei hilfreicher visueller Qualität.", "title": "Ästhetik vs. Funktion und Nutzen", "columns": [["Ästhetik", "Wahrnehmbare Form und visuell-emotionale Qualität: Farbe, Typografie, Layout und Konsistenz."], ["Funktion und Nutzen", "Was das Produkt ermöglicht und ob Menschen im Kontext sinnvolle Ziele erreichen."]], "tradeoff": "Attraktivität kann Orientierung und Freude fördern, ersetzt aber keine Aufgabenerledigung. Ziel ist das Zusammenspiel ästhetischer Qualität und sinnvoller, verständlicher Nutzung."}, "en": {"prompt": "An app looks beautiful, but people cannot complete their task. Is it well designed? Explain aesthetics versus function and benefit.", "answer": "For the specified task, no. Aesthetic quality is one dimension, not proof of overall quality. Function concerns available actions; benefit concerns their value for people. A beautiful booking app that prevents completing a booking fails its purpose. Check task success, effort and accessibility, then improve the flow while retaining helpful visual quality.", "title": "Aesthetics vs. function and benefit", "columns": [["Aesthetics", "Perceivable form and visual/emotional quality: color, typography, layout and consistency."], ["Function and benefit", "What the product does and whether people can achieve useful goals in context."]], "tradeoff": "Attractiveness can support orientation and enjoyment, but cannot compensate for blocked tasks. The aim is to integrate aesthetic quality with useful, understandable operation."}}, {"slides": "5; 18–20", "de": {"prompt": "Eine App ist einfach zu bedienen, manipuliert aber Menschen. Ist sie gut designt? Unterscheide Usability und Verantwortung mit Beispiel.", "answer": "Sie kann für eine gewählte Handlung hohe Usability haben und trotzdem verantwortungsvoll gestaltetes Design verfehlen. Ein einfaches Abo mit irreführenden Optionen kann informierte Zustimmung untergraben. Prüfe, wessen Ziel unterstützt wird, Transparenz, echte Wahl und Folgen. Gutes Design verbindet bedienbare Interaktion mit Respekt und weiterem Verantwortungsbewusstsein.", "title": "Usability vs. Verantwortung", "columns": [["Usability", "Bestimmte Menschen erreichen Ziele im Kontext effektiv, effizient und zufriedenstellend."], ["Verantwortung", "Autonomie, Privatsphäre, Manipulation und Folgen für Stakeholder, Gesellschaft, Umwelt und Zukunft berücksichtigen."]], "tradeoff": "Einfache Bedienung macht eine Handlung nicht automatisch verantwortungsvoll. Ein reibungsloser Ablauf kann helfen oder Manipulation erleichtern. Beide Dimensionen müssen geprüft werden."}, "en": {"prompt": "An app is easy to use but manipulates users. Is it well designed? Distinguish usability and responsibility and give an example.", "answer": "It may have high usability for a selected action, yet still fail responsible design. For example, an easy subscription flow with misleading choices can undermine informed consent. Assess whose goal is supported, transparency, meaningful choice and consequences. Good design combines usable interaction with respect for people and wider effects.", "title": "Usability vs. responsibility", "columns": [["Usability", "Specified people achieve goals effectively, efficiently and satisfactorily in context."], ["Responsibility", "Consider autonomy, privacy, manipulation and effects on stakeholders, society, environment and the future."]], "tradeoff": "Ease of use does not make an action ethically desirable. A frictionless flow can help people or make a manipulative choice easier. These dimensions must both be assessed."}}, {"slides": "25–26", "de": {"prompt": "Unterscheide die vier Begriffe anhand kurzfristiger Raumänderungen.", "answer": "Problem: Änderungen werden übersehen. Bedürfnis: verlässliche rechtzeitige Information. Ziel: relevante Änderungen rechtzeitig bemerken. Lösung: Kalenderupdate, Push oder besserer Ablauf. Eine vorzeitige Funktionswahl kann am eigentlichen Problem vorbeigehen.", "title": "Problem vs. Bedürfnis vs. Ziel vs. Lösung", "columns": [["Problem", "Unbefriedigende bestehende Situation."], ["Bedürfnis", "Was Betroffene benötigen."], ["Ziel", "Gewünschter Zustand."], ["Lösung", "Konkrete Maßnahme zum Erreichen des Ziels."]], "tradeoff": "Gewünschte Veränderung und Umsetzung trennen. Mehrere digitale oder organisatorische Lösungen können dasselbe Bedürfnis adressieren."}, "en": {"prompt": "Distinguish all four terms using last-minute classroom changes.", "answer": "Problem: changes are missed. Need: reliable timely information. Goal: students notice relevant changes in time. Solution: calendar update, push message or improved communication process. Selecting a feature before understanding the need risks solving the wrong issue.", "title": "Problem vs. need vs. goal vs. solution", "columns": [["Problem", "An unsatisfactory existing situation."], ["Need", "What affected people require."], ["Goal", "The desired outcome."], ["Solution", "A concrete intervention to achieve the outcome."]], "tradeoff": "Separate the desired change from one implementation. Several digital or organizational solutions may address the same need."}}, {"slides": "37", "de": {"prompt": "Vergleiche beide Ansätze und erkläre Stärken und Grenzen.", "answer": "Ein gut hergestelltes Objekt kann am Bedarf vorbeigehen. Forschung kann einen sinnvolleren Service oder Ablauf entdecken, benötigt aber sorgfältige Umsetzung. Verbinde Untersuchung und Herstellung.", "title": "Design als Handwerk vs. Design als Denkweise", "columns": [["Handwerk", "Sorgfältiges Herstellen mit Materialwissen und ästhetischen Qualitäten."], ["Denkweise", "Arbeits- und Lebenssituationen untersuchen, neu rahmen und gestalten."]], "tradeoff": "Handwerk schafft greifbare Qualität; die Denkweise erweitert den Gegenstand. Beide ergänzen einander."}, "en": {"prompt": "Compare the two approaches and explain their strengths and limits.", "answer": "A well-made object demonstrates craft, but may address an unimportant need. Investigation may uncover a better service or workflow, but still needs careful realization. Connect inquiry and making so a meaningful direction becomes a good artifact or service.", "title": "Design as craft vs. design as thinking", "columns": [["Craft", "Making objects with care, material knowledge and attractive qualities."], ["Thinking", "Investigating, reframing and shaping people’s working and living situations."]], "tradeoff": "Craft brings tangible quality; a thinking approach broadens what can be addressed. They complement each other rather than form an exclusive choice."}}, {"slides": "46–48", "de": {"prompt": "Vergleiche die Perspektiven am Beispiel Sprachnachricht.", "answer": "Design fragt nach Nutzen für Sender und Empfänger, Informatik nach Codierung/Übertragung, Engineering nach zuverlässigem Betrieb und Leistung auf Geräten. Kunst kann Klang und Darstellung ausdrucksvoll erfahrbar machen. Die Funktion entsteht im Zusammenspiel.", "title": "Kunst vs. Design vs. Informatik vs. Engineering", "columns": [["Kunst", "Ausdruck, Kritik, Bedeutung und ästhetische Erfahrung."], ["Design", "Sinnvolle Veränderung für Menschen, Bedürfnisse, Kontext und Folgen."], ["Informatik", "Algorithmen, Datenverarbeitung und Software."], ["Engineering", "Zuverlässige, sichere und wartbare technische Realisierung."]], "tradeoff": "Die Fragen überschneiden sich. Produkte benötigen Zusammenarbeit; keine Perspektive beantwortet alles."}, "en": {"prompt": "Compare the perspectives using a voice-message feature.", "answer": "Design asks when recording helps senders and recipients. Computer science addresses encoding/transmission. Engineering addresses performance and reliable operation across devices. Art can explore expressive sound and presentation. Combine their contributions rather than treating one as sufficient.", "title": "Art vs. design vs. computer science vs. engineering", "columns": [["Art", "Expression, critique, meaning and aesthetic experience."], ["Design", "Meaningful change for people, needs, context and consequences."], ["Computer science", "Algorithms, data processing and software."], ["Engineering", "Reliable, secure, maintainable technical realization."]], "tradeoff": "Different questions overlap. A working product requires collaboration; one perspective does not answer every question."}}, {"slides": "15", "de": {"prompt": "Warum verbessern zusätzliche Funktionen ein Produkt nicht automatisch?", "answer": "Beziehe Funktionen auf Bedürfnisse und Ziele. Ein Dashboard ist eine Fähigkeit; bessere Entscheidungen wären ein zu prüfender Nutzen. Wäge diesen gegen Aufwand, Fehler und Überlastung ab.", "title": "Zweck und Nutzen vs. Funktionen", "columns": [["Zweck/Nutzen", "Warum das Produkt für wen welchen Wert schaffen soll."], ["Funktionen", "Was Menschen damit tun können."]], "tradeoff": "Eine Handlungsmöglichkeit schafft nicht automatisch genügend Nutzen. Mehr Funktionen können Komplexität, Wartung und kognitive Last erhöhen."}, "en": {"prompt": "Why does adding functions not automatically improve a product?", "answer": "Relate each function to a need and goal. A dashboard is a capability; better decision-making is a possible benefit that needs evidence. Weigh that benefit against effort, errors and overload.", "title": "Purpose and benefit vs. functions", "columns": [["Purpose/benefit", "Why a product should exist, for whom and toward what value."], ["Functions", "What people can do with it."]], "tradeoff": "A feature can enable an action without creating enough value. More functions may also increase complexity, maintenance and cognitive load."}}, {"slides": "16", "de": {"prompt": "Unterscheide beide Bereiche mit Nachrichtenbeispielen.", "answer": "Fehlerfeedback nach Senden betrifft Interaktion. Angepinnte Chats und versteckte Einstellungen betreffen Priorität. Erkläre Systemreaktion und Aufmerksamkeitslenkung.", "title": "Interaktion/Verhalten vs. Sichtbarkeit/Priorität", "columns": [["Interaktion/Verhalten", "Reaktionen, Rückmeldungen und Zustandsänderungen nach Handlungen."], ["Sichtbarkeit/Priorität", "Was zuerst sichtbar, hervorgehoben oder schwer auffindbar ist."]], "tradeoff": "Klares Feedback und auffindbare Bedienung ergänzen sich. Eine korrekt funktionierende, versteckte Datenschutzeinstellung hilft praktisch möglicherweise wenig."}, "en": {"prompt": "Distinguish the areas with two messaging examples.", "answer": "Failure feedback after Send concerns interaction. Pinned chats and hidden settings concern priority. Explain both the response to an action and the attention directed before acting.", "title": "Interaction/behavior vs. visibility/priority", "columns": [["Interaction/behavior", "How actions produce responses, feedback and state changes."], ["Visibility/priority", "What becomes prominent, visible first or hard to find."]], "tradeoff": "Clear feedback and discoverable controls work together. A correctly functioning privacy control may still be ineffective in practice if hidden."}}, {"slides": "55–58", "de": {"prompt": "Unterscheide Zustellhäkchen und ein Produkt als Ausdruck von Zugehörigkeit.", "answer": "Das Häkchen zeigt einen Nachrichtenzustand. Zugehörigkeit ist symbolische Bedeutung. Beide sind zeichenhafte Produktfunktionen, nicht bloß formales Aussehen oder praktische Fähigkeit.", "title": "Anzeichenfunktion vs. Symbolfunktion", "columns": [["Anzeichen", "Hinweis auf Zustand, Funktion oder Gebrauch."], ["Symbolik", "Soziale, kulturelle oder emotionale Bedeutung."]], "tradeoff": "Beide kommunizieren auf unterschiedlichen Ebenen. Zustandszeichen müssen verständlich sein; Symbolik hängt auch von Menschen und Kultur ab."}, "en": {"prompt": "Distinguish a delivery check mark from a product expressing belonging.", "answer": "The check mark indicates message state. Belonging is a wider symbolic meaning. Both are sign-related product-language functions, not the same as formal appearance or practical capability.", "title": "Indicative vs. symbolic function", "columns": [["Indicative", "A cue about state, function or use."], ["Symbolic", "Social, cultural or emotional meaning."]], "tradeoff": "Both communicate, but at different levels. A state cue should be understandable; symbolic interpretation also depends on people and culture."}}, {"slides": "20", "de": {"prompt": "Nenne Vorteil, Nachteil und Gestaltungsreaktion für Lesebestätigungen.", "answer": "Sie unterstützen Verbindlichkeit, können aber sofortige Antworten erwarten lassen. Prüfe Kontrollmöglichkeiten und verständliche Statusbedeutung sowie Folgen für beide Seiten.", "title": "Lesebestätigung: Verbindlichkeit vs. Druck", "columns": [["Vorteil", "Rückmeldung und Verbindlichkeit der Kommunikation."], ["Risiko", "Antwortdruck und geringere Privatsphäre über Leseverhalten."]], "tradeoff": "Beziehung, Kontext und echte Einstellungen entscheiden. Lesebestätigungen sind nicht grundsätzlich gut oder schlecht."}, "en": {"prompt": "Give a benefit, a drawback and a design response for read receipts.", "answer": "They support accountability but may create an expectation of immediate reply. Consider user controls and communicate clearly what the status means. Evaluate effects on both sender and recipient.", "title": "Read receipts: accountability vs. pressure", "columns": [["Benefit", "Acknowledgment and a sense that communication has reached the other person."], ["Risk", "Response pressure and reduced privacy about reading behavior."]], "tradeoff": "Whether it helps depends on relationship, context and meaningful settings. This is a trade-off, not proof that receipts are always good or bad."}}, {"slides": "20", "de": {"prompt": "Diskutiere Vor- und Nachteile von Sprachnachrichten für beide Seiten.", "answer": "Tonfall und weniger Tippen helfen, während Hören langsam oder öffentlich unpraktisch sein kann. Biete passende Alternativen und prüfe Empfängerbedürfnisse statt allgemeinen Komfort anzunehmen.", "title": "Sprachnachrichten: Senderkomfort vs. Empfängeraufwand", "columns": [["Vorteil", "Schnelle, ausdrucksstarke zeitversetzte Aufnahme."], ["Risiko", "Höraufwand, unpassende Umgebung und schwieriges Wiederfinden bestimmter Inhalte."]], "tradeoff": "Zeitersparnis einer Person kann Arbeit für eine andere sein. Rollen, Kontext und Barrierefreiheit prüfen."}, "en": {"prompt": "Discuss pros and cons of voice messages from both perspectives.", "answer": "They can convey tone and reduce typing, but listening may be slow or impractical in public. Offer context-appropriate alternatives and evaluate actual recipient needs rather than assuming universal convenience.", "title": "Voice messages: sender convenience vs. recipient effort", "columns": [["Benefit", "Fast expressive asynchronous recording for the sender."], ["Risk", "Listening effort, unsuitable surroundings and difficulty locating specific information."]], "tradeoff": "Time saved by one person can become work for another. Assess both roles and context; accessibility also matters."}}, {"slides": "20", "de": {"prompt": "Erkläre den Zielkonflikt und eine evidenzbasierte Verbesserung.", "answer": "Prüfe, ob Entscheidungen wegen Menge, Relevanz oder Struktur übersehen werden. Erkunde Highlights, Threads oder Gruppenabläufe statt einfach mehr Benachrichtigungen einzuführen.", "title": "Gruppenchats: Koordination vs. Informationsüberlastung", "columns": [["Vorteil", "Gemeinsame Kommunikation und Koordination."], ["Risiko", "Nachrichtenmenge, unklare Prioritäten und sozialer Druck."]], "tradeoff": "Mehr Aktivität kann koordinieren und zugleich überfordern. Administration und Organisation haben weitere Sichtweisen."}, "en": {"prompt": "Explain the trade-off and suggest an evidence-based improvement.", "answer": "Investigate whether people miss decisions because of volume, relevance or structure. Explore highlights, threads or group practices instead of assuming simply increasing notifications will help.", "title": "Group chats: coordination vs. information overload", "columns": [["Benefit", "Shared communication and group coordination."], ["Risk", "Message volume, unclear priorities and social pressure."]], "tradeoff": "More activity can help coordination and still overwhelm members. Consider administrators’ and organizational perspectives as well."}}, {"slides": "20", "de": {"prompt": "Nenne je einen Vorteil und Nachteil und begründe ihre Bedeutung.", "answer": "Vertraulicher informeller Austausch kann profitieren; koordinierte Arbeit braucht möglicherweise Aufzeichnungen. Bedürfnisse und Regeln prüfen statt eine Einstellung universell vorzuziehen.", "title": "Selbstlöschende Nachrichten: Privatsphäre vs. Nachvollziehbarkeit", "columns": [["Vorteil", "Weniger dauerhaft gespeicherter Verlauf kann Privatsphäre unterstützen."], ["Risiko", "Entscheidungen und Kontext sind später schwer rekonstruierbar."]], "tradeoff": "Der Gesprächszweck entscheidet. Aufbewahrungsregeln müssen klar sein."}, "en": {"prompt": "Give one advantage and disadvantage and explain when each matters.", "answer": "Sensitive informal communication may benefit from reduced persistence; coordinated work may need a record. Discuss participants’ needs and retention rules rather than declaring one setting universally best.", "title": "Disappearing messages: privacy vs. traceability", "columns": [["Benefit", "Less persistent conversation history can support privacy."], ["Risk", "Decisions or context become harder to reconstruct later."]], "tradeoff": "Appropriateness depends on the purpose of the conversation. Clear expectations about retention matter."}}, {"slides": "25–26", "de": {"prompt": "Unterscheide Problem, Bedürfnis, Ziel und Lösung am Raumänderungsbeispiel.", "answer": "Problem: Änderungen werden übersehen. Bedürfnis: rechtzeitige verlässliche Information. Ziel: relevante Änderungen rechtzeitig wahrnehmen. Lösungen: Push, Kalender, E-Mail, Anzeigen oder organisatorische Verbesserungen. Eine Lösung ist ein möglicher Weg zum Ziel."}, "en": {"prompt": "Distinguish problem, need, goal and solution using the room-change example.", "answer": "Problem: students miss changes. Need: timely and reliable information. Goal: notice relevant changes in time. Solutions: notifications, calendar updates, email, signs or organizational changes. Explain that a solution is one possible means to an outcome."}}, {"slides": "19–20", "de": {"prompt": "Analysiere die Zielkonflikte von Lesebestätigungen.", "answer": "Erläutere Feedback und Verbindlichkeit sowie Antwortdruck, Privatsphäre und Kontrolle. Betrachte Sender, Empfänger, Gruppen und Organisation. Unterscheide beabsichtigte und unbeabsichtigte Folgen."}, "en": {"prompt": "Analyze the design trade-offs of read receipts.", "answer": "Cover system feedback and accountability, possible response pressure, privacy and user control. Identify senders, recipients, groups and the organization, and explain intended and unintended effects."}}, {"slides": "14–17", "de": {"prompt": "Wende die fünf Entscheidungsbereiche auf eine Nachrichtenfunktion an.", "answer": "Zweck/Nutzen, Funktionen, Interaktion/Verhalten, Sichtbarkeit/Priorität sowie Regeln/Grenzen. Bei Sprache: Zielgruppe, Aufnahme/Wiedergabe, Fehlerfeedback, Hervorhebung und Berechtigungen."}, "en": {"prompt": "Apply the five decision areas to a messaging feature.", "answer": "Discuss purpose/benefit, functions, interaction/behavior, visibility/priority and rules/boundaries. For voice messages, consider who benefits, recording/playback, failure feedback, prominence and permissions."}}, {"slides": "56–58", "de": {"prompt": "Unterscheide Anzeichen- und Symbolfunktion.", "answer": "Anzeichen vermitteln Zustand, Funktion oder Nutzung, etwa Zustellhäkchen. Symbolik vermittelt soziale, kulturelle oder emotionale Bedeutung, etwa Identität und Zugehörigkeit. Ein Produkt kann mehrere Funktionen tragen."}, "en": {"prompt": "Distinguish indicative and symbolic functions.", "answer": "Indicative: a cue about state, use or function, such as a delivery check mark. Symbolic: social, cultural or emotional meaning, such as identity or belonging. Explain why the same product can carry several functions."}}, {"slides": "50–51", "de": {"prompt": "Warum ist ein digitales Produkt mehr als sein Interface?", "answer": "Nenne Interaktion, Inhalte, Technik/Daten und Service/Organisation. Accounts, Support, Regeln, Datenschutz und Infrastruktur ergänzen die sichtbaren Screens."}, "en": {"prompt": "Explain why a digital product is more than its interface.", "answer": "Include interaction, content, technology/data and service/organization. A messaging service needs accounts, support, rules, privacy and infrastructure as well as screens."}}, {"slides": "60–63", "de": {"prompt": "Wende drei Rams-Prinzipien auf ein digitales Produkt an.", "answer": "Definiere drei Prinzipien und begründe konkrete Entscheidungen, etwa verständliche Navigation, ehrliche Leistungsversprechen und langlebige Kompatibilität. Bewerte kritisch statt nur zu loben."}, "en": {"prompt": "Apply three Rams principles to one digital product.", "answer": "Choose three, define each and give a concrete decision. For example: understandable navigation, honest claims and long-lasting compatibility. Evaluate rather than simply praise the product."}}, {"slides": "11–13, 42", "de": {"prompt": "Definiere Design, ohne es auf Dekoration zu reduzieren.", "answer": "Bewusste Entscheidungen über Möglichkeiten, Form, Funktion, Verhalten, Regeln, Inhalte, Prioritäten, Menschen und Folgen. Verbinde dies mit der Veränderung bestehender Situationen für Menschen."}, "en": {"prompt": "Define design without reducing it to decoration.", "answer": "Discuss deliberate choices about possibilities, form, function, behavior, rules, content, priorities, users and consequences. Connect these choices with changing an existing situation for people."}}, {"slides": "9–17", "de": {"prompt": "Nenne fünf nichtvisuelle WhatsApp-Designentscheidungen und erläutere sie.", "answer": "Etwa Bearbeitungsfrist, Online-Standard, Benachrichtigungen, Gruppenrechte und selbstlöschende Nachrichten. Zeige Folgen für Handlungen, Aufmerksamkeit, Privatsphäre und Beziehungen."}, "en": {"prompt": "List and illustrate five nonvisual design decisions in WhatsApp.", "answer": "Examples: edit time limit, online-status default, notification behavior, group permissions and disappearing-message rules. Explain how each changes possible action, attention, privacy or social relationships."}}, {"slides": "12–13", "de": {"prompt": "Warum ist auch eine implizite Wahl eine Designentscheidung?", "answer": "Eine ungeprüfte Voreinstellung wählt eine Möglichkeit, verstärkt Ziele, wirkt unter Bedingungen und hat Folgen. Beispiel: voreingestellter Datenschutz oder Benachrichtigungen."}, "en": {"prompt": "What makes a choice a design decision even when it is implicit?", "answer": "An unexamined default still selects among possibilities, pursues or reinforces goals, operates under constraints and creates effects. Give a default privacy or notification example."}}, {"slides": "13, 19–20", "de": {"prompt": "Erkläre beabsichtigte und unbeabsichtigte Folgen einer Produktentscheidung.", "answer": "Nenne Ziel, Mechanismus, Nutznießer und Nebenfolge. Lesebestätigungen erleichtern Rückmeldung und erzeugen möglicherweise Druck. Schlage Kontrolle und Evaluation vor."}, "en": {"prompt": "Explain intended and unintended effects of a product choice.", "answer": "Identify the goal, the selected mechanism, who benefits and a possible side effect. For example: read receipts support acknowledgment but can create pressure; propose user controls and evaluation."}}, {"slides": "14–17", "de": {"prompt": "Unterscheide Zweck, Funktionen, Interaktion, Sichtbarkeit und Regeln.", "answer": "Warum/für wen? Was ist möglich? Wie reagiert das System? Was wird hervorgehoben? Was ist erlaubt? Ordne konkrete Beispiele den Fragen zu."}, "en": {"prompt": "Distinguish purpose, functions, interaction, visibility and rules.", "answer": "State each core question, then classify concrete examples. Purpose: why/for whom. Functions: what is possible. Interaction: action/response. Visibility: prominence. Rules: permitted or restricted actions."}}, {"slides": "15", "de": {"prompt": "Warum können zusätzliche Funktionen ein Produkt verschlechtern?", "answer": "Wäge Nutzen gegen Komplexität, kognitive Last, Aufwand, Fehler und Wartung ab. Begründe, für welche Menschen und Aufgaben sich diese Kosten lohnen."}, "en": {"prompt": "Discuss why more functions can make a product worse.", "answer": "Balance added utility against complexity, cognitive load, implementation effort, errors and maintenance. State which people and tasks gain enough benefit to justify the cost."}}, {"slides": "19–20, 47", "de": {"prompt": "Analysiere Sprachnachrichten aus Sender- und Empfängersicht.", "answer": "Sender: schnell, ausdrucksstark und zeitversetzt. Empfänger: Hörzeit, Umgebung, Barrierefreiheit, Wiederauffinden und Privatsphäre. Komfort ist nicht automatisch gleich verteilt."}, "en": {"prompt": "Analyze voice messages from sender and recipient perspectives.", "answer": "Sender: quick, expressive asynchronous recording. Recipient: listening time, surroundings, accessibility, retrieval and privacy. Evaluate the trade-off instead of assuming convenience is shared equally."}}, {"slides": "24, 32", "de": {"prompt": "Wie können neue technische Möglichkeiten Designprobleme eröffnen?", "answer": "Es muss nichts defekt sein. Neue Fähigkeiten erlauben Verbesserungen, erzeugen aber auch Anforderungen und Nebenfolgen. Kläre den menschlichen Bedarf vor dem Technikeinsatz."}, "en": {"prompt": "Explain how problems can arise from new technological possibilities.", "answer": "A situation need not involve a broken tool. New capabilities can create opportunities to improve use, but also new demands or unwanted effects. Establish a human need before adopting a technology."}}, {"slides": "27–28", "de": {"prompt": "Warum kann eine Lösung das ursprüngliche Problem verändern?", "answer": "Maßnahmen verändern Verhalten, Erwartungen und Kontext. Benachrichtigungen können Informationsprobleme lösen und Überlastung schaffen. Beobachtung, Lernen und Anpassung bleiben nötig."}, "en": {"prompt": "Why can a solution alter the original problem?", "answer": "An intervention changes behavior, expectations and context. Example: a notification solution increases overload. Explain ongoing observation, learning and adaptation."}}, {"slides": "29–30", "de": {"prompt": "Vergleiche Mitglied, Administration und Organisation beim Gruppenchat.", "answer": "Mitglieder: Übersicht und wenig Druck. Administration: Moderation und wichtige Informationen. Organisation: Nutzung und Bindung. Zeige Konflikte und einen ausgehandelten Problemframe."}, "en": {"prompt": "Compare an administrator, a member and an organization in a group-chat problem.", "answer": "Members may prioritize clarity and reduced pressure; administrators prioritize moderation and important information; the organization may prioritize use and retention. Identify conflicts and negotiate a frame."}}, {"slides": "39", "de": {"prompt": "Erkläre Ist- und Soll-Situation nach Simon.", "answer": "Beschreibe den aktuellen Zustand, warum er für bestimmte Menschen unbefriedigend ist, und den gewünschten Zustand. Design entwirft Handlungswege dazwischen; mehrere Lösungen sind möglich."}, "en": {"prompt": "Explain the difference between current and preferred situations in Simon’s account.", "answer": "Describe the existing state, why it is unsatisfactory for specified people and the preferred outcome. Design devises actions bridging the states without assuming only one solution exists."}}, {"slides": "36–38", "de": {"prompt": "Vergleiche Design als Handwerk und als Denkweise.", "answer": "Handwerk betont Herstellen und Objektqualitäten. Denken umfasst Untersuchen, Reframen und Gestaltung von Arbeits- und Lebenssituationen. Beide können sich ergänzen."}, "en": {"prompt": "Compare design as craft with design as a way of thinking.", "answer": "Craft emphasizes making and qualities of objects; design thinking includes investigation, reframing and shaping working or living situations. They can support one another rather than being mutually exclusive."}}, {"slides": "45–48", "de": {"prompt": "Erkläre das Zusammenspiel von Design, Kunst, Informatik und Engineering.", "answer": "Ausdruck/Kritik, sinnvolle Veränderung für Menschen, rechnerische Verarbeitung und zuverlässige technische Umsetzung unterscheiden. Zeige an einer Funktion Zusammenarbeit und Überschneidungen."}, "en": {"prompt": "Explain design’s relation to art, computer science and engineering.", "answer": "Distinguish expression/critique, meaningful change for people, computational processing, and reliable technical realization. Use one feature to show collaboration and overlap."}}, {"slides": "50–51", "de": {"prompt": "Erkläre fünf digitale Produktebenen an einer Banking-App.", "answer": "Interface; Handlungen/Reaktionen; Inhalte; Technik/Daten; Service/Organisation. Support, Kontoregeln, Sicherheit und Datenschutz gehen über den Screen hinaus."}, "en": {"prompt": "Explain all five layers of a digital product using a banking app.", "answer": "Interface; actions and responses; content and information; technology and data; services and organization. Include support, account rules, security or privacy beyond the screen."}}, {"slides": "56", "de": {"prompt": "Beschreibe die Hierarchie der Produktsprache im Offenbacher Ansatz.", "answer": "Praktisch-technische, ökonomische und produktsprachlich-sinnliche Funktionen unterscheiden. Produktsprache umfasst formalästhetische und zeichenhafte Funktionen; letztere Anzeichen und Symbolik."}, "en": {"prompt": "Describe the hierarchy of product-language functions in the Offenbach approach.", "answer": "Distinguish practical–technical, economic and product-language/sensory functions. Within product language, explain formal-aesthetic and sign-related functions; within signs, explain indicative and symbolic functions."}}, {"slides": "54–56", "de": {"prompt": "Vergleiche praktisch-technische, ökonomische, ökologische, ästhetische und symbolische Funktionen.", "answer": "Definiere jeweils Wert oder Wirkung und gib Beispiele. Ein Produkt kann alle zugleich erfüllen; zeige mögliche Konflikte zwischen ihnen."}, "en": {"prompt": "Compare practical–technical, economic, ecological, aesthetic and symbolic functions.", "answer": "Define the kind of value or effect each addresses and give examples. Explain that one product can serve all simultaneously and create conflicts among them."}}, {"slides": "62–63", "de": {"prompt": "Nenne alle zehn Rams-Prinzipien und verbinde sie mit Entscheidungen.", "answer": "Innovativ, brauchbar, verständlich, ästhetisch, ehrlich, unaufdringlich, langlebig, gründlich/konsequent, umweltfreundlich, so wenig Design wie möglich. Ergänze konkrete Produktentscheidungen."}, "en": {"prompt": "State all ten Rams principles and connect each to a decision.", "answer": "Innovative; useful; understandable; aesthetic; honest; unobtrusive; long-lasting; thorough to the last detail; environmentally friendly; as little design as possible. Give concrete product choices, not only slogans."}}, {"slides": "5, 60–63", "de": {"prompt": "Bewerte eine beliebte App mit drei Rams-Prinzipien und einer Verantwortungsfrage.", "answer": "Untersuche beobachtbares Verhalten, Evidenz und Zielkonflikte. Schlage Verbesserungen vor. Beliebtheit beweist nicht Qualität; berücksichtige Datenschutz, Aufmerksamkeit, Barrieren oder Ressourcen."}, "en": {"prompt": "Critically assess a popular app with three Rams principles and a responsibility concern.", "answer": "Choose identifiable behavior, assess evidence and trade-offs, and propose improvements. Distinguish popularity from quality; include privacy, attention, accessibility or resource effects."}}], "notes": [{"id": "design-scope", "lecture": 1, "slides": "2–21", "en": {"title": "Design is more than appearance", "content": "\u003cp class=\"lead\">Design shapes what people can do, what they notice, and the consequences that follow.\u003c/p>\u003cp>It includes appearance, functions, rules, workflows, content, priorities, target groups and impacts. A beautiful app that prevents task completion is poorly designed for that task. An easy-to-use app that manipulates people raises questions of responsibility.\u003c/p>\u003ch3>Five layers in the WhatsApp example\u003c/h3>\u003cul>\u003cli>\u003cstrong>Visible form:\u003c/strong> color, typography, hierarchy, icons, spacing and layout.\u003c/li>\u003cli>\u003cstrong>Interactions and functions:\u003c/strong> writing, sending, reacting, calling, editing, forwarding and archiving.\u003c/li>\u003cli>\u003cstrong>Rules and system behavior:\u003c/strong> check marks, read receipts, online status, notifications and group permissions.\u003c/li>\u003cli>\u003cstrong>Social relationships:\u003c/strong> reply expectations, social pressure, group dynamics and boundaries between work and private life.\u003c/li>\u003cli>\u003cstrong>Technical and organizational decisions:\u003c/strong> encryption, synchronization, contact matching, data storage, ecosystem connections and business models.\u003c/li>\u003c/ul>\u003cp class=\"recall\">A design decision is an explicit or implicit choice between possibilities. It pursues goals under constraints and can have intended and unintended effects.\u003c/p>\u003ch3>Trade-offs\u003c/h3>\u003cp>Read receipts can support accountability but create pressure. Voice messages help senders communicate quickly but may increase recipients’ effort. Group chats support coordination but create overload. Disappearing messages support privacy but reduce traceability.\u003c/p>"}, "de": {"title": "Design ist mehr als Aussehen", "content": "\u003cp class='lead'>Design gestaltet, was Menschen tun können, was sie wahrnehmen und welche Folgen daraus entstehen.\u003c/p>\u003cp>Es umfasst Aussehen, Funktionen, Regeln, Abläufe, Inhalte, Prioritäten, Zielgruppen und Auswirkungen. Eine schöne App kann an der Aufgabe scheitern; eine leicht bedienbare App kann trotzdem manipulativ sein.\u003c/p>\u003ch3>Fünf Ebenen am Beispiel WhatsApp\u003c/h3>\u003cul>\u003cli>\u003cstrong>Sichtbare Gestaltung:\u003c/strong> Hierarchie, Farben, Typografie, Icons, Abstände und Anordnung.\u003c/li>\u003cli>\u003cstrong>Interaktionen und Funktionen:\u003c/strong> Schreiben, Senden, Reagieren, Anrufen, Bearbeiten, Weiterleiten und Archivieren.\u003c/li>\u003cli>\u003cstrong>Regeln und Systemverhalten:\u003c/strong> Häkchen, Lesebestätigung, Online-Status, Benachrichtigungen und Gruppenrechte.\u003c/li>\u003cli>\u003cstrong>Soziale Beziehungen:\u003c/strong> Antworterwartungen, Druck, Gruppendynamik und Grenzen zwischen Beruf und Privatleben.\u003c/li>\u003cli>\u003cstrong>Technische und organisatorische Entscheidungen:\u003c/strong> Verschlüsselung, Synchronisierung, Kontaktabgleich, Datenspeicherung, Ökosystem und Geschäftsmodell.\u003c/li>\u003c/ul>\u003cp class='recall'>Eine Designentscheidung ist eine begründete oder implizite Auswahl zwischen Gestaltungsmöglichkeiten. Sie verfolgt Ziele unter Rahmenbedingungen und hat beabsichtigte sowie unbeabsichtigte Folgen.\u003c/p>\u003ch3>Zielkonflikte\u003c/h3>\u003cp>Lesebestätigungen unterstützen Verbindlichkeit, können aber Druck erzeugen. Sprachnachrichten entlasten Sender, belasten jedoch möglicherweise Empfänger. Gruppenchats ermöglichen Koordination und erzeugen Überlastung. Selbstlöschende Nachrichten stärken Privatsphäre und verringern Nachvollziehbarkeit.\u003c/p>"}}, {"id": "decision-areas", "lecture": 1, "slides": "12–18", "en": {"title": "Five areas of design decisions", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Core question\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Purpose and benefit\u003c/td>\u003ctd>Which problem or need should the product address, and for whom?\u003c/td>\u003ctd>Prioritize reliable coordination over constant engagement.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Functions\u003c/td>\u003ctd>What should people be able to do?\u003c/td>\u003ctd>Send messages, find information, call others.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interaction and behavior\u003c/td>\u003ctd>How does the system respond to an action?\u003c/td>\u003ctd>Explain failure when the connection is lost.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visibility and priority\u003c/td>\u003ctd>What is prominent, and what is hidden?\u003c/td>\u003ctd>Pin important chats or hide advanced settings.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rules and boundaries\u003c/td>\u003ctd>What is allowed, prevented or restricted?\u003c/td>\u003ctd>Determine who can add members or see online status.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>More features can add value but also increase complexity, development effort, maintenance, errors and cognitive load.\u003c/p>\u003cp class=\"recall\">More features ≠ a better product. Explain the benefit and the cost of each decision.\u003c/p>"}, "de": {"title": "Fünf Bereiche von Designentscheidungen", "content": "\u003cdl>\u003cdt>\u003cstrong>Zweck und Nutzen\u003c/strong>\u003c/dt>\u003cdd>Welches Problem oder Bedürfnis soll für wen bearbeitet werden? Welche Situationen und Prioritäten zählen?\u003c/dd>\u003cdt>\u003cstrong>Funktionen\u003c/strong>\u003c/dt>\u003cdd>Was können Menschen mit dem Produkt machen? Welche Funktionen braucht es dafür?\u003c/dd>\u003cdt>\u003cstrong>Interaktion und Verhalten\u003c/strong>\u003c/dt>\u003cdd>Wie reagiert das System? Beispiel: Rückmeldung bei Verbindungsverlust oder Fehlern.\u003c/dd>\u003cdt>\u003cstrong>Sichtbarkeit und Priorität\u003c/strong>\u003c/dt>\u003cdd>Was steht im Vordergrund, was bleibt schwer auffindbar? Beispiel: angepinnte Chats und Datenschutzeinstellungen.\u003c/dd>\u003cdt>\u003cstrong>Regeln und Grenzen\u003c/strong>\u003c/dt>\u003cdd>Was ist erlaubt oder eingeschränkt? Beispiel: Mitglieder hinzufügen oder Online-Status sehen.\u003c/dd>\u003c/dl>\u003cp>Weitere Funktionen können Nutzen, aber auch Komplexität, Entwicklungsaufwand, Wartung, Fehler und kognitive Belastung erhöhen.\u003c/p>\u003cp class='recall'>Mehr Funktionen ≠ besseres Produkt. Begründe jeweils Nutzen und Kosten.\u003c/p>"}}, {"id": "problem-need-goal", "lecture": 1, "slides": "22–32", "en": {"title": "Problem, need, goal and solution", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Lecture example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Problem\u003c/td>\u003ctd>A situation is unsatisfactory for particular people.\u003c/td>\u003ctd>Students miss last-minute room changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Need\u003c/td>\u003ctd>What the affected people require.\u003c/td>\u003ctd>Reliable, timely information about changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Goal\u003c/td>\u003ctd>The desired state to achieve.\u003c/td>\u003ctd>Students notice relevant changes in time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solution\u003c/td>\u003ctd>A concrete way to reach that state.\u003c/td>\u003ctd>Push notifications, calendar updates, email, signs or a better organizational process.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A design problem is a situation worth improving without a single predetermined way to change it. It may involve frustration, wasted time, unmet needs, conflicting interests, new opportunities or unwanted effects.\u003c/p>\u003cp>\u003cstrong>Sequence:\u003c/strong> observe → understand the problem and affected people → question assumptions → formulate the desired change → develop alternatives → select and refine.\u003c/p>\u003cp>Problems depend on perspective. A group member may see overload, an administrator may see moderation work, and the organization may value growth or retention.\u003c/p>\u003cp class=\"recall\">Identify whose problem you are solving before choosing a solution. Solutions can create new problems, so design remains a learning process.\u003c/p>"}, "de": {"title": "Problem, Bedürfnis, Ziel und Lösung", "content": "\u003cul>\u003cli>\u003cstrong>Problem:\u003c/strong> Eine Situation funktioniert für bestimmte Menschen nicht zufriedenstellend. Beispiel: Studierende übersehen kurzfristige Raumänderungen.\u003c/li>\u003cli>\u003cstrong>Bedürfnis:\u003c/strong> Was benötigen Betroffene? Verlässliche und rechtzeitige Informationen.\u003c/li>\u003cli>\u003cstrong>Ziel:\u003c/strong> Welcher Zustand soll erreicht werden? Relevante Änderungen rechtzeitig wahrnehmen.\u003c/li>\u003cli>\u003cstrong>Lösung:\u003c/strong> Ein konkreter Weg dorthin: Push, Kalenderaktualisierung, E-Mail, Anzeige oder besserer organisatorischer Ablauf.\u003c/li>\u003c/ul>\u003cp>Ein Designproblem ist eine verbesserungswürdige Situation ohne bereits eindeutig festgelegte Veränderung. Es kann Frustration, Zeitverlust, unerfüllte Bedürfnisse, Interessenkonflikte, neue Möglichkeiten oder unerwünschte Folgen betreffen.\u003c/p>\u003cp>\u003cstrong>Vorgehen:\u003c/strong> Beobachten → Problem und Betroffene verstehen → Annahmen hinterfragen → gewünschte Veränderung formulieren → Alternativen entwickeln → auswählen und verbessern.\u003c/p>\u003cp>Mitglieder sehen möglicherweise Überlastung, Administration sieht Moderationsbedarf, die Organisation sieht Wachstum und Bindung.\u003c/p>\u003cp class='recall'>Kläre zuerst, aus wessen Perspektive das Problem besteht. Lösungen können neue Probleme schaffen: Design bleibt ein Lernprozess.\u003c/p>"}}, {"id": "definitions", "lecture": 1, "slides": "33–43", "en": {"title": "Definitions and ways of thinking about design", "content": "\u003cp>\u003cstrong>Word history in the lecture:\u003c/strong> Latin \u003cem>designare\u003c/em> and Italian \u003cem>disegnare\u003c/em> connect design with marking, drawing, planning and determining. Its industrial meaning developed with mass production in the nineteenth century.\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Craft\u003c/h3>\u003cp>Creating well-made, attractive objects that provide enjoyment.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>A way of thinking\u003c/h3>\u003cp>Investigating and rethinking situations with people and their lives at the center.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Strategic process\u003c/h3>\u003cp>Connecting creativity, research, technology, business and social or environmental value.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Herbert Simon:\u003c/strong> designing means devising actions that transform existing situations into preferred ones: current state → desired state.\u003c/p>\u003cp>\u003cstrong>Design Council:\u003c/strong> creativity is used to solve problems.\u003c/p>\u003cp>\u003cstrong>World Design Organization:\u003c/strong> design is a strategic, transdisciplinary problem-solving process connecting innovation, business success and quality of life.\u003c/p>\u003cp class=\"recall\">DDP working definition: Design deliberately shapes possibilities to change existing situations for people within technological, organizational and societal conditions.\u003c/p>\u003cp>Definitions are perspectives, not one final truth. Design can address problems, fulfill needs and create new possibilities.\u003c/p>"}, "de": {"title": "Definitionen und Denkweisen von Design", "content": "\u003cp>\u003cstrong>Begriffsgeschichte:\u003c/strong> Lateinisch \u003cem>designare\u003c/em> und italienisch \u003cem>disegnare\u003c/em> verbinden Design mit Bezeichnen, Umreißen, Zeichnen, Planen und Bestimmen. Die industrielle Bedeutung entwickelte sich mit der Massenproduktion im 19. Jahrhundert.\u003c/p>\u003cul>\u003cli>\u003cstrong>Handwerk:\u003c/strong> Gut gemachte, schöne und erfreuliche Dinge herstellen.\u003c/li>\u003cli>\u003cstrong>Denkweise:\u003c/strong> Situationen untersuchen und neu betrachten, mit Menschen und ihrer Lebenswelt im Mittelpunkt.\u003c/li>\u003cli>\u003cstrong>Strategischer Prozess:\u003c/strong> Kreativität, Forschung, Technik, Wirtschaft sowie sozialen und ökologischen Wert verbinden.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Herbert Simon:\u003c/strong> Handlungswege entwerfen, die bestehende in bevorzugte Situationen verwandeln: Ist → Soll.\u003c/p>\u003cp>\u003cstrong>Design Council:\u003c/strong> Kreativität zur Problemlösung einsetzen.\u003c/p>\u003cp>\u003cstrong>WDO:\u003c/strong> Strategischer, transdisziplinärer Problemlösungsprozess, der Innovation, Geschäftserfolg und Lebensqualität verbindet.\u003c/p>\u003cp class='recall'>DDP-Arbeitsdefinition: Design ist die bewusste Gestaltung von Möglichkeiten, um bestehende Situationen für Menschen innerhalb technologischer, organisatorischer und gesellschaftlicher Rahmenbedingungen zu verändern.\u003c/p>\u003cp>Definitionen sind Perspektiven statt einer endgültigen Wahrheit. Design bearbeitet Probleme, erfüllt Bedürfnisse und schafft Möglichkeiten.\u003c/p>"}}, {"id": "disciplines-products", "lecture": 1, "slides": "44–51", "en": {"title": "Disciplines and the digital product", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Perspective\u003c/th>\u003cth>Typical question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Art\u003c/td>\u003ctd>What should be expressed, questioned or experienced?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Design\u003c/td>\u003ctd>How can a situation be meaningfully shaped or improved for people?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Computer science\u003c/td>\u003ctd>How can data and processes be implemented computationally?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Engineering\u003c/td>\u003ctd>How can the result operate reliably, securely and at scale?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These perspectives overlap and collaborate. Digital products also involve research, content, product management, marketing, law and security.\u003c/p>\u003ch3>A digital product has several layers\u003c/h3>\u003cul>\u003cli>\u003cstrong>Interface:\u003c/strong> what people see.\u003c/li>\u003cli>\u003cstrong>Interaction and behavior:\u003c/strong> actions and responses.\u003c/li>\u003cli>\u003cstrong>Content and information:\u003c/strong> what is communicated, organized and prioritized.\u003c/li>\u003cli>\u003cstrong>Technology and data:\u003c/strong> what makes it possible.\u003c/li>\u003cli>\u003cstrong>Service and organization:\u003c/strong> accounts, support, moderation, privacy and strategy.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Denzinger:\u003c/strong> products are artifacts that enable active use, whether physical or virtual. \u003cstrong>Oswald:\u003c/strong> design should examine use, interaction, social context, business models and societal impact.\u003c/p>\u003cp class=\"recall\">The product is more than the screen or the code: its use, service and organization matter too.\u003c/p>"}, "de": {"title": "Disziplinen und das digitale Produkt", "content": "\u003cul>\u003cli>\u003cstrong>Kunst:\u003c/strong> Was soll ausgedrückt, hinterfragt oder erfahrbar werden?\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> Wie wird eine Situation für Menschen sinnvoll gestaltet oder verändert?\u003c/li>\u003cli>\u003cstrong>Informatik:\u003c/strong> Wie werden Daten und Prozesse rechnerisch umgesetzt?\u003c/li>\u003cli>\u003cstrong>Engineering:\u003c/strong> Wie funktioniert die Umsetzung zuverlässig, sicher und skalierbar?\u003c/li>\u003c/ul>\u003cp>Die Perspektiven überschneiden sich. Forschung, Content, Produktmanagement, Marketing, Recht und Security tragen ebenfalls bei.\u003c/p>\u003ch3>Fünf Ebenen digitaler Produkte\u003c/h3>\u003col>\u003cli>Interface: Was Menschen sehen.\u003c/li>\u003cli>Interaktion und Verhalten: Handlungen und Reaktionen.\u003c/li>\u003cli>Inhalte und Informationen: Kommunikation, Ordnung und Priorisierung.\u003c/li>\u003cli>Technologie und Daten: Technische Grundlage.\u003c/li>\u003cli>Service und Organisation: Accounts, Support, Moderation, Datenschutz und Strategie.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Denzinger:\u003c/strong> Produkte ermöglichen aktive Nutzung, unabhängig von physischer oder virtueller Form. \u003cstrong>Oswald:\u003c/strong> Gestaltung muss Gebrauch, Interaktion, sozialen Kontext, Geschäftsmodell und gesellschaftliche Folgen betrachten.\u003c/p>\u003cp class='recall'>Ein digitales Produkt ist mehr als Bildschirm oder Code.\u003c/p>"}}, {"id": "product-language", "lecture": 1, "slides": "52–58", "en": {"title": "Product functions and product language", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>What it concerns\u003c/th>\u003cth>WhatsApp example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Practical–technical\u003c/td>\u003ctd>What the product enables in practice.\u003c/td>\u003ctd>Sending messages or making encrypted calls.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Economic\u003c/td>\u003ctd>Business purpose and commercial value.\u003c/td>\u003ctd>Retention, reach and business offerings.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ecological\u003c/td>\u003ctd>Resources, production and disposal.\u003c/td>\u003ctd>Consider device and infrastructure impacts; this is a practice application.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aesthetic / formal-aesthetic\u003c/td>\u003ctd>Perceivable form, color, material, layout and visual order.\u003c/td>\u003ctd>Green color scheme, chat bubbles, typography and spacing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Indicative — Anzeichenfunktion\u003c/td>\u003ctd>Clues to state, function or use.\u003c/td>\u003ctd>Check marks signal sent/delivered/read; a microphone indicates voice messaging.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Symbolic\u003c/td>\u003ctd>Social, cultural or emotional meanings.\u003c/td>\u003ctd>Closeness, identity, belonging and availability.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>The Offenbach approach\u003c/h3>\u003cp>Between the user and the product, the lecture distinguishes practical–technical, product-language/sensory and economic functions. Product-language functions include formal-aesthetic and sign-related functions; sign-related functions include \u003cstrong>indicative\u003c/strong> and \u003cstrong>symbolic\u003c/strong> functions.\u003c/p>\u003cp>\u003cstrong>Semiotics\u003c/strong> studies signs and meaning. Symbolic meaning is shaped by the people and contexts involved, not fixed completely by the designer.\u003c/p>\u003cp class=\"recall\">A check mark tells you a system state: indicative. A product standing for belonging or status: symbolic.\u003c/p>"}, "de": {"title": "Produktfunktionen und Produktsprache", "content": "\u003cul>\u003cli>\u003cstrong>Praktisch-technisch:\u003c/strong> Was ermöglicht das Produkt? Beispiele: Nachrichten senden, verschlüsselt telefonieren; Ergonomie, Handhabung, Haltbarkeit, Qualität und Sicherheit.\u003c/li>\u003cli>\u003cstrong>Ökonomisch:\u003c/strong> Wirtschaftlicher Zweck, Bindung, Reichweite und Geschäftsangebote.\u003c/li>\u003cli>\u003cstrong>Ökologisch:\u003c/strong> Ressourcen, Produktion und Entsorgung. Geräte- und Infrastruktureffekte sind eine Übungsanwendung.\u003c/li>\u003cli>\u003cstrong>Ästhetisch/formalästhetisch:\u003c/strong> Form, Farbe, Material, Layout und Ordnung; etwa Chat-Bubbles und Typografie.\u003c/li>\u003cli>\u003cstrong>Anzeichenfunktion:\u003c/strong> Hinweise auf Zustand, Funktion und Gebrauch; etwa Häkchen oder Mikrofon.\u003c/li>\u003cli>\u003cstrong>Symbolfunktion:\u003c/strong> Soziale, kulturelle und emotionale Bedeutung; etwa Identität, Nähe und Zugehörigkeit.\u003c/li>\u003c/ul>\u003ch3>Offenbacher Ansatz\u003c/h3>\u003cp>Zwischen Nutzer und Produkt unterscheidet die Vorlesung praktisch-technische, produktsprachlich-sinnliche und ökonomische Funktionen. Produktsprachliche Funktionen umfassen formalästhetische und zeichenhafte Funktionen; zeichenhafte Funktionen umfassen Anzeichen- und Symbolfunktion.\u003c/p>\u003cp>\u003cstrong>Semiotik\u003c/strong> untersucht Zeichen und Bedeutung. Symbolik entsteht mit den beteiligten Menschen und Kontexten.\u003c/p>\u003cp class='recall'>Häkchen als Zustandsanzeige: Anzeichenfunktion. Produkt als Zeichen von Zugehörigkeit: Symbolfunktion.\u003c/p>"}}, {"id": "good-design", "lecture": 1, "slides": "59–63", "en": {"title": "Good design and Dieter Rams", "content": "\u003cp>Good design makes the product understandable and usable, addresses the relationship between person and object, supports problem solving, and considers resource conservation, reuse and longevity.\u003c/p>\u003cp>Rams contrasts calm, unobtrusive design with aggressive stimulation that adds to confusion.\u003c/p>\u003ch3>Ten principles in the lecture’s order\u003c/h3>\u003col>\u003cli>\u003cstrong>Innovative:\u003c/strong> develops with technological possibilities.\u003c/li>\u003cli>\u003cstrong>Useful:\u003c/strong> supports the product’s purpose.\u003c/li>\u003cli>\u003cstrong>Understandable:\u003c/strong> explains the product.\u003c/li>\u003cli>\u003cstrong>Aesthetic:\u003c/strong> contributes to use and well-being.\u003c/li>\u003cli>\u003cstrong>Honest:\u003c/strong> does not pretend to have capabilities it lacks.\u003c/li>\u003cli>\u003cstrong>Unobtrusive:\u003c/strong> allows the product to recede into the background.\u003c/li>\u003cli>\u003cstrong>Long-lasting:\u003c/strong> avoids dependence on passing fashion.\u003c/li>\u003cli>\u003cstrong>Thorough down to the last detail:\u003c/strong> careful and consistent.\u003c/li>\u003cli>\u003cstrong>Environmentally friendly:\u003c/strong> conserves resources and reduces physical and visual pollution.\u003c/li>\u003cli>\u003cstrong>As little design as possible:\u003c/strong> simple and focused on essentials.\u003c/li>\u003c/ol>\u003cp class=\"recall\">Do more than recite the list: explain a principle using a product decision.\u003c/p>"}, "de": {"title": "Gutes Design und Dieter Rams", "content": "\u003cp>Gutes Design macht Funktion und Handhabung verständlich, unterstützt Problemlösung und betrachtet Mensch–Objekt-Beziehungen sowie Ressourcenschonung, Wiederverwendung und Langlebigkeit.\u003c/p>\u003cp>Rams stellt ruhiges, unaufdringliches Design einer reizintensiven Gestaltung gegenüber, die Verwirrung verstärkt.\u003c/p>\u003ch3>Zehn Thesen in der Reihenfolge der Folien\u003c/h3>\u003col>\u003cli>\u003cstrong>Innovativ:\u003c/strong> mit technischen Möglichkeiten weiterentwickeln.\u003c/li>\u003cli>\u003cstrong>Brauchbar:\u003c/strong> den Produktzweck unterstützen.\u003c/li>\u003cli>\u003cstrong>Verständlich:\u003c/strong> das Produkt erklären.\u003c/li>\u003cli>\u003cstrong>Ästhetisch:\u003c/strong> Gebrauch und Wohlbefinden fördern.\u003c/li>\u003cli>\u003cstrong>Ehrlich:\u003c/strong> keine Funktionalität vortäuschen.\u003c/li>\u003cli>\u003cstrong>Unaufdringlich:\u003c/strong> das Produkt zurücktreten lassen.\u003c/li>\u003cli>\u003cstrong>Langlebig:\u003c/strong> kurzfristige Mode vermeiden.\u003c/li>\u003cli>\u003cstrong>Konsequent:\u003c/strong> gründlich und genau bis ins Detail.\u003c/li>\u003cli>\u003cstrong>Umweltfreundlich:\u003c/strong> Ressourcen und physische wie visuelle Umwelt schonen.\u003c/li>\u003cli>\u003cstrong>So wenig Design wie möglich:\u003c/strong> einfach und wesentlich.\u003c/li>\u003c/ol>\u003cp class='recall'>Erkläre Prinzipien an konkreten Entscheidungen, statt nur die Liste aufzusagen.\u003c/p>"}}]}</script>
<script>
"use strict";
const root = document.getElementById("root");
if (!window.React || !window.ReactDOM) {
  root.textContent = "React konnte nicht geladen werden. Prüfe deine Internetverbindung und lade neu. / React could not load. Check your internet connection and reload.";
} else {
const {createElement: h, useEffect, useRef, useState} = React;
const {kind, questions, notes} = JSON.parse(document.getElementById("study-data").textContent);
const isReview = kind === "reviewer";
const perSet = 10;
const setCount = questions.length / perSet;
const initial = {lang:"de", active:0, answers:{}, drafts:{}, reviewed:{}};
const storeName = "progress";
const key = "design-verstehen:" + kind;
const translations = {
  de:{lecture:"Vorlesung 01",heading:"Design verstehen",reviewer:"Reviewer", "multiple-choice":"Multiple Choice", "true-false":"Richtig oder Falsch", set:"Set", question:"Frage", slide:"Folie", sets:"Fragensets", jump:"Frage auswählen", previous:"Zurück", next:"Weiter", select:"Wähle eine Antwort.", check:"Antwort prüfen", correct:"Richtig", incorrect:"Falsch", true:"Richtig", false:"Falsch", solution:"Musterantwort anzeigen", hide:"Musterantwort ausblenden", write:"Deine Antwort", review:"Als gelernt markieren", undo:"Markierung entfernen", studied:"gelernt", answered:"beantwortet", notes:"Lernnotizen zur Vorlesung", source:"Quelle: Victoria Kaiselgruber, Design digitaler Produkte – Design verstehen, WS 2026/27.", loading:"Lernstand wird geladen …", unavailable:"Lokales Speichern ist hier nicht verfügbar. Der Fortschritt bleibt nur bis zum Schließen oder Neuladen erhalten.", saving:"Wird gespeichert …", saved:"Lernstand lokal gespeichert", ready:"Lernstand lokal geladen", skip:"Zur Frage springen", comparison:"Vergleich", tryAgain:"Antwort zurücksetzen", resetSet:"Dieses Set zurücksetzen", resetConfirm:"Antworten und Lernstand für dieses Set zurücksetzen?"},
  en:{lecture:"Lecture 01",heading:"Understanding design",reviewer:"Reviewer", "multiple-choice":"Multiple choice", "true-false":"True or false", set:"Set", question:"Question", slide:"Slide", sets:"Question sets", jump:"Jump to a question", previous:"Previous", next:"Next", select:"Choose one answer.", check:"Check answer", correct:"Correct", incorrect:"Incorrect", true:"True", false:"False", solution:"Show model answer", hide:"Hide model answer", write:"Your answer", review:"Mark as studied", undo:"Unmark", studied:"studied", answered:"answered", notes:"Lecture study notes", source:"Source: Victoria Kaiselgruber, Design digitaler Produkte – Design verstehen, WS 2026/27.", loading:"Loading progress …", unavailable:"Local storage is unavailable here. Your progress lasts until you close or reload this page.", saving:"Saving …", saved:"Progress saved locally", ready:"Local progress loaded", skip:"Skip to question", comparison:"Comparison", tryAgain:"Clear answer", resetSet:"Reset this set", resetConfirm:"Reset answers and progress for this set?"}
};
function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("DDP-study-progress", 1);
    request.onupgradeneeded = () => request.result.createObjectStore(storeName);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Database upgrade is blocked"));
  });
}
function readProgress(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readonly");
    const request = transaction.objectStore(storeName).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
function writeProgress(db, progress) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readwrite");
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore(storeName).put(progress, key);
  });
}
function App() {
  const [progress, setProgress] = useState(initial);
  const [ready, setReady] = useState(false);
  const [status, setStatus] = useState("loading");
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const db = useRef(null);
  const current = useRef(initial);
  const revision = useRef(0);
  const heading = useRef(null);
  const focusNext = useRef(false);

  useEffect(() => {
    let live = true;
    async function load() {
      try {
        db.current = await openDb();
        db.current.onversionchange = () => {
          db.current.close();
          db.current = null;
          if (live) setStatus("unavailable");
        };
        const stored = await readProgress(db.current);
        if (!live) { db.current?.close(); return; }
        if (stored) {
          current.current = {...initial,...stored,
            lang:stored.lang === "en" ? "en" : "de",
            active:Number.isInteger(stored.active) && stored.active >= 0 && stored.active < questions.length ? stored.active : 0};
          setProgress(current.current);
        }
        setStatus("ready");
      } catch {
        db.current?.close();
        db.current = null;
        if (live) setStatus("unavailable");
      } finally {
        if (live) setReady(true);
      }
    }
    load();
    return () => {live = false; db.current?.close();};
  }, []);

  useEffect(() => { document.documentElement.lang = progress.lang; }, [progress.lang]);
  useEffect(() => {
    if (focusNext.current) { heading.current?.focus(); focusNext.current = false; }
  }, [progress.active]);

  function update(patch) {
    const snapshot = {...current.current,...patch};
    current.current = snapshot;
    setProgress(snapshot);
    if (!db.current) return;
    const version = ++revision.current;
    setStatus("saving");
    writeProgress(db.current, snapshot).then(
      () => {if (version === revision.current) setStatus("saved");},
      () => {if (version === revision.current) setStatus("unavailable");}
    );
  }
  function move(target) {
    if (target === progress.active || target < 0 || target >= questions.length) return;
    setPicked(null);
    setRevealed(false);
    focusNext.current = true;
    update({active:target});
  }
  const {lang,active,answers,drafts,reviewed} = progress;
  const t = translations[lang];
  const set = Math.floor(active / perSet);
  const start = set * perSet;
  const numbers = Array.from({length:perSet},(_,i)=>start+i);
  const complete = i => isReview ? Boolean(reviewed[i]) : Number.isInteger(answers[i]);
  const done = numbers.filter(complete).length;
  const score = numbers.filter(i => answers[i] === questions[i].answer).length;
  const question = questions[active];
  const item = question[lang];
  const checked = Number.isInteger(answers[active]);
  const right = checked && answers[active] === question.answer;
  const options = item.options || [t.true,t.false];
  function resetSet() {
    if (!window.confirm(t.resetConfirm)) return;
    const nextAnswers = {...answers}, nextDrafts = {...drafts}, nextReviewed = {...reviewed};
    numbers.forEach(i => {delete nextAnswers[i]; delete nextDrafts[i]; delete nextReviewed[i];});
