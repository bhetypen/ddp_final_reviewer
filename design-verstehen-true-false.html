htbaren Interface.", "explain": "Interaktion, Inhalte, Technologie und Daten sowie Service und Organisation gehören ebenfalls dazu."}, "en": {"prompt": "The digital product WhatsApp consists solely of its visible interface.", "explain": "Interaction, content, technology and data, and service and organization also belong to the product."}}, {"slides": "54", "answer": 0, "de": {"prompt": "Herstellung und Entsorgung gehören zur ökologischen Funktion.", "explain": "Die Vorlesung verbindet diese Lebenszyklusphasen mit ökologischen Auswirkungen."}, "en": {"prompt": "Production and disposal belong to ecological function.", "explain": "The lecture connects those lifecycle stages with ecological effects."}}, {"slides": "55", "answer": 1, "de": {"prompt": "Die symbolische Bedeutung eines Produkts lässt sich im Voraus vollständig festlegen.", "explain": "Nutzende, Besitzende und Herstellende prägen Bedeutungen mit."}, "en": {"prompt": "The symbolic meaning of a product can be fully fixed in advance.", "explain": "Users, owners and producers help shape meanings."}}, {"slides": "56–58", "answer": 0, "de": {"prompt": "Zustellhäkchen erfüllen eine Anzeichenfunktion.", "explain": "Sie zeigen einen Systemzustand an, etwa ob eine Nachricht zugestellt wurde."}, "en": {"prompt": "Delivery check marks perform an indicative function.", "explain": "They show a system state, such as whether a message was delivered."}}, {"slides": "58", "answer": 1, "de": {"prompt": "Zugehörigkeit ist im WhatsApp-Beispiel eine formalästhetische Eigenschaft.", "explain": "Zugehörigkeit ist eine symbolische Bedeutung. Abstände oder Form der Chatblasen sind formalästhetische Eigenschaften."}, "en": {"prompt": "Belonging is a formal aesthetic property in the WhatsApp example.", "explain": "Belonging is a symbolic meaning. Spacing and bubble shapes are formal aesthetic properties."}}, {"slides": "57", "answer": 0, "de": {"prompt": "Nutzerbindung kann zur ökonomischen Funktion eines Produkts beitragen.", "explain
