<script type="application/json" id="study-data">{"kind": "multiple-choice", "questions": [{"lecture": 3, "topic": "foundations", "slides": "4–7", "answer": 2, "en": {"prompt": "Why might the same banking interface be suitable for one person but difficult for another?", "options": ["Everyone perceives interface feedback in the same way.", "Interface quality is independent of the user.", "Their abilities, experience and expectations differ.", "The task always determines the interface by itself."], "explain": "Person characteristics affect how an interface is used. Consider the person, task and context together."}, "de": {"prompt": "Warum kann dasselbe Banking-Interface einer Person helfen und einer anderen Schwierigkeiten bereiten?", "options": ["Alle nehmen Rückmeldungen gleich wahr.", "Interfacequalität ist unabhängig von Menschen.", "Fähigkeiten, Erfahrung und Erwartungen unterscheiden sich.", "Die Aufgabe bestimmt das Interface immer allein."], "explain": "Person, Aufgabe und Kontext müssen gemeinsam betrachtet werden."}}, {"lecture": 3, "topic": "foundations", "slides": "5", "answer": 1, "en": {"prompt": "An experienced developer renames one file with a file manager and 500 files with a script. What changed most directly?", "options": ["The developer’s physical ability.", "The task and its scale.", "The developer’s prior knowledge.", "The social setting."], "explain": "The person remains the same, but the number and structure of the operations change the task."}, "de": {"prompt": "Eine Entwicklerin benennt eine Datei im Dateimanager und 500 Dateien per Skript um. Was änderte sich am direktesten?", "options": ["Die körperliche Fähigkeit.", "Die Aufgabe und ihr Umfang.", "Das Vorwissen der Entwicklerin.", "Das soziale Umfeld."], "explain": "Die Person bleibt gleich, während Anzahl und Struktur der Operationen die Aufgabe verändern."}}, {"lecture": 3, "topic": "foundations", "slides": "6–7", "answer": 2, "en": {"prompt": "A voice message is convenient at home but disruptive in a quiet library. Which factor best explains this?", "options": ["Technical feasibility.", "Personal significance.", "Context of use.", "Memorability."], "explain": "Social surroundings and the physical setting are part of context."}, "de": {"prompt": "Eine Sprachnachricht passt zu Hause, stört aber in der Bibliothek. Welcher Faktor erklärt das?", "options": ["Technische Machbarkeit.", "Persönliche Bedeutsamkeit.", "Nutzungskontext.", "Einprägsamkeit."], "explain": "Soziale Umgebung und Ort gehören zum Kontext."}}, {"lecture": 3, "topic": "factors", "slides": "9–10", "answer": 0, "en": {"prompt": "What does the Swiss cheese model illustrate?", "options": ["Aligned weaknesses across protective layers can allow harm.", "Accidents are explained only by the last person’s mistake.", "Adding technology makes human adaptation unnecessary.", "One protective barrier can remove every possible risk."], "explain": "Each layer has weaknesses. A hazard can pass through when these weaknesses align."}, "de": {"prompt": "Was veranschaulicht das Schweizer Käsescheibenmodell?", "options": ["Ausgerichtete Schwachstellen mehrerer Schutzebenen können Schaden ermöglichen.", "Unfälle beruhen nur auf dem letzten menschlichen Fehler.", "Technik macht menschliche Anpassung unnötig.", "Eine Schutzbarriere beseitigt jedes Risiko."], "explain": "Jede Ebene besitzt Schwachstellen; liegen diese passend hintereinander, kann eine Gefahr passieren."}}, {"lecture": 3, "topic": "factors", "slides": "11", "answer": 3, "en": {"prompt": "Which statement best represents the lecture’s view of Human Factors?", "options": ["Human Factors is another term for human error.", "People are only sources of system failures.", "Human Factors studies interface colors exclusively.", "People can contribute positively to system resilience."], "explain": "The lecture explicitly separates Human Factors from Human Error and recognizes people’s positive contributions."}, "de": {"prompt": "Welche Aussage entspricht der Human-Factors-Sicht der Vorlesung?", "options": ["Human Factors ist dasselbe wie Human Error.", "Menschen verursachen ausschließlich Systemversagen.", "Human Factors untersucht nur Interfacefarben.", "Menschen können positiv zur Systemresilienz beitragen."], "explain": "Menschen können Probleme erkennen und die Widerstandsfähigkeit des Systems stärken."}}, {"lecture": 3, "topic": "factors", "slides": "12", "answer": 2, "en": {"prompt": "An operator stops checking other signals because they completely trust an automatic alarm. What is this?", "options": ["Learnability.", "Human flourishing.", "Complacency.", "Personal fit."], "explain": "Excessive trust in automation can reduce active attention and processing of available information."}, "de": {"prompt": "Eine Bedienperson ignoriert andere Signale, weil sie dem automatischen Alarm völlig vertraut. Was ist das?", "options": ["Erlernbarkeit.", "Human Flourishing.", "Complacency.", "Personal Fit."], "explain": "Übermäßiges Technikvertrauen kann Aufmerksamkeit und Informationsverarbeitung verringern."}}, {"lecture": 3, "topic": "perspectives", "slides": "18–22, 38", "answer": 3, "en": {"prompt": "Which question is most closely associated with HCC in the lecture?", "options": ["How many incorrect inputs can a form accept?", "Which sequence of design activities should a team follow?", "How quickly can a person perform a single interface action?", "How are people, computing and everyday life connected?"], "explain": "HCC broadens the focus to computing in people’s social, cultural and everyday contexts."}, "de": {"prompt": "Welche Frage gehört besonders zu HCC?", "options": ["Wie viele ungültige Eingaben akzeptiert ein Formular?", "Welche Abfolge von Designaktivitäten soll ein Team wählen?", "Wie schnell gelingt eine einzelne Interfacehandlung?", "Wie sind Menschen, Computing und Lebenswelt verbunden?"], "explain": "HCC erweitert die Sicht auf soziale, kulturelle und alltägliche Zusammenhänge."}}, {"lecture": 3, "topic": "perspectives", "slides": "15", "answer": 2, "en": {"prompt": "What does WIMP stand for?", "options": ["Windows, Images, Motion, Programs.", "Widgets, Inputs, Models, Processes.", "Windows, Icons, Menus, Pointing Devices.", "Workflows, Interfaces, Menus, Permissions."], "explain": "WIMP is the graphical-interface paradigm associated with the first two development phases in the lecture."}, "de": {"prompt": "Wofür steht WIMP?", "options": ["Windows, Images, Motion, Programs.", "Widgets, Inputs, Models, Processes.", "Windows, Icons, Menus, Pointing Devices.", "Workflows, Interfaces, Menus, Permissions."], "explain": "WIMP bezeichnet das grafische Paradigma der ersten beiden HCI-Entwicklungsphasen."}}, {"lecture": 3, "topic": "perspectives", "slides": "15", "answer": 0, "en": {"prompt": "Which HCI phase emphasizes groups, teams and collaboration technology?", "options": ["Cooperative systems.", "Ubiquitous systems.", "Interactive systems.", "Ambient intelligence."], "explain": "The early-1990s cooperative phase shifts attention to groups and teamwork."}, "de": {"prompt": "Welche HCI-Phase betont Gruppen, Teams und Kooperationstechnologie?", "options": ["Kooperative Systeme.", "Ubiquitäre Systeme.", "Interaktive Systeme.", "Ambient Intelligence."], "explain": "Die Phase der frühen 1990er richtet den Blick auf Zusammenarbeit."}}, {"lecture": 3, "topic": "perspectives", "slides": "16–17", "answer": 3, "en": {"prompt": "In the interaction loop, a user sees a check mark and understands that a message was sent. What happens here?", "options": ["Generation of input before any system response.", "Specification and validation of user requirements.", "Removal of the context from the interaction.", "Perception and interpretation of system feedback."], "explain": "The system produces output, and the user perceives and interprets it. Interaction continues beyond the tap."}, "de": {"prompt": "Eine Person sieht ein Häkchen und versteht, dass die Nachricht gesendet wurde. Was geschieht?", "options": ["Eine Eingabe wird vor jeder Systemreaktion erzeugt.", "Nutzeranforderungen werden spezifiziert und validiert.", "Der Kontext wird aus der Interaktion entfernt.", "Systemfeedback wird wahrgenommen und interpretiert."], "explain": "Das System gibt etwas aus, das die Person wahrnimmt und deutet."}}, {"lecture": 3, "topic": "perspectives", "slides": "22", "answer": 3, "en": {"prompt": "Why is WhatsApp described as a sociotechnical system?", "options": ["Its users are the only stakeholders affected by its design.", "Its interface can be fully understood without social context.", "Its technical infrastructure determines all human behavior.", "Its use is shaped by people, technology, organizations and social rules."], "explain": "Communication norms, relationships, policies, infrastructure and wider society interact."}, "de": {"prompt": "Warum ist WhatsApp ein soziotechnisches System?", "options": ["Nur direkte Nutzer sind betroffen.", "Das Interface ist ohne sozialen Kontext vollständig verständlich.", "Die Infrastruktur bestimmt jedes menschliche Verhalten.", "Menschen, Technik, Organisationen und soziale Regeln prägen seine Nutzung."], "explain": "Normen, Beziehungen, Richtlinien, Infrastruktur und Gesellschaft wirken zusammen."}}, {"lecture": 3, "topic": "hcd", "slides": "23–24", "answer": 1, "en": {"prompt": "A team builds an AI summary feature simply because an LLM is available. Which question is most important to add?", "options": ["How can the button be released before any user research?", "What needs do people have, and what happens if a summary is wrong?", "How can evaluation be replaced by technical testing alone?", "How can all users receive the same summary by default?"], "explain": "Technical feasibility does not demonstrate usefulness, trust or human relevance."}, "de": {"prompt": "Ein Team baut KI-Zusammenfassungen, weil ein LLM verfügbar ist. Welche Frage muss ergänzt werden?", "options": ["Wie veröffentlichen wir den Button vor jeder Forschung?", "Welche Bedürfnisse bestehen, und was passiert bei falschen Zusammenfassungen?", "Wie ersetzen wir Nutzerevaluation ausschließlich durch Techniktests?", "Wie erhalten alle standardmäßig dieselbe Zusammenfassung?"], "explain": "Machbarkeit beweist weder Relevanz noch Vertrauen oder Nutzen."}}, {"lecture": 3, "topic": "hcd", "slides": "26–29", "answer": 1, "en": {"prompt": "Which practice matches the HCD principles in the lecture?", "options": ["Evaluate only the visual style of the final interface.", "Involve users throughout the process and refine designs through evaluation.", "Avoid returning to requirements once prototypes exist.", "Include users only after all design decisions are final."], "explain": "User involvement, evaluation and iteration are core HCD principles."}, "de": {"prompt": "Welche Praxis entspricht HCD?", "options": ["Nur den visuellen Stil am Ende bewerten.", "Menschen während des gesamten Prozesses beteiligen und durch Evaluation verbessern.", "Nach dem Prototyp keine Anforderungen mehr ändern.", "Menschen erst nach allen Entscheidungen beteiligen."], "explain": "Beteiligung, Evaluation und Iteration sind HCD-Kernprinzipien."}}, {"lecture": 3, "topic": "hcd", "slides": "29", "answer": 2, "en": {"prompt": "What normally follows understanding and specifying the context of use in the HCD process?", "options": ["Selecting promotional imagery.", "Ending all user involvement.", "Specifying user requirements.", "Publishing the final product."], "explain": "Context informs user requirements, which guide design solutions and evaluation."}, "de": {"prompt": "Was folgt im HCD-Prozess auf das Verstehen und Spezifizieren des Nutzungskontexts?", "options": ["Werbebilder auswählen.", "Nutzerbeteiligung beenden.", "Nutzeranforderungen spezifizieren.", "Das fertige Produkt veröffentlichen."], "explain": "Der Kontext informiert Anforderungen, die Lösungen und Evaluation leiten."}}, {"lecture": 3, "topic": "hcd", "slides": "27–29", "answer": 0, "en": {"prompt": "A prototype fails to meet user requirements. What should an HCD team do?", "options": ["Use the findings to revise context, requirements or solutions as needed.", "Remove evaluation from the next design cycle.", "Ignore findings if the software works technically.", "Treat the first prototype as the final solution."], "explain": "Iteration means returning to relevant activities based on evaluation evidence."}, "de": {"prompt": "Ein Prototyp erfüllt Nutzeranforderungen nicht. Was sollte das HCD-Team tun?", "options": ["Erkenntnisse nutzen, um Kontext, Anforderungen oder Lösungen zu überarbeiten.", "Evaluation aus dem nächsten Durchlauf streichen.", "Ergebnisse ignorieren, wenn der Code funktioniert.", "Den ersten Prototyp als endgültig betrachten."], "explain": "Iteration bedeutet, aufgrund von Evidenz relevante Aktivitäten erneut aufzugreifen."}}, {"lecture": 3, "topic": "usability", "slides": "32–33", "answer": 1, "en": {"prompt": "A person completes a transfer quickly, but sends the wrong amount. Which core usability factor most directly failed?", "options": ["Efficiency only.", "Effectiveness.", "Memorability only.", "Visual attractiveness."], "explain": "Speed alone is insufficient. The intended goal was not achieved correctly."}, "de": {"prompt": "Eine Überweisung ist schnell, aber der Betrag ist falsch. Welcher Kernfaktor scheitert am direktesten?", "options": ["Nur Effizienz.", "Effektivität.", "Nur Einprägsamkeit.", "Visuelle Attraktivität."], "explain": "Das beabsichtigte Ziel wurde nicht korrekt erreicht; Geschwindigkeit genügt nicht."}}, {"lecture": 3, "topic": "usability", "slides": "33", "answer": 2, "en": {"prompt": "A user completes the correct task, but needs many unnecessary steps. Which factor most directly needs improvement?", "options": ["Design for virtue.", "Awe.", "Efficiency.", "Effectiveness only."], "explain": "Efficiency concerns time, effort and other resources required to achieve a goal."}, "de": {"prompt": "Eine Aufgabe gelingt korrekt, verlangt aber viele unnötige Schritte. Was muss verbessert werden?", "options": ["Design for Virtue.", "Ehrfurcht.", "Effizienz.", "Nur Effektivität."], "explain": "Effizienz betrifft Zeit, Aufwand und andere eingesetzte Ressourcen."}}, {"lecture": 3, "topic": "usability", "slides": "33", "answer": 1, "en": {"prompt": "Someone returns to an app after three months and easily remembers how to use it. Which criterion does this demonstrate?", "options": ["Complacency.", "Memorability.", "First-use learnability.", "Personal significance."], "explain": "Memorability concerns re-establishing proficiency after a period of non-use."}, "de": {"prompt": "Eine Person erinnert sich nach drei Monaten leicht an die Bedienung. Welches Kriterium zeigt das?", "options": ["Complacency.", "Einprägsamkeit.", "Erlernbarkeit beim ersten Gebrauch.", "Persönliche Bedeutsamkeit."], "explain": "Einprägsamkeit betrifft die Rückkehr nach Nichtnutzung."}}, {"lecture": 3, "topic": "usability", "slides": "33", "answer": 1, "en": {"prompt": "Which example most clearly demonstrates error tolerance?", "options": ["A form requires users to restart after any typing mistake.", "A form identifies invalid input and lets the user correct it without losing their work.", "A form accepts every input regardless of validity.", "A form hides error messages to keep the interface clean."], "explain": "Error tolerance includes handling errors and providing a simple recovery path."}, "de": {"prompt": "Was zeigt Fehlertoleranz am deutlichsten?", "options": ["Jeder Tippfehler erzwingt einen Neustart.", "Ein Formular zeigt ungültige Eingaben und ermöglicht Korrektur ohne Arbeitsverlust.", "Jede Eingabe wird ungeprüft akzeptiert.", "Fehlermeldungen werden für ein sauberes Design versteckt."], "explain": "Fehlertoleranz umfasst Fehlerbehandlung und einfache Wiederherstellung."}}, {"lecture": 3, "topic": "ux", "slides": "36", "answer": 2, "en": {"prompt": "Which situation belongs to UX even before a person uses the product?", "options": ["Only time spent operating the interface.", "Only errors recorded after a task begins.", "Expectations shaped by its brand and anticipated use.", "Only the number of clicks during a completed task."], "explain": "UX includes anticipated use and responses before, during and after interaction."}, "de": {"prompt": "Was gehört bereits vor der Nutzung zur UX?", "options": ["Nur die Bedienzeit.", "Nur Fehler nach Aufgabenbeginn.", "Erwartungen durch Marke und erwartete Nutzung.", "Nur die Klickanzahl einer erledigten Aufgabe."], "explain": "UX umfasst erwartete Nutzung sowie Reaktionen davor, dabei und danach."}}, {"lecture": 3, "topic": "ux", "slides": "36–37", "answer": 1, "en": {"prompt": "Why can designers not fully determine a user’s experience?", "options": ["User evaluation eliminates all individual differences.", "Experience also depends on the person’s state, history and context.", "A functional product creates the same emotions for everyone.", "Experience depends only on the chosen color palette."], "explain": "Design can shape conditions, but experience also involves factors outside the interface itself."}, "de": {"prompt": "Warum können Designer die Nutzungserfahrung nicht vollständig bestimmen?", "options": ["Evaluation beseitigt alle individuellen Unterschiede.", "Sie hängt auch von Zustand, Geschichte und Kontext der Person ab.", "Ein funktionierendes Produkt erzeugt bei allen dieselben Gefühle.", "Sie hängt nur von der Farbpalette ab."], "explain": "Gestaltung schafft Bedingungen; weitere Faktoren liegen außerhalb des Interfaces."}}, {"lecture": 3, "topic": "positive", "slides": "40–43", "answer": 2, "en": {"prompt": "What distinguishes the aim of Positive Design from simply creating momentary fun?", "options": ["Maximizing screen time regardless of consequences.", "Replacing personal goals with product engagement goals.", "Supporting longer-term well-being and human flourishing.", "Restricting design to the removal of technical errors."], "explain": "Positive Design aims to enrich life, including meaning, growth and sustainable well-being."}, "de": {"prompt": "Was unterscheidet Positive Design von bloß kurzfristigem Spaß?", "options": ["Bildschirmzeit unabhängig von Folgen maximieren.", "Persönliche Ziele durch Engagementziele des Produkts ersetzen.", "Langfristiges Wohlbefinden und menschliche Entfaltung unterstützen.", "Design auf technische Fehlerbeseitigung beschränken."], "explain": "Positive Design soll Leben durch Sinn, Entwicklung und nachhaltiges Wohlbefinden bereichern."}}, {"lecture": 3, "topic": "positive", "slides": "42", "answer": 2, "en": {"prompt": "A person evaluates how satisfied they are with their life. Which component of subjective well-being does this illustrate?", "options": ["The accessibility component.", "The technical component.", "The cognitive component.", "The affective component alone."], "explain": "The cognitive component concerns a person’s evaluation of their own happiness."}, "de": {"prompt": "Eine Person bewertet ihre Lebenszufriedenheit. Welche Komponente zeigt das?", "options": ["Die Barrierefreiheitskomponente.", "Die technische Komponente.", "Die kognitive Komponente.", "Nur die affektive Komponente."], "explain": "Kognitives Wohlbefinden betrifft die Bewertung des eigenen Glücks."}}, {"lecture": 3, "topic": "framework", "slides": "43–44", "answer": 1, "en": {"prompt": "A product helps someone act in an environmentally responsible way. Which Positive Design dimension is most directly illustrated?", "options": ["Design for Pleasure.", "Design for Virtue.", "Design for Personal Significance only.", "Memorability."], "explain": "Virtue concerns morally good action. The lecture uses the energy-saving thermostat as an example."}, "de": {"prompt": "Ein Produkt unterstützt umweltbewusstes Handeln. Welche Dimension steht im Vordergrund?", "options": ["Design for Pleasure.", "Design for Virtue.", "Nur Design for Personal Significance.", "Einprägsamkeit."], "explain": "Virtue betrifft moralisch gutes Handeln; die Vorlesung nennt das energiesparende Thermostat."}}, {"lecture": 3, "topic": "framework", "slides": "43–45", "answer": 0, "en": {"prompt": "A tracker helps a person pursue a personally meaningful exercise goal. Which dimension is most directly illustrated?", "options": ["Design for Personal Significance.", "Graphical interaction.", "Complacency.", "Design for Pleasure only."], "explain": "Personal significance concerns pursuing personally meaningful goals. Other dimensions may also be supported."}, "de": {"prompt": "Ein Tracker unterstützt ein persönlich wichtiges Bewegungsziel. Welche Dimension ist am direktesten betroffen?", "options": ["Design for Personal Significance.", "Grafische Interaktion.", "Complacency.", "Nur Design for Pleasure."], "explain": "Persönliche Bedeutsamkeit betrifft eigene sinnvolle Ziele; weitere Dimensionen können mitwirken."}}, {"lecture": 3, "topic": "framework", "slides": "46", "answer": 2, "en": {"prompt": "Which characteristic requires consideration of all three Positive Design dimensions?", "options": ["Active user involvement.", "Long-term impact.", "Balanced.", "Personal fit."], "explain": "Balanced design considers virtue, pleasure and personal significance together."}, "de": {"prompt": "Welches Merkmal fordert die Berücksichtigung aller drei Positive-Design-Dimensionen?", "options": ["Active User Involvement.", "Long-Term Impact.", "Balanced.", "Personal Fit."], "explain": "Ausgewogenheit verbindet Virtue, Pleasure und Personal Significance."}}, {"lecture": 3, "topic": "perma", "slides": "47", "answer": 3, "en": {"prompt": "Which is the correct expansion of PERMA?", "options": ["Pleasure, Efficiency, Resilience, Motivation, Accessibility.", "Personal Fit, Engagement, Relationships, Memorability, Achievement.", "Positive Emotions, Experience, Requirements, Meaning, Attention.", "Positive Emotions, Engagement, Relationships, Meaning, Achievement."], "explain": "PERMA names five dimensions of well-being, not interface-quality criteria."}, "de": {"prompt": "Wofür steht PERMA korrekt?", "options": ["Pleasure, Efficiency, Resilience, Motivation, Accessibility.", "Personal Fit, Engagement, Relationships, Memorability, Achievement.", "Positive Emotions, Experience, Requirements, Meaning, Attention.", "Positive Emotions, Engagement, Relationships, Meaning, Achievement."], "explain": "PERMA bezeichnet fünf Dimensionen des Wohlbefindens."}}, {"lecture": 3, "topic": "perma", "slides": "47", "answer": 1, "en": {"prompt": "Someone is deeply absorbed in an intrinsically motivating activity. Which PERMA dimension is most direct?", "options": ["Positive emotions only.", "Engagement.", "Relationships.", "Achievement only."], "explain": "Engagement includes absorbing activities and flow, in which a person uses their strengths."}, "de": {"prompt": "Jemand ist völlig in eine intrinsisch motivierende Tätigkeit vertieft. Welche PERMA-Dimension passt?", "options": ["Nur Positive Emotions.", "Engagement.", "Relationships.", "Nur Achievement."], "explain": "Engagement umfasst fesselnde Tätigkeiten, Flow und den Einsatz eigener Stärken."}}, {"lecture": 3, "topic": "perma", "slides": "48", "answer": 2, "en": {"prompt": "A souvenir reminds its owner of a meaningful experience. Which product role is most direct?", "options": ["Source.", "Enablement.", "Symbol.", "Support."], "explain": "The object represents a meaningful experience. A product can have several roles, but this example emphasizes symbolism."}, "de": {"prompt": "Ein Souvenir erinnert an ein bedeutsames Erlebnis. Welche Produktrolle steht im Vordergrund?", "options": ["Source.", "Enablement.", "Symbol.", "Support."], "explain": "Das Objekt steht für eine Bedeutung; weitere Rollen sind möglich."}}, {"lecture": 3, "topic": "responsibility", "slides": "50–52", "answer": 2, "en": {"prompt": "A popular app has excellent usability but harmful effects on non-users. What is the best conclusion?", "options": ["Non-users are outside the scope of any design concern.", "Accessibility makes wider social evaluation unnecessary.", "Good immediate UX does not guarantee responsible design.", "High satisfaction proves every design effect is beneficial."], "explain": "Responsible design considers stakeholders, society, environment and long-term effects beyond direct use."}, "de": {"prompt": "Eine beliebte App ist gut bedienbar, schadet aber Nichtnutzern. Was folgt daraus?", "options": ["Nichtnutzer sind für Design grundsätzlich irrelevant.", "Barrierefreiheit ersetzt gesellschaftliche Bewertung.", "Gute unmittelbare UX garantiert kein verantwortungsvolles Design.", "Hohe Zufriedenheit beweist ausschließlich positive Folgen."], "explain": "Verantwortung umfasst Stakeholder, Gesellschaft, Umwelt und langfristige Folgen."}}, {"lecture": 3, "topic": "foundations", "slides": "7", "answer": 3, "en": {"prompt": "Which is a task factor rather than a person factor?", "options": ["The user’s prior banking experience.", "The user’s physical ability.", "The user’s visual perception.", "How frequently a transfer must be completed."], "explain": "The task category includes goal, complexity, frequency and urgency."}, "de": {"prompt": "Was ist ein Aufgabenfaktor statt eines Personenfaktors?", "options": ["Bisherige Banking-Erfahrung.", "Körperliche Fähigkeit.", "Visuelle Wahrnehmung.", "Wie häufig eine Überweisung erledigt werden muss."], "explain": "Aufgabenfaktoren umfassen Ziel, Komplexität, Häufigkeit und Dringlichkeit."}}, {"lecture": 3, "topic": "foundations", "slides": "4–7", "answer": 1, "en": {"prompt": "Which is a person factor rather than a context factor?", "options": ["The social expectations of a library.", "Prior knowledge of banking terminology.", "The place where the phone is used.", "Noise in the surrounding train."], "explain": "Prior knowledge belongs to the person; place and situation belong to context."}, "de": {"prompt": "Was ist ein Personenfaktor statt eines Kontextfaktors?", "options": ["Soziale Erwartungen in einer Bibliothek.", "Vorwissen über Bankbegriffe.", "Der Ort der Handynutzung.", "Lärm im Zug."], "explain": "Vorwissen gehört zur Person; Ort und Situation zum Kontext."}}, {"lecture": 3, "topic": "factors", "slides": "8", "answer": 3, "en": {"prompt": "Which set is included in Human Factors?", "options": ["Only visual style of an interface.", "Only physical dimensions of hardware.", "Only financial targets of a company.", "Physical, psychological, cognitive and social characteristics."], "explain": "The field concerns human characteristics and adapting systems to them."}, "de": {"prompt": "Welche Merkmale untersucht Human Factors?", "options": ["Nur visuellen Interfacestil.", "Nur Hardwareabmessungen.", "Nur finanzielle Unternehmensziele.", "Physische, psychische, kognitive und soziale Eigenschaften."], "explain": "Human Factors untersucht Menschen und die Anpassung von Systemen an sie."}}, {"lecture": 3, "topic": "factors", "slides": "11", "answer": 3, "en": {"prompt": "How can a person contribute to resilience?", "options": ["Remove all communication between team members.", "Always follow an automated output without checking context.", "Assume every deviation is a personal failure.", "Notice an unexpected situation and adapt before harm occurs."], "explain": "The lecture recognizes humans as positive contributors within the overall system."}, "de": {"prompt": "Wie kann eine Person zur Resilienz beitragen?", "options": ["Kommunikation im Team entfernen.", "Automatische Ausgaben immer ungeprüft befolgen.", "Jede Abweichung als persönliches Versagen ansehen.", "Eine unerwartete Situation bemerken und vor einem Schaden angemessen reagieren."], "explain": "Die Vorlesung erkennt positive menschliche Beiträge zum Gesamtsystem an."}}, {"lecture": 3, "topic": "factors", "slides": "12", "answer": 1, "en": {"prompt": "What contributes to subjective competence in the lecture?", "options": ["Only seeing more technical labels.", "Understanding a system and having opportunities to influence it.", "Only being told to trust automation.", "Only receiving more alarms."], "explain": "A sense of competence depends on understanding plus possible action or influence."}, "de": {"prompt": "Was trägt zum subjektiven Kompetenzempfinden bei?", "options": ["Nur mehr technische Beschriftungen sehen.", "Systemverständnis und Möglichkeiten zur Einflussnahme.", "Nur zum Technikvertrauen aufgefordert werden.", "Nur mehr Alarme erhalten."], "explain": "Kompetenzgefühl braucht Verständnis und Handlungs- oder Einflussmöglichkeiten."}}, {"lecture": 3, "topic": "factors", "slides": "12", "answer": 2, "en": {"prompt": "Why can monotonous monitoring reduce effective human involvement?", "options": ["It removes all need for system knowledge.", "It automatically increases active understanding.", "It can weaken critical attention and perceived competence.", "It guarantees anticipation of every future event."], "explain": "The lecture links self-controlling systems with undemanding supervision and loss of attention."}, "de": {"prompt": "Warum kann monotones Überwachen wirksame menschliche Beteiligung schwächen?", "options": ["Systemwissen wird vollständig unnötig.", "Aktives Verständnis steigt automatisch.", "Kritische Aufmerksamkeit und Kompetenzempfinden können sinken.", "Alle zukünftigen Ereignisse werden garantiert vorausgesehen."], "explain": "Selbststeuernde Systeme können Menschen anspruchslose Überwachung überlassen."}}, {"lecture": 3, "topic": "perspectives", "slides": "15", "answer": 0, "en": {"prompt": "Which HCI development phase emphasizes intelligent environments such as smart homes?", "options": ["Ambient intelligence.", "The cooperative-systems phase only.", "Historicist product styling.", "The first interactive-systems phase only."], "explain": "The fourth HCI development phase in this lecture concerns intelligent environments."}, "de": {"prompt": "Welche HCI-Phase betont intelligente Umgebungen wie Smart Homes?", "options": ["Ambient Intelligence.", "Nur die Phase kooperativer Systeme.", "Historistisches Produktstyling.", "Nur die erste Phase interaktiver Systeme."], "explain": "Die vierte HCI-Phase behandelt intelligente Umgebungen."}}, {"lecture": 3, "topic": "perspectives", "slides": "15", "answer": 1, "en": {"prompt": "Which HCI phase highlights embedded and mobile systems becoming widespread?", "options": ["Cooperative systems only.", "Ubiquitous systems.", "Postmodern furniture design.", "Purely mechanical systems."], "explain": "The late-1990s phase concerns computing integrated into everyday settings."}, "de": {"prompt": "Welche HCI-Phase betont verbreitete eingebettete und mobile Systeme?", "options": ["Nur kooperative Systeme.", "Ubiquitäre Systeme.", "Postmodernes Möbeldesign.", "Rein mechanische Systeme."], "explain": "Die Phase der späten 1990er integriert Computing in Alltagssituationen."}}, {"lecture": 3, "topic": "perspectives", "slides": "13–14", "answer": 1, "en": {"prompt": "Why does interface design require multiple disciplines?", "options": ["Every problem is purely a color decision.", "Human abilities, software, information, aesthetics and social context all matter.", "Psychology and ergonomics cannot affect use.", "One coding language explains all human behavior."], "explain": "The lecture’s interdisciplinary diagram connects several contributing areas."}, "de": {"prompt": "Warum benötigt Interfacedesign mehrere Disziplinen?", "options": ["Jedes Problem ist nur eine Farbfrage.", "Menschliche Fähigkeiten, Software, Information, Ästhetik und sozialer Kontext wirken zusammen.", "Psychologie und Ergonomie haben keinen Einfluss.", "Eine Programmiersprache erklärt jedes Verhalten."], "explain": "Das Disziplinendiagramm verbindet verschiedene Fachgebiete."}}, {"lecture": 3, "topic": "perspectives", "slides": "16–17", "answer": 1, "en": {"prompt": "A person taps Send. What comes next on the system side of the interaction loop?", "options": ["Remove the person’s context.", "Interpret and process the input, then produce output.", "Create a new user need automatically.", "Finish interaction before any feedback."], "explain": "Input leads to system processing and feedback that users then perceive and interpret."}, "de": {"prompt": "Eine Person tippt auf Senden. Was folgt systemseitig?", "options": ["Den Personenkontext entfernen.", "Eingabe interpretieren und verarbeiten, dann eine Ausgabe erzeugen.", "Automatisch ein neues Bedürfnis schaffen.", "Die Interaktion vor jedem Feedback beenden."], "explain": "Auf Eingabe folgen Verarbeitung und Rückmeldung für Wahrnehmung und Interpretation."}}, {"lecture": 3, "topic": "perspectives", "slides": "22", "answer": 2, "en": {"prompt": "In a sociotechnical view, response-time expectations in a group are what?", "options": ["Only network-transfer speeds.", "Unrelated to the product experience.", "Social norms that shape use.", "Only decorative interface properties."], "explain": "Communication norms and relationships interact with the technical system."}, "de": {"prompt": "Was sind Antwortzeiterwartungen in einem Gruppenchat aus soziotechnischer Sicht?", "options": ["Nur Netzwerkgeschwindigkeit.", "Ohne Bezug zum Produkterlebnis.", "Soziale Normen, die Nutzung prägen.", "Nur dekorative Interfaceeigenschaften."], "explain": "Kommunikationsnormen und Beziehungen wirken mit der Technik zusammen."}}, {"lecture": 3, "topic": "hcd", "slides": "26", "answer": 1, "en": {"prompt": "What makes HCD evidence-based in the lecture?", "options": ["Choosing the most fashionable feature.", "Identifying needs through observation and analysis.", "Testing only whether the code compiles.", "Relying only on the designer’s intuition."], "explain": "Evidence about people and their circumstances guides problem understanding and design."}, "de": {"prompt": "Was macht HCD evidenzbasiert?", "options": ["Die modischste Funktion wählen.", "Bedürfnisse durch Beobachtung und Analyse bestimmen.", "Nur prüfen, ob der Code kompiliert.", "Nur der Intuition des Designers folgen."], "explain": "Wissen über Menschen und ihre Umstände leitet die Gestaltung."}}, {"lecture": 3, "topic": "hcd", "slides": "26", "answer": 1, "en": {"prompt": "Why is spending time on problem finding important?", "options": ["Problem framing cannot influence solutions.", "The initial request may not reveal the core problem.", "Research is only useful after publication.", "A first feature request always contains every requirement."], "explain": "The lecture emphasizes time for understanding the core before choosing interventions."}, "de": {"prompt": "Warum sollte man Zeit für die Problemfindung aufwenden?", "options": ["Framing beeinflusst Lösungen nicht.", "Der erste Wunsch zeigt möglicherweise nicht das Kernproblem.", "Forschung ist erst nach Veröffentlichung hilfreich.", "Der erste Funktionswunsch enthält immer alle Anforderungen."], "explain": "Die Vorlesung betont das Verstehen des Kerns vor der Lösungswahl."}}, {"lecture": 3, "topic": "hcd", "slides": "28", "answer": 2, "en": {"prompt": "Which statement reflects the whole-experience HCD principle?", "options": ["Treat anticipated use as outside the product’s effects.", "Optimize one button while ignoring all other touchpoints.", "Consider the experience around and across use, not just one isolated screen.", "Limit research to one visible color preference."], "explain": "HCD addresses the whole user experience, not only a local interaction."}, "de": {"prompt": "Welche Aussage entspricht dem HCD-Prinzip der gesamten UX?", "options": ["Erwartete Nutzung außerhalb aller Produktwirkungen sehen.", "Einen Button optimieren und alle anderen Kontaktpunkte ignorieren.", "Erfahrungen rund um und über die Nutzung hinweg berücksichtigen.", "Forschung auf eine Farbpräferenz beschränken."], "explain": "HCD umfasst mehr als eine lokale Interaktion."}}, {"lecture": 3, "topic": "hcd", "slides": "28", "answer": 3, "en": {"prompt": "What is one reason to involve several disciplines in HCD?", "options": ["It guarantees all disagreements disappear.", "It makes evaluation unnecessary.", "It replaces direct involvement of users.", "Different skills and perspectives reveal different requirements and effects."], "explain": "Multidisciplinary teams are one of the six principles listed in the lecture."}, "de": {"prompt": "Warum sind mehrere Disziplinen in HCD sinnvoll?", "options": ["Sie garantieren das Ende aller Meinungsverschiedenheiten.", "Sie machen Evaluation überflüssig.", "Sie ersetzen die Beteiligung der Nutzer.", "Unterschiedliche Kompetenzen und Perspektiven zeigen verschiedene Anforderungen und Folgen."], "explain": "Multidisziplinäre Teams gehören zu den sechs HCD-Prinzipien."}}, {"lecture": 3, "topic": "usability", "slides": "32", "answer": 0, "en": {"prompt": "Which of these belongs to the ISO usability definition?", "options": ["Specified users, goals and context of use.", "A fixed number of interface controls.", "Appearance as the only quality factor.", "Universal usability independent of context."], "explain": "Usability is evaluated in relation to users achieving goals in context."}, "de": {"prompt": "Was gehört zur ISO-Definition der Gebrauchstauglichkeit?", "options": ["Bestimmte Nutzer, Ziele und Nutzungskontexte.", "Eine feste Anzahl an Bedienelementen.", "Aussehen als einziger Qualitätsfaktor.", "Universelle Qualität unabhängig vom Kontext."], "explain": "Usability bezieht sich auf Zielerreichung bestimmter Menschen im Kontext."}}, {"lecture": 3, "topic": "usability", "slides": "33", "answer": 0, "en": {"prompt": "A first-time user quickly learns how to perform a basic task. Which criterion is most direct?", "options": ["Learnability.", "Social responsibility.", "System resilience only.", "Memorability after long absence."], "explain": "Learnability concerns getting started and learning basic operation."}, "de": {"prompt": "Eine neue Person lernt grundlegende Aufgaben schnell. Welches Kriterium passt?", "options": ["Erlernbarkeit.", "Gesellschaftliche Verantwortung.", "Nur Systemresilienz.", "Einprägsamkeit nach langer Pause."], "explain": "Erlernbarkeit betrifft Einstieg und grundlegende Bedienung."}}, {"lecture": 3, "topic": "usability", "slides": "4,33", "answer": 1, "en": {"prompt": "A person can complete tasks using a screen reader. Which concern is most direct?", "options": ["Market differentiation only.", "Accessibility.", "Product collectability.", "Styling."], "explain": "Accessibility addresses use by people with diverse abilities and support needs."}, "de": {"prompt": "Eine Person erledigt Aufgaben mit einem Screenreader. Welches Anliegen steht im Vordergrund?", "options": ["Nur Marktdifferenzierung.", "Barrierefreiheit.", "Sammelwert.", "Styling."], "explain": "Barrierefreiheit unterstützt Menschen mit unterschiedlichen Fähigkeiten und Hilfsmitteln."}}, {"lecture": 3, "topic": "usability", "slides": "32–33", "answer": 0, "en": {"prompt": "A correct and fast task still leaves users frustrated. Which core factor needs attention?", "options": ["Satisfaction.", "Only effectiveness.", "Only system uptime.", "Only storage capacity."], "explain": "The ISO core includes satisfaction as well as successful, efficient goal achievement."}, "de": {"prompt": "Eine Aufgabe gelingt korrekt und schnell, bleibt aber frustrierend. Welcher Kernfaktor braucht Aufmerksamkeit?", "options": ["Zufriedenheit.", "Nur Effektivität.", "Nur Systemverfügbarkeit.", "Nur Speicherkapazität."], "explain": "Zufriedenheit gehört neben Effektivität und Effizienz zu den Kernfaktoren."}}, {"lecture": 3, "topic": "ux", "slides": "32–37", "answer": 2, "en": {"prompt": "Which statement about usability and UX is most accurate?", "options": ["UX excludes task completion and system performance.", "Usability concerns only decorative appearance.", "Usability contributes to UX, while UX also includes broader perceptions and responses.", "They are identical because both concern only task speed."], "explain": "The concepts overlap, but UX encompasses anticipated use and experiences before, during and after use."}, "de": {"prompt": "Welche Aussage zu Usability und UX ist am genauesten?", "options": ["UX schließt Aufgabenerledigung und Leistung aus.", "Usability betrifft nur Dekoration.", "Usability trägt zur UX bei; UX umfasst zusätzlich breitere Wahrnehmungen und Reaktionen.", "Beide sind identisch und betreffen nur Geschwindigkeit."], "explain": "UX umfasst auch erwartete Nutzung und Erfahrungen davor, dabei und danach."}}, {"lecture": 3, "topic": "ux", "slides": "34", "answer": 2, "en": {"prompt": "What does Emotional Usability emphasize in the lecture?", "options": ["Only network throughput.", "Only compile-time correctness.", "Needs beyond functional requirements.", "Only the size of a menu."], "explain": "The historical discussion links the term to nonfunctional human needs and emotional experience."}, "de": {"prompt": "Was betont Emotional Usability?", "options": ["Nur Netzwerkdurchsatz.", "Nur Fehlerfreiheit beim Kompilieren.", "Bedürfnisse über funktionale Anforderungen hinaus.", "Nur die Menügröße."], "explain": "Die historische Diskussion erweitert den Blick auf nichtfunktionale Bedürfnisse und Emotionen."}}, {"lecture": 3, "topic": "ux", "slides": "36", "answer": 1, "en": {"prompt": "Which can influence UX even if the interface itself is unchanged?", "options": ["Only a new source-code file name.", "A person’s prior experience and current internal state.", "Only an unused development tool.", "Only a new version-control branch."], "explain": "The definition includes prior experiences, attitudes, skills, personality and physical/internal state."}, "de": {"prompt": "Was kann UX bei unverändertem Interface beeinflussen?", "options": ["Nur ein neuer Quellcodedateiname.", "Vorerfahrungen und aktueller innerer Zustand.", "Nur ein ungenutztes Entwicklungstool.", "Nur ein neuer Versionskontrollzweig."], "explain": "Die Definition nennt Erfahrungen, Einstellungen, Fähigkeiten, Persönlichkeit und Zustand."}}, {"lecture": 3, "topic": "positive", "slides": "42", "answer": 2, "en": {"prompt": "Feeling frequent joy and occasional sadness most directly concerns which well-being component?", "options": ["Only cognitive life evaluation.", "Only organizational structure.", "Affective experience.", "Only technical feasibility."], "explain": "Affect concerns feelings and emotions; cognitive well-being concerns evaluation."}, "de": {"prompt": "Häufige Freude und gelegentliche Traurigkeit betreffen welche Komponente?", "options": ["Nur kognitive Lebensbewertung.", "Nur Organisationsstruktur.", "Affektive Erfahrung.", "Nur technische Machbarkeit."], "explain": "Affekt betrifft Gefühle und Emotionen, kognitive Bewertung die Einschätzung des Lebens."}}, {"lecture": 3, "topic": "positive", "slides": "40–43", "answer": 2, "en": {"prompt": "Which statement best matches the lecture’s approach to positive possibilities?", "options": ["Assume any pleasurable interaction guarantees lasting flourishing.", "Replace personal values with company goals.", "Look for ways to enrich life, not only eliminate an existing problem.", "Measure well-being only through session length."], "explain": "Positive Design broadens attention to positive value and long-term psychological well-being."}, "de": {"prompt": "Welche Aussage passt zum Fokus auf positive Möglichkeiten?", "options": ["Jede angenehme Interaktion garantiert dauerhaftes Aufblühen.", "Persönliche Werte durch Unternehmensziele ersetzen.", "Möglichkeiten zur Lebensbereicherung suchen statt nur Probleme beseitigen.", "Wohlbefinden ausschließlich durch Nutzungsdauer messen."], "explain": "Positive Design berücksichtigt Mehrwert und längerfristiges psychologisches Wohlbefinden."}}, {"lecture": 3, "topic": "framework", "slides": "44", "answer": 2, "en": {"prompt": "Remembering meaningful experiences with pleasure most directly fits which triangle dimension?", "options": ["Practical–technical function only.", "Automatic system control.", "Design for Pleasure.", "Error tolerance."], "explain": "The lecture’s Recordis example is under pleasure and concerns pride and memories."}, "de": {"prompt": "Angenehme Erinnerungen an bedeutsame Erlebnisse passen im Vorlesungsbeispiel zu welcher Dimension?", "options": ["Nur praktisch-technischer Funktion.", "Automatischer Systemsteuerung.", "Design for Pleasure.", "Fehlertoleranz."], "explain": "Recordis steht unter Pleasure und verbindet Stolz mit Erinnerungen."}}, {"lecture": 3, "topic": "framework", "slides": "46", "answer": 3, "en": {"prompt": "Which characteristic emphasizes users’ values, lifestyle and goals?", "options": ["Interface generation.", "Balanced only.", "Technical standardization only.", "Personal fit."], "explain": "Personal fit tailors design to individual requirements rather than one undifferentiated audience."}, "de": {"prompt": "Welches Merkmal betont Werte, Lebensstil und Ziele der Nutzer?", "options": ["Interfacegeneration.", "Nur Balanced.", "Nur technische Standardisierung.", "Personal Fit."], "explain": "Personal Fit berücksichtigt individuelle Anforderungen."}}, {"lecture": 3, "topic": "framework", "slides": "46", "answer": 2, "en": {"prompt": "Which characteristic emphasizes sustainable contribution over time?", "options": ["Appearance-only styling.", "Short-term novelty only.", "Long-term impact.", "One-shot visual redesign."], "explain": "The lecture treats well-being as a process requiring lasting contribution."}, "de": {"prompt": "Welches Merkmal betont nachhaltige Beiträge über längere Zeit?", "options": ["Nur oberflächliches Styling.", "Nur kurzfristige Neuheit.", "Long-Term Impact.", "Einmalige visuelle Überarbeitung."], "explain": "Wohlbefinden wird als Prozess mit langfristigem Unterstützungsbedarf gesehen."}}, {"lecture": 3, "topic": "perma", "slides": "47", "answer": 3, "en": {"prompt": "A user pursues an activity because it feels purposeful. Which PERMA dimension is most direct?", "options": ["Memorabil
