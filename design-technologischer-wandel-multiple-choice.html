<script type="application/json" id="study-data">{"kind": "multiple-choice", "questions": [{"lecture": 2, "topic": "changing-object", "slides": "4–6", "answer": 3, "en": {"prompt": "How does the object of design change with digital and AI technologies?", "options": ["It no longer includes human expectations.", "It becomes limited to physical material selection.", "It excludes functions once they are automated.", "It expands to data flows, rules, interaction and system behavior."], "explain": "Design extends into less visible processes, personalization and AI behavior."}, "de": {"prompt": "Wie verändert sich der Designgegenstand durch digitale Technik und KI?", "options": ["Menschliche Erwartungen gehören nicht mehr dazu.", "Er beschränkt sich auf physische Materialien.", "Automatisierte Funktionen sind von Design ausgeschlossen.", "Er erweitert sich um Datenflüsse, Regeln, Interaktion und Systemverhalten."], "explain": "Design betrifft auch unsichtbare Prozesse, Personalisierung und KI-Verhalten."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "14–15", "answer": 2, "en": {"prompt": "What did Arts and Crafts criticize?", "options": ["All links between everyday objects and social life.", "The idea that design quality matters to people.", "Poor industrial goods and the social and environmental effects of industrialization.", "The use of craftsmanship in product creation."], "explain": "The movement connected aesthetic quality with social reform and craftsmanship."}, "de": {"prompt": "Was kritisierte Arts and Crafts?", "options": ["Jede Verbindung zwischen Alltagsobjekten und Gesellschaft.", "Die Bedeutung von Gestaltungsqualität.", "Schlechte Industriewaren sowie soziale und ökologische Folgen der Industrialisierung.", "Handwerkliche Fertigung."], "explain": "Die Bewegung verband ästhetische Qualität mit Handwerk und sozialer Reform."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "15", "answer": 0, "en": {"prompt": "Rich floral ornament is most closely associated with which movement in the lecture?", "options": ["Art Nouveau.", "Streamline styling.", "Command-line interaction.", "Good Form."], "explain": "The Art Nouveau section highlights floral ornament and Hector Guimard’s Métro work."}, "de": {"prompt": "Reiche florale Ornamentik gehört in der Vorlesung besonders zu welcher Bewegung?", "options": ["Art Nouveau.", "Streamline.", "Kommandozeileninteraktion.", "Die Gute Form."], "explain": "Art Nouveau wird mit floralen Ornamenten und Guimards Metroeingängen verbunden."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "17", "answer": 0, "en": {"prompt": "What was a central aim of the Deutscher Werkbund?", "options": ["Combine art, craft and industry to improve accessible mass-produced goods.", "Replace every industrial process with unique luxury handwork.", "Restrict design to purely decorative surfaces.", "Separate product quality from production decisions."], "explain": "The Werkbund sought reform through collaboration with industry."}, "de": {"prompt": "Was war ein zentrales Anliegen des Deutschen Werkbunds?", "options": ["Kunst, Handwerk und Industrie für hochwertige erschwingliche Massenware verbinden.", "Jede industrielle Herstellung durch luxuriöse Einzelstücke ersetzen.", "Design auf Dekoration beschränken.", "Produktqualität von Herstellungsentscheidungen trennen."], "explain": "Der Werkbund suchte Reform durch Zusammenarbeit mit der Industrie."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "19", "answer": 3, "en": {"prompt": "Which combination best represents the Bauhaus emphasis in the lecture?", "options": ["Eliminating applied arts from design education.", "Historical ornament and visual imitation alone.", "Marketing-only redesign without regard to use.", "Function, form experimentation, technology and industrial production."], "explain": "Bauhaus connected function and beauty with workshops, materials and later standardization."}, "de": {"prompt": "Welche Verbindung kennzeichnet das Bauhaus in der Vorlesung?", "options": ["Ausschluss angewandter Kunst aus der Ausbildung.", "Nur historische Ornamentik und Nachahmung.", "Nur Marketing ohne Gebrauch.", "Funktion, Formexperimente, Technik und industrielle Produktion."], "explain": "Das Bauhaus verband Funktion und Schönheit mit Werkstätten, Materialien und Standardisierung."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "20–21", "answer": 3, "en": {"prompt": "What is styling in the Streamline discussion?", "options": ["A method for identifying all stakeholder needs.", "A guarantee of improved technical performance.", "A replacement for all product functions.", "Formal redesign emphasizing aesthetic and marketing effects."], "explain": "The lecture distinguishes appearance-led, marketing-oriented redesign as styling."}, "de": {"prompt": "Was bedeutet Styling im Streamline-Kontext?", "options": ["Eine Methode zur Ermittlung sämtlicher Stakeholderbedürfnisse.", "Eine Garantie technischer Leistungssteigerung.", "Ein Ersatz aller Produktfunktionen.", "Formale Überarbeitung mit ästhetischem und marketingbezogenem Schwerpunkt."], "explain": "Styling bezeichnet hier eine auf Erscheinung und Vermarktung ausgerichtete Überarbeitung."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "21", "answer": 1, "en": {"prompt": "Which designer is most closely linked to Streamline in the lecture?", "options": ["Max Bill.", "Raymond Loewy.", "Ettore Sottsass.", "Gui Bonsiepe."], "explain": "Loewy is presented through Streamline, market research and well-known commercial design work."}, "de": {"prompt": "Wer wird besonders mit Streamline verbunden?", "options": ["Max Bill.", "Raymond Loewy.", "Ettore Sottsass.", "Gui Bonsiepe."], "explain": "Die Vorlesung verbindet Loewy mit Stromliniengestaltung, Marktanalyse und kommerziellen Produkten."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "22–24", "answer": 2, "en": {"prompt": "Which qualities characterize Good Form?", "options": ["Constant novelty, heavy ornament and disposability.", "Unpredictable interaction as a central goal.", "Simplicity, objectivity, durability and timelessness.", "Random form without regard to practical use."], "explain": "Good Form continues the lecture’s functionalist emphasis on clarity and lasting usefulness."}, "de": {"prompt": "Welche Eigenschaften kennzeichnen die Gute Form?", "options": ["Ständige Neuheit, starke Ornamentik und Wegwerfbarkeit.", "Unvorhersehbare Interaktion als Hauptziel.", "Einfachheit, Sachlichkeit, Haltbarkeit und Zeitlosigkeit.", "Beliebige Form ohne Gebrauch."], "explain": "Die Gute Form betont funktionalistische Klarheit und dauerhafte Brauchbarkeit."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "22–23", "answer": 0, "en": {"prompt": "Which institution is associated with Max Bill and functional design education?", "options": ["HfG Ulm.", "The Paris Métro.", "Studio Alchimia.", "The Memphis group."], "explain": "The lecture describes Max Bill as HfG Ulm’s first rector and connects the school with functional design."}, "de": {"prompt": "Welche Institution verbindet die Vorlesung mit Max Bill und funktionaler Designausbildung?", "options": ["HfG Ulm.", "Die Pariser Metro.", "Studio Alchimia.", "Die Memphis-Gruppe."], "explain": "Max Bill wird als erster Rektor der HfG Ulm vorgestellt."}}, {"lecture": 2, "topic": "postmodern-participatory", "slides": "25–28", "answer": 1, "en": {"prompt": "Which statement best describes postmodern design as presented?", "options": ["It requires every product to follow the same neutral appearance.", "It uses expressive colors, signs and playful combinations to challenge restrained functionalism.", "It limits design to technical efficiency.", "It treats emotional meaning as irrelevant to objects."], "explain": "Postmodernism challenged Good Form and explored emotional and symbolic relationships."}, "de": {"prompt": "Was beschreibt postmodernes Design am besten?", "options": ["Jedes Produkt muss gleich neutral aussehen.", "Ausdrucksstarke Farben, Zeichen und spielerische Kombinationen hinterfragen reduzierten Funktionalismus.", "Design beschränkt sich auf technische Effizienz.", "Emotionale Bedeutung gilt als unwichtig."], "explain": "Die Postmoderne erkundet emotionale und symbolische Beziehungen als Gegenposition zur Guten Form."}}, {"lecture": 2, "topic": "postmodern-participatory", "slides": "26", "answer": 0, "en": {"prompt": "Which pair belongs to the postmodern design discussion?", "options": ["Studio Alchimia and Memphis.", "HfG Ulm and Braun only.", "Xerox Alto and Mosaic.", "Bonsiepe and Krippendorff."], "explain": "These Italian design groups appear in the lecture’s postmodern section."}, "de": {"prompt": "Welches Paar gehört zur postmodernen Designdiskussion?", "options": ["Studio Alchimia und Memphis.", "Nur HfG Ulm und Braun.", "Xerox Alto und Mosaic.", "Bonsiepe und Krippendorff."], "explain": "Die beiden italienischen Gruppen gehören zum Postmoderne-Abschnitt."}}, {"lecture": 2, "topic": "postmodern-participatory", "slides": "32", "answer": 3, "en": {"prompt": "What distinguishes participatory design from designing entirely without users?", "options": ["Users are consulted only to approve a finished marketing image.", "The designer assumes all preferences without research.", "Only technical experts may propose changes.", "Users help shape the process through involvement and contribution."], "explain": "Workshops, communities and customization are examples of participation."}, "de": {"prompt": "Was unterscheidet partizipatives Design von Gestaltung ohne Nutzerbeteiligung?", "options": ["Menschen bestätigen nur ein fertiges Werbebild.", "Designer nehmen alle Präferenzen ohne Forschung an.", "Nur technische Fachleute dürfen Änderungen vorschlagen.", "Menschen tragen aktiv zur Gestaltung und zum Prozess bei."], "explain": "Workshops, Gemeinschaften und Customization sind Formen der Beteiligung."}}, {"lecture": 2, "topic": "postmodern-participatory", "slides": "31", "answer": 3, "en": {"prompt": "How does brand design expand attention beyond the standalone product?", "options": ["It makes use and company strategy unrelated.", "It removes the product’s symbolic value.", "It concerns only the product’s physical dimensions.", "It connects the product to an experience world, identity and strategy."], "explain": "The product becomes an image carrier and part of wider organizational strategy."}, "de": {"prompt": "Wie erweitert Markendesign die Sicht auf das einzelne Produkt?", "options": ["Es trennt Nutzung und Unternehmensstrategie vollständig.", "Es entfernt symbolische Bedeutung.", "Es betrifft ausschließlich physische Maße.", "Es verbindet das Produkt mit Erlebniswelt, Identität und Strategie."], "explain": "Das Produkt wird zum Imageträger und Teil der Unternehmensstrategie."}}, {"lecture": 2, "topic": "interface-theory", "slides": "37", "answer": 2, "en": {"prompt": "Which question expresses the Human Factors perspective?", "options": ["How can more system complexity be hidden without feedback?", "How can people adapt to a machine without any redesign?", "How should the system be designed so people can operate it reliably?", "How can users be excluded from the design process?"], "explain": "Human Factors shifts emphasis from merely training people to adapting systems to people."}, "de": {"prompt": "Welche Frage entspricht der Human-Factors-Perspektive?", "options": ["Wie versteckt man Komplexität ohne Rückmeldung?", "Wie passen sich Menschen ohne Neugestaltung an die Maschine an?", "Wie muss das System gestaltet sein, damit Menschen es zuverlässig bedienen können?", "Wie lassen sich Menschen aus dem Prozess ausschließen?"], "explain": "Human Factors verschiebt den Fokus von bloßer Schulung zur Anpassung des Systems."}}, {"lecture": 2, "topic": "interface-theory", "slides": "39", "answer": 2, "en": {"prompt": "Bonsiepe’s interface connects which three elements?", "options": ["Color, material and price.", "Server, database and network only.", "User, goal of action and tool.", "Brand, revenue and competitors."], "explain": "The ontological diagram links purposeful human action to a tool through an interface."}, "de": {"prompt": "Welche drei Elemente verbindet Bonsiepes Interface?", "options": ["Farbe, Material und Preis.", "Nur Server, Datenbank und Netzwerk.", "Nutzer, Handlungsziel und Werkzeug.", "Marke, Umsatz und Konkurrenz."], "explain": "Das ontologische Diagramm verbindet zielgerichtetes Handeln mit einem Werkzeug."}}, {"lecture": 2, "topic": "interface-theory", "slides": "40–41", "answer": 2, "en": {"prompt": "What is second-order understanding in Krippendorff’s discussion?", "options": ["Replacing user research with a technical checklist.", "Studying only an interface’s second screen.", "Understanding how stakeholders understand the artifact.", "Checking only the designer’s interpretation twice."], "explain": "Designers need to engage with others’ interpretations and social contexts."}, "de": {"prompt": "Was bedeutet Krippendorffs „Verstehen zweiter Ordnung“?", "options": ["Nutzerforschung durch technische Checklisten ersetzen.", "Nur die zweite Bildschirmseite untersuchen.", "Verstehen, wie Stakeholder das Artefakt verstehen.", "Nur die eigene Interpretation zweimal prüfen."], "explain": "Designer müssen sich mit den Deutungen anderer und ihrem sozialen Kontext befassen."}}, {"lecture": 2, "topic": "interface-evolution", "slides": "44", "answer": 2, "en": {"prompt": "Which development is associated with graphical web browsing in the lecture?", "options": ["Removal of all visual navigation.", "A requirement to use AI agents.", "Mosaic and hyperlink navigation.", "A return to mechanical controls only."], "explain": "The second interface-generation section highlights Mosaic in 1993 and hyperlink navigation."}, "de": {"prompt": "Welche Entwicklung steht für grafisches Web-Browsing?", "options": ["Entfernung jeder visuellen Navigation.", "Verpflichtender Einsatz von KI-Agenten.", "Mosaic und Navigation über Hyperlinks.", "Rückkehr ausschließlich zu mechanischen Bedienelementen."], "explain": "Die zweite Interfacegeneration nennt Mosaic 1993 und Hyperlink-Navigation."}}, {"lecture": 2, "topic": "interface-evolution", "slides": "46", "answer": 2, "en": {"prompt": "Moving physical objects on an interactive table most directly illustrates what?", "options": ["A business-model canvas.", "A purely symbolic product role.", "A Tangible User Interface.", "A command-line interface."], "explain": "Tangible interfaces use physical objects for digital interaction; the lecture gives reacTable as an example."}, "de": {"prompt": "Physische Objekte auf einem interaktiven Tisch zu verschieben, veranschaulicht was?", "options": ["Einen Business Model Canvas.", "Nur eine symbolische Produktrolle.", "Ein Tangible User Interface.", "Ein Command Line Interface."], "explain": "Greifbare Objekte steuern digitale Interaktion; reacTable ist das Vorlesungsbeispiel."}}, {"lecture": 2, "topic": "interface-evolution", "slides": "47", "answer": 0, "en": {"prompt": "What does “Evolution ≠ Replacement” mean?", "options": ["CLI, GUI, touch, voice and newer systems can coexist.", "Each new interface removes every older interface.", "Only the newest mode can support expert users.", "Interfaces stop evolving after graphical interaction."], "explain": "Different modes remain useful for different people, tasks and contexts."}, "de": {"prompt": "Was bedeutet „Evolution ≠ Replacement“?", "options": ["CLI, GUI, Touch, Sprache und neuere Systeme können nebeneinander bestehen.", "Jede neue Oberfläche beseitigt alle älteren.", "Nur die neueste Form eignet sich für Experten.", "Interfaces entwickeln sich nach GUI nicht weiter."], "explain": "Unterschiedliche Interaktionsformen bleiben je nach Mensch, Aufgabe und Kontext sinnvoll."}}, {"lecture": 2, "topic": "technology-control", "slides": "47–51", "answer": 3, "en": {"prompt": "What changes when a person delegates parts of a task to an agent-based system?", "options": ["System feedback becomes irrelevant.", "Design decisions become unnecessary.", "The person’s goals cease to matter.", "The distribution of action, control and responsibility needs consideration."], "explain": "The lecture links technological change to how humans and systems share action and control."}, "de": {"prompt": "Was muss bei der Delegation an ein agentenbasiertes System bedacht werden?", "options": ["Systemrückmeldung wird unwichtig.", "Designentscheidungen werden überflüssig.", "Menschliche Ziele spielen keine Rolle mehr.", "Die Verteilung von Handlung, Kontrolle und Verantwortung."], "explain": "Technologischer Wandel verändert die Aufteilung zwischen Menschen und Systemen."}}, {"lecture": 2, "topic": "changing-object", "slides": "5–6", "answer": 1, "en": {"prompt": "Why do AI systems create design questions even when no new physical object is built?", "options": ["Generated content eliminates the need for communication.", "Expectations, dialogue, uncertainty and generated content must be shaped.", "Algorithms have no consequences for interaction.", "Only a physical shell can be designed."], "explain": "The changing design object includes invisible behavior and human expectations."}, "de": {"prompt": "Warum entstehen bei KI Designfragen auch ohne neues physisches Objekt?", "options": ["Generierte Inhalte beseitigen Kommunikationsbedarf.", "Erwartungen, Dialog, Unsicherheit und erzeugte Inhalte müssen gestaltet werden.", "Algorithmen wirken sich nicht auf Interaktion aus.", "Nur ein physisches Gehäuse ist gestaltbar."], "explain": "Der Designgegenstand umfasst unsichtbares Verhalten und menschliche Erwartungen."}}, {"lecture": 2, "topic": "changing-object", "slides": "7", "answer": 3, "en": {"prompt": "What does the lecture mean when conventions outlast technologies?", "options": ["Conventions never influence usability.", "Every convention was invented for the latest phone.", "An old convention must always be removed.", "Familiar interaction patterns may continue after their original technical basis changes."], "explain": "Design creates learned patterns that can persist across technical generations."}, "de": {"prompt": "Was bedeutet, dass Konventionen Technologien überdauern?", "options": ["Konventionen beeinflussen Benutzbarkeit nie.", "Alle Konventionen wurden für das neueste Handy erfunden.", "Alte Konventionen müssen immer entfernt werden.", "Vertraute Interaktionsmuster bleiben nach Veränderungen ihrer technischen Grundlage bestehen."], "explain": "Gelernte Muster können technische Generationen überdauern."}}, {"lecture": 2, "topic": "changing-object", "slides": "6", "answer": 3, "en": {"prompt": "Which example belongs to designing an invisible system?", "options": ["Choosing the shape of a physical handle only.", "Selecting packaging dimensions only.", "Selecting the material of a chair leg only.", "Selecting rules for personalization and automated behavior."], "explain": "Data flows, algorithms and automation are less visible but still shaped by design."}, "de": {"prompt": "Was ist ein Beispiel für die Gestaltung eines unsichtbaren Systems?", "options": ["Nur die Form eines Griffs bestimmen.", "Nur Verpackungsmaße wählen.", "Nur das Material eines Stuhlbeins wählen.", "Regeln für Personalisierung und automatisiertes Verhalten festlegen."], "explain": "Datenflüsse und Automatisierung sind weniger sichtbar, aber trotzdem gestaltbar."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "12–13", "answer": 2, "en": {"prompt": "What characterizes historicism in the industrialization discussion?", "options": ["Eliminating all reference to past styles.", "Making algorithms explain their decisions.", "Borrowing earlier styles and applying abundant ornament to new products.", "Designing hyperlink navigation."], "explain": "The lecture describes historical decoration applied to industrial goods and devices."}, "de": {"prompt": "Was kennzeichnet Historismus in der Industrialisierungsdiskussion?", "options": ["Jeden Bezug zu früheren Stilen beseitigen.", "Algorithmische Entscheidungen erklären.", "Frühere Stile übernehmen und neue Produkte reich ornamentieren.", "Hyperlink-Navigation entwickeln."], "explain": "Die Vorlesung beschreibt historische Dekoration an industriellen Waren und Geräten."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "14", "answer": 1, "en": {"prompt": "Why was reform not limited to the appearance of objects?", "options": ["Production and social conditions were unrelated.", "Housing, living conditions and work were also involved.", "Only color choices could affect industrial society.", "Reformers rejected all concern for everyday use."], "explain": "The reform discussion includes workers’ furniture, settlements and garden-city ideas."}, "de": {"prompt": "Warum ging die Reformbewegung über das Aussehen von Objekten hinaus?", "options": ["Produktion und soziale Bedingungen waren unabhängig.", "Sie betraf auch Wohnen, Lebensbedingungen und Arbeit.", "Nur Farben konnten die Industriegesellschaft beeinflussen.", "Reformer lehnten jeden Alltagsbezug ab."], "explain": "Arbeitermöbel, Siedlungen und Gartenstadtideen gehören dazu."}}, {"lecture": 2, "topic": "industrial-reform", "slides": "14", "answer": 3, "en": {"prompt": "Which group in the lecture called for simple, affordable and honest everyday goods?", "options": ["Only owners of luxury art collections.", "Only users of agent-based systems.", "Only early web-browser developers.", "Workers and trade unions."], "explain": "The reform slide identifies trade-union demands alongside cultural and economic pressures."}, "de": {"prompt": "Wer forderte einfache, preiswerte und ehrliche Gebrauchsgegenstände?", "options": ["Nur luxuriöse Kunstsammler.", "Nur Nutzer von Agentensystemen.", "Nur frühe Webbrowserentwickler.", "Arbeiter und Gewerkschaften."], "explain": "Die Reformfolie nennt Gewerkschaften neben kulturellen und wirtschaftlichen Reformkräften."}}, {" ession without use.", "No connection between technology and design."], "explain": "The Ulm section links formal restraint, functional/technical concerns and design education."}, "de": {"prompt": "Was gehört zur funktionalen Ausrichtung der HfG Ulm?", "options": ["Klare Formen, reduzierte Farben und Ergonomie.", "Maximale Ornamentik und bewusste Verwirrung.", "Nur individueller Kunstausdruck ohne Gebrauch.", "Keine Beziehung zwischen Technik und Design."], "explain": "Ulm verbindet formale Reduktion mit funktionalen und technischen Fragen."}}, {"lecture": 2, "topic": "modernism-styling", "slides": "24", "answer": 1, "en": {"prompt": "What does the Braun example illustrate?", "options": ["A purely decorative rejection of function.", "Functional order, usability and careful harmonious design.", "The first use of AI agents.", "An exclusively handmade luxury movement."], "explain": "Braun is presented as an influential expression of Good Form principles."}, "de": {"prompt": "Was veranschaulicht das Braun-Beispiel?", "options": ["Rein dekorative Ablehnung von Funktion.", "Funktionale Ordnung, Gebrauchstauglichkeit und sorgfältige harmonische Gestaltung.", "Den ersten Einsatz von KI-Agenten.", "Nur handwerkliche Luxusproduktion."], "explain": "Braun wird als prägendes Beispiel der Guten Form dargestellt."}}, {"lecture": 2, "topic": "postmodern-participatory", "slides": "25", "answer": 2, "en": {"prompt": "What was a target of alternative and radical design around 1968?", "options": ["Every form of experimentation.", "The use of any cultural or symbolic reference.", "Reduction of design to function and technique within mass consumption.", "Any critique of established design."], "explain": "These movements questioned functionalist and consumerist assumptions."}, "de": {"prompt": "Wogegen richteten sich Alternativ- und Radical Design um 1968?", "options": ["Gegen sämtliche Experimente.", "Gegen jede kulturelle oder symbolische Referenz.", "Gegen die Reduktion auf Funktion und nly command syntax can be used.", "Computing exists only at one dedicated desk.", "Computing is distributed through everyday environments, often unobtrusively."], "explain": "The fourth-generation discussion includes wearables and less visible embedded systems."}, "de": {"prompt": "Was beschreibt ubiquitäres Computing?", "options": ["Alle Funktionen müssen mechanisch sichtbar sein.", "Nur Befehlssyntax ist nutzbar.", "Computing existiert nur an einem festen Schreibtisch.", "Computing ist in Alltagsumgebungen verteilt und oft unauffällig."], "explain": "Wearables und wenig sichtbare eingebettete Systeme gehören dazu."}}, {"lecture": 2, "topic": "interface-evolution", "slides": "47", "answer": 2, "en": {"prompt": "How does goal-oriented generative-AI interaction differ from direct GUI manipulation?", "options": ["The system no longer processes any input.", "People lose every ability to specify a goal.", "People increasingly state intentions instead of specifying each visible action.", "All GUI objects become physically tangible."], "explain": "The lecture contrasts visible object manipulation with expressing goals and intentions."}, "de": {"prompt": "Wie unterscheidet sich zielorientierte KI-Interaktion von direkter GUI-Manipulation?", "options": ["Das System verarbeitet keine Eingaben mehr.", "Menschen verlieren jede Möglichkeit, Ziele zu nennen.", "Menschen formulieren stärker Absichten statt jede sichtbare Handlung einzeln vorzugeben.", "Alle GUI-Objekte werden physisch greifbar."], "explain": "Die Vorlesung kontrastiert Objektmanipulation mit Zielen und Intentionen."}}, {"lecture": 2, "topic": "technology-control", "slides": "48", "answer": 3, "en": {"prompt": "What can be lost when physical controls are replaced by digital ones?", "options": ["All possibilities for feedback.", "The need for any user action.", "Every form of visual hierarchy.", "Tactile and material cues to operation."], "explain": "Weight, friction, shape and material can provide use-related clue     h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.lecture),h("h1",null,t.heading),h("p",null,t[kind]))));

    h("p",{className:"progress"},done+" / "+perSet+" "+(isReview?t.studied:t.answered)),
    h("progress",{max:perSet,value:done,"aria-label":isReview?t.studied:t.answered}),

    h("p",{className:"progress"+(status==="unavailable"?" warning":""),role:"status"},t[status]));

    h("textarea",{id:"draft",rows:4,value:drafts[active]||"",onChange:e=>update({drafts:{...drafts,[active]:e.target.value}})}),

    h("p",{className:"meta"},t.select),

        onClick:()=>{if(!checked)setPicked(i);}},
        kind==="multiple-choice" && h("strong",null,String.fromCharCode(65+i)),h("span",null,option),
