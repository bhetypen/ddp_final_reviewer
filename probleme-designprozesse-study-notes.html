<script type="application/json" id="study-data">{"chapters": [{"id": "symptom-feature", "lecture": 4, "slides": "2–9", "en": {"title": "Feature requests, symptoms and problems", "content": "\u003cp class=\"lead\">“We need a chatbot” describes a proposed solution. It does not explain the underlying problem.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Statement\u003c/th>\u003cth>Classification\u003c/th>\u003cth>What to investigate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>“We need dark mode / gamification / AI search.”\u003c/td>\u003ctd>Feature request\u003c/td>\u003ctd>Who needs support, in which situation, and why?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“People abandon checkout.”\u003c/td>\u003ctd>Observed symptom\u003c/td>\u003ctd>Shipping costs, payment options, forced registration, delivery time, technical faults, trust or price checking?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“People cannot identify important group decisions after an absence.”\u003c/td>\u003ctd>A possible problem frame\u003c/td>\u003ctd>Validate the people, context and causes with evidence.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Knowing \u003cem>what\u003c/em> happens does not establish \u003cem>why\u003c/em>. Do not fall in love with the solution before understanding the problem.\u003c/p>\u003ch3>Problem space versus solution space\u003c/h3>\u003cp>\u003cstrong>Problem space:\u003c/strong> who is affected, when, what they want to achieve, possible causes and existing workarounds. \u003cstrong>Solution space:\u003c/strong> different interventions that might help.\u003c/p>\u003cp>The long-group-chat example includes summaries, highlights, threads, prioritized mentions, group-member curation, filters and changes to information architecture.\u003c/p>\u003cp class=\"recall\">Digital product design does not require building a new digital product for every problem. Organizational changes may also help.\u003c/p>"}, "de": {"title": "Funktionswünsche, Symptome und Probleme", "content": "\u003cp class='lead'>„Wir brauchen einen Chatbot“ nennt eine Lösung, nicht das zugrunde liegende Problem.\u003c/p>\u003cul>\u003cli>\u003cstrong>Funktionswunsch:\u003c/strong> Dark Mode, Gamification oder KI-Suche. Frage nach Menschen, Situation und Bedarf.\u003c/li>\u003cli>\u003cstrong>Symptom:\u003c/strong> Checkout-Abbrüche. Mögliche Ursachen: Versandkosten, fehlende Zahlungsart, Registrierung, Lieferzeit, Technik, Vertrauen oder reine Preisabfrage.\u003c/li>\u003cli>\u003cstrong>Möglicher Problemframe:\u003c/strong> Menschen erkennen nach Abwesenheit wichtige Gruppenentscheidungen nicht. Mit Evidenz prüfen.\u003c/li>\u003c/ul>\u003cp>Was geschieht, erklärt noch nicht warum. Verliebe dich nicht vor dem Problemverständnis in eine Lösung.\u003c/p>\u003ch3>Problem- und Lösungsraum\u003c/h3>\u003cp>Problemraum: Betroffene, Zeitpunkt, Ziel, Ursachen und Workarounds. Lösungsraum: alternative Maßnahmen wie Zusammenfassungen, Highlights, Threads, Erwähnungen, Gruppenmarkierungen, Filter oder andere Informationsarchitektur.\u003c/p>\u003cp class='recall'>Nicht jedes Problem braucht ein neues digitales Produkt. Auch organisatorische Änderungen können helfen.\u003c/p>"}, "comparisons": [{"slides": "3", "de": {"title": "Feature Request vs. Problem", "columns": [["Funktionswunsch", "Nennt eine Maßnahme: „Wir brauchen KI-Suche“."], ["Problem", "Beschreibt eine unbefriedigende Situation für Menschen."]], "tradeoff": "Der Wunsch ist ein Hinweis, kein Beweis für Bedürfnis oder Ursache. Vor Festlegung untersuchen.", "question": "Überführe „Wir brauchen einen Chatbot“ in Forschungsfragen.", "answer": "Wer hat bei welcher Aufgabe unter welchen Bedingungen warum Schwierigkeiten? Workarounds und Ziele prüfen. Chatbot ist eine mögliche Antwort, keine Problemdefinition."}, "en": {"title": "Feature request vs. problem", "columns": [["Feature request", "Names a proposed intervention: “We need AI search.”"], ["Problem", "Describes an unsatisfactory situation for people."]], "tradeoff": "A requested feature can be a useful clue, not proof of the need or cause. Investigate before commitment.", "question": "Turn “We need a chatbot” into problem-research questions.", "answer": "Who is struggling, with what task, in which context and why? Ask about workarounds and desired outcomes. A chatbot is one possible response, not the initial problem definition."}}, {"slides": "4", "de": {"title": "Symptom vs. zugrunde liegendes Problem/Ursachen", "columns": [["Symptom", "Beobachtung: häufige Checkout-Abbrüche."], ["Mögliche Ursachen", "Versand, Zahlungsarten, Registrierung, Lieferung, Vertrauen, Technik oder Preisabfrage."]], "tradeoff": "Eine Beobachtung kann mehrere Erklärungen haben. Eine Rate beweist keine einzelne Ursache.", "question": "Unterscheide Symptom und Ursache und beschreibe die Untersuchung.", "answer": "Abbruch beschreibt Verhalten. Interviews, Beobachtung und Daten helfen Erklärungen zu prüfen. Eine neue Interfacefunktion löst nicht automatisch hohe Versandkosten oder fehlende Zahlungsarten."}, "en": {"title": "Symptom vs. underlying problem/causes", "columns": [["Symptom", "What is observed: frequent checkout abandonment."], ["Possible causes", "Shipping cost, payment options, registration, delivery, trust, technology or price checking."]], "tradeoff": "One observation can have several explanations. Do not infer one cause automatically from a rate.", "question": "Distinguish symptom and cause, then explain how to investigate.", "answer": "Abandonment describes behavior. Interviews, observation and relevant data can distinguish explanations. A new interface feature may not solve high shipping costs or a missing payment method."}}, {"slides": "7; 23–24; 46", "de": {"title": "Problemraum vs. Lösungsraum", "columns": [["Problemraum", "Menschen, Ziele, Kontext, Schwierigkeiten und sinnvolles Problem verstehen."], ["Lösungsraum", "Maßnahmen zur gewünschten Veränderung entwickeln und prüfen."]], "tradeoff": "Das Richtige tun und Dinge richtig tun hängen zusammen. Ideen dürfen Verständnis fördern, aber das Problem nicht vorschnell festlegen.", "question": "Vergleiche die Räume und ordne Double Diamond zu.", "answer": "Discover/Define öffnen und fokussieren das Problem; Develop/Deliver Lösungen. Evaluation kann falsches Framing zeigen und Rücksprünge erfordern."}, "en": {"title": "Problem space vs. solution space", "columns": [["Problem space", "Understand people, goals, context, difficulties and the problem worth addressing."], ["Solution space", "Explore and evaluate interventions that might achieve the desired change."]], "tradeoff": "Doing the right thing and doing things right are connected. Early ideas can inform understanding, but should not lock the problem prematurely.", "question": "Compare the spaces and map them to Double Diamond.", "answer": "Discover/Define open and focus the problem; Develop/Deliver open and focus solutions. Evaluation may reveal a mistaken frame, so the process can return to earlier work."}}], "exam": {"de": {"prompt": "Überführe einen Funktionswunsch in eine Untersuchung.", "answer": "Bei „KI-Zusammenfassungen“ nach Betroffenen, Zeitpunkt, Zielen, wichtigen Inhalten, Ursachen, Workarounds und Vertrauen/Risiken fragen. Evidenz vor Wahl zwischen Zusammenfassung, Highlights, Struktur oder organisatorischen Änderungen sammeln.", "points": [["Funktionswunsch", "Dark Mode, Gamification oder KI-Suche. Frage nach Menschen, Situation und Bedarf."], ["Symptom", "Checkout-Abbrüche. Mögliche Ursachen: Versandkosten, fehlende Zahlungsart, Registrierung, Lieferzeit, Technik, Vertrauen oder reine Preisabfrage."], ["Möglicher Problemframe", "Menschen erkennen nach Abwesenheit wichtige Gruppenentscheidungen nicht. Mit Evidenz prüfen."]], "lists": [{"title": "Drei Begriffe", "items": ["Funktionswunsch", "Symptom", "Zugrunde liegendes Problem"]}]}, "en": {"prompt": "Turn a feature request into an investigation.", "answer": "Start with “We need AI summaries.” Ask who struggles, when, goals, important content, causes, existing workarounds and trust/risk. Gather evidence before choosing between summaries, highlights, structure or organizational changes.", "points": [["Problem space", "who is affected, when, what they want to achieve, possible causes and existing workarounds. Solution space: different interventions that might help."]], "lists": [{"title": "Three terms", "items": ["Feature request", "Symptom", "Underlying problem"]}]}}}, {"id": "framing", "lecture": 4, "slides": "10–14", "en": {"title": "Framing and reframing", "content": "\u003cp>\u003cstrong>A frame\u003c/strong> is a perspective through which a situation is interpreted and structured as a design problem. It affects whose experiences count, what is relevant, assumed causes, priorities and possible interventions.\u003c/p>\u003cp>\u003cstrong>Reframing\u003c/strong> changes that perspective by questioning assumptions.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Same observation: 327 unread group messages after a holiday\u003c/th>\u003cth>Possible intervention\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Volume frame: too much to read.\u003c/td>\u003ctd>An AI summary.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relevance frame: important content is hard to distinguish.\u003c/td>\u003ctd>Personalized highlights.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Structure frame: decisions and small talk share one chronological stream.\u003c/td>\u003ctd>Topics, threads and visible decisions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Social participation frame: rejoining the conversation is difficult.\u003c/td>\u003ctd>A catch-me-up view with context, key events and mentions.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Questions for reframing\u003c/h3>\u003cul>\u003cli>\u003cstrong>Who?\u003c/strong> Who is included, and who is overlooked?\u003c/li>\u003cli>\u003cstrong>Why?\u003c/strong> Why is this a problem?\u003c/li>\u003cli>\u003cstrong>When / where?\u003c/strong> Under which conditions does it arise?\u003c/li>\u003cli>\u003cstrong>What if?\u003c/strong> What if the central assumption is wrong?\u003c/li>\u003cli>\u003cstrong>From whose perspective?\u003c/strong> Who might interpret it differently?\u003c/li>\u003c/ul>\u003cp class=\"recall\">Change the frame → change the solution space. A promising frame still needs evidence.\u003c/p>"}, "de": {"title": "Framing und Reframing", "content": "\u003cp>Ein \u003cstrong>Frame\u003c/strong> ist ein Blickwinkel, der eine Situation als Designproblem strukturiert. Er beeinflusst berücksichtigte Menschen, Relevanz, Ursachenannahmen, Prioritäten und Möglichkeiten. \u003cstrong>Reframing\u003c/strong> verändert diesen Blick durch Hinterfragen von Annahmen.\u003c/p>\u003ch3>327 ungelesene Nachrichten nach dem Urlaub\u003c/h3>\u003cul>\u003cli>\u003cstrong>Menge:\u003c/strong> Zu viel zu lesen → Zusammenfassung.\u003c/li>\u003cli>\u003cstrong>Relevanz:\u003c/strong> Wichtiges schwer erkennbar → personalisierte Highlights.\u003c/li>\u003cli>\u003cstrong>Struktur:\u003c/strong> Entscheidungen und Smalltalk im selben Verlauf → Themen, Threads und sichtbare Entscheidungen.\u003c/li>\u003cli>\u003cstrong>Teilhabe:\u003c/strong> Wiedereinstieg schwierig → Catch-me-up mit Kontext und Schlüsselereignissen.\u003c/li>\u003c/ul>\u003ch3>Fragen\u003c/h3>\u003cp>Wer wird betrachtet oder übersehen? Warum ist es ein Problem? Wann und wo entsteht es? Was wäre, wenn die zentrale Annahme falsch ist? Aus wessen Sicht sieht es anders aus?\u003c/p>\u003cp class='recall'>Anderer Frame → anderer Lösungsraum. Auch ein vielversprechender Frame braucht Evidenz.\u003c/p>"}, "comparisons": [{"slides": "10–14", "de": {"title": "Framing vs. Reframing", "columns": [["Framing", "Die Situation aus einem bestimmten Blickwinkel strukturieren."], ["Reframing", "Blickwinkel und Annahmen hinterfragen und verändern."]], "tradeoff": "Framing fokussiert, kann aber Betroffene oder Ursachen übersehen. Reframing öffnet Alternativen und braucht Evidenz sowie spätere Fokussierung.", "question": "Rahme „zu viele Nachrichten“ neu und erkläre den veränderten Lösungsraum.", "answer": "Relevanz, Struktur oder Wiedereinstieg statt Menge betrachten. Dadurch erscheinen Highlights, Threads oder Catch-me-up plausibel. Evidenz für die neue Deutung nennen."}, "en": {"title": "Framing vs. reframing", "columns": [["Framing", "Structure the situation through a selected perspective."], ["Reframing", "Question and change the perspective and its assumptions."]], "tradeoff": "A frame enables focus but can overlook people or causes. Reframing opens alternatives; it still needs evidence and eventual focus.", "question": "Reframe “too many messages” and explain the changed solution space.", "answer": "Treat it as relevance, structure or social reintegration rather than volume. Highlights, threads or catch-me-up may then become plausible. Explain what evidence would support the new interpretation."}}], "exam": {"de": {"prompt": "Rahme das Problem ungelesener Nachrichten auf drei Arten neu.", "answer": "Menge, Relevanz, Struktur oder soziale Teilhabe wählen. Jeweils Verständnis und passende Maßnahme erläutern. Annahmen und benötigte Evidenz benennen.", "points": [["Menge", "Zu viel zu lesen → Zusammenfassung."], ["Relevanz", "Wichtiges schwer erkennbar → personalisierte Highlights."], ["Struktur", "Entscheidungen und Smalltalk im selben Verlauf → Themen, Threads und sichtbare Entscheidungen."], ["Teilhabe", "Wiedereinstieg schwierig → Catch-me-up mit Kontext und Schlüsselereignissen."]], "lists": [{"title": "Vier Frames für ungelesene Nachrichten", "items": ["Menge", "Relevanz", "Struktur", "Teilhabe"]}]}, "en": {"prompt": "Reframe the unread-group-chat problem in three ways.", "answer": "Choose volume, relevance, structure or social participation. For each, explain the problem interpretation and a fitting intervention. Make assumptions explicit and describe evidence needed.", "points": [["Who?", "Who is included, and who is overlooked?"], ["Why?", "Why is this a problem?"], ["When / where?", "Under which conditions does it arise?"], ["What if?", "What if the central assumption is wrong?"]], "lists": [{"title": "Four frames for unread messages", "items": ["Volume", "Relevance", "Structure", "Participation"]}]}}}, {"id": "wicked", "lecture": 4, "slides": "15–21", "en": {"title": "Wicked problems: ten characteristics", "content": "\u003cp>\u003cstrong>Wicked problems\u003c/strong> are complex societal planning problems without a definitive formulation, an objectively correct solution path or a clear final state. Understanding the problem and developing interventions affect each other.\u003c/p>\u003col>\u003cli>\u003cstrong>No definitive formulation:\u003c/strong> the problem cannot be specified once and for all.\u003c/li>\u003cli>\u003cstrong>No stopping rule:\u003c/strong> no objective criterion says the work is finished.\u003c/li>\u003cli>\u003cstrong>Good/bad rather than true/false:\u003c/strong> stakeholders judge quality differently.\u003c/li>\u003cli>\u003cstrong>No immediate or ultimate test:\u003c/strong> consequences unfold over time.\u003c/li>\u003cli>\u003cstrong>One-shot operations:\u003c/strong> interventions have real consequences and cannot be tried without effects.\u003c/li>\u003cli>\u003cstrong>No enumerable solution set:\u003c/strong> all possible solutions cannot be listed exhaustively.\u003c/li>\u003cli>\u003cstrong>Essential uniqueness:\u003c/strong> relevant contextual differences matter.\u003c/li>\u003cli>\u003cstrong>May be a symptom of another problem:\u003c/strong> problems are interconnected.\u003c/li>\u003cli>\u003cstrong>Many explanations:\u003c/strong> different explanations suggest different interventions.\u003c/li>\u003cli>\u003cstrong>The planner has no right to be wrong:\u003c/strong> responsibility matters because errors affect real people.\u003c/li>\u003c/ol>\u003cp>Not every design problem is wicked. A clearly specified technical task may be well-defined; a wider sociotechnical or societal situation may involve conflicting interests and uncertainty.\u003c/p>\u003cp class=\"recall\">A design process provides orientation, a thinking structure, decision support and a shared language. It is not a recipe or a guarantee of innovation, good outcomes or human-centeredness.\u003c/p>\u003cp class=\"small\">Source note: the definition slide cites 1973; the following slides print 1937. This appears to be a date reversal. The reviewer uses “Rittel &amp; Webber” without testing the inconsistent date.\u003c/p>"}, "de": {"title": "Wicked Problems: zehn Merkmale", "content": "\u003cp>Komplexe gesellschaftliche Planungsprobleme ohne endgültige Formulierung, objektiv richtigen Lösungsweg oder klaren Endzustand. Problemverständnis und Intervention beeinflussen sich.\u003c/p>\u003col>\u003cli>Keine endgültige Formulierung.\u003c/li>\u003cli>Keine objektive Stoppregel.\u003c/li>\u003cli>Lösungen werden als gut/schlecht statt wahr/falsch beurteilt.\u003c/li>\u003cli>Kein unmittelbarer oder endgültiger Test.\u003c/li>\u003cli>Jeder Eingriff hat reale, nicht folgenlos rücksetzbare Konsequenzen.\u003c/li>\u003cli>Keine vollständig aufzählbare Lösungsmenge.\u003c/li>\u003cli>Wesentliche Einzigartigkeit des Kontexts.\u003c/li>\u003cli>Ein Problem kann Symptom eines übergeordneten sein.\u003c/li>\u003cli>Mehrere Erklärungen eröffnen andere Maßnahmen.\u003c/li>\u003cli>Planende tragen Verantwortung für reale Folgen von Fehlern.\u003c/li>\u003c/ol>\u003cp>Nicht jede Designaufgabe ist wicked. Eine klar spezifizierte technische Aufgabe unterscheidet sich von gesellschaftlichen Situationen mit widersprüchlichen Interessen.\u003c/p>\u003cp class='recall'>Prozesse geben Orientierung, Denkstruktur, Entscheidungshilfe und gemeinsame Sprache. Sie sind keine Garantie für gute Lösungen, Innovation oder Menschenzentrierung.\u003c/p>\u003cp class='small'>Quellenhinweis: Die Definitionsfolie nennt 1973, Folgefolien 1937. Die Datumsumkehr wird nicht als Quizfakt verwendet; gemeint sind Rittel &amp; Webber.\u003c/p>"}, "comparisons": [{"slides": "16–19", "de": {"title": "Klar definierte vs. Wicked Problems", "columns": [["Klar definiert", "Relativ klare Ziele, Bedingungen und Erfolgstests."], ["Wicked", "Veränderliches Verständnis, unterschiedliche Bewertungen, vernetzte Folgen und kein endgültiger Test/Abschluss."]], "tradeoff": "Schwierig ist nicht automatisch wicked. Auch klar definierte Aufgaben können weitere Folgen haben.", "question": "Vergleiche Dateiumbenennung und ein gesellschaftliches Planungsproblem.", "answer": "500 Dateien können klare Namensregeln und Tests haben. Gesellschaftliche Eingriffe betreffen verschiedene Werte, Kontexte und Langzeitfolgen. Kriterien erklären statt jede schwere Aufgabe wicked nennen."}, "en": {"title": "Well-defined vs. wicked problems", "columns": [["Well-defined", "Relatively clear goal, constraints and tests for success."], ["Wicked", "Evolving formulation, competing judgments, linked consequences and no definitive stopping rule/test."]], "tradeoff": "Difficult does not automatically mean wicked. Wider consequences can matter even for a well-specified task.", "question": "Contrast a specified file-renaming task with a societal planning problem.", "answer": "Renaming 500 files can have explicit naming rules and tests. A societal intervention involves differing values, contexts and long-term effects. Explain the criteria rather than label every hard task wicked."}}, {"slides": "20–21", "de": {"title": "Designprozess vs. Rezept", "columns": [["Prozess", "Orientierung, gemeinsame Sprache, Denkstruktur und Entscheidungshilfe."], ["Rezeptannahme", "Feste Abfolge mit garantiert gutem Ergebnis."]], "tradeoff": "Ein Prozess hilft mit Unsicherheit, ist aber nicht automatisch innovativ oder menschenzentriert. Forschung und Urteilsvermögen bleiben nötig.", "question": "Warum garantiert das Befolgen eines Diagramms kein gutes Design?", "answer": "Schritte können oberflächlich oder mit falschen Annahmen erledigt werden. Evidenz und Folgen prüfen und nötige Phasen wiederholen. Methoden strukturieren, ersetzen aber keine Entscheidungen."}, "en": {"title": "Design process vs. recipe", "columns": [["Process", "Orientation, shared language, thinking structure and decision support."], ["Recipe assumption", "A fixed sequence that guarantees a good result."]], "tradeoff": "A process helps manage uncertainty; it is not automatically innovative or human-centered. Judgment, research and iteration remain necessary.", "question": "Why does following a process diagram not guarantee good design?", "answer": "Activities can be completed superficially or based on false assumptions. Evaluate evidence and consequences and return to relevant phases. A method structures work rather than substitutes for thoughtful decisions."}}], "exam": {"de": {"prompt": "Warum ist ein Wicked Problem mehr als eine schwierige Technikaufgabe?", "answer": "Unklare Formulierung, widersprüchliche Werte, kein endgültiger Test oder Abschluss, Einzigartigkeit und Folgen erläutern. Gesellschaftliches Beispiel einer klar spezifizierten Aufgabe gegenüberstellen.", "points": [["Warum ist ein Wicked Problem mehr als eine schwierige Technikaufgabe?", "Unklare Formulierung, widersprüchliche Werte, kein endgültiger Test oder Abschluss, Einzigartigkeit und Folgen erläutern. Gesellschaftliches Beispiel einer klar spezifizierten Aufgabe gegenüberstellen."]], "lists": [{"title": "Zehn Merkmale von Wicked Problems", "items": ["Keine endgültige Formulierung", "Keine objektive Stoppregel", "Gut oder schlecht statt wahr oder falsch", "Kein unmittelbarer oder endgültiger Test", "Eingriffe mit realen Folgen", "Keine vollständig aufzählbaren Lösungen", "Kontext wesentlich einzigartig", "Mögliches Symptom eines anderen Problems", "Mehrere Erklärungen", "Verantwortung für Folgen"]}]}, "en": {"prompt": "Explain why a wicked problem is not just a difficult technical task.", "answer": "Discuss uncertain formulation, conflicting values, no final test or stopping rule, uniqueness and consequences. Use a societal planning example and contrast with a well-specified technical task.", "points": [["No definitive formulation", "the problem cannot be specified once and for all."], ["No stopping rule", "no objective criterion says the work is finished."], ["Good/bad rather than true/false", "stakeholders judge quality differently."], ["No immediate or ultimate test", "consequences unfold over time."]], "lists": [{"title": "Ten characteristics of wicked problems", "items": ["No definitive formulation", "No objective stopping rule", "Good or bad instead of true or false", "No immediate or final test", "Interventions with real consequences", "No enumerable set of solutions", "Essentially unique context", "Possible symptom of another problem", "Multiple explanations", "Responsibility for consequences"]}]}}}, {"id": "double-diamond", "lecture": 4, "slides": "22–25", "en": {"title": "Divergence, convergence and Double Diamond", "content": "\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Diverge\u003c/h3>\u003cp>Open possibilities: explore alternatives, broaden perspectives, question assumptions and notice differences.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Converge\u003c/h3>\u003cp>Focus possibilities: compare, evaluate, prioritize, select and decide.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Repeat\u003c/h3>\u003cp>Both movements recur. Evidence may require a return to earlier work.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Space / movement\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Discover\u003c/td>\u003ctd>Problem space · diverge\u003c/td>\u003ctd>Investigate people, context, needs and assumptions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Define\u003c/td>\u003ctd>Problem space · converge\u003c/td>\u003ctd>Synthesize evidence and frame the specific problem.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Develop\u003c/td>\u003ctd>Solution space · diverge\u003c/td>\u003ctd>Explore possible ideas and approaches.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deliver\u003c/td>\u003ctd>Solution space · converge\u003c/td>\u003ctd>Prototype, evaluate and refine a suitable direction.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Four principles:\u003c/strong> put people first; communicate visually and inclusively; collaborate and co-create; iterate, iterate, iterate.\u003c/p>\u003cp class=\"recall\">Problem space: “Are we doing the right thing?” Solution space: “Are we doing things right?” These are connected, iterative questions.\u003c/p>"}, "de": {"title": "Divergenz, Konvergenz und Double Diamond", "content": "\u003cul>\u003cli>\u003cstrong>Divergieren:\u003c/strong> Möglichkeiten öffnen, Alternativen suchen, Perspektiven erweitern, Annahmen hinterfragen.\u003c/li>\u003cli>\u003cstrong>Konvergieren:\u003c/strong> Vergleichen, bewerten, priorisieren, auswählen und entscheiden.\u003c/li>\u003cli>\u003cstrong>Wiederholen:\u003c/strong> Evidenz kann Rücksprünge erfordern.\u003c/li>\u003c/ul>\u003col>\u003cli>\u003cstrong>Discover:\u003c/strong> Problemraum öffnen; Menschen, Kontext, Bedürfnisse und Annahmen untersuchen.\u003c/li>\u003cli>\u003cstrong>Define:\u003c/strong> Problemraum fokussieren; Erkenntnisse zusammenführen und Problem bestimmen.\u003c/li>\u003cli>\u003cstrong>Develop:\u003c/strong> Lösungsraum öffnen; Alternativen entwickeln.\u003c/li>\u003cli>\u003cstrong>Deliver:\u003c/strong> Lösungsraum fokussieren; Prototypen prüfen und verbessern.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Vier Prinzipien:\u003c/strong> Menschen zuerst; visuell und inklusiv kommunizieren; zusammenarbeiten und gemeinsam gestalten; iterieren.\u003c/p>\u003cp class='recall'>Problemraum: das Richtige tun. Lösungsraum: Dinge richtig tun. Beide bleiben verbunden und iterativ.\u003c/p>"}, "comparisons": [{"slides": "22–24", "de": {"title": "Divergenz vs. Konvergenz", "columns": [["Divergenz", "Öffnen: Alternativen, Perspektiven und Annahmen erkunden."], ["Konvergenz", "Fokussieren: vergleichen, bewerten, priorisieren und auswählen."]], "tradeoff": "Nur Divergenz lässt Entscheidungen offen; vorschnelle Konvergenz fixiert eine schwache Richtung. Mit Evidenz und Kriterien wechseln.", "question": "Erkläre beide Bewegungen mit Beispiel und Risiko einseitiger Anwendung.", "answer": "Brainstorming öffnet, eine Impact-Effort-Diskussion fokussiert. Beides in Problem- und Lösungsraum wiederholen. Frühe Auswahl kann bessere Frames oder Konzepte verdecken."}, "en": {"title": "Divergence vs. convergence", "columns": [["Divergence", "Open possibilities: explore alternatives, perspectives and assumptions."], ["Convergence", "Focus possibilities: compare, evaluate, prioritize and select."]], "tradeoff": "Only divergence may leave no decision; premature convergence can lock a weak direction. Alternate them with evidence and criteria.", "question": "Explain both movements, with an example and a risk of using only one.", "answer": "Brainstorming opens alternatives; an impact–effort discussion focuses them. Repeat opening and focusing in problem and solution space. Explain why selecting too early can hide a better frame or concept."}}], "exam": {"de": {"prompt": "Beschreibe alle Double-Diamond-Phasen mit Methoden.", "answer": "Discover: Forschung/Annahmen. Define: Synthese, Personas, JTBD und Framing. Develop: Ideen/Konzepte. Deliver: Prototypen, Evaluation, Verbesserung. Öffnen, Fokussieren und Rücksprünge zeigen.", "points": [["Divergieren", "Möglichkeiten öffnen, Alternativen suchen, Perspektiven erweitern, Annahmen hinterfragen."], ["Konvergieren", "Vergleichen, bewerten, priorisieren, auswählen und entscheiden."], ["Wiederholen", "Evidenz kann Rücksprünge erfordern."], ["Discover", "Problemraum öffnen; Menschen, Kontext, Bedürfnisse und Annahmen untersuchen."]], "lists": [{"title": "Vier Phasen des Double Diamond", "items": ["Discover", "Define", "Develop", "Deliver"]}]}, "en": {"prompt": "Describe all four Double Diamond phases with methods.", "answer": "Discover: research and assumptions. Define: synthesize, personas/JTBD/problem framing. Develop: explore ideas and concepts. Deliver: prototype, evaluate and refine. Show divergence and convergence, and explain iterative return.", "points": [["Four principles", "put people first; communicate visually and inclusively; collaborate and co-create; iterate, iterate, iterate."]], "lists": [{"title": "Four Double Diamond phases", "items": ["Discover", "Define", "Develop", "Deliver"]}]}}}, {"id": "discover-methods", "lecture": 4, "slides": "26–30", "en": {"title": "Discover: research and assumption tools", "content": "\u003cp>Ask who is affected, what actually happens, in which context, which needs and goals exist, what causes might matter, and which assumptions remain uncertain.\u003c/p>\u003cul>\u003cli>\u003cstrong>Stakeholder map:\u003c/strong> identify relevant people and groups; the slide shows concentric levels of relevance around a core.\u003c/li>\u003cli>\u003cstrong>Interviews and observation:\u003c/strong> investigate real experiences, behavior and context. Also consider competitor analysis.\u003c/li>\u003cli>\u003cstrong>Extended Product Vision Board:\u003c/strong> vision, target group, needs, product, business goals, competitors, revenue streams, cost factors and channels.\u003c/li>\u003cli>\u003cstrong>Mission statement:\u003c/strong> purpose; who; what; standouts/USP; beliefs and aspirations.\u003c/li>\u003c/ul>\u003ch3>The assumption matrix shown in this lecture\u003c/h3>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Column\u003c/th>\u003cth>Prompt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Attractiveness\u003c/td>\u003ctd>Customers find product X attractive because…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Usefulness / use in practice — Brauchbarkeit\u003c/td>\u003ctd>Customers use product X regularly because…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Feasibility — Realisierbarkeit\u003c/td>\u003ctd>We can implement product X because…\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Write assumptions explicitly and investigate them. This specific template has three columns; it is not the same as an impact–effort matrix.\u003c/p>\u003cp class=\"recall\">Research distinguishes evidence from assumptions before a team commits to a solution.\u003c/p>"}, "de": {"title": "Discover: Forschung und Annahmen", "content": "\u003cp>Frage nach Betroffenen, tatsächlichen Abläufen, Kontext, Bedürfnissen, Zielen, Ursachen und ungeprüften Annahmen.\u003c/p>\u003cul>\u003cli>\u003cstrong>Stakeholdermap:\u003c/strong> Menschen und Gruppen nach Relevanz um einen Kern darstellen.\u003c/li>\u003cli>\u003cstrong>Interviews und Beobachtung:\u003c/strong> Erfahrungen und Verhalten im Kontext untersuchen; auch Konkurrenz analysieren.\u003c/li>\u003cli>\u003cstrong>Extended Product Vision Board:\u003c/strong> Vision, Zielgruppe, Bedürfnisse, Produkt, Unternehmensziele, Konkurrenz, Einnahmequellen, Kostenfaktoren und Kanäle.\u003c/li>\u003cli>\u003cstrong>Mission Statement:\u003c/strong> Purpose, Who, What, Standouts/USP, Beliefs and Aspirations.\u003c/li>\u003c/ul>\u003ch3>Annahmenmatrix dieser Vorlesung\u003c/h3>\u003cul>\u003cli>\u003cstrong>Attraktivität:\u003c/strong> Für Kunden ist Produkt X attraktiv, weil …\u003c/li>\u003cli>\u003cstrong>Brauchbarkeit:\u003c/strong> Kunden nutzen Produkt X regelmäßig, weil …\u003c/li>\u003cli>\u003cstrong>Realisierbarkeit:\u003c/strong> Wir können Produkt X umsetzen, weil …\u003c/li>\u003c/ul>\u003cp>Diese dreispaltige Vorlage ist keine Impact-Effort-Matrix. Annahmen ausdrücklich formulieren und prüfen.\u003c/p>\u003cp class='recall'>Forschung unterscheidet Evidenz und Annahmen vor der Festlegung einer Lösung.\u003c/p>"}, "comparisons": [], "exam": {"de": {"prompt": "Vergleiche Annahmenmatrix und Impact-Effort-Matrix.", "answer": "Annahmen: Attraktivität, regelmäßiger Gebrauch/Brauchbarkeit und Realisierbarkeit; Überzeugungen prüfen. Impact/Effort: Wirkung und Aufwand schätzen und Optionen priorisieren. Unterschiedliche Fragen und Werkzeuge.", "points": [["Stakeholdermap", "Menschen und Gruppen nach Relevanz um einen Kern darstellen."], ["Interviews und Beobachtung", "Erfahrungen und Verhalten im Kontext untersuchen; auch Konkurrenz analysieren."], ["Extended Product Vision Board", "Vision, Zielgruppe, Bedürfnisse, Produkt, Unternehmensziele, Konkurrenz, Einnahmequellen, Kostenfaktoren und Kanäle."], ["Mission Statement", "Purpose, Who, What, Standouts/USP, Beliefs and Aspirations."]], "lists": [{"title": "Annahmenmatrix", "items": ["Attraktivität", "Brauchbarkeit", "Realisierbarkeit"]}, {"title": "Extended Product Vision Board", "items": ["Vision", "Zielgruppe", "Bedürfnisse", "Produkt", "Unternehmensziele", "Konkurrenz", "Einnahmequellen", "Kostenfaktoren", "Kanäle"]}]}, "en": {"prompt": "Compare the lecture’s assumption matrix and impact–effort matrix.", "answer": "Assumption matrix: attractiveness, use in practice and feasibility; make beliefs explicit. Impact–effort: high/low expected impact and effort; prioritize options. Different tools, different questions.", "points": [["Stakeholder map", "identify relevant people and groups; the slide shows concentric levels of relevance around a core."], ["Interviews and observation", "investigate real experiences, behavior and context. Also consider competitor analysis."], ["Extended Product Vision Board", "vision, target group, needs, product, business goals, competitors, revenue streams, cost factors and channels."], ["Mission statement", "purpose; who; what; standouts/USP; beliefs and aspirations."]], "lists": [{"title": "Assumption matrix", "items": ["Desirability", "Usability", "Feasibility"]}, {"title": "Extended Product Vision Board", "items": ["Vision", "Target group", "Needs", "Product", "Business goals", "Competitors", "Revenue streams", "Cost factors", "Channels"]}]}}}, {"id": "define-methods", "lecture": 4, "slides": "31–33", "en": {"title": "Define: personas, JTBD and How Might We", "content": "\u003ch3>Personas\u003c/h3>\u003cp>Research-based representations of possible user groups: goals, needs, motivations, frustrations and context. The lecture emphasizes that personas must be data-oriented, not invented stereotypes.\u003c/p>\u003ch3>Jobs to Be Done\u003c/h3>\u003cp>Focus on why people use a product and the progress or outcome they seek.\u003c/p>\u003cp class=\"recall\">When [situation], I want to [action / progress], so I can [desired outcome].\u003c/p>\u003cp>\u003cstrong>Practice example:\u003c/strong> When my class room changes shortly before a lesson, I want to notice the update in time, so I can arrive at the right place without stress.\u003c/p>\u003ch3>How Might We\u003c/h3>\u003cp>Turn insights about users and needs into an open design question. It should guide exploration without predetermining one feature.\u003c/p>\u003cp>\u003cstrong>Practice example:\u003c/strong> How might we help students notice relevant schedule changes before they travel?\u003c/p>\u003cp>Compare a solution-locked question: “How might we add a push-notification button?” The wording already selects an intervention.\u003c/p>\u003cp class=\"recall\">Persona: who and context. JTBD: desired progress. HMW: a generative design challenge.\u003c/p>"}, "de": {"title": "Define: Personas, JTBD und How Might We", "content": "\u003ch3>Personas\u003c/h3>\u003cp>Datenbasierte Repräsentationen möglicher Nutzergruppen mit Zielen, Bedürfnissen, Motivation, Frustrationen und Kontext. Keine erfundenen Stereotype.\u003c/p>\u003ch3>Jobs to Be Done\u003c/h3>\u003cp>Warum wird ein Produkt genutzt, welcher Fortschritt soll erreicht werden?\u003c/p>\u003cp class='recall'>Wenn [Situation], möchte ich [Handlung/Fortschritt], damit ich [gewünschtes Ergebnis].\u003c/p>\u003cp>\u003cstrong>Übungsbeispiel:\u003c/strong> Wenn sich kurz vor der Lehrveranstaltung der Raum ändert, möchte ich dies rechtzeitig bemerken, damit ich ohne Stress am richtigen Ort ankomme.\u003c/p>\u003ch3>How Might We\u003c/h3>\u003cp>Aus Erkenntnissen eine offene Gestaltungsfrage entwickeln, ohne eine Funktion vorzugeben.\u003c/p>\u003cp>Offen: Wie könnten wir Studierende vor der Anreise auf relevante Planänderungen aufmerksam machen? Zu eng: Wie könnten wir einen Push-Button ergänzen?\u003c/p>\u003cp class='recall'>Persona: Wer und welcher Kontext? JTBD: Welcher Fortschritt? HMW: Welche offene Gestaltungsaufgabe?\u003c/p>"}, "comparisons": [], "exam": {"de": {"prompt": "Schreibe ein JTBD-Statement und eine offene HMW-Frage.", "answer": "Situation, gewünschte Handlung und Ergebnis verbinden. Raumänderung rechtzeitig bemerken, um richtig anzukommen. HMW: Wie helfen wir, relevante Änderungen rechtzeitig wahrzunehmen? Keine Funktion vorgeben.", "points": [["Übungsbeispiel", "Wenn sich kurz vor der Lehrveranstaltung der Raum ändert, möchte ich dies rechtzeitig bemerken, damit ich ohne Stress am richtigen Ort ankomme."]], "lists": [{"title": "Methoden in Define", "items": ["Persona", "Jobs to Be Done", "How Might We"]}]}, "en": {"prompt": "Write a JTBD statement and an open HMW question.", "answer": "Include context, desired action/progress and outcome. Example: When a room changes shortly before class, I want to notice the change, so I can arrive correctly. HMW: How might we help students notice relevant changes in time? Avoid locking the question to one feature.", "points": [["Practice example", "When my class room changes shortly before a lesson, I want to notice the update in time, so I can arrive at the right place without stress."], ["Practice example", "How might we help students notice relevant schedule changes before they travel?"]], "lists": [{"title": "Methods in Define", "items": ["Persona", "Jobs to Be Done", "How Might We"]}]}}}, {"id": "develop-deliver", "lecture": 4, "slides": "34–37", "en": {"title": "Develop and Deliver: journeys, priorities and prototypes", "content": "\u003ch3>Impact–effort matrix\u003c/h3>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Low effort\u003c/th>\u003cth>High effort\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>High impact\u003c/td>\u003ctd>Quick wins\u003c/td>\u003ctd>Strategic projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Low impact\u003c/td>\u003ctd>Nice to have\u003c/td>\u003ctd>Efficiency killers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The matrix compares expected value and effort. These are estimates to discuss, not objective guarantees. Although the lecture places it under Develop, prioritizing options is a convergent activity within broader iterative work.\u003c/p>\u003ch3>User / customer journey\u003c/h3>\u003cp>Map what happens before, during and after use for a specific user, scenario and goals. Include actions, touchpoints, thoughts, feelings, difficulties and opportunities. The lecture includes a car-shopping journey and recommends defining two or three goals and developing journey and empathy maps.\u003c/p>\u003ch3>Prototyping\u003c/h3>\u003cp>Low-, mid- and high-fidelity prototypes make ideas tangible at different levels of detail. Match fidelity to what you need to learn. Ask: Where am I? What can I do? How do I move forward?\u003c/p>\u003ch3>Usability evaluation\u003c/h3>\u003cp>Investigate major problems, navigation understanding and task completion, including speed and ease. Decide what works for the target group, what is feasible, what risks exist and what to refine.\u003c/p>\u003cdetails>\u003csummary>Study carefully: “5 users → 85%”\u003c/summary>\u003cp>Slide 37 gives this as a usability-testing heuristic. It does not guarantee that five people find 85% of problems in every product or user group. Do not treat a prototype as identical to a released minimum viable product.\u003c/p>\u003c/details>"}, "de": {"title": "Develop und Deliver: Journeys, Prioritäten und Prototypen", "content": "\u003ch3>Impact-Effort-Matrix\u003c/h3>\u003cul>\u003cli>Hohe Wirkung, geringer Aufwand: Quick Wins.\u003c/li>\u003cli>Hohe Wirkung, hoher Aufwand: strategische Projekte.\u003c/li>\u003cli>Geringe Wirkung, geringer Aufwand: Nice to Have.\u003c/li>\u003cli>Geringe Wirkung, hoher Aufwand: Effizienz-Killer.\u003c/li>\u003c/ul>\u003cp>Wirkung und Aufwand sind zu begründende Schätzungen. Priorisieren ist konvergent, auch wenn die Methode innerhalb von Develop eingesetzt wird.\u003c/p>\u003ch3>User/Customer Journey\u003c/h3>\u003cp>Vor, während und nach Nutzung für eine Person, ein Szenario und Ziele: Handlungen, Kontaktpunkte, Gedanken, Gefühle, Probleme und Möglichkeiten. Die Vorlesung zeigt Autokauf und empfiehlt zwei bis drei Ziele sowie Journey- und Empathy-Maps.\u003c/p>\u003ch3>Prototyping\u003c/h3>\u003cp>Low-, Mid- und High-Fidelity machen Ideen unterschiedlich detailliert greifbar. Der Grad muss zur Lernfrage passen. Wo bin ich? Was kann ich tun? Wie komme ich weiter?\u003c/p>\u003ch3>Evaluation\u003c/h3>\u003cp>Hauptprobleme, Navigationsverständnis und Aufgabenerledigung einschließlich Geschwindigkeit und Einfachheit prüfen. Was funktioniert für die Zielgruppe? Was ist machbar? Welche Risiken bleiben?\u003c/p>\u003cdetails>\u003csummary>„5 Nutzer → 85 %“ sorgfältig einordnen\u003c/summary>\u003cp>Folie 37 nennt diese Faustregel. Sie garantiert nicht für jedes Produkt oder jede Zielgruppe 85 % Problemerkennung. Ein Prototyp ist außerdem nicht automatisch ein veröffentlichtes MVP.\u003c/p>\u003c/details>"}, "comparisons": [{"slides": "30; 34", "de": {"title": "Annahmenmatrix vs. Impact-Effort-Matrix", "columns": [["Annahmenmatrix", "Attraktivität, Brauchbarkeit und Realisierbarkeit: Welche Überzeugungen sind zu prüfen?"], ["Impact-Effort-Matrix", "Erwartete Wirkung gegenüber Aufwand: Welche Optionen priorisieren?"]], "tradeoff": "Forschungsannahmen und Priorisierungsschätzungen sind verschieden. Beide brauchen Begründung und Revision.", "question": "Vergleiche Zweck, Spalten/Achsen und Beispiele beider Matrizen.", "answer": "In die Annahmenvorlage kommen Gründe für Anziehung, regelmäßige Nutzung und Umsetzung. Optionen nach Wirkung/Aufwand in Quick Wins, strategische Projekte, Nice to Have und Effizienz-Killer ordnen. Vorlagen nicht austauschen."}, "en": {"title": "Assumption matrix vs. impact–effort matrix", "columns": [["Assumption matrix", "Attractiveness, regular use/Brauchbarkeit and feasibility: what do we believe and need to test?"], ["Impact–effort matrix", "Expected impact versus effort: how should options be prioritized?"]], "tradeoff": "Research beliefs are not the same as prioritization estimates. Both need justification and revision; neither makes uncertainty disappear.", "question": "Compare purpose, axes/columns and examples of both matrices.", "answer": "Write why customers would want/use a product and why it is realizable in the assumption template. For options, use quick wins, strategic projects, nice to have and efficiency killers by impact/effort. Avoid substituting one template for the other."}}, {"slides": "37; 44–45", "de": {"title": "Low vs. High Fidelity; Prototyp vs. MVP", "columns": [["Low Fidelity", "Wenig detaillierte Darstellung zur schnellen Erkundung von Ideen und Fragen."], ["Höhere Fidelity", "Realistischere Darstellung für bestimmte Interaktionsfragen."], ["Prototyp vs. MVP", "Eine testbare Repräsentation ist nicht automatisch ein minimal nutzbares veröffentlichtes Produkt."]], "tradeoff": "Wenig Detail spart Aufwand, beantwortet aber nicht jede realitätsabhängige Frage. Mehr Detail kostet und kann von ungeklärten Annahmen ablenken.", "question": "Diskutiere Fidelity-Zielkonflikte und unterscheide einen ausgearbeiteten Prototyp vom MVP.", "answer": "Fidelity nach Lernziel wählen: früh Struktur skizzieren, bei Bedarf realistische Interaktion ergänzen. Visuelle Qualität und Interaktivität beweisen weder vollständigen Betrieb noch Nutzen. Erkundung und tatsächlich nutzbares Produkt trennen."}, "en": {"title": "Low vs. high fidelity; prototype vs. MVP", "columns": [["Low fidelity", "Low-detail representation to explore ideas and questions quickly."], ["Higher fidelity", "More detailed/realistic representation for particular interaction questions."], ["Prototype vs. MVP", "A testable representation is not automatically a minimally usable released product."]], "tradeoff": "Low detail saves effort but cannot answer every realism-dependent question. Higher detail can support specific testing but costs more and can distract from unresolved assumptions.", "question": "Discuss fidelity trade-offs and explain why a polished prototype is not automatically an MVP.", "answer": "Choose fidelity by learning goal: sketch structure early; add realistic interaction when needed. Neither visual polish nor interactivity proves complete operation or value. Distinguish exploration from a product people can actually use."}}], "exam": {"de": {"prompt": "Plane Prototyp und Evaluation.", "answer": "Lernfrage, passende Fidelity, relevante Personen und realistische Aufgaben festlegen. Orientierung, Zielerreichung und Feedback beobachten; Grenzen benennen und verbessern. Fünf Personen sind keine universelle Garantie; Prototyp ist nicht automatisch MVP.", "points": [["Plane Prototyp und Evaluation.", "Lernfrage, passende Fidelity, relevante Personen und realistische Aufgaben festlegen. Orientierung, Zielerreichung und Feedback beobachten; Grenzen benennen und verbessern. Fünf Personen sind keine universelle Garantie; Prototyp ist nicht automatisch MVP."]], "lists": [{"title": "Impact-Effort-Matrix", "items": ["Quick Wins", "Strategische Projekte", "Nice to Have", "Effizienz-Killer"]}, {"title": "Prototyp-Stufen", "items": ["Low Fidelity", "Mid Fidelity", "High Fidelity"]}]}, "en": {"prompt": "Plan a prototype and evaluation.", "answer": "State a learning question, select suitable fidelity, recruit relevant users and give realistic tasks. Observe navigation and task completion, collect feedback, identify limitations and iterate. Five users is not a universal guarantee; a prototype is not automatically a released MVP.", "points": [["Plan a prototype and evaluation.", "State a learning question, select suitable fidelity, recruit relevant users and give realistic tasks. Observe navigation and task completion, collect feedback, identify limitations and iterate. Five users is not a universal guarantee; a prototype is not automatically a released MVP."]], "lists": [{"title": "Impact–effort matrix", "items": ["Quick wins", "Strategic projects", "Nice to have", "Efficiency killers"]}, {"title": "Prototype fidelity levels", "items": ["Low fidelity", "Mid fidelity", "High fidelity"]}]}}}, {"id": "design-thinking", "lecture": 4, "slides": "38–46", "en": {"title": "Design Thinking and the frameworks", "content": "\u003cp>Design Thinking combines a human-centered, interdisciplinary and iterative approach with tools such as sketches and prototypes, particularly when problems are poorly defined.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stanford d.school phase\u003c/th>\u003cth>Methods / purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Empathize\u003c/td>\u003ctd>Interviews, observations, surveys and contextual inquiry: understand people.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Define\u003c/td>\u003ctd>Synthesis, problem or point-of-view statements and How Might We.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ideate\u003c/td>\u003ctd>Brainstorming: generate diverse ideas without immediate judgment.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prototype\u003c/td>\u003ctd>Sketches, wireframes and mock-ups: make ideas testable.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Test\u003c/td>\u003ctd>Usability testing, feedback and experiments: learn and revise.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>IDEO’s three phases:\u003c/strong> Inspiration, Ideation, Implementation. The lecture’s graphic shows repeated opening and focusing of possibilities.\u003c/p>\u003cp>\u003cstrong>History as presented:\u003c/strong> Rittel and wicked problems; Simon and design as thinking; Lawson and Cross on designers’ approaches; Rowe and architectural design thinking; IDEO and mainstream adoption; the d.school and teaching/practice. The slides’ timeline is schematic, so focus on contributions rather than treating every placement as a precise historical date.\u003c/p>\u003ch3>Relationship to Double Diamond\u003c/h3>\u003cp>Both encourage research and problem definition before commitment, followed by ideation, prototyping and evaluation. They are related frameworks rather than exact one-to-one phase equivalents or rigid recipes.\u003c/p>\u003cp class=\"recall\">Understanding, framing, creating, trying and learning continue to influence one another.\u003c/p>"}, "de": {"title": "Design Thinking und die Frameworks", "content": "\u003cp>Menschenzentriertes, interdisziplinäres und iteratives Vorgehen mit Skizzen und Prototypen, besonders bei schlecht definierten Problemen.\u003c/p>\u003col>\u003cli>\u003cstrong>Empathize:\u003c/strong> Interviews, Beobachtungen, Umfragen und Contextual Inquiry.\u003c/li>\u003cli>\u003cstrong>Define:\u003c/strong> Synthese, Problem-/Point-of-View-Statement und HMW.\u003c/li>\u003cli>\u003cstrong>Ideate:\u003c/strong> Brainstorming und urteilsfreie Ideenvielfalt.\u003c/li>\u003cli>\u003cstrong>Prototype:\u003c/strong> Skizzen, Wireframes und Mock-ups.\u003c/li>\u003cli>\u003cstrong>Test:\u003c/strong> Usabilitytests, Feedback und Experimente.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>IDEO:\u003c/strong> Inspiration, Ideation, Implementation mit wiederholtem Öffnen und Fokussieren.\u003c/p>\u003cp>\u003cstrong>Geschichte laut Folien:\u003c/strong> Rittel und Wicked Problems; Simon und Design als Denken; Lawson/Cross und designerische Ansätze; Rowe und Architektur; IDEO und Verbreitung; d.school und Lehre/Praxis. Die Zeitleiste ist schematisch; Beiträge sind wichtiger als jede genaue Position.\u003c/p>\u003cp>Double Diamond und Design Thinking verbinden Forschung, Problemdefinition, Ideen, Prototypen und Evaluation. Es sind verwandte, aber nicht exakt deckungsgleiche oder starre Modelle.\u003c/p>\u003cp class='recall'>Verstehen, Framen, Entwickeln, Ausprobieren und Lernen beeinflussen sich fortlaufend.\u003c/p>"}, "comparisons": [{"slides": "23–29; 39–46", "de": {"title": "Double Diamond vs. Stanford vs. IDEO vs. HCD", "columns": [["Double Diamond", "Discover, Define, Develop, Deliver; zwei Öffnungs-/Fokussierungszyklen."], ["Stanford", "Empathize, Define, Ideate, Prototype, Test."], ["IDEO", "Inspiration, Ideation, Implementation."], ["HCD", "Menschenzentrierte Prinzipien und iterative Aktivitäten zu Kontext, Anforderungen, Lösungen und Evaluation."]], "tradeoff": "Gemeinsames Untersuchen, Machen und Lernen, aber keine identischen Stufenlisten. Methoden passend wählen und bei Evidenz zurückgehen.", "question": "Vergleiche Gemeinsamkeiten und strukturelle Unterschiede der Frameworks.", "answer": "Double Diamond betont Räume; Stanford Empathie, Synthese, Ideen, Prototyp und Test; IDEO drei übergreifende Phasen. HCD betont Prinzipien sowie Kontext-/Anforderungszyklus. Keine exakte Eins-zu-eins-Zuordnung erzwingen."}, "en": {"title": "Double Diamond vs. Stanford vs. IDEO vs. HCD", "columns": [["Double Diamond", "Discover, Define, Develop, Deliver; two cycles of opening/focusing."], ["Stanford", "Empathize, Define, Ideate, Prototype, Test."], ["IDEO", "Inspiration, Ideation, Implementation."], ["HCD", "Principles and iterative activities centered on users, context, requirements, solutions and evaluation."]], "tradeoff": "They share inquiry, making and learning but are not identical stage lists. Choose suitable methods and return as evidence requires.", "question": "Compare the frameworks and explain what they share and where their structure differs.", "answer": "Double Diamond highlights problem/solution spaces; Stanford names empathy, synthesis, ideas, prototypes and testing; IDEO groups work into three broad phases; HCD specifies human-centered principles and a context/requirements cycle. Do not force an exact one-to-one correspondence."}}], "exam": {"de": {"prompt": "Vergleiche Double Diamond, Stanford und IDEO.", "answer": "Discover–Define–Develop–Deliver; Empathize–Define–Ideate–Prototype–Test; Inspiration–Ideation–Implementation. Gemeinsame Forschung, Erkundung, Herstellung und Iteration erklären, ohne exakte Gleichsetzung.", "points": [["Empathize", "Interviews, Beobachtungen, Umfragen und Contextual Inquiry."], ["Define", "Synthese, Problem-/Point-of-View-Statement und HMW."], ["Ideate", "Brainstorming und urteilsfreie Ideenvielfalt."], ["Prototype", "Skizzen, Wireframes und Mock-ups."]], "lists": [{"title": "Stanford d.school", "items": ["Empathize", "Define", "Ideate", "Prototype", "Test"]}, {"title": "IDEO", "items": ["Inspiration", "Ideation", "Implementation"]}]}, "en": {"prompt": "Compare Double Diamond, Stanford and IDEO.", "answer": "Double Diamond: Discover, Define, Develop, Deliver. Stanford: Empathize, Define, Ideate, Prototype, Test. IDEO: Inspiration, Ideation, Implementation. Identify shared inquiry, exploration, making and iteration rather than forcing exact phase equivalence.", "points": [["IDEO’s three phases", "Inspiration, Ideation, Implementation. The lecture’s graphic shows repeated opening and focusing of possibilities."], ["History as presented", "Rittel and wicked problems; Simon and design as thinking; Lawson and Cross on designers’ approaches; Rowe and architectural design thinking; IDEO and mainstream adoption; the d.school and teaching/practice. The slides’ timeline is schematic, so focus on contributions rather than treating every placement as a precise historical date."]], "lists": [{"title": "Stanford d.school", "items": ["Empathize", "Define", "Ideate", "Prototype", "Test"]}, {"title": "IDEO", "items": ["Inspiration", "Ideation", "Implementation"]}]}}}], "slide10": null}</script>
<script>

} else {
const {createElement:h,useEffect,useRef,useState} = React;

const storeName = "progress";

  de:{title:"Probleme und Designprozesse verstehen", subtitle:"Lernskript · Vorlesung 04", contents:"Kapitel", slides:"Folien", slide:"Folie", comparisons:"Unterschiede und Zielkonflikte", mark:"Als gelesen markieren", unmark:"Als ungelesen markieren", read:"gelesen", previous:"Vorheriges Kapitel", next:"Nächstes Kapitel", loading:"Lernstand wird geladen …", unavailable:"Lokales Speichern ist in diesem Browser gerade nicht verfügbar.", source:"Quelle: Victoria Kaiselgruber, Design digitaler Produkte – Probleme und Designprozesse verstehen, WS 2026/27."},

};
const audioUi = {

  en:{read:"Read", listen:"Listen", play:"Read chapter aloud", pause:"Pause", resume:"Resume", stop:"Stop", speed:"Speed", unsupported:"This browser does not support text to speech.", error:"Playback could not start or continue. Check whether an English voice is available in your browser.", playing:"Playing", paused:"Paused", finished:"Chapter finished"}
};

  en:{tab:"Exam Review", views:"Study view", points:"What to memorize", recall:"Possible exam question", answer:"Model answer"}
};
const modes = ["read","listen","review"];
function ExamReview({chapter,lang}) {
  const t=reviewUi[lang];
  const review=chapter.exam[lang];
  return h(React.Fragment,null,
    ...review.lists.map(({title,items})=>h("section",{key:title},
      h("h3",null,title),
      h("ol",null,...items.map(item=>h("li",{key:item},item))))),

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("DDP-study-progress", 1);
    request.onupgradeneeded = () => request.result.createObjectStore(storeName);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Database upgrade is blocked"));
  });
}
function readProgress(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readonly");
    const request = transaction.objectStore(storeName).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
function writeProgress(db, progress) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readwrite");
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore(storeName).put(progress, key);
  });
}

function narration(chapter, lang, first) {
  const doc = new DOMParser().parseFromString(chapter[lang].content,"text/html");
  const blocks = Array.from(doc.body.querySelectorAll("h2,h3,h4,p,li,dt,dd,tr"),node =>
    node.matches("tr") ? Array.from(node.cells,cell=>cell.textContent.trim()).join(". ") :
    Array.from(node.childNodes,child=>child.nodeType===1 && child.matches("ul,ol") ? "" : child.textContent).join("").trim());
  const opening = [chapter[lang].title,...blocks];
  if (first && slide10) opening.push("WhatsApp",slide10[lang].answer);
  if (chapter.comparisons.length) opening.push(ui[lang].comparisons);
  const comparisons = chapter.comparisons.flatMap(comparison=>{
    const part = comparison[lang];
    return [part.title,...part.columns.map(([name,value])=>name+". "+value),part.tradeoff];
  });
  return [...opening,...comparisons].filter(Boolean).flatMap(block=>{
    const normalized = block.replace(/\s+/g," ").trim();
    const pieces = normalized.match(/.{1,220}(?:\s|$)|\S+/gu) || [];
    return pieces.map(piece=>piece.trim()).filter(Boolean);
  });
}
function ChapterAudio({chapter,lang,first}) {
  const t=audioUi[lang];
  const synth=window.speechSynthesis;
  const supported=Boolean(synth && window.SpeechSynthesisUtterance);
  const [status,setStatus]=useState("idle");
  const [rate,setRate]=useState(1);
  const session=useRef(0);
  const utterance=useRef(null);
  useEffect(()=>()=>{session.current++;if(utterance.current)synth?.cancel();utterance.current=null;},[synth]);
  function stop() {
    session.current++;
    synth.cancel();
    utterance.current=null;
    setStatus("idle");
  }
  function play() {
    stop();
    const segments=narration(chapter,lang,first);
    const id=session.current;
    const locale=lang==="de"?"de-DE":"en-GB";
    const voices=synth.getVoices();
    const voice=voices.find(candidate=>candidate.lang.toLowerCase()===locale.toLowerCase())
      || voices.find(candidate=>candidate.lang.toLowerCase().split(/[-_]/)[0]===lang);
    function speak(index) {
      if (id!==session.current) return;
      if (index>=segments.length) {utterance.current=null;setStatus("finished");return;}
      const next=new SpeechSynthesisUtterance(segments[index]);
      next.lang=voice?.lang||locale;
      if (voice) next.voice=voice;
      next.rate=rate;
      next.onend=()=>speak(index+1);
      next.onerror=()=>{if(id===session.current){utterance.current=null;setStatus("error");}};
      utterance.current=next;
      synth.speak(next);
    }
    setStatus("playing");
    speak(0);
  }
  const playing=status==="playing"||status==="paused";
  if (!supported) return h("p",{role:"status"},t.unsupported);
  return h("div",{className:"audio-player"},
    h("div",{className:"row"},
      h("button",{className:"primary",onClick:play,disabled:playing},t.play),
      h("button",{disabled:!playing,onClick:()=>{
        if(status==="paused"){synth.resume();setStatus("playing");}
        else{synth.pause();setStatus("paused");}
      }},status==="paused"?t.resume:t.pause),
      h("button",{onClick:stop,disabled:!playing},t.stop),
      h("label",{htmlFor:"speech-rate"},t.speed),
      h("select",{id:"speech-rate",value:rate,disabled:playing,onChange:event=>setRate(Number(event.target.value))},
        ...[0.75,1,1.25,1.5].map(speed=>h("option",{key:speed,value:speed},speed+"×")))),
    h("p",{role:"status",className:status==="error"?"warning":"progress"},t[status]||""));
}
function StudyNotes() {
  const [state,setState] = useState(initial);
  const [tab,setTab] = useState("read");
  const [ready,setReady] = useState(false);
  const [unavailable,setUnavailable] = useState(false);
  const db = useRef(null);
  const current = useRef(initial);
  const heading = useRef(null);
  const focus = useRef(false);
  useEffect(() => {
    let live = true;
    async function load() {
      try {
        const connection = await openDb();
        if (!live) { connection.close(); return; }
        db.current = connection;
        connection.onversionchange = () => {
          connection.close();
          db.current = null;
          if (live) setUnavailable(true);
        };
        const value = await readProgress(connection);
        if (live && value) {
          current.current = {
            lang:value.lang === "en" ? "en" : "de",
            active:Number.isInteger(value.active) && chapters[value.active] ? value.active : 0,
            read:value.read || {}
          };
          setState(current.current);
        }
      } catch {
        db.current?.close();
        db.current = null;
        if (live) setUnavailable(true);
      } finally {
        if (live) setReady(true);
      }
    }
    load();
    return () => {live=false;db.current?.close();};
  },[]);
  useEffect(() => {document.documentElement.lang=state.lang;},[state.lang]);
  useEffect(() => {
    if (focus.current) {heading.current?.focus();focus.current=false;}
  },[state.active]);
  function update(patch) {
    current.current = {...current.current,...patch};
    setState(current.current);
    if (db.current) writeProgress(db.current,current.current).catch(() => setUnavailable(true));
  }
  function openChapter(index) {
    if (index === state.active || !chapters[index]) return;
    focus.current=true;
    update({active:index});
  }
  const {lang,active,read} = state;
  const t=ui[lang];
  const audio=audioUi[lang];
  const chapter=chapters[active];
  const readCount=chapters.filter(c=>read[c.id]).length;
  const isRead=Boolean(read[chapter.id]);

  return h(React.Fragment,null,
    h("header",{className:"top"},h("div",{className:"shell"},
      h("span",{className:"brand"},"DDP · WS 2026/27"),
      h("div",{className:"languages",role:"group","aria-label":"Sprache / Language"},
        ...["de","en"].map(l=>h("button",{key:l,lang:l,disabled:!ready,"aria-label":l==="de"?"Deutsch":"English","aria-pressed":lang===l,onClick:()=>update({lang:l})},l.toUpperCase()))))),
    h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.subtitle),h("h1",null,t.title))),
    !ready ? h("main",{className:"shell",role:"status"},t.loading) :
    h("main",{className:"shell layout"},
      h("aside",{className:"panel"},
        h("h2",{className:"meta"},t.contents),
        h("nav",{className:"notes-nav","aria-label":t.contents},
          ...chapters.map((c,i)=>h("button",{key:c.id,"aria-current":active===i?"true":undefined,"aria-pressed":active===i,onClick:()=>openChapter(i)},read[c.id]?"✓ ":"",c[lang].title))),
        h("p",{className:"progress"},readCount+" / "+chapters.length+" "+t.read),
        h("progress",{max:chapters.length,value:readCount,"aria-label":t.read}),
        unavailable&&h("p",{className:"progress warning",role:"status"},t.unavailable)),
      h("article",{className:"card chapter","aria-labelledby":"chapter-title"},
        h("div",{className:"meta"},t.slides+" "+chapter.slides),
        h("h2",{id:"chapter-title",ref:heading,tabIndex:-1},chapter[lang].title),
        h("div",{className:"row mode-tabs",role:"tablist","aria-label":reviewUi[lang].views,
          onKeyDown:event=>{
            if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
            event.preventDefault();
            const step=event.key==="ArrowRight"?1:-1;
            const next=event.key==="Home"?modes[0]:event.key==="End"?modes.at(-1):
              modes[(modes.indexOf(tab)+step+modes.length)%modes.length];
            setTab(next);
            document.getElementById("mode-"+next)?.focus();
          }},
          ...modes.map(mode=>h("button",{key:mode,id:"mode-"+mode,role:"tab",tabIndex:mode===tab?0:-1,
            "aria-selected":mode===tab,"aria-controls":"chapter-mode",onClick:()=>setTab(mode)},mode==="review"?reviewUi[lang].tab:audio[mode]))),
        h("div",{id:"chapter-mode",role:"tabpanel","aria-labelledby":"mode-"+tab,tabIndex:0},
          tab==="listen" ? h(ChapterAudio,{key:chapter.id+":"+lang,chapter,lang,first:active===0}) :
          tab==="review" ? h(ExamReview,{key:chapter.id+":"+lang,chapter,lang}) :
          h(React.Fragment,null,
        h("div",{dangerouslySetInnerHTML:{__html:chapter[lang].content}}),
        active===0&&slide10&&h("section",{className:"response"},h("h3",null,"WhatsApp · "+t.slide+" 10"),h("p",null,slide10[lang].answer)),
        chapter.comparisons.length>0&&h("section",null,
          h("h3",null,t.comparisons),
          ...chapter.comparisons.map(c=>h("details",{key:c[lang].title},
            h("summary",null,c[lang].title),
            h("p",{className:"meta"},t.slides+" "+c.slides),
            h("table",{className:"comparison","aria-label":c[lang].title},
              h("tbody",null,...c[lang].columns.map(([name,value])=>h("tr",{key:name},h("th",{scope:"row"},name),h("td",null,value))))),
            h("p",null,c[lang].tradeoff)))))),
        h("button",{className:"primary","aria-pressed":isRead,onClick:()=>update({read:{...read,[chapter.id]:!isRead}})},isRead?t.unmark:t.mark),
        h("div",{className:"row between navigation"},
          h("button",{disabled:active===0,onClick:()=>openChapter(active-1)},"← "+t.previous),
          h("button",{disabled:active===chapters.length-1,onClick:()=>openChapter(active+1)},t.next+" →")))),
    h("footer",null,h("div",{className:"shell"},t.source)));
}
ReactDOM.createRoot(root).render(h(StudyNotes));
}

</script>
</body>
</html>
