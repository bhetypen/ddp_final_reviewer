sehen ableiten."}, "en": {"title": "UX vs. Positive Design / Design for Well-Being", "columns": [["UX", "Broad perceptions and responses around use."], ["Positive Design", "Deliberately support positive experience, lasting psychological well-being and flourishing."]], "tradeoff": "Well-being is a design objective, not merely an attractive or enjoyable surface. UX is broader than attractiveness alone, even though the lecture uses that contrast to introduce Positive Design.", "question": "Why does an enjoyable experience not automatically demonstrate long-term well-being?", "answer": "Momentary fun may not support meaning, growth or personal goals. Positive Design considers virtue, pleasure, significance and lasting effects. Evaluate these outcomes rather than infer them from engagement or a good-looking interface."}}], "exam": {"de": {"prompt": "Unterscheide affektives und kognitives Wohlbefinden.", "answer": "Affektiv: Gefühle, Emotionen und angenehme/unangenehme Affekte. Kognitiv: Bewertung des eigenen Glücks/Lebens. Die 3:1-Quellenangabe nicht als universellen Schwellenwert darstellen.", "points": [["Affektiv", "Gefühle und Emotionen; Verhältnis angenehmer und unangenehmer Affekte."], ["Kognitiv", "Wahrnehmung und Bewertung des eigenen Glücks."]], "lists": [{"title": "Zehn positive Emotionen", "items": ["Stolz", "Interesse", "Hoffnung", "Inspiration", "Dankbarkeit", "Vergnügen", "Liebe", "Heiterkeit", "Ehrfurcht", "Freude"]}, {"title": "Zwei Seiten des Wohlbefindens", "items": ["Affektiv", "Kognitiv"]}]}, "en": {"prompt": "Distinguish affective and cognitive subjective well-being.", "answer": "Affective: feelings, emotions and positive/negative affect. Cognitive: evaluation of one’s happiness or life. Do not present the lecture’s 3:1 ratio as a universal threshold.", "points": [["Affective component", "feelings and emotions; the balance of pleasant and unpleasant affect."], ["Cognitive component", "a person’s perception and evaluation of their own happiness."]], "lists": [{"title": "Ten positive emotions", "items": ["Pride", "Interest", "Hope", "Inspiration", "Gratitude", "Pleasure", "Love", "Serenity", "Awe", "Joy"]}, {"title": "Two sides of well-being", "items": ["Affective", "Cognitive"]}]}}}, {"id": "framework", "lecture": 3, "slides": "43–46", "en": {"title": "The Positive Design framework", "content": "\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Virtue\u003c/h3>\u003cp>Being a morally good person.\u003c/p>\u003cp>\u003cstrong>Lecture example:\u003c/strong> NEST Learning Thermostat — comfort and energy saving.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Pleasure\u003c/h3>\u003cp>Experiencing positive affect.\u003c/p>\u003cp>\u003cstrong>Lecture example:\u003c/strong> Recordis — pride and memories.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Personal significance\u003c/h3>\u003cp>Pursuing personally meaningful goals.\u003c/p>\u003cp>\u003cstrong>Lecture example:\u003c/strong> MiiMo — exercise, mindfulness and (mental) health.\u003c/p>\u003c/div>\u003c/div>\u003cp>At their intersection, Positive Design enables or stimulates human flourishing. A product can support more than one dimension.\u003c/p>\u003ch3>Five characteristics\u003c/h3>\u003col>\u003cli>\u003cstrong>Personal fit:\u003c/strong> values, lifestyle, goals and individual requirements.\u003c/li>\u003cli>\u003cstrong>Possibility-driven:\u003c/strong> pursue positive possibilities rather than only fixing problems.\u003c/li>\u003cli>\u003cstrong>Active user involvement:\u003c/strong> create experiences meaningful to the people using them.\u003c/li>\u003cli>\u003cstrong>Long-term impact:\u003c/strong> contribute to well-being sustainably.\u003c/li>\u003cli>\u003cstrong>Balanced:\u003c/strong> consider virtue, pleasure and personal significance together.\u003c/li>\u003c/ol>"}, "de": {"title": "Das Positive-Design-Framework", "content": "\u003cul>\u003cli>\u003cstrong>Design for Virtue:\u003c/strong> Moralisch gutes Handeln; NEST Learning Thermostat verbindet Wohlfühlen und Energiesparen.\u003c/li>\u003cli>\u003cstrong>Design for Pleasure:\u003c/strong> Positive Affekte; Recordis verbindet Stolz und Erinnerungen.\u003c/li>\u003cli>\u003cstrong>Design for Personal Significance:\u003c/strong> Eigene bedeutsame Ziele verfolgen; MiiMo unterstützt Bewegung, Achtsamkeit und Gesundheit.\u003c/li>\u003c/ul>\u003cp>Im Zusammenspiel fördern sie menschliche Entfaltung; ein Produkt kann mehrere Dimensionen unterstützen.\u003c/p>\u003ch3>Fünf Merkmale\u003c/h3>\u003col>\u003cli>\u003cstrong>Personal Fit:\u003c/strong> Individuelle Werte, Lebensstil und Ziele.\u003c/li>\u003cli>\u003cstrong>Possibility-Driven:\u003c/strong> Positive Möglichkeiten statt nur Problembeseitigung.\u003c/li>\u003cli>\u003cstrong>Active User Involvement:\u003c/strong> Bedeutsame Erlebnisse mit Beteiligung der Nutzer.\u003c/li>\u003cli>\u003cstrong>Long-Term Impact:\u003c/strong> Nachhaltiger Beitrag zum Wohlbefinden.\u003c/li>\u003cli>\u003cstrong>Balanced:\u003c/strong> Alle drei Dimensionen zusammen berücksichtigen.\u003c/li>\u003c/ol>"}, "comparisons": [{"slides": "43–46", "de": {"title": "Virtue vs. Pleasure vs. Personal Significance", "columns": [["Virtue", "Moralisch gutes bzw. verantwortliches Handeln."], ["Pleasure", "Positive Affekte erleben."], ["Personal Significance", "Persönlich bedeutsame Ziele verfolgen."]], "tradeoff": "Ergänzende Dimensionen statt ausschließlicher Produktkategorien. Balance und individuelle Passung beachten.", "question": "Unterscheide die Dimensionen anhand der Vorlesungsbeispiele.", "answer": "NEST: Wohlfühlen und Energiesparen/Virtue. Recordis: Stolz und Erinnerungen/Pleasure. MiiMo: eigene Gesundheitsziele. Ein Produkt kann mehrere Dimensionen unterstützen."}, "en": {"title": "Virtue vs. pleasure vs. personal significance", "columns": [["Virtue", "Being morally good / responsible action."], ["Pleasure", "Experiencing positive affect."], ["Personal significance", "Pursuing personally meaningful goals."]], "tradeoff": "They are complementary dimensions, not exclusive product categories. Balance and personal fit matter.", "question": "Distinguish the dimensions and give lecture examples.", "answer": "NEST illustrates comfort and energy-saving virtue; Recordis pleasure through pride/memories; MiiMo personal health goals. Explain why a single product could support more than one dimension."}}], "exam": {"de": {"prompt": "Erkläre die drei Positive-Design-Dimensionen.", "answer": "Virtue: moralisch gutes Handeln. Pleasure: positive Affekte. Personal Significance: eigene Ziele. Beispiele NEST, Recordis und MiiMo; mehrere Dimensionen können zusammenwirken.", "points": [["Design for Virtue", "Moralisch gutes Handeln; NEST Learning Thermostat verbindet Wohlfühlen und Energiesparen."], ["Design for Pleasure", "Positive Affekte; Recordis verbindet Stolz und Erinnerungen."], ["Design for Personal Significance", "Eigene bedeutsame Ziele verfolgen; MiiMo unterstützt Bewegung, Achtsamkeit und Gesundheit."], ["Personal Fit", "Individuelle Werte, Lebensstil und Ziele."]], "lists": [{"title": "Drei Positive-Design-Dimensionen", "items": ["Virtue", "Pleasure", "Personal Significance"]}, {"title": "Fünf Merkmale", "items": ["Personal Fit", "Possibility-Driven", "Active User Involvement", "Long-Term Impact", "Balanced"]}]}, "en": {"prompt": "Explain all three Positive Design dimensions.", "answer": "Virtue: morally good action. Pleasure: positive affect. Personal significance: pursuing personal goals. Use the lecture examples—NEST, Recordis and MiiMo—and explain how more than one dimension may apply.", "points": [["Personal fit", "values, lifestyle, goals and individual requirements."], ["Possibility-driven", "pursue positive possibilities rather than only fixing problems."], ["Active user involvement", "create experiences meaningful to the people using them."], ["Long-term impact", "contribute to well-being sustainably."]], "lists": [{"title": "Three dimensions of positive design", "items": ["Virtue", "Pleasure", "Personal significance"]}, {"title": "Five characteristics", "items": ["Personal fit", "Possibility-driven", "Active user involvement", "Long-term impact", "Balanced"]}]}}}, {"id": "perma", "lecture": 3, "slides": "47–48", "en": {"title": "PERMA & the four product roles", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Letter\u003c/th>\u003cth>Dimension\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>P\u003c/td>\u003ctd>Positive emotions\u003c/td>\u003ctd>Positive experiences and feelings.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E\u003c/td>\u003ctd>Engagement\u003c/td>\u003ctd>Absorbing, intrinsically motivated activities; flow and strengths.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R\u003c/td>\u003ctd>Relationships\u003c/td>\u003ctd>Appreciative, meaningful connections with others.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M\u003c/td>\u003ctd>Meaning\u003c/td>\u003ctd>Purpose and meaningful activity.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Achievement\u003c/td>\u003ctd>Progress toward and attainment of goals.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>How products can contribute\u003c/h3>\u003cul>\u003cli>\u003cstrong>Source:\u003c/strong> directly evokes positive responses through aesthetics, play or social interaction.\u003c/li>\u003cli>\u003cstrong>Symbol:\u003c/strong> represents something meaningful, such as a wedding ring, souvenir or trophy.\u003c/li>\u003cli>\u003cstrong>Enablement:\u003c/strong> opens possibilities, such as connecting with others through Teams or participating in an interactive game.\u003c/li>\u003cli>\u003cstrong>Support:\u003c/strong> helps users, such as a mental-health app or fitness watch.\u003c/li>\u003c/ul>\u003cp class=\"recall\">PERMA dimensions describe aspects of well-being. Product roles describe ways a product can contribute to them.\u003c/p>"}, "de": {"title": "PERMA und vier Produktrollen", "content": "\u003cul>\u003cli>\u003cstrong>P – Positive Emotions:\u003c/strong> Positive Erlebnisse und Gefühle.\u003c/li>\u003cli>\u003cstrong>E – Engagement:\u003c/strong> Intrinsisch motivierte, fesselnde Tätigkeit, Flow und Stärken.\u003c/li>\u003cli>\u003cstrong>R – Relationships:\u003c/strong> Wertschätzende Beziehungen.\u003c/li>\u003cli>\u003cstrong>M – Meaning:\u003c/strong> Sinn und bedeutungsvolle Tätigkeit.\u003c/li>\u003cli>\u003cstrong>A – Achievement:\u003c/strong> Fortschritt und Zielerreichung.\u003c/li>\u003c/ul>\u003ch3>Wie Produkte beitragen können\u003c/h3>\u003cul>\u003cli>\u003cstrong>Source/Quelle:\u003c/strong> Unmittelbare positive Reaktionen durch Ästhetik, Spiel oder soziale Interaktion.\u003c/li>\u003cli>\u003cstrong>Symbol:\u003c/strong> Bedeutung repräsentieren, etwa Ehering, Souvenir oder Trophäe.\u003c/li>\u003cli>\u003cstrong>Enablement/Ermöglichung:\u003c/strong> Möglichkeiten eröffnen, etwa Austausch über Teams oder interaktive Spiele.\u003c/li>\u003cli>\u003cstrong>Support/Unterstützung:\u003c/strong> Helfen, etwa durch Gesundheitsapp oder Fitnessuhr.\u003c/li>\u003c/ul>\u003cp class='recall'>PERMA beschreibt Dimensionen des Wohlbefindens; Produktrollen beschreiben Wege, dazu beizutragen.\u003c/p>"}, "comparisons": [{"slides": "47–48", "de": {"title": "PERMA-Dimensionen vs. Produktrollen", "columns": [["PERMA", "Wohlbefindensaspekte: Emotionen, Engagement, Beziehungen, Sinn, Zielerreichung."], ["Produktrollen", "Beitragsweisen: Quelle, Symbol, Ermöglichung, Unterstützung."]], "tradeoff": "Eine Rolle kann mehrere Dimensionen fördern. Es sind keine konkurrierenden Phasenmodelle.", "question": "Unterscheide beide anhand Fitnessuhr oder Souvenir.", "answer": "Eine Uhr unterstützt Zielerreichung und ermöglicht Aktivität. Ein Souvenir symbolisiert Sinn und weckt positive Emotionen. Dimension des Wohlbefindens und Beitragsweise getrennt benennen."}, "en": {"title": "PERMA dimensions vs. product roles", "columns": [["PERMA", "Aspects of well-being: emotion, engagement, relationships, meaning, achievement."], ["Product roles", "Ways to contribute: source, symbol, enablement, support."]], "tradeoff": "One role may support several dimensions. These are not two competing phase models.", "question": "Distinguish the frameworks using a fitness watch or souvenir.", "answer": "A watch may support achievement and enable activity; a souvenir may symbolize meaning and evoke positive emotion. Name the well-being dimension separately from the mechanism or role."}}], "exam": {"de": {"prompt": "Wende PERMA auf ein selbst gewähltes Produkt an.", "answer": "Begründe positive Emotionen, Engagement, Beziehungen, Sinn und Zielerreichung. Ein Lernwerkzeug kann Feedback, vertiefende Übung, Kontakte, Lernzweck und Fortschritt unterstützen. Dies sind Möglichkeiten, keine garantierten Wirkungen.", "points": [["P – Positive Emotions", "Positive Erlebnisse und Gefühle."], ["E – Engagement", "Intrinsisch motivierte, fesselnde Tätigkeit, Flow und Stärken."], ["R – Relationships", "Wertschätzende Beziehungen."], ["M – Meaning", "Sinn und bedeutungsvolle Tätigkeit."]], "lists": [{"title": "PERMA", "items": ["Positive Emotions", "Engagement", "Relationships", "Meaning", "Achievement"]}, {"title": "Vier Produktrollen", "items": ["Quelle", "Symbol", "Ermöglichung", "Unterstützung"]}]}, "en": {"prompt": "Apply PERMA to a product of your choice.", "answer": "Identify a plausible contribution for each: positive emotions, engagement, relationships, meaning and achievement. For example, a community-learning tool might provide encouraging feedback, absorbing practice, peer connections, a meaningful learning purpose and visible milestones. These are practice applications, not guaranteed outcomes.", "points": [["Source", "directly evokes positive responses through aesthetics, play or social interaction."], ["Symbol", "represents something meaningful, such as a wedding ring, souvenir or trophy."], ["Enablement", "opens possibilities, such as connecting with others through Teams or <script>

function App() {

    h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.lecture),h("h1",null,t.heading),h("p",null,t[kind]))));

    h("div",{className:"sets"},...Array.from({length:setCount},(_,i)=>h("button",{key:i,"aria-pressed":i===set,"aria-label":t.set+" "+(i+1),onClick:()=>move(i*perSet)},i+1))),
    h("p",{className:"progress"},done+" / "+perSet+" "+(isReview?t.studied:t.answered)),

    !isReview && done>0 && h("p",{className:"progress"},t.correct+": "+score+" / "+done),
    h("button",{disabled:!numbers.some(i=>complete(i)||Boolean(drafts[i])),onClick:resetSet},t.resetSet),
    h("p",{className:"progress"+(status==="unavailable"?" warning":""),role:"status"},t[status]));

    h("label",{htmlFor:"draft"},t.write),

        h("p",null,item.tradeoff)),

    h("footer",null,h("div",{className:"shell"},t.source)));
}
ReactDOM.createRoot(root).render(h(App));
}
</script>
