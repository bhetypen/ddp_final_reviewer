*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:.55rem .85rem;font-weight:650}button:hover:not(:disabled){border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true],button.primary{background:var(--green);border-color:var(--green);color:white}.shell{max-width:980px;margin:auto;padding:0 clamp(16px,4vw,32px)}.top{background:var(--card);border-bottom:1px solid var(--line)}.top .shell{display:flex;justify-content:space-between;align-items:center;padding-block:.75rem;gap:.5rem}.brand{font-size:.84rem;font-weight:750;letter-spacing:.04em}.languages,.row,.sets,.numbers{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.hero{background:var(--green);color:white;padding:clamp(1.8rem,6vw,3.6rem) 0}.hero p{margin:.5rem 0 0;color:#e0eee4}.eyebrow,.meta{font-size:.78rem;font-weight:700;letter-spacing:.065em;text-transform:uppercase}.eyebrow{color:#d0e4d4}h1,h2,h3{line-height:1.23;margin:0}h1{font:clamp(2.2rem,7vw,4rem)/1.08 Georgia,serif;margin:.5rem 0}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:1.3rem;padding-block:1.5rem}.panel,.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px}.panel{padding:1rem;align-self:start}.card{padding:clamp(1rem,4vw,2rem)}.card h2{font:clamp(1.45rem,4vw,2rem)/1.24 Georgia,serif;margin:.6rem 0 1.15rem;overflow-wrap:anywhere}.meta{color:var(--muted)}.between{justify-content:space-between}.sets{margin:.8rem 0}.sets button,.numbers button{min-width:40px;padding:.4rem .55rem}.numbers{margin:1rem 0}.numbers .done:not([aria-pressed=true]){background:var(--pale);border-color:#839e8c}.progress{font-size:.87rem;margin:.6rem 0;color:var(--muted)}progress{width:100%;accent-color:var(--green)}.option{display:flex;align-items:center;width:100%;text-align:left;margin:.55rem 0;gap:.7rem}.option strong{min-width:1.7rem;font-size:.8rem}.option.good{background:var(--pale);border-color:var(--green);color:var(--green)}.option.bad{background:var(--rose);border-color:var(--bad);color:var(--bad)}.response{margin:1rem 0;background:var(--pale);border-left:3px solid var(--green);padding:.75rem 1rem}.response.wrong{background:var(--rose);border-color:var(--bad)}.response p,.card p{margin:.45rem 0}.navigation{margin-top:1rem}textarea{display:block;width:100%;resize:vertical;margin:.4rem 0 .9rem;padding:.65rem;border:1px solid var(--line);background:var(--paper);border-radius:6px}label{font-weight:650}details{padding:1rem;margin:.75rem 0}summary{cursor:pointer;font-weight:700}details details{border-radius:6px}.comparison{width:100%;border-collapse:collapse;margin:.7rem 0}.comparison th,.comparison td{text-align:left;vertical-align:top;padding:.5rem;border-bottom:1px solid var(--line)}.comparison th{width:34%}.warning{color:var(--bad)}footer{border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;padding:1rem 0 2rem}a{color:var(--green)}.skip{position:absolute;left:-9999px}.skip:focus{top:.3rem;left:.3rem;background:white;padding:.5rem}

<script type="application/json" id="study-data">{"kind": "reviewer", "questions": [{"slides": "2–7", "de": {"prompt": "Erkläre Mensch, Aufgabe und Kontext an einem Beispiel.", "answer": "Gelegentlicher Banking-Nutzer: Person. Dringende Überweisung: Aufgabe. Handy im lauten Zug: Kontext. Nenne konkrete Eigenschaften und erkläre die Auswirkungen auf Gestaltung."}, "en": {"prompt": "Explain person, task and context using one example.", "answer": "Name the user characteristics, the goal and demands of the task, and the setting. For example: an occasional banking-app user (person) makes an urgent transfer (task) on a phone in a noisy train (context). Explain how these factors affect the design."}}, {"slides": "13–22", "de": {"prompt": "Vergleiche Human Factors, HCI, HCC und HCD.", "answer": "Human Factors: Fähigkeiten/Grenzen. HCI: Interaktion mit Computersystemen. HCC: Computing in Lebenswelt und soziotechnischem Kontext. HCD: iteratives Vorgehen zur Anwendung dieser Erkenntnisse."}, "en": {"prompt": "Compare Human Factors, HCI, HCC and HCD.", "answer": "Human Factors: capabilities and limits. HCI: interaction between people and computer systems. HCC: computing within everyday and sociotechnical contexts. HCD: an iterative approach for applying these insights to design."}}, {"slides": "8–12", "de": {"prompt": "Erkläre das Käsescheibenmodell ohne eine Einzelperson zu beschuldigen.", "answer": "Alle Schutzschichten haben Schwächen; ausgerichtete Lücken ermöglichen Schaden. Systembedingungen und mehrere Schutzmaßnahmen prüfen. Menschen können zusätzlich Resilienz stärken."}, "en": {"prompt": "Explain the Swiss cheese model without blaming one person.", "answer": "Each protective layer has weaknesses. A hazard can cause harm when weaknesses align across layers. Analyze system conditions and improve several protections; recognize that people can also increase resilience."}}, {"slides": "23–29", "de": {"prompt": "Beschreibe HCD für eine KI-Chat-Zusammenfassung.", "answer": "Forschung planen; Menschen und Kontext verstehen; Anforderungen wie Erhalt kritischer Information definieren; Prototyp entwickeln; Nutzen, Vertrauen und Fehler evaluieren; iterieren und verschiedene Disziplinen beteiligen."}, "en": {"prompt": "Describe an HCD process for an AI chat-summary feature.", "answer": "Plan research; understand who needs summaries and in what context; define requirements such as preserving critical information; prototype; evaluate usefulness, trust and errors with users; iterate. Include a multidisciplinary perspective."}}, {"slides": "30–37", "de": {"prompt": "Unterscheide Usability und UX anhand eines Beispiels.", "answer": "Buchungsapp: erfolgreiche Buchung, effiziente Schritte und Zufriedenheit im Kontext. UX umfasst auch Erwartung, Vertrauen, Emotionen und Erinnerung. Usability trägt zur breiteren Erfahrung bei."}, "en": {"prompt": "Distinguish usability from UX with an example.", "answer": "For a booking app, usability includes successful booking, efficient steps and satisfaction in context. UX also includes anticipation, trust, emotions during use and memories afterward. Usability contributes to the broader experience."}}, {"slides": "43–46", "de": {"prompt": "Erkläre die drei Positive-Design-Dimensionen.", "answer": "Virtue: moralisch gutes Handeln. Pleasure: positive Affekte. Personal Significance: eigene Ziele. Beispiele NEST, Recordis und MiiMo; mehrere Dimensionen können zusammenwirken."}, "en": {"prompt": "Explain all three Positive Design dimensions.", "answer": "Virtue: morally good action. Pleasure: positive affect. Personal significance: pursuing personal goals. Use the lecture examples—NEST, Recordis and MiiMo—and explain how more than one dimension may apply."}}, {"slides": "47–48", "de": {"prompt": "Wende PERMA auf ein selbst gewähltes Produkt an.", "answer": "Begründe positive Emotionen, Engagement, Beziehungen, Sinn und Zielerreichung. Ein Lernwerkzeug kann Feedback, vertiefende Übung, Kontakte, Lernzweck und Fortschritt unterstützen. Dies sind Möglichkeiten, keine garantierten Wirkungen."}, "en": {"prompt": "Apply PERMA to a product of your choice.", "answer": "Identify a plausible contribution for each: positive emotions, engagement, relationships, meaning and achievement. For example, a community-learning tool might provide encouraging feedback, absorbing practice, peer connections, a meaningful learning purpose and visible milestones. These are practice applications, not guaranteed outcomes."}}, {"slides": "49–52", "de": {"prompt": "Warum reicht Erfolg bei direkten Nutzern für Verantwortung nicht aus?", "answer": "Nichtnutzer, Stakeholder, Gesellschaft, Energie/Ressourcen, Arbeitsbedingungen und langfristige Folgen prüfen. Ein Produkt kann Bedürfnisse erfüllen und trotzdem anderen Kosten auferlegen."}, "en": {"prompt": "Why is user-centered success insufficient for responsible design?", "answer": "Discuss non-users and stakeholders, society, energy and resources, working conditions and long-term effects. A product can meet direct users’ needs and still impose costs elsewhere. Widen the frame from user to future."}}, {"slides": "2–7", "de": {"prompt": "Liste Faktoren von Mensch, Aufgabe und Kontext und erkläre ihr Zusammenspiel.", "answer": "Person: Fähigkeit, Erfahrung, Wissen, Bedürfnis, Erwartung. Aufgabe: Ziel, Komplexität, Häufigkeit, Dringlichkeit. Kontext: Ort/Zeit, Situation, soziales Umfeld, Gerät. Zeige, wie eine Änderung die passende Oberfläche verändert."}, "en": {"prompt": "List person, task and context factors and explain their interaction.", "answer": "Person: abilities, experience, knowledge, needs, expectations. Task: goal, complexity, frequency, urgency. Context: place/time, situation, social surroundings, device. Explain why changing one may change a suitable interface."}}, {"slides": "3–7", "de": {"prompt": "Vergleiche häufige Banking-Nutzer, seltene Nutzer und Screenreader-Nutzer.", "answer": "Vorwissen, Lernen, Wahrnehmung und Interaktionswege unterscheiden. Gruppen sind nicht einheitlich; tatsächliche Bedürfnisse erforschen und Zielerreichung im Kontext prüfen."}, "en": {"prompt": "Compare a frequent banking user, an occasional user and a screen-reader user.", "answer": "Identify differing prior knowledge, learning needs, perception and interaction methods. Avoid treating groups as uniform; establish actual needs and evaluate goal achievement in context."}}, {"slides": "8–12", "de": {"prompt": "Erkläre Human Factors bei Individuum, Aufgabe und Umwelt.", "answer": "Fähigkeiten/Grenzen, Aufgabenkomplexität/Monotonie/Belastung und Umweltbedingungen diskutieren. Das Umweltkästchen der Quelle wiederholt den Individuumstext; daraus keine eigenständige Definition ableiten."}, "en": {"prompt": "Explain Human Factors across individual, task and environment.", "answer": "Discuss abilities and limits, task complexity/monotony/demands and environmental conditions. Note that the source duplicates the individual text in its environment box; do not rely on that repetition as a distinct definition."}}, {"slides": "8–12", "de": {"prompt": "Warum ist Resilienz mehr als die Vermeidung menschlicher Fehler?", "answer": "Menschen erkennen Abweichungen, improvisieren, koordinieren und passen sich an. Systembedingungen und mehrere Schutzebenen mit Unterstützung menschlicher Beiträge verbinden."}, "en": {"prompt": "Explain why resilience requires more than preventing human error.", "answer": "People may recognize anomalies, improvise, coordinate and adapt. Combine attention to system conditions and layered protections with support for human contribution."}}, {"slides": "8–12", "de": {"prompt": "Beschreibe Complacency und Folgen für Informationsverarbeitung.", "answer": "Übervertrauen senkt möglicherweise Informationsaufnahme, Verarbeitung und Vorwegnahme zukünftiger Zustände. Verbinde passive Überwachung mit geringerem Kompetenzgefühl und Reaktionsfähigkeit."}, "en": {"prompt": "Describe complacency and its consequences for information processing.", "answer": "Excessive trust can reduce gathering information, processing available cues and anticipating future states. Link this with passive monitoring, weakened competence and inability to respond."}}, {"slides": "8–12", "de": {"prompt": "Erkläre subjektive Kompetenz und schlage Gestaltung zur Unterstützung vor.", "answer": "Systemverständnis plus Einflussmöglichkeiten. Verständliches Feedback, sinnvolle Kontrolle und angemessene Beteiligung sind Übungsvorschläge. Begründe mögliche positive Wirkungen auf Aufmerksamkeit."}, "en": {"prompt": "Explain subjective competence and propose ways design could support it.", "answer": "Understanding the system plus opportunities to influence it. As practice proposals, offer understandable feedback, meaningful control and appropriate involvement; explain how these might improve active attention."}}, {"slides": "13–22", "de": {"prompt": "Nenne vier HCI-Phasen mit Nutzerfokus und Beispielen.", "answer": "Interaktiv: Einzelne/WIMP. Kooperativ: Gruppen/Kommunikation. Ubiquitär: eingebettet/mobil. Ambient Intelligence: intelligente Umgebungen. Die ungefähren Zeiträume der Folien ergänzen."}, "en": {"prompt": "State the four HCI development phases with users and examples.", "answer": "Interactive/individual/WIMP; cooperative/groups and communication; ubiquitous/embedded and mobile; ambient intelligence/intelligent environments for people or groups. Use the lecture’s approximate periods."}}, {"slides": "13–22", "de": {"prompt": "Beschreibe einen vollständigen Feedbackkreislauf außerhalb des Nachrichtenversands.", "answer": "Beispiel Speichern: Zustand wahrnehmen, interpretieren, entscheiden, handeln, verarbeiten, rückmelden, erneut wahrnehmen. Erkläre Folgen fehlenden oder mehrdeutigen Feedbacks."}, "en": {"prompt": "Describe a complete feedback loop for an action other than sending a message.", "answer": "Example: save a file. Perceive state, interpret, decide, act, processing, feedback, then perceive and interpret again. Explain how missing or ambiguous feedback interrupts confidence."}}, {"slides": "13–22", "de": {"prompt": "Analysiere einen digitalen Service als soziotechnisches System.", "answer": "Individuum, Beziehungen, Technik, Regeln, Organisation und Gesellschaft mit wechselseitigen Einflüssen betrachten. Vorteile und Risiken identifizieren."}, "en": {"prompt": "Analyze a digital service as a sociotechnical system.", "answer": "Include individual, relationships, technology, rules, organization and societal context, with influences in both directions. Identify both benefits and risks."}}, {"slides": "23–29", "de": {"prompt": "Nenne und erläutere alle sechs HCD-Prinzipien.", "answer": "Menschen/Aufgaben/Umwelt verstehen; durchgehend beteiligen; Evaluation treibt und verfeinert; iterieren; gesamte UX berücksichtigen; multidisziplinär arbeiten. Jeweils eine konkrete Praxis nennen."}, "en": {"prompt": "State and apply all six HCD principles.", "answer": "Understand users/tasks/environment; involve users throughout; user evaluation drives/refines; iterate; address whole UX; use multidisciplinary perspectives. Explain an action demonstrating each."}}, {"slides": "23–29", "de": {"prompt": "Erkläre Evidenz und Learning-by-Doing in HCD.", "answer": "Bedürfnisse beobachten und analysieren, Zwischenlösungen herstellen und prüfen. Erkenntnisse verändern Verständnis oder Lösung. Iteration ist zielgerichtetes Lernen."}, "en": {"prompt": "Explain HCD’s evidence-based and learning-by-doing character.", "answer": "Use observation and analysis to establish needs, then make and test intermediate ideas. Feedback changes the problem understanding or solution; iteration is purposeful learning."}}, {"slides": "30–33", "de": {"prompt": "Plane eine Evaluation mit drei Usability-Kernfaktoren und vier Zusatzkriterien.", "answer": "Menschen, Ziele und Kontext festlegen. Effektivität, Zeit/Aufwand und Zufriedenheit beobachten; Erlernbarkeit, Einprägsamkeit, Fehlertoleranz und Barrierefreiheit prüfen. Grenzen eines einzelnen Tests benennen."}, "en": {"prompt": "Design a usability evaluation using the three core factors and four additional criteria.", "answer": "Define users, goals and context. Observe effectiveness, time/effort and satisfaction; examine learnability, memorability, error tolerance and accessibility. Specify realistic tasks and acknowledge what one session cannot assess."}}, {"slides": "34–37", "de": {"prompt": "Erkläre UX vor, während und nach Nutzung.", "answer": "Erwartung/Marke, Interaktion und Reaktionen sowie Erinnerung/Bewertung. Vorerfahrungen, Zustand, Kontext und Systemmerkmale einbeziehen."}, "en": {"prompt": "Explain before-, during- and after-use UX with one product.", "answer": "Include anticipated use/brand expectations, interaction emotions and responses, and later memory or evaluation. Discuss prior experience, internal state, context and system characteristics."}}, {"slides": "39–43", "de": {"prompt": "Unterscheide affektives und kognitives Wohlbefinden.", "answer": "Affektiv: Gefühle, Emotionen und angenehme/unangenehme Affekte. Kognitiv: Bewertung des eigenen Glücks/Lebens. Die 3:1-Quellenangabe nicht als universellen Schwellenwert darstellen."}, "en": {"prompt": "Distinguish affective and cognitive subjective well-being.", "answer": "Affective: feelings, emotions and positive/negative affect. Cognitive: evaluation of one’s happiness or life. Do not present the lecture’s 3:1 ratio as a universal threshold."}}, {"slides": "39–43", "de": {"prompt": "Nenne zehn positive Emotionen und Bedingungen für drei davon.", "answer": "Stolz, Interesse, Hoffnung, Inspiration, Dankbarkeit, Vergnügen, Liebe, Heiterkeit, Ehrfurcht und Freude. Plausible Gestaltungsmöglichkeiten begründen; Gefühle sind nicht garantiert."}, "en": {"prompt": "Name the ten positive emotions listed and choose design conditions that may support three.", "answer": "Pride, interest, hope, inspiration, gratitude, amusement, love, serenity/cheerfulness, awe and joy. Explain plausible conditions while acknowledging designers cannot guarantee feelings."}}, {"slides": "43–46", "de": {"prompt": "Nenne und wende die fünf Positive-Design-Merkmale an.", "answer": "Personal Fit, Possibility-Driven, Active User Involvement, Long-Term Impact, Balanced. An einem Konzept erläutern und Virtue, Pleasure sowie Personal Significance berücksichtigen."}, "en": {"prompt": "State the five characteristics of Positive Design and apply them.", "answer": "Personal fit; possibility-driven; active user involvement; long-term impact; balanced. Explain each using the same concept and include virtue, pleasure and personal significance."}}, {"slides": "47–48", "de": {"prompt": "Unterscheide PERMA und die vier Produktrollen.", "answer": "PERMA beschreibt Wohlbefindensdimensionen; Source, Symbol, Enablement und Support beschreiben Beiträge eines Produkts. Ordne ein Produkt begründet mehreren Dimensionen und Rollen zu."}, "en": {"prompt": "Distinguish PERMA dimensions from the four product roles.", "answer": "PERMA describes aspects of well-being. Source, symbol, enablement and support describe ways products contribute. Map a product to several dimensions and roles with reasons."}}, {"slides": "49–52", "de": {"prompt": "Bewerte eine beliebte App über ihre direkten Nutzer hinaus.", "answer": "Nichtnutzer, Stakeholder, Gesellschaft, Umwelt/Ressourcen und Zukunft einbeziehen; etwa Arbeit entlang der Wertschöpfung. Zielkonflikte und Evidenzbedarf benennen statt Zufriedenheit als Verantwortungsbeweis zu verwenden."}, "en": {"prompt": "Evaluate a well-loved app beyond its direct users.", "answer": "Consider non-users and stakeholders, society, resources/environment and the future; include labor conditions or other value-chain effects. Identify trade-offs and evidence needed rather than assuming satisfaction proves responsibility."}}, {"slides": "8–11", "de": {"title": "Human Factors vs. Human Error", "columns": [["Human Factors", "Menschliche Eigenschaften und passende Systeme untersuchen."], ["Human Error", "Fehler menschlichen Handelns als ein Aspekt im Gesamtsystem."]], "tradeoff": "Keine konkurrierenden Ansätze. Die Gleichsetzung übersieht Anpassung, Resilienz und Systemschwächen.", "question": "Warum sind Human Factors nicht dasselbe wie Human Error?", "answer": "Human Factors umfasst physische, psychische, kognitive und soziale Merkmale. Fehler hängen auch von Systembedingungen ab; Menschen erkennen und beheben Probleme. Käsescheibenmodell statt alleiniger Schuldzuweisung nutzen.", "prompt": "Warum sind Human Factors nicht dasselbe wie Human Error?"}, "en": {"title": "Human Factors vs. Human Error", "columns": [["Human Factors", "Study human characteristics and how systems fit people."], ["Human Error", "An error in human action; one concern within the wider system."]], "tradeoff": "They are not competing approaches. Reducing the field to error misses human adaptation and resilience and can hide system weaknesses.", "question": "Explain why Human Factors is not the same as Human Error.", "answer": "Human Factors includes physical, psychological, cognitive and social characteristics. Errors may arise through system conditions; people can also detect, recover and adapt. Use the Swiss cheese model to discuss layers rather than blaming one operator.", "prompt": "Explain why Human Factors is not the same as Human Error."}}, {"slides": "14–22; 38", "de": {"title": "Human Factors vs. HCI vs. HCC vs. HCD", "columns": [["Human Factors", "Fähigkeiten und Grenzen verstehen."], ["HCI", "Interaktion mit Computersystemen verstehen."], ["HCC", "Computing in sozialer und alltäglicher Lebenswelt verstehen."], ["HCD", "Erkenntnisse in einem menschenzentrierten iterativen Prozess anwenden."]], "tradeoff": "Perspektiven ergänzen sich. Unterschied sind Leitfrage und Reichweite, nicht ein Wettbewerb.", "question": "Unterscheide die vier Begriffe und beziehe sie auf ein Produkt.", "answer": "Banking: Wahrnehmungs-/Aufmerksamkeitsgrenzen sind Human Factors; Handlung/Feedback HCI; kulturelle, soziale und organisatorische Nutzung HCC; Forschung, Anforderungen, Prototyp und Evaluation HCD.", "prompt": "Unterscheide die vier Begriffe und beziehe sie auf ein Produkt."}, "en": {"title": "Human Factors vs. HCI vs. HCC vs. HCD", "columns": [["Human Factors", "Understand capabilities and limits."], ["HCI", "Understand interaction with computer systems."], ["HCC", "Understand computing in people’s social and everyday world."], ["HCD", "Apply insights through a human-centered iterative design process."]], "tradeoff": "These perspectives overlap and support one another. Their main distinction is the question and scope, not a contest over which is best.", "question": "Distinguish the four terms and relate them to one product.", "answer": "For a banking app: perception/attention limits are Human Factors; action/feedback is HCI; social, cultural and organizational use is HCC; research, requirements, prototypes and evaluation describe HCD.", "prompt": "Distinguish the four terms and relate them to one product."}}, {"slides": "23–29", "de": {"title": "Technologiezentriert vs. menschenzentriert", "columns": [["Technologiezentriert", "Verfügbare Fähigkeit nehmen, Funktion bauen und veröffentlichen."], ["Menschenzentriert", "Menschen, Kontext, Bedürfnisse, Anforderungen und Folgen erforschen; Alternativen evaluieren."]], "tradeoff": "Technisch funktionierend heißt nicht relevant oder verantwortungsvoll. Forschung reduziert ungeprüfte Annahmen, benötigt aber Zeit und Iteration.", "question": "Vergleiche beide Ansätze für KI-Gruppenzusammenfassungen.", "answer": "Technik zuerst: LLM und Button einbauen. HCD: Wer braucht wann welche Inhalte, mit welchem Vertrauen und welchen Fehlerfolgen? Machbarkeit und menschliche Relevanz unterscheiden und verbinden.", "prompt": "Vergleiche beide Ansätze für KI-Gruppenzusammenfassungen."}, "en": {"title": "Technology-centered vs. human-centered", "columns": [["Technology-centered", "Start with an available capability, build a function and release it."], ["Human-centered", "Investigate people, context, needs, requirements and consequences; then evaluate alternatives."]], "tradeoff": "A capability can work and still be irrelevant or harmful. Human-centered inquiry reduces untested assumptions but requires research and iteration.", "question": "Compare both approaches for an AI group-chat summary.", "answer": "Technology-first asks how to add an LLM/button. HCD asks who needs a summary, when, which content matters, trust and errors. Technical feasibility and human relevance are distinct; integrate both.", "prompt": "Compare both approaches for an AI group-chat summary."}}, {"slides": "31–32", "de": {"title": "Enge vs. breite Usability-Sicht", "columns": [["Enge historische Sicht", "Usability vor allem als Produkt-/Funktionsqualität unabhängig vom Kontext."], ["Breite Sicht", "Bestimmte Menschen erreichen Ziele in einem bestimmten Kontext."]], "tradeoff": "Checklisten prüfen Eigenschaften, beweisen aber keine Eignung für jede Situation. Die ISO-Definition ist kontextbezogen.", "question": "Warum kann dasselbe Produkt in einer Umgebung brauchbar und in einer anderen schwierig sein?", "answer": "Sprachbedienung passt eventuell zu Hause, aber nicht zu Bibliotheksnormen. Fähigkeiten und Aufgaben verändern die Bewertung. Menschen, Ziele und Kontext vor Effektivität, Effizienz und Zufriedenheit benennen.", "prompt": "Warum kann dasselbe Produkt in einer Umgebung brauchbar und in einer anderen schwierig sein?"}, "en": {"title": "Narrow vs. broad view of usability", "columns": [["Narrow historical view", "Treat usability mainly as product/function quality, apart from context."], ["Broad view", "Evaluate specified users achieving goals in a specified context."]], "tradeoff": "A checklist can identify useful properties but does not establish suitability for every use situation. The ISO definition in the lecture is contextual.", "question": "Explain why the same product can be usable in one setting and difficult in another.", "answer": "A voice action may fit a private home and conflict with library norms. User ability and task demands also change the evaluation. Name people, goals and context before judging effectiveness, efficiency and satisfaction.", "prompt": "Explain why the same product can be usable in one setting and difficult in another."}}, {"slides": "31–37", "de": {"title": "Usability Engineering vs. User Experience", "columns": [["Usability Engineering", "Systematische Gestaltung erfolgreicher, effizienter und zufriedenstellender Nutzung; historisch aufgaben-/prozessbezogen."], ["User Experience", "Wahrnehmungen und Reaktionen aus erwarteter und tatsächlicher Nutzung davor, dabei und danach."]], "tradeoff": "Usability trägt zur UX bei. Es ist nicht bloß „Funktion gegen Schönheit“; Zufriedenheit und Emotionen überschneiden sich.", "question": "Unterscheide Usability Engineering und UX anhand eines Beispiels.", "answer": "Eine Buchung kann schnell und korrekt sein und dennoch Misstrauen hinterlassen. Usability prüft Erfolg, Aufwand und Zufriedenheit. UX umfasst zusätzlich Erwartungen, Gefühle, Marke, Vorerfahrung und spätere Reaktion.", "prompt": "Unterscheide Usability Engineering und UX anhand eines Beispiels."}, "en": {"title": "Usability Engineering vs. User Experience", "columns": [["Usability Engineering", "Systematic work on successful, efficient, satisfactory use; historically task/process focused."], ["User Experience", "Perceptions and responses from anticipated and actual use, before, during and after."]], "tradeoff": "They overlap: usability contributes to UX. Neither reduces to “function versus beauty”; satisfaction and emotions can intersect.", "question": "Distinguish Usability Engineering and UX, including an example.", "answer": "A booking flow may be correct and fast yet leave distrust or an unpleasant memory. Usability evaluation checks task success, effort and satisfaction; UX also considers expectations, emotions, brand, prior state and later response.", "prompt": "Distinguish Usability Engineering and UX, including an example."}}, {"slides": "32–33", "de": {"title": "Effektivität vs. Effizienz vs. Zufriedenheit", "columns": [["Effektivität", "Vollständige korrekte Zielerreichung."], ["Effizienz", "Ressourcen, Zeit und Aufwand dafür."], ["Zufriedenheit", "Angenehme und akzeptable Nutzung ohne Frustration."]], "tradeoff": "Geschwindigkeit ist bei falschem Ergebnis kein Erfolg. Korrektheit beweist weder geringen Aufwand noch Zufriedenheit.", "question": "Eine Überweisung ist schnell, aber der Betrag falsch. Welcher Faktor scheitert? Vergleiche alle drei.", "answer": "Effektivität scheitert, weil das Ziel nicht korrekt erreicht ist. Effizienz betrifft Ressourcen für erfolgreiche Erledigung, nicht nur Geschwindigkeit. Zufriedenheit betrifft die Reaktion. Viele Schritte bei korrekter Überweisung betreffen besonders Effizienz.", "prompt": "Eine Überweisung ist schnell, aber der Betrag falsch. Welcher Faktor scheitert? Vergleiche alle drei."}, "en": {"title": "Effectiveness vs. efficiency vs. satisfaction", "columns": [["Effectiveness", "Complete and correct goal achievement."], ["Efficiency", "Resources, time and effort required for that achievement."], ["Satisfaction", "Pleasant, acceptable use without frustration."]], "tradeoff": "Speed is not successful use if the outcome is wrong. Correct completion does not prove low effort or satisfaction.", "question": "A transfer is fast but sends the wrong amount. Which factor fails? Compare all three.", "answer": "Effectiveness fails because the intended goal was not correctly achieved. Efficiency concerns resources for successful completion, not speed alone. Satisfaction concerns the person’s response. A correct transfer requiring many steps mainly raises efficiency concerns.", "prompt": "A transfer is fast but sends the wrong amount. Which factor fails? Compare all three."}}, {"slides": "42", "de": {"title": "Affektives vs. kognitives Wohlbefinden", "columns": [["Affektiv", "Gefühle, Emotionen und angenehme/unangenehme Affekte."], ["Kognitiv", "Wahrnehmung und Bewertung des eigenen Glücks oder Lebens."]], "tradeoff": "Momentane Freude und Lebenszufriedenheit sind verbunden, aber verschieden. Die 3:1-Angabe ist kein universeller Schwellenwert.", "question": "Unterscheide beide Komponenten mit Beispielen.", "answer": "Ein freudiger Moment ist affektiv. Die Einschätzung, mit dem Leben zufrieden zu sein, ist kognitiv. Momentane Stimmung ersetzt keine umfassendere Bewertung.", "prompt": "Unterscheide beide Komponenten mit Beispielen."}, "en": {"title": "Affective vs. cognitive well-being", "columns": [["Affective", "Feelings, emotions and pleasant/unpleasant affect."], ["Cognitive", "Perception and evaluation of one’s happiness or life."]], "tradeoff": "Feeling joyful now and judging life as satisfying are related but distinct. Do not treat the lecture’s 3:1 claim as a universal threshold.", "question": "Distinguish the components with one example each.", "answer": "A pleasant moment is affective. Reflecting that one is satisfied with life is cognitive. An assessment of well-being should not substitute momentary mood for the person’s overall evaluation.", "prompt": "Distinguish the components with one example each."}}, {"slides": "36; 40–43", "de": {"title": "UX vs. Positive Design / Design for Well-Being", "columns": [["UX", "Breite Wahrnehmungen und Reaktionen rund um Nutzung."], ["Positive Design", "Positive Erfahrungen, psychologisches Wohlbefinden und Entfaltung gezielt fördern."]], "tradeoff": "Wohlbefinden ist ein Gestaltungsziel, nicht nur attraktive Oberfläche. UX ist umfassender als Attraktivität, auch wenn die Vorlesung damit den Übergang einführt.", "question": "Warum beweist ein angenehmes Erlebnis nicht automatisch langfristiges Wohlbefinden?", "answer": "Kurzer Spaß unterstützt nicht zwangsläufig Sinn, Wachstum oder eigene Ziele. Positive Design betrachtet Virtue, Pleasure, Bedeutsamkeit und langfristige Wirkung. Diese prüfen statt aus Nutzungsdauer oder Aussehen ableiten.", "prompt": "Warum beweist ein angenehmes Erlebnis nicht automatisch langfristiges Wohlbefinden?"}, "en": {"title": "UX vs. Positive Design / Design for Well-Being", "columns": [["UX", "Broad perceptions and responses around use."], ["Positive Design", "Deliberately support positive experience, lasting psychological well-being and flourishing."]], "tradeoff": "Well-being is a design objective, not merely an attractive or enjoyable surface. UX is broader than attractiveness alone, even though the lecture uses that contrast to introduce Positive Design.", "question": "Why does an enjoyable experience not automatically demonstrate long-term well-being?", "answer": "Momentary fun may not support meaning, growth or personal goals. Positive Design considers virtue, pleasure, significance and lasting effects. Evaluate these outcomes rather than infer them from engagement or a good-looking interface.", "prompt": "Why does an enjoyable experience not automatically demonstrate long-term well-being?"}}, {"slides": "43–46", "de": {"title": "Virtue vs. Pleasure vs. Personal Significance", "columns": [["Virtue", "Moralisch gutes bzw. verantwortliches Handeln."], ["Pleasure", "Positive Affekte erleben."], ["Personal Significance", "Persönlich bedeutsame Ziele verfolgen."]], "tradeoff": "Ergänzende Dimensionen statt ausschließlicher Produktkategorien. Balance und individuelle Passung beachten.", "question": "Unterscheide die Dimensionen anhand der Vorlesungsbeispiele.", "answer": "NEST: Wohlfühlen und Energiesparen/Virtue. Recordis: Stolz und Erinnerungen/Pleasure. MiiMo: eigene Gesundheitsziele. Ein Produkt kann mehrere Dimensionen unterstützen.", "prompt": "Unterscheide die Dimensionen anhand der Vorlesungsbeispiele."}, "en": {"title": "Virtue vs. pleasure vs. personal significance", "columns": [["Virtue", "Being morally good / responsible action."], ["Pleasure", "Experiencing positive affect."], ["Personal significance", "Pursuing personally meaningful goals."]], "tradeoff": "They are complementary dimensions, not exclusive product categories. Balance and personal fit matter.", "question": "Distinguish the dimensions and give lecture examples.", "answer": "NEST illustrates comfort and energy-saving virtue; Recordis pleasure through pride/memories; MiiMo personal health goals. Explain why a single product could support more than one dimension.", "prompt": "Distinguish the dimensions and give lecture examples."}}, {"slides": "47–48", "de": {"title": "PERMA-Dimensionen vs. Produktrollen", "columns": [["PERMA", "Wohlbefindensaspekte: Emotionen, Engagement, Beziehungen, Sinn, Zielerreichung."], ["Produktrollen", "Beitragsweisen: Quelle, Symbol, Ermöglichung, Unterstützung."]], "tradeoff": "Eine Rolle kann mehrere Dimensionen fördern. Es sind keine konkurrierenden Phasenmodelle.", "question": "Unterscheide beide anhand Fitnessuhr oder Souvenir.", "answer": "Eine Uhr unterstützt Zielerreichung und ermöglicht Aktivität. Ein Souvenir symbolisiert Sinn und weckt positive Emotionen. Dimension des Wohlbefindens und Beitragsweise getrennt benennen.", "prompt": "Unterscheide beide anhand Fitnessuhr oder Souvenir."}, "en": {"title": "PERMA dimensions vs. product roles", "columns": [["PERMA", "Aspects of well-being: emotion, engagement, relationships, meaning, achievement."], ["Product roles", "Ways to contribute: source, symbol, enablement, support."]], "tradeoff": "One role may support several dimensions. These are not two competing phase models.", "question": "Distinguish the frameworks using a fitness watch or souvenir.", "answer": "A watch may support achievement and enable activity; a souvenir may symbolize meaning and evoke positive emotion. Name the well-being dimension separately from the mechanism or role.", "prompt": "Distinguish the frameworks using a fitness watch or souvenir."}}, {"slides": "2–7", "de": {"prompt": "Nenne die Punkte aus „Mensch, Aufgabe und Kontext“.", "answer": "Mensch · Aufgabe · Kontext"}, "en": {"prompt": "List the items under “Person, task and context”.", "answer": "Person · Task · Context"}}, {"slides": "23–29", "de": {"prompt": "Nenne die Punkte aus „Sechs HCD-Prinzipien“.", "answer": "Menschen, Aufgaben und Umgebung verstehen · Nutzer*innen durchgehend beteiligen · Durch Evaluation gestalten · Iterativ arbeiten · Gesamte UX berücksichtigen · Multidisziplinär arbeiten"}, "en": {"prompt": "List the items under “Six HCD principles”.", "answer": "Understand people, tasks and environments · Involve users throughout · Use evaluation to guide design · Work iteratively · Address the entire UX · Work across disciplines"}}, {"slides": "30–33", "de": {"prompt": "Nenne die Punkte aus „Drei Usability-Kernfaktoren“.", "answer": "Effektivität · Effizienz · Zufriedenheit"}, "en": {"prompt": "List the items under “Three core usability factors”.", "answer": "Effectiveness · Efficiency · Satisfaction"}}, {"slides": "47–48", "de": {"prompt": "Nenne die Punkte aus „PERMA“.", "answer": "Positive Emotions · Engagement · Relationships · Meaning · Achievement"}, "en": {"prompt": "List the items under “PERMA”.", "answer": "Positive emotions · Engagement · Relationships · Meaning · Achievement"}}], "notes": [{"id": "foundations", "lecture": 3, "slides": "2–7", "en": {"title": "People, tasks & context", "content": "\u003cp class=\"lead\">There is no single best interface for every situation. Good design depends on the interaction between the \u003cstrong>person, task and context\u003c/strong>.\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Person\u003c/h3>\u003cp>Abilities, needs, experience, prior knowledge and expectations.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Task\u003c/h3>\u003cp>Goal, complexity, frequency and urgency.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Context\u003c/h3>\u003cp>Place, time, situation, social environment and device.\u003c/p>\u003c/div>\u003c/div>\u003ch3>Examples to remember\u003c/h3>\u003cul>\u003cli>\u003cstrong>Different people:\u003c/strong> a daily banking-app user, an occasional user and a screen-reader user may need different support.\u003c/li>\u003cli>\u003cstrong>Different tasks:\u003c/strong> a graphical file manager may suit renaming one file; a command or script may suit renaming 500 files.\u003c/li>\u003cli>\u003cstrong>Different contexts:\u003c/strong> sending a voice message at home, in a library or on public transport creates different constraints.\u003c/li>\u003c/ul>\u003cp class=\"recall\">Ask: Who is using it? What must they achieve? Under what conditions?\u003c/p>"}, "de": {"title": "Mensch, Aufgabe und Kontext", "content": "\u003cp class='lead'>Es gibt nicht das beste Interface für jede Situation. Gute Gestaltung entsteht im Zusammenspiel von Mensch, Aufgabe und Kontext.\u003c/p>\u003cul>\u003cli>\u003cstrong>Mensch:\u003c/strong> Fähigkeiten, Bedürfnisse, Erfahrung, Vorwissen und Erwartungen.\u003c/li>\u003cli>\u003cstrong>Aufgabe:\u003c/strong> Ziel, Komplexität, Häufigkeit und Dringlichkeit.\u003c/li>\u003cli>\u003cstrong>Kontext:\u003c/strong> Ort, Zeit, Situation, soziales Umfeld und Gerät.\u003c/li>\u003c/ul>\u003ch3>Beispiele\u003c/h3>\u003cp>Tägliche Banking-Nutzer, seltene Nutzer und Screenreader-Nutzer benötigen möglicherweise andere Unterstützung. Ein Dateimanager kann für eine Datei passen, ein Skript für 500. Eine Sprachnachricht hat zu Hause, in der Bibliothek oder im Zug andere Bedingungen.\u003c/p>\u003cp class='recall'>Wer nutzt es? Was soll erreicht werden? Unter welchen Bedingungen?\u003c/p>"}, "comparisons": [], "exam": {"de": {"prompt": "Erkläre Mensch, Aufgabe und Kontext an einem Beispiel.", "answer": "Gelegentlicher Banking-Nutzer: Person. Dringende Überweisung: Aufgabe. Handy im lauten Zug: Kontext. Nenne konkrete Eigenschaften und erkläre die Auswirkungen auf Gestaltung.", "points": [["Mensch", "Fähigkeiten, Bedürfnisse, Erfahrung, Vorwissen und Erwartungen."], ["Aufgabe", "Ziel, Komplexität, Häufigkeit und Dringlichkeit."], ["Kontext", "Ort, Zeit, Situation, soziales Umfeld und Gerät."]], "lists": [{"title": "Mensch, Aufgabe und Kontext", "items": ["Mensch", "Aufgabe", "Kontext"]}]}, "en": {"prompt": "Explain person, task and context using one example.", "answer": "Name the user characteristics, the goal and demands of the task, and the setting. For example: an occasional banking-app user (person) makes an urgent transfer (task) on a phone in a noisy train (context). Explain how these factors affect the design.", "points": [["Different people", "a daily banking-app user, an occasional user and a screen-reader user may need different support."], ["Different tasks", "a graphical file manager may suit renaming one file; a command or script may suit renaming 500 files."], ["Different contexts", "sending a voice message at home, in a library or on public transport creates different constraints."]], "lists": [{"title": "Person, task and context", "items": ["Person", "Task", "Context"]}]}}}, {"id": "factors", "lecture": 3, "slides": "8–12", "en": {"title": "Human Factors & system resilience", "content": "\u003cp>\u003cstrong>Human Factors\u003c/strong> studies physical, psychological, cognitive and social characteristics, and how technical systems can be adapted to people.\u003c/p>\u003cp>Consider sensory perception, attention, stress tolerance, physical abilities and mental limits, together with the demands of the task and environment.\u003c/p>\u003ch3>Swiss cheese model — James Reason\u003c/h3>\u003cp>Each protective layer has weaknesses, like holes in a slice of cheese. When weaknesses align, a hazard can pass through several layers and cause harm. Combining protections can reduce risk.\u003c/p>\u003cp class=\"recall\">Human Factors ≠ Human Error. People can also detect problems, adapt and contribute to resilience.\u003c/p>\u003ch3>Complacency and perceived competence\u003c/h3>\u003cul>\u003cli>\u003cstrong>Complacency:\u003c/strong> excessive reliance on technology can reduce information gathering, processing and anticipation of future situations.\u003c/li>\u003cli>\u003cstrong>Example:\u003c/strong> an operator trusts an alarm so strongly that they stop noticing other warning signs.\u003c/li>\u003cli>\u003cstrong>Subjective competence:\u003c/strong> understanding a system plus the ability to influence it.\u003c/li>\u003cli>Self-controlling systems may leave people with monotonous monitoring tasks, weakening attention and their sense of competence.\u003c/li>\u003c/ul>"}, "de": {"title": "Human Factors und Systemresilienz", "content": "\u003cp>\u003cstrong>Human Factors\u003c/strong> untersucht physische, psychische, kognitive und soziale Eigenschaften und die Anpassung technischer Systeme an Menschen. Dazu zählen Wahrnehmung, Aufmerksamkeit, Stressresistenz und körperliche wie geistige Grenzen sowie Aufgaben- und Umweltbedingungen.\u003c/p>\u003ch3>Schweizer Käsescheibenmodell – James Reason\u003c/h3>\u003cp>Jede Schutzebene hat Schwachstellen. Liegen diese hintereinander, kann eine Gefahr alle Ebenen passieren. Mehrere geeignete Schutzmaßnahmen können Risiken verringern.\u003c/p>\u003cp class='recall'>Human Factors ≠ Human Error. Menschen erkennen Probleme, passen sich an und tragen zur Resilienz bei.\u003c/p>\u003ch3>Complacency und Kompetenzempfinden\u003c/h3>\u003cul>\u003cli>Übermäßiges Technikvertrauen kann Informationsaufnahme, Verarbeitung und Zukunftsplanung schwächen.\u003c/li>\u003cli>Beispiel: Alarme werden so stark vertraut, dass andere Warnzeichen unbeachtet bleiben.\u003c/li>\u003cli>Subjektive Kompetenz = Systemverständnis + Einflussmöglichkeiten.\u003c/li>\u003cli>Monotone Überwachung selbststeuernder Systeme kann Aufmerksamkeit und Kompetenzgefühl verringern.\u003c/li>\u003c/ul>"}, "comparisons": [{"slides": "8–11", "de": {"title": "Human Factors vs. Human Error", "columns": [["Human Factors", "Menschliche Eigenschaften und passende Systeme untersuchen."], ["Human Error", "Fehler menschlichen Handelns als ein Aspekt im Gesamtsystem."]], "tradeoff": "Keine konkurrierenden Ansätze. Die Gleichsetzung übersieht Anpassung, Resilienz und Systemschwächen.", "question": "Warum sind Human Factors nicht dasselbe wie Human Error?", "answer": "Human Factors umfasst physische, psychische, kognitive und soziale Merkmale. Fehler hängen auch von Systembedingungen ab; Menschen erkennen und beheben Probleme. Käsescheibenmodell statt alleiniger Schuldzuweisung nutzen."}, "en": {"title": "Human Factors vs. Human Error", "columns": [["Human Factors", "Study human characteristics and how systems fit people."], ["Human Error", "An error in human action; one concern within the wider system."]], "tradeoff": "They are not competing approaches. Reducing the field to error misses human adaptation and resilience and can hide system weaknesses.", "question": "Explain why Human Factors is not the same as Human Error.", "answer": "Human Factors includes physical, psychological, cognitive and social characteristics. Errors may arise through system conditions; people can also detect, recover and adapt. Use the Swiss cheese model to discuss layers rather than blaming one operator."}}], "exam": {"de": {"prompt": "Erkläre das Käsescheibenmodell ohne eine Einzelperson zu beschuldigen.", "answer": "Alle Schutzschichten haben Schwächen; ausgerichtete Lücken ermöglichen Schaden. Systembedingungen und mehrere Schutzmaßnahmen prüfen. Menschen können zusätzlich Resilienz stärken.", "points": [["Human Factors", "untersucht physische, psychische, kognitive und soziale Eigenschaften und die Anpassung technischer Systeme an Menschen. Dazu zählen Wahrnehmung, Aufmerksamkeit, Stressresistenz und körperliche wie geistige Grenzen sowie Aufgaben- und Umweltbedingungen."]], "lists": [{"title": "Drei Betrachtungsebenen", "items": ["Individuum", "Aufgabe", "Umwelt"]}]}, "en": {"prompt": "Explain the Swiss cheese model without blaming one person.", "answer": "Each protective layer has weaknesses. A hazard can cause harm when weaknesses align across layers. Analyze system conditions and improve several protections; recognize that people can also increase resilience.", "points": [["Complacency", "excessive reliance on technology can reduce information gathering, processing and anticipation of future situations."], ["Example", "an operator trusts an alarm so strongly that they stop noticing other warning signs."], ["Subjective competence", "understanding a system plus the ability to influence it."]], "lists": [{"title": "Three levels of analysis", "items": ["Individual", "Task", "Environment"]}]}}}, {"id": "perspectives", "lecture": 3, "slides": "13–22, 38", "en": {"title": "Human Factors, HCI, HCC & HCD", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Perspective\u003c/th>\u003cth>Central question\u003c/th>\u003cth>Remember\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Human Factors\u003c/td>\u003ctd>What can people do, and where are their limits?\u003c/td>\u003ctd>Understand people\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HCI — Human–Computer Interaction\u003c/td>\u003ctd>How do people interact with computer systems?\u003c/td>\u003ctd>Understand interaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HCC — Human-Centered Computing\u003c/td>\u003ctd>How are people, computing and everyday life connected?\u003c/td>\u003ctd>Understand context\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HCD — Human-Centered Design\u003c/td>\u003ctd>How do we apply these insights systematically in design?\u003c/td>\u003ctd>Design process\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These perspectives overlap. HCC broadens attention to social, cultural and organizational structures; HCD provides an approach for designing around people.\u003c/p>\u003ch3>Four HCI development phases in the lecture\u003c/h3>\u003col>\u003cli>\u003cstrong>1980s — Interactive systems:\u003c/strong> individual users and graphical WIMP interfaces.\u003c/li>\u003cli>\u003cstrong>Early 1990s — Cooperative systems:\u003c/strong> groups, teams and collaboration, still using WIMP interfaces.\u003c/li>\u003cli>\u003cstrong>Late 1990s — Ubiquitous systems:\u003c/strong> embedded and mobile computing across everyday settings.\u003c/li>\u003cli>\u003cstrong>2000s — Ambient intelligence:\u003c/strong> intelligent environments, such as smart homes.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>WIMP:\u003c/strong> Windows, Icons, Menus, Pointing Devices.\u003c/p>\u003ch3>Interaction is a feedback loop\u003c/h3>\u003cp>Perceive → Interpret → Decide → Act/input → System processes → Feedback/output → Perceive again.\u003c/p>\u003cp>\u003cstrong>WhatsApp:\u003c/strong> goal to send a message → tap Send → system transmits it → check mark appears → user perceives and interprets the feedback.\u003c/p>\u003ch3>Why is WhatsApp sociotechnical?\u003c/h3>\u003cp>It connects the individual, social relationships, technology, rules and conventions, the organization, and society/context. Response-time expectations, group rules, infrastructure, privacy expectations and business decisions all shape use.\u003c/p>\u003cp>UX design is interdisciplinary: design, psychology, ergonomics, computer science, information architecture and other fields contribute.\u003c/p>"}, "de": {"title": "Human Factors, HCI, HCC und HCD", "content": "\u003cul>\u003cli>\u003cstrong>Human Factors:\u003c/strong> Fähigkeiten und Grenzen verstehen.\u003c/li>\u003cli>\u003cstrong>HCI – Human-Computer Interaction:\u003c/strong> Interaktion mit Computersystemen verstehen.\u003c/li>\u003cli>\u003cstrong>HCC – Human-Centered Computing:\u003c/strong> Verbindungen zwischen Mensch, Computing und Lebenswelt verstehen.\u003c/li>\u003cli>\u003cstrong>HCD – Human-Centered Design:\u003c/strong> Erkenntnisse systematisch im Gestaltungsprozess anwenden.\u003c/li>\u003c/ul>\u003cp>Die Perspektiven überschneiden sich; HCC erweitert den sozialen und kulturellen Blick, HCD bietet ein Vorgehen.\u003c/p>\u003ch3>Vier HCI-Phasen\u003c/h3>\u003col>\u003cli>1980er: interaktive Systeme, einzelne Nutzer und WIMP.\u003c/li>\u003cli>Frühe 1990er: kooperative Systeme, Teams und Kommunikation.\u003c/li>\u003cli>Späte 1990er: ubiquitäre, eingebettete und mobile Systeme.\u003c/li>\u003cli>2000er: Ambient Intelligence und intelligente Umgebungen.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>WIMP:\u003c/strong> Windows, Icons, Menus, Pointing Devices.\u003c/p>\u003ch3>Feedbackkreislauf\u003c/h3>\u003cp>Wahrnehmen → Interpretieren → Entscheiden → Handeln/Eingabe → Verarbeitung → Feedback/Ausgabe → erneute Wahrnehmung.\u003c/p>\u003cp>WhatsApp: Nachricht senden wollen, Senden antippen, übertragen, Häkchen anzeigen, wahrnehmen und verstehen.\u003c/p>\u003ch3>Soziotechnisches System\u003c/h3>\u003cp>Individuum, Beziehungen, Technik, Regeln, Organisation und Gesellschaft beeinflussen sich. Antwortnormen, Gruppenregeln, Datenschutz, Infrastruktur und Geschäftsentscheidungen prägen Nutzung.\u003c/p>\u003cp>UX-Design verbindet unter anderem Gestaltung, Psychologie, Ergonomie, Informatik und Informationsarchitektur.\u003c/p>"}, "comparisons": [{"slides": "14–22; 38", "de": {"title": "Human Factors vs. HCI vs. HCC vs. HCD", "columns": [["Human Factors", "Fähigkeiten und Grenzen verstehen."], ["HCI", "Interaktion mit Computersystemen verstehen."], ["HCC", "Computing in sozialer und alltäglicher Lebenswelt verstehen."], ["HCD", "Erkenntnisse in einem menschenzentrierten iterativen Prozess anwenden."]], "tradeoff": "Perspektiven ergänzen sich. Unterschied sind Leitfrage und Reichweite, nicht ein Wettbewerb.", "question": "Unterscheide die vier Begriffe und beziehe sie auf ein Produkt.", "answer": "Banking: Wahrnehmungs-/Aufmerksamkeitsgrenzen sind Human Factors; Handlung/Feedback HCI; kulturelle, soziale und organisatorische Nutzung HCC; Forschung, Anforderungen, Prototyp und Evaluation HCD."}, "en": {"title": "Human Factors vs. HCI vs. HCC vs. HCD", "columns": [["Human Factors", "Understand capabilities and limits."], ["HCI", "Understand interaction with computer systems."], ["HCC", "Understand computing in people’s social and everyday world."], ["HCD", "Apply insights through a human-centered iterative design process."]], "tradeoff": "These perspectives overlap and support one another. Their main distinction is the question and scope, not a contest over which is best.", "question": "Distinguish the four terms and relate them to one product.", "answer": "For a banking app: perception/attention limits are Human Factors; action/feedback is HCI; social, cultural and organizational use is HCC; research, requirements, prototypes and evaluation describe HCD."}}], "exam": {"de": {"prompt": "Vergleiche Human Factors, HCI, HCC und HCD.", "answer": "Human Factors: Fähigkeiten/Grenzen. HCI: Interaktion mit Computersystemen. HCC: Computing in Lebenswelt und soziotechnischem Kontext. HCD: iteratives Vorgehen zur Anwendung dieser Erkenntnisse.", "points": [["Human Factors", "Fähigkeiten und Grenzen verstehen."], ["HCI – Human-Computer Interaction", "Interaktion mit Computersystemen verstehen."], ["HCC – Human-Centered Computing", "Verbindungen zwischen Mensch, Computing und Lebenswelt verstehen."], ["HCD – Human-Centered Design", "Erkenntnisse systematisch im Gestaltungsprozess anwenden."]], "lists": [{"title": "Vier Perspektiven", "items": ["Human Factors", "HCI", "HCC", "HCD"]}, {"title": "Vier HCI-Phasen", "items": ["Interaktive Systeme", "Kooperative Systeme", "Ubiquitäre Systeme", "Ambient Intelligence"]}]}, "en": {"prompt": "Compare Human Factors, HCI, HCC and HCD.", "answer": "Human Factors: capabilities and limits. HCI: interaction between people and computer systems. HCC: computing within everyday and sociotechnical contexts. HCD: an iterative approach for applying these insights to design.", "points": [["1980s — Interactive systems", "individual users and graphical WIMP interfaces."], ["Early 1990s — Cooperative systems", "groups, teams and collaboration, still using WIMP interfaces."], ["Late 1990s — Ubiquitous systems", "embedded and mobile computing across everyday settings."], ["2000s — Ambient intelligence", "intelligent environments, such as smart homes."]], "lists": [{"title": "Four perspectives", "items": ["Human factors", "HCI", "HCC", "HCD"]}, {"title": "Four HCI phases", "items": ["Interactive systems", "Cooperative systems", "Ubiquitous systems", "Ambient intelligence"]}]}}}, {"id": "hcd", "lecture": 3, "slides": "23–29", "en": {"title": "Human-centered design in practice", "content": "\u003cp>\u003cstrong>HCD\u003c/strong> makes interactive systems usable and useful by focusing on users, needs and requirements and applying Human Factors and usability knowledge.\u003c/p>\u003cp class=\"recall\">Technical feasibility does not establish human relevance.\u003c/p>\u003cp>\u003cstrong>AI-summary example:\u003c/strong> “We can build it” is insufficient. Ask who needs summaries, which messages matter, when summaries are needed, what must not be lost, whether people trust them, and what happens when they are wrong.\u003c/p>\u003ch3>Six principles — ISO 9241-210 as presented in the lecture\u003c/h3>\u003col>\u003cli>Understand users, tasks and environments.\u003c/li>\u003cli>Involve users throughout the process.\u003c/li>\u003cli>Let user evaluation drive and refine design.\u003c/li>\u003cli>Work iteratively.\u003c/li>\u003cli>Address the whole user experience.\u003c/li>\u003cli>Include multidisciplinary skills and perspectives.\u003c/li>\u003c/ol>\u003ch3>The process\u003c/h3>\u003col>\u003cli>Plan the HCD process.\u003c/li>\u003cli>Understand and specify the context of use.\u003c/li>\u003cli>Specify user requirements.\u003c/li>\u003cli>Produce design solutions.\u003c/li>\u003cli>Evaluate against requirements and iterate where needed.\u003c/li>\u003c/ol>\u003cp>Evaluation can send you back to context, requirements or solutions. This is not a one-way checklist.\u003c/p>\u003cp>\u003cstrong>Denzinger’s emphasis:\u003c/strong> quality of life, finding the real problem, evidence from observation and analysis, iteration, and learning by doing.\u003c/p>"}, "de": {"title": "Menschenzentrierte Gestaltung in der Praxis", "content": "\u003cp>\u003cstrong>HCD\u003c/strong> macht interaktive Systeme brauchbar und nützlich: Fokus auf Menschen, Bedürfnisse und Anforderungen sowie Human-Factors- und Usabilitywissen.\u003c/p>\u003cp class='recall'>Technische Machbarkeit beantwortet noch nicht die Frage nach menschlicher Relevanz.\u003c/p>\u003cp>Bei KI-Zusammenfassungen fragen: Wer braucht sie? Welche Nachrichten zählen? Wann? Was darf nicht verloren gehen? Besteht Vertrauen? Was passiert bei Fehlern?\u003c/p>\u003ch3>Sechs Prinzipien nach ISO 9241-210 in der Vorlesung\u003c/h3>\u003col>\u003cli>Menschen, Aufgaben und Umgebung verstehen.\u003c/li>\u003cli>Nutzer durchgehend beteiligen.\u003c/li>\u003cli>Evaluation treibt und verfeinert Design.\u003c/li>\u003cli>Iterativ arbeiten.\u003c/li>\u003cli>Die gesamte UX adressieren.\u003c/li>\u003cli>Multidisziplinäre Fähigkeiten und Perspektiven einbeziehen.\u003c/li>\u003c/ol>\u003ch3>Prozess\u003c/h3>\u003col>\u003cli>HCD planen.\u003c/li>\u003cli>Nutzungskontext verstehen und spezifizieren.\u003c/li>\u003cli>Nutzeranforderungen spezifizieren.\u003c/li>\u003cli>Gestaltungslösungen entwickeln.\u003c/li>\u003cli>Gegen Anforderungen evaluieren und bei Bedarf zurückgehen.\u003c/li>\u003c/ol>\u003cp>Denzinger betont Lebensqualität, Problemfindung, Evidenz aus Beobachtung/Analyse, Iteration und Learning-by-Doing.\u003c/p>"}, "comparisons": [{"slides": "23–29", "de": {"title": "Technologiezentriert vs. menschenzentriert", "columns": [["Technologiezentriert", "Verfügbare Fähigkeit nehmen, Funktion bauen und veröffentlichen."], ["Menschenzentriert", "Menschen, Kontext, Bedürfnisse, Anforderungen und Folgen erforschen; Alternativen evaluieren."]], "tradeoff": "Technisch funktionierend heißt nicht relevant oder verantwortungsvoll. Forschung reduziert ungeprüfte Annahmen, benötigt aber Zeit und Iteration.", "question": "Vergleiche beide Ansätze für KI-Gruppenzusammenfassungen.", "answer": "Technik zuerst: LLM und Button einbauen. HCD: Wer braucht wann welche Inhalte, mit welchem Vertrauen und welchen Fehlerfolgen? Machbarkeit und menschliche Relevanz unterscheiden und verbinden."}, "en": {"title": "Technology-centered vs. human-centered", "columns": [["Technology-centered", "Start with an available capability, build a function and release it."], ["Human-centered", "Investigate people, context, needs, requirements and consequences; then evaluate alternatives."]], "tradeoff": "A capability can work and still be irrelevant or harmful. Human-centered inquiry reduces untested assumptions but requires research and iteration.", "question": "Compare both approaches for an AI group-chat summary.", "answer": "Technology-first asks how to add an LLM/button. HCD asks who needs a summary, when, which content matters, trust and errors. Technical feasibility and human relevance are distinct; integrate both."}}], "exam": {"de": {"prompt": "Beschreibe HCD für eine KI-Chat-Zusammenfassung.", "answer": "Forschung planen; Menschen und Kontext verstehen; Anforderungen wie Erhalt kritischer Information definieren; Prototyp entwickeln; Nutzen, Vertrauen und Fehler evaluieren; iterieren und verschiedene Disziplinen beteiligen.", "points": [["HCD", "macht interaktive Systeme brauchbar und nützlich: Fokus auf Menschen, Bedürfnisse und Anforderungen sowie Human-Factors- und Usabilitywissen."]], "lists": [{"title": "Sechs HCD-Prinzipien", "items": ["Menschen, Aufgaben und Umgebung verstehen", "Nutzer*innen durchgehend beteiligen", "Durch Evaluation gestalten", "Iterativ arbeiten", "Gesamte UX berücksichtigen", "Multidisziplinär arbeiten"]}]}, "en": {"prompt": "Describe an HCD process for an AI chat-summary feature.", "answer": "Plan research; understand who needs summaries and in what context; define requirements such as preserving critical information; prototype; evaluate usefulness, trust and errors with users; iterate. Include a multidisciplinary perspective.", "points": [["HCD", "makes interactive systems usable and useful by focusing on users, needs and requirements and applying Human Factors and usability knowledge."], ["AI-summary example", "“We can build it” is insufficient. Ask who needs summaries, which messages matter, when summaries are needed, what must not be lost, whether people trust them, and what happens when they are wrong."], ["Denzinger’s emphasis", "quality of life, finding the real problem, evidence from observation and analysis, iteration, and learning by doing."]], "lists": [{"title": "Six HCD principles", "items": ["Understand people, tasks and environments", "Involve users throughout", "Use evaluation to guide design", "Work iteratively", "Address the entire UX", "Work across disciplines"]}]}}}, {"id": "usability", "lecture": 3, "slides": "30–33", "en": {"title": "Usability: the three core factors", "content": "\u003cp class=\"lead\">Usability concerns whether \u003cstrong>specified users\u003c/strong> can achieve \u003cstrong>specified goals\u003c/strong> with \u003cstrong>effectiveness, efficiency and satisfaction\u003c/strong> in a \u003cstrong>specified context of use\u003c/strong> (ISO 9241-11).\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Effectiveness\u003c/h3>\u003cp>Can users achieve the goal completely and correctly?\u003c/p>\u003cp>\u003cem>Example:\u003c/em> completing a bank transfer with the intended recipient and amount.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Efficiency\u003c/h3>\u003cp>How much time and effort does successful completion require?\u003c/p>\u003cp>\u003cem>Example:\u003c/em> completing that transfer with fewer unnecessary steps.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Satisfaction\u003c/h3>\u003cp>Is the interaction acceptable and pleasant rather than frustrating?\u003c/p>\u003cp>\u003cem>Example:\u003c/em> users feel comfortable with the transfer process.\u003c/p>\u003c/div>\u003c/div>\u003ch3>Additional criteria\u003c/h3>\u003cul>\u003cli>\u003cstrong>Learnability:\u003c/strong> ease of learning basic tasks on first use.\u003c/li>\u003cli>\u003cstrong>Memorability:\u003c/strong> ease of returning after a period of non-use.\u003c/li>\u003cli>\u003cstrong>Error tolerance:\u003c/strong> handling incorrect input and providing recovery.\u003c/li>\u003cli>\u003cstrong>Accessibility:\u003c/strong> enabling people with diverse abilities to use the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Narrow vs broad view:\u003c/strong> the historical narrow view treats usability as a product property; the broader view requires attention to users, tasks and context.\u003c/p>\u003cp class=\"recall\">A beautiful interface can still have poor usability. A fast interaction is not effective if it produces the wrong result.\u003c/p>\u003cdetails>\u003csummary>Historical detail from the lecture\u003c/summary>\u003cp>Early usability engineering emphasized process models, checklists, questionnaires, menu counts (7 ± 2), font sizes and pictograms. The slide mentions blue underlined links and blue image borders as historical conventions, not universal design requirements.\u003c/p>\u003c/details>"}, "de": {"title": "Usability: drei Kernfaktoren", "content": "\u003cp class='lead'>Gebrauchstauglichkeit beschreibt, ob bestimmte Menschen bestimmte Ziele in einem bestimmten Nutzungskontext effektiv, effizient und zufriedenstellend erreichen können (ISO 9241-11).\u003c/p>\u003cul>\u003cli>\u003cstrong>Effektivität:\u003c/strong> Ziel vollständig und korrekt erreichen, etwa richtiger Betrag und Empfänger.\u003c/li>\u003cli>\u003cstrong>Effizienz:\u003c/strong> Möglichst wenig Zeit und Aufwand für erfolgreiche Zielerreichung, etwa weniger unnötige Schritte.\u003c/li>\u003cli>\u003cstrong>Zufriedenheit:\u003c/strong> Angenehme und akzeptable statt frustrierende Bedienung.\u003c/li>\u003c/ul>\u003ch3>Weitere Kriterien\u003c/h3>\u003cul>\u003cli>Erlernbarkeit: Grundaufgaben beim ersten Gebrauch verstehen.\u003c/li>\u003cli>Einprägsamkeit: Nach Nichtnutzung wieder zurechtkommen.\u003c/li>\u003cli>Fehlertoleranz: Falsche Eingaben abfangen und Erholung ermöglichen.\u003c/li>\u003cli>Barrierefreiheit: Menschen mit unterschiedlichen Fähigkeiten berücksichtigen.\u003c/li>\u003c/ul>\u003cp>Die enge historische Sicht behandelt Usability als Produkteigenschaft; die breite Sicht berücksichtigt Menschen, Aufgaben und Kontext.\u003c/p>\u003cp class='recall'>Ein schönes Interface kann schlecht bedienbar sein. Schnell ist nicht effektiv, wenn das Ergebnis falsch ist.\u003c/p>\u003cdetails>\u003csummary>Historisches Detail\u003c/summary>\u003cp>Frühes Usability Engineering betonte Vorgehensmodelle, Checklisten, Fragebögen, Menüanzahl (7 ± 2), Schrift und Piktogramme. Blaue unterstrichene Links und blaue Bildränder sind historische Konventionen, keine universellen heutigen Anforderungen.\u003c/p>\u003c/details>"}, "comparisons": [{"slides": "31–32", "de": {"title": "Enge vs. breite Usability-Sicht", "columns": [["Enge historische Sicht", "Usability vor allem als Produkt-/Funktionsqualität unabhängig vom Kontext."], ["Breite Sicht", "Bestimmte Menschen erreichen Ziele in einem bestimmten Kontext."]], "tradeoff": "Checklisten prüfen Eigenschaften, beweisen aber keine Eignung für jede Situation. Die ISO-Definition ist kontextbezogen.", "question": "Warum kann dasselbe Produkt in einer Umgebung brauchbar und in einer anderen schwierig sein?", "answer": "Sprachbedienung passt eventuell zu Hause, aber nicht zu Bibliotheksnormen. Fähigkeiten und Aufgaben verändern die Bewertung. Menschen, Ziele und Kontext vor Effektivität, Effizienz und Zufriedenheit benennen."}, "en": {"title": "Narrow vs. broad view of usability", "columns": [["Narrow historical view", "Treat usability mainly as product/function quality, apart from context."], ["Broad view", "Evaluate specified users achieving goals in a specified context."]], "tradeoff": "A checklist can identify useful properties but does not establish suitability for every use situation. The ISO definition in the lecture is contextual.", "question": "Explain why the same product can be usable in one setting and difficult in another.", "answer": "A voice action may fit a private home and conflict with library norms. User ability and task demands also change the evaluation. Name people, goals and context before judging effectiveness, efficiency and satisfaction."}}, {"slides": "32–33", "de": {"title": "Effektivität vs. Effizienz vs. Zufriedenheit", "columns": [["Effektivität", "Vollständige korrekte Zielerreichung."], ["Effizienz", "Ressourcen, Zeit und Aufwand dafür."], ["Zufriedenheit", "Angenehme und akzeptable Nutzung ohne Frustration."]], "tradeoff": "Geschwindigkeit ist bei falschem Ergebnis kein Erfolg. Korrektheit beweist weder geringen Aufwand noch Zufriedenheit.", "question": "Eine Überweisung ist schnell, aber der Betrag falsch. Welcher Faktor scheitert? Vergleiche alle drei.", "answer": "Effektivität scheitert, weil das Ziel nicht korrekt erreicht ist. Effizienz betrifft Ressourcen für erfolgreiche Erledigung, nicht nur Geschwindigkeit. Zufriedenheit betrifft die Reaktion. Viele Schritte bei korrekter Überweisung betreffen besonders Effizienz."}, "en": {"title": "Effectiveness vs. efficiency vs. satisfaction", "columns": [["Effectiveness", "Complete and correct goal achievement."], ["Efficiency", "Resources, time and effort required for that achievement."], ["Satisfaction", "Pleasant, acceptable use without frustration."]], "tradeoff": "Speed is not successful use if the outcome is wrong. Correct completion does not prove low effort or satisfaction.", "question": "A transfer is fast but sends the wrong amount. Which factor fails? Compare all three.", "answer": "Effectiveness fails because the intended goal was not correctly achieved. Efficiency concerns resources for successful completion, not speed alone. Satisfaction concerns the person’s response. A correct transfer requiring many steps mainly raises efficiency concerns."}}], "exam": {"de": {"prompt": "Plane eine Evaluation mit drei Usability-Kernfaktoren und vier Zusatzkriterien.", "answer": "Menschen, Ziele und Kontext festlegen. Effektivität, Zeit/Aufwand und Zufriedenheit beobachten; Erlernbarkeit, Einprägsamkeit, Fehlertoleranz und Barrierefreiheit prüfen. Grenzen eines einzelnen Tests benennen.", "points": [["Effektivität", "Ziel vollständig und korrekt erreichen, etwa richtiger Betrag und Empfänger."], ["Effizienz", "Möglichst wenig Zeit und Aufwand für erfolgreiche Zielerreichung, etwa weniger unnötige Schritte."], ["Zufriedenheit", "Angenehme und akzeptable statt frustrierende Bedienung."]], "lists": [{"title": "Drei Usability-Kernfaktoren", "items": ["Effektivität", "Effizienz", "Zufriedenheit"]}]}, "en": {"prompt": "Design a usability evaluation using the three core factors and four additional criteria.", "answer": "Define users, goals and context. Observe effectiveness, time/effort and satisfaction; examine learnability, memorability, error tolerance and accessibility. Specify realistic tasks and acknowledge what one session cannot assess.", "points": [["Learnability", "ease of learning basic tasks on first use."], ["Memorability", "ease of returning after a period of non-use."], ["Error tolerance", "handling incorrect input and providing recovery."], ["Accessibility", "enabling people with diverse abilities to use the product."]], "lists": [{"title": "Three core usability factors", "items": ["Effectiveness", "Efficiency", "Satisfaction"]}]}}}, {"id": "ux", "lecture": 3, "slides": "34–37", "en": {"title": "User experience goes beyond task completion", "content": "\u003cp>\u003cstrong>UX\u003c/strong> includes a person’s perceptions and responses resulting from actual or anticipated use of a product, system or service (ISO 9241-210).\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Before use\u003c/h3>\u003cp>Expectations, brand impressions and anticipation.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>During use\u003c/h3>\u003cp>Emotions, perceptions, behavior, effort and physical responses.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>After use\u003c/h3>\u003cp>Memories, judgments and feelings about the experience.\u003c/p>\u003c/div>\u003c/div>\u003cp>UX is influenced by the product, performance, presentation, interaction, assistive capabilities, the person’s prior experiences and state, and context.\u003c/p>\u003cp>\u003cstrong>Historical transition in the lecture:\u003c/strong> task-oriented usability → Joy of Use (1988) → Emotional Usability (Robert J. Logan, 1994) → broader emphasis on UX.\u003c/p>\u003cp class=\"recall\">We cannot fully determine an experience. We can design conditions that support a desired experience.\u003c/p>\u003cp>\u003cstrong>Compare:\u003c/strong> usability asks how well someone completes a booking; UX also includes anticipation, trust, frustration, delight and the memory of the experience.\u003c/p>"}, "de": {"title": "User Experience über die Aufgabenerledigung hinaus", "content": "\u003cp>\u003cstrong>UX\u003c/strong> umfasst Wahrnehmungen und Reaktionen aus tatsächlicher oder erwarteter Nutzung eines Produkts, Systems oder Services (ISO 9241-210).\u003c/p>\u003cul>\u003cli>\u003cstrong>Davor:\u003c/strong> Erwartungen, Markenbild und Vorfreude.\u003c/li>\u003cli>\u003cstrong>Währenddessen:\u003c/strong> Emotionen, Wahrnehmung, Verhalten, Aufwand und körperliche Reaktionen.\u003c/li>\u003cli>\u003cstrong>Danach:\u003c/strong> Erinnerung, Bewertung und Gefühle.\u003c/li>\u003c/ul>\u003cp>Produkt, Leistung, Darstellung, Interaktion und Hilfsfunktionen wirken ebenso wie Vorerfahrung, Fähigkeiten, Persönlichkeit, Zustand und Kontext.\u003c/p>\u003cp>Historische Entwicklung der Folien: aufgabenbezogene Usability → Joy of Use 1988 → Emotional Usability (Logan 1994) → breiterer UX-Fokus.\u003c/p>\u003cp class='recall'>Erfahrungen lassen sich nicht vollständig bestimmen; Bedingungen für gewünschte Erfahrungen lassen sich gestalten.\u003c/p>\u003cp>Beim Buchungsprodukt betrifft Usability die erfolgreiche und effiziente Buchung; UX umfasst zusätzlich Erwartungen, Vertrauen, Emotionen und spätere Erinnerung.\u003c/p>"}, "comparisons": [{"slides": "31–37", "de": {"title": "Usability Engineering vs. User Experience", "columns": [["Usability Engineering", "Systematische Gestaltung erfolgreicher, effizienter und zufriedenstellender Nutzung; historisch aufgaben-/prozessbezogen."], ["User Experience", "Wahrnehmungen und Reaktionen aus erwarteter und tatsächlicher Nutzung davor, dabei und danach."]], "tradeoff": "Usability trägt zur UX bei. Es ist nicht bloß „Funktion gegen Schönheit“; Zufriedenheit und Emotionen überschneiden sich.", "question": "Unterscheide Usability Engineering und UX anhand eines Beispiels.", "answer": "Eine Buchung kann schnell und korrekt sein und dennoch Misstrauen hinterlassen. Usability prüft Erfolg, Aufwand und Zufriedenheit. UX umfasst zusätzlich Erwartungen, Gefühle, Marke, Vorerfahrung und spätere Reaktion."}, "en": {"title": "Usability Engineering vs. User Experience", "columns": [["Usability Engineering", "Systematic work on successful, efficient, satisfactory use; historically task/process focused."], ["User Experience", "Perceptions and responses from anticipated and actual use, before, during and after."]], "tradeoff": "They overlap: usability contributes to UX. Neither reduces to “function versus beauty”; satisfaction and emotions can intersect.", "question": "Distinguish Usability Engineering and UX, including an example.", "answer": "A booking flow may be correct and fast yet leave distrust or an unpleasant memory. Usability evaluation checks task success, effort and satisfaction; UX also considers expectations, emotions, brand, prior state and later response."}}], "exam": {"de": {"prompt": "Erkläre UX vor, während und nach Nutzung.", "answer": "Erwartung/Marke, Interaktion und Reaktionen sowie Erinnerung/Bewertung. Vorerfahrungen, Zustand, Kontext und Systemmerkmale einbeziehen.", "points": [["Davor", "Erwartungen, Markenbild und Vorfreude."], ["Währenddessen", "Emotionen, Wahrnehmung, Verhalten, Aufwand und körperliche Reaktionen."], ["Danach", "Erinnerung, Bewertung und Gefühle."]], "lists": [{"title": "Zeitliche UX-Perspektiven", "items": ["Vor der Nutzung", "Während der Nutzung", "Nach der Nutzung"]}]}, "en": {"prompt": "Explain before-, during- and after-use UX with one product.", "answer": "Include anticipated use/brand expectations, interaction emotions and responses, and later memory or evaluation. Discuss prior experience, internal state, context and system characteristics.", "points": [["UX", "includes a person’s perceptions and responses resulting from actual or anticipated use of a product, system or service (ISO 9241-210)."], ["Historical transition in the lecture", "task-oriented usability → Joy of Use (1988) → Emotional Usability (Robert J. Logan, 1994) → broader emphasis on UX."], ["Compare", "usability asks how well someone completes a booking; UX also includes anticipation, trust, frustration, delight and the memory of the experience."]], "lists": [{"title": "UX over time", "items": ["Before use", "During use", "After use"]}]}}}, {"id": "positive", "lecture": 3, "slides": "39–43", "en": {"title": "Positive Design & subjective well-being", "content": "\u003cp>\u003cstrong>Positive Design\u003c/strong> explores how design supports well-being and positive experiences. Its aim goes beyond brief enjoyment to longer-term psychological well-being and human flourishing.\u003c/p>\u003cp>It draws on positive psychology and asks: What makes people happy? What supports well-being over time? What positive value can design create?\u003c/p>\u003ch3>Subjective well-being\u003c/h3>\u003cul>\u003cli>\u003cstrong>Affective component:\u003c/strong> feelings and emotions; the balance of pleasant and unpleasant affect.\u003c/li>\u003cli>\u003cstrong>Cognitive component:\u003c/strong> a person’s perception and evaluation of their own happiness.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Ten positive emotions listed:\u003c/strong> pride, interest, hope, inspiration, gratitude, amusement, love, serenity/cheerfulness, awe and joy.\u003c/p>\u003cdetails>\u003csummary>Lecture-specific detail: the 3:1 ratio\u003c/summary>\u003cp>Slide 42 states a 3:1 positive-to-negative affect ratio. Treat this as a claim in the lecture, not a universal threshold established by this reviewer.\u003c/p>\u003c/details>\u003cp class=\"recall\">Human flourishing means enriching life and developing potential through meaning, engagement, positive emotion, purpose, growth and social responsibility.\u003c/p>"}, "de": {"title": "Positive Design und subjektives Wohlbefinden", "content": "\u003cp>Positive Design untersucht, wie Gestaltung Wohlbefinden und positive Erfahrungen unterstützt. Es geht über kurzen Spaß hinaus zu längerfristigem psychologischem Wohlbefinden und menschlicher Entfaltung.\u003c/p>\u003cp>Es nutzt Positive Psychologie und fragt nach Glück, dauerhaftem Wohlbefinden und zusätzlichem positivem Wert.\u003c/p>\u003cul>\u003cli>\u003cstrong>Affektiv:\u003c/strong> Gefühle und Emotionen; Verhältnis angenehmer und unangenehmer Affekte.\u003c/li>\u003cli>\u003cstrong>Kognitiv:\u003c/strong> Wahrnehmung und Bewertung des eigenen Glücks.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Zehn positive Emotionen:\u003c/strong> Stolz, Interesse, Hoffnung, Inspiration, Dankbarkeit, Vergnügen, Liebe, Heiterkeit, Ehrfurcht und Freude.\u003c/p>\u003cdetails>\u003csummary>Die 3:1-Angabe der Vorlesung\u003c/summary>\u003cp>Folie 42 nennt ein Verhältnis positiver zu negativer Affekte von 3:1. Dies ist eine Quellenangabe der Vorlesung, kein hier bestätigter universeller Schwellenwert.\u003c/p>\u003c/details>\u003cp class='recall'>Human Flourishing: Potenziale entfalten durch Sinn, Engagement, positive Emotionen, Lebenszweck, Wachstum und soziale Verantwortung.\u003c/p>"}, "comparisons": [{"slides": "42", "de": {"title": "Affektives vs. kognitives Wohlbefinden", "columns": [["Affektiv", "Gefühle, Emotionen und angenehme/unangenehme Affekte."], ["Kognitiv", "Wahrnehmung und Bewertung des eigenen Glücks oder Lebens."]], "tradeoff": "Momentane Freude und Lebenszufriedenheit sind verbunden, aber verschieden. Die 3:1-Angabe ist kein universeller Schwellenwert.", "question": "Unterscheide beide Komponenten mit Beispielen.", "answer": "Ein freudiger Moment ist affektiv. Die Einschätzung, mit dem Leben zufrieden zu sein, ist kognitiv. Momentane Stimmung ersetzt keine umfassendere Bewertung."}, "en": {"title": "Affective vs. cognitive well-being", "columns": [["Affective", "Feelings, emotions and pleasant/unpleasant affect."], ["Cognitive", "Perception and evaluation of one’s happiness or life."]], "tradeoff": "Feeling joyful now and judging life as satisfying are related but distinct. Do not treat the lecture’s 3:1 claim as a universal threshold.", "question": "Distinguish the components with one example each.", "answer": "A pleasant moment is affective. Reflecting that one is satisfied with life is cognitive. An assessment of well-being should not substitute momentary mood for the person’s overall evaluation."}}, {"slides": "36; 40–43", "de": {"title": "UX vs. Positive Design / Design for Well-Being", "columns": [["UX", "Breite Wahrnehmungen und Reaktionen rund um Nutzung."], ["Positive Design", "Positive Erfahrungen, psychologisches Wohlbefinden und Entfaltung gezielt fördern."]], "tradeoff": "Wohlbefinden ist ein Gestaltungsziel, nicht nur attraktive Oberfläche. UX ist umfassender als Attraktivität, auch wenn die Vorlesung damit den Übergang einführt.", "question": "Warum beweist ein angenehmes Erlebnis nicht automatisch langfristiges Wohlbefinden?", "answer": "Kurzer Spaß unterstützt nicht zwangsläufig Sinn, Wachstum oder eigene Ziele. Positive Design betrachtet Virtue, Pleasure, Bedeutsamkeit und langfristige Wirkung. Diese prüfen statt aus Nutzungsdauer oder Aus
