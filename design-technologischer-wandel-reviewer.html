gical development.\u003c/p>"}, "de": {"title": "Komplexität, Kontrolle und Wechselwirkungen", "content": "\u003cp>Physische Bedienelemente vermitteln Hinweise durch Material, Gewicht, Reibung und Haptik. Digitale Alternativen verlieren möglicherweise solche Anzeichen und benötigen verständliche neue Hinweise und Rückmeldungen.\u003c/p>\u003cp>Vernetzte Produkt-Service-Ökosysteme schaffen Möglichkeiten, aber auch Komplexität. Technologischer Wandel verteilt \u003cstrong>Handlung, Kontrolle und Verantwortung\u003c/strong> neu zwischen Mensch und System.\u003c/p>\u003cul>\u003cli>\u003cstrong>Technologie:\u003c/strong> Was ist möglich?\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> Was soll möglich werden?\u003c/li>\u003cli>\u003cstrong>Nutzung:\u003c/strong> Was tun Menschen tatsächlich?\u003c/li>\u003c/ul>\u003cp>Alle drei beeinflussen einander durch Feedback innerhalb von Gesellschaft, Kultur, Wirtschaft und Regulierung.\u003c/p>\u003cp class='recall'>Technik bestimmt Design nicht einseitig. Design und tatsächliche Nutzung formen technische Entwicklung mit.\u003c/p>"}, "comparisons": [{"slides": "48", "de": {"title": "Mechanisch vs. digital: Möglichkeiten und Komplexität", "columns": [["Mechanisch/physisch", "Material, Form, Reibung und Gewicht können Gebrauch anzeigen."], ["Digital/vernetzt", "Flexible Funktionen und Services; physische Hinweise können fehlen und Optionen zunehmen."]], "tradeoff": "Mehr Möglichkeiten bedeuten nicht einfachere Nutzung. Zustände, Feedback und Auswahl verständlich gestalten.", "question": "Diskutiere Vor- und Nachteile des digitalen Ersatzes eines physischen Bedienelements.", "answer": "Digitale Flexibilität ermöglicht viele Funktionen, verliert aber möglicherweise Haptik und erzeugt versteckte Modi. Physische Steuerung kann Gebrauch unmittelbar zeigen, ist jedoch weniger flexibel. Nach Mensch, Aufgabe und Kontext entscheiden."}, "en": {"title": "Mechanical vs. digital: possibilities and complexity", "columns": [["Mechanical / physical", "Material, shape, friction and weight can indicate use."], ["Digital / connected", "Flexible functions and services, but physical clues can disappear and choices multiply."]], "tradeoff": "More possibilities do not guarantee easier use. Design legible states, meaningful feedback and manageable choices when replacing physical clues.", "question": "Discuss advantages and disadvantages of replacing a physical control with a digital one.", "answer": "Digital flexibility can enable many functions, yet lose tactile orientation and increase hidden modes. A physical control may communicate its operation directly but offer less flexibility. Choose according to user, task and context."}}], "exam": {"de": {"lists": [{"title": "Drei Teile des Wechselwirkungsmodells", "items": ["Technologie", "Design", "Nutzung"]}], "points": [["Technologie", "Was ist möglich?"], ["Design", "Was soll möglich werden?"], ["Nutzung", "Was tun Menschen tatsächlich?"]], "prompt": "Wie beeinflussen sich Technologie, Design und tatsächliche Nutzung?", "answer": "Technik eröffnet Möglichkeiten, Design wählt gewünschte Möglichkeiten, Menschen nutzen oder interpretieren sie. Feedback wirkt innerhalb von Kultur, Gesellschaft, Wirtschaft und Regulierung."}, "en": {"lists": [{"title": "Three parts of the interaction model", "items": ["Technology", "Design", "Use"]}], "points": [["Explain how technology, design and actual use influence each other.", "Technology opens possibilities; design selects what should be possible; people use or reinterpret the result. Feedback occurs within culture, society, economy and regulation."]], "prompt": "Explain how technology, design and actual use influence each other.", "answer": "Technology opens possibilities; design selects what should be possible; people use or reinterpret the result. Feedback occurs within culture, society, economy and regulation."}}}]}</script>
<script>
"use strict";
const root = document.getElementById("root");
if (!window.React || !window.ReactDOM) {
  root.textContent = "React konnte nicht geladen werden. Prüfe deine Internetverbindung und lade neu. / React could not load. Check your internet connection and reload.";
} else {
const {createElement: h, useEffect, useRef, useState} = React;
const {kind, questions, notes} = JSON.parse(document.getElementById("study-data").textContent);
const isReview = kind === "reviewer";
const perSet = 10;
const setCount = questions.length / perSet;
const initial = {lang:"de", active:0, answers:{}, drafts:{}, reviewed:{}};
const storeName = "progress";
const key = "design-technologischer-wandel:" + kind;
const translations = {
  de:{lecture:"Vorlesung 02",heading:"Design im technologischen Wandel",reviewer:"Reviewer", "multiple-choice":"Multiple Choice", "true-false":"Richtig oder Falsch", set:"Set", question:"Frage", slide:"Folie", sets:"Fragensets", jump:"Frage auswählen", previous:"Zurück", next:"Weiter", select:"Wähle eine Antwort.", check:"Antwort prüfen", correct:"Richtig", incorrect:"Falsch", true:"Richtig", false:"Falsch", solution:"Musterantwort anzeigen", hide:"Musterantwort ausblenden", write:"Deine Antwort", review:"Als gelernt markieren", undo:"Markierung entfernen", studied:"gelernt", answered:"beantwortet", notes:"Lernnotizen zur Vorlesung", source:"Quelle: Victoria Kaiselgruber, Design digitaler Produkte – Design im technologischen Wandel, WS 2026/27.", loading:"Lernstand wird geladen …", unavailable:"Lokales Speichern ist hier nicht verfügbar. Der Fortschritt bleibt nur bis zum Schließen oder Neuladen erhalten.", saving:"Wird gespeichert …", saved:"Lernstand lokal gespeichert", ready:"Lernstand lokal geladen", skip:"Zur Frage springen", comparison:"Vergleich", tryAgain:"Antwort zurücksetzen", resetSet:"Dieses Set zurücksetzen", resetConfirm:"Antworten und Lernstand für dieses Set zurücksetzen?"},
  en:{lecture:"Lecture 02",heading:"Design in a time of technological change",reviewer:"Reviewer", "multiple-choice":"Multiple choice", "true-false":"True or false", set:"Set", question:"Question", slide:"Slide", sets:"Question sets", jump:"Jump to a question", previous:"Previous", next:"Next", select:"Choose one answer.", check:"Check answer", correct:"Correct", incorrect:"Incorrect", true:"True", false:"False", solution:"Show model answer", hide:"Hide model answer", write:"Your answer", review:"Mark as studied", undo:"Unmark", studied:"studied", answered:"answered", notes:"Lecture study notes", source:"Source: Victoria Kaiselgruber, Design digitaler Produkte – Design im technologischen Wandel, WS 2026/27.", loading:"Loading progress …", unavailable:"Local storage is unavailable here. Your progress lasts until you close or reload this page.", saving:"Saving …", saved:"Progress saved locally", ready:"Local progress loaded", skip:"Skip to question", comparison:"Comparison", tryAgain:"Clear answer", resetSet:"Reset this set", resetConfirm:"Reset answers and progress for this set?"}
};
function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("DDP-study-progress", 1);
    request.onupgradeneeded = () => request.result.createObjectStore(storeName);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Database upgrade is blocked"));
  });
}
function readProgress(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readonly");
    const request = transaction.objectStore(storeName).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
function writeProgress(db, progress) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readwrite");
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore(storeName).put(progress, key);
  });
}
function App() {
  const [progress, setProgress] = useState(initial);
  const [ready, setReady] = useState(false);
  const [status, setStatus] = useState("loading");
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const db = useRef(null);
  const current = useRef(initial);
  const revision = useRef(0);
  const heading = useRef(null);
  const focusNext = useRef(false);

  useEffect(() => {
    let live = true;
    async function load() {
      try {
        db.current = await openDb();
        db.current.onversionchange = () => {
          db.current.close();
          db.current = null;
          if (live) setStatus("unavailable");
        };
        const stored = await readProgress(db.current);
        if (!live) { db.current?.close(); return; }
        if (stored) {
          current.current = {...initial,...stored,
            lang:stored.lang === "en" ? "en" : "de",
            active:Number.isInteger(stored.active) && stored.active >= 0 && stored.active < questions.length ? stored.active : 0};
          setProgress(current.current);
        }
        setStatus("ready");
      } catch {
        db.current?.close();
        db.current = null;
        if (live) setStatus("unavailable");
      } finally {
        if (live) setReady(true);
      }
    }
    load();
    return () => {live = false; db.current?.close();};
  }, []);

  useEffect(() => { document.documentElement.lang = progress.lang; }, [progress.lang]);
  useEffect(() => {
    if (focusNext.current) { heading.current?.focus(); focusNext.current = false; }
  }, [progress.active]);

  function update(patch) {
    const snapshot = {...current.current,...patch};
    current.current = snapshot;
    setProgress(snapshot);
    if (!db.current) return;
    const version = ++revision.current;
    setStatus("saving");
    writeProgress(db.current, snapshot).then(
      () => {if (version === revision.current) setStatus("saved");},
      () => {if (version === revision.current) setStatus("unavailable");}
    );
  }
  function move(target) {
    if (target === progress.active || target < 0 || target >= questions.length) return;
    setPicked(null);
    setRevealed(false);
    focusNext.current = true;
    update({active:target});
  }
  const {lang,active,answers,drafts,reviewed} = progress;
  const t = translations[lang];
  const set = Math.floor(active / perSet);
  const start = set * perSet;
  const numbers = Array.from({length:perSet},(_,i)=>start+i);
  const complete = i => isReview ? Boolean(reviewed[i]) : Number.isInteger(answers[i]);
  const done = numbers.filter(complete).length;
  const score = numbers.filter(i => answers[i] === questions[i].answer).length;
  const question = questions[active];
  const item = question[lang];
  const checked = Number.isInteger(answers[active]);
  const right = checked && answers[active] === question.answer;
  const options = item.options || [t.true,t.false];
  function resetSet() {
    if (!window.confirm(t.resetConfirm)) return;
    const nextAnswers = {...answers}, nextDrafts = {...drafts}, nextReviewed = {...reviewed};
    numbers.forEach(i => {delete nextAnswers[i]; delete nextDrafts[i]; delete nextReviewed[i];});
    setPicked(null);
    setRevealed(false);
    update({answers:nextAnswers,drafts:nextDrafts,reviewed:nextReviewed});
  }
  function clearAnswer() {
    const next = {...answers};
    delete next[active];
    setPicked(null);
    update({answers:next});
  }
  const header = h(React.Fragment,null,
    h("a",{href:"#question",className:"skip"},t.skip),
    h("header",{className:"top"},h("div",{className:"shell"},
      h("span",{className:"brand"},"DDP · WS 2026/27"),
      h("div",{className:"languages",role:"group","aria-label":"Sprache / Language"},
        ...["de","en"].map(l=>h("button",{key:l,lang:l,disabled:!ready,"aria-label":l==="de"?"Deutsch":"English","aria-pressed":lang===l,onClick:()=>update({lang:l})},l.toUpperCase()))))),
    h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.lecture),h("h1",null,t.heading),h("p",null,t[kind]))));
  if (!ready) return h(React.Fragment,null,header,h("main",{className:"shell",role:"status"},t.loading));
  const sidebar = h("aside",{className:"panel","aria-label":t.sets},
    h("h2",{className:"meta"},t.sets),
    h("div",{className:"sets"},...Array.from({length:setCount},(_,i)=>h("button",{key:i,"aria-pressed":i===set,"aria-label":t.set+" "+(i+1),onClick:()=>move(i*perSet)},i+1))),
    h("p",{className:"progress"},done+" / "+perSet+" "+(isReview?t.studied:t.answered)),
    h("progress",{max:perSet,value:done,"aria-label":isReview?t.studied:t.answered}),
    !isReview && done>0 && h("p",{className:"progress"},t.correct+": "+score+" / "+done),
    h("button",{disabled:!numbers.some(i=>complete(i)||Boolean(drafts[i])),onClick:resetSet},t.resetSet),
    h("p",{className:"progress"+(status==="unavailable"?" warning":""),role:"status"},t[status]));
  const reviewControls = isReview && h(React.Fragment,null,
    h("label",{htmlFor:"draft"},t.write),
    h("textarea",{id:"draft",rows:4,value:drafts[active]||"",onChange:e=>update({drafts:{...drafts,[active]:e.target.value}})}),
    h("div",{className:"row"},
      h("button",{className:"primary","aria-expanded":revealed,"aria-controls":"model-answer",onClick:()=>setRevealed(!revealed)},revealed?t.hide:t.solution),
      h("button",{"aria-pressed":Boolean(reviewed[active]),onClick:()=>update({reviewed:{...reviewed,[active]:!reviewed[active]}})},reviewed[active]?t.undo:t.review)),
    h("div",{id:"model-answer",className:"response",hidden:!revealed},
      item.columns && h(React.Fragment,null,
        h("table",{className:"comparison","aria-label":item.title||t.comparison},h("tbody",null,...item.columns.map(([name,value],i)=>h("tr",{key:i},h("th",{scope:"row"},name),h("td",null,value))))),
        h("p",null,item.tradeoff)),
      h("p",null,item.answer)));
  const quizControls = !isReview && h(React.Fragment,null,
    h("p",{className:"meta"},t.select),
    h("div",{role:"group","aria-labelledby":"question"},...options.map((option,i)=>{
      const selected = (checked ? answers[active] : picked) === i;
      const state = checked && i===question.answer ? " good" : checked && selected ? " bad" : "";
      return h("button",{key:i,className:"option"+state,"aria-pressed":selected,"aria-disabled":checked,
        onClick:()=>{if(!checked)setPicked(i);}},
        kind==="multiple-choice" && h("strong",null,String.fromCharCode(65+i)),h("span",null,option),
        checked && i===question.answer && h("span",{"aria-label":t.correct},"✓"));
    })),
    checked
      ? h(React.Fragment,null,h("div",{className:"response"+(right?"":" wrong"),role:"status"},
          h("strong",null,right?t.correct:t.incorrect),h("p",null,item.explain)),
          h("button",{onClick:clearAnswer},t.tryAgain))
      : h("button",{className:"primary",disabled:picked===null,onClick:()=>update({answers:{...answers,[active]:picked}})},t.check));
  return h(React.Fragment,null,header,
    h("main",{className:"shell layout"},sidebar,h("div",null,
      h("article",{className:"card","aria-labelledby":"question"},
        h("div",{className:"row between meta"},h("span",null,t.set+" "+(set+1)+" · "+t.question+" "+(active-start+1)+" / "+perSet),h("span",null,t.slide+" "+question.slides)),
        h("nav",{className:"numbers","aria-label":t.jump},...numbers.map(i=>h("button",{key:i,className:complete(i)?"done":"","aria-label":t.question+" "+(i-start+1)+(complete(i)?", "+(isReview?t.studied:t.answered):""),"aria-pressed":i===active,onClick:()=>move(i)},i-start+1))),
        h("h2",{id:"question",ref:heading,tabIndex:-1},item.prompt),
        isReview?reviewControls:quizControls,
        h("div",{className:"row between navigation"},
          h("button",{disabled:active===0,onClick:()=>move(active-1)},"← "+t.previous),
          h("button",{disabled:active===questions.length-1,onClick:()=>move(active+1)},t.next+" →"))),
      isReview && h("details",null,h("summary",null,t.notes),
        ...notes.map(n=>h("details",{key:n.id},h("summary",null,n[lang].title+" · "+t.slide+" "+n.slides),h("div",{dangerouslySetInnerHTML:{__html:n[lang].content}})))))),
    h("footer",null,h("div",{className:"shell"},t.source)));
}
ReactDOM.createRoot(root).render(h(App));
}
</script>
