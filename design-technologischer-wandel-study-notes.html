<script type="application/json" id="study-data">{"chapters": [{"id": "changing-object", "lecture": 2, "slides": "2–9", "en": {"title": "What changes when technology changes?", "content": "\u003cp class=\"lead\">The object of design expands from physical things to interaction, services and invisible system behavior.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Emphasis\u003c/th>\u003cth>What is designed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Material and form\u003c/td>\u003ctd>Shape, surface, proportion, material and quality.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Function and operation\u003c/td>\u003ctd>Controls, ergonomics, workflows and comprehensibility.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Information and interface\u003c/td>\u003ctd>Symbols, screens, structure and visual hierarchy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interaction and experience\u003c/td>\u003ctd>Gestures, feedback, transitions, context and emotion.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data, algorithms and system behavior\u003c/td>\u003ctd>Data flows, rules, personalization, automation and AI behavior.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These layers accumulate rather than simply replace each other. AI also brings questions about dialogue, expectations, trust and uncertainty.\u003c/p>\u003cp class=\"recall\">Design mediates between technological complexity and human use. Design conventions can outlast the technologies that created them.\u003c/p>"}, "de": {"title": "Was verändert sich mit der Technologie?", "content": "\u003cp class='lead'>Der Designgegenstand erweitert sich vom Ding über Interaktion und Services bis zu unsichtbarem Systemverhalten.\u003c/p>\u003col>\u003cli>\u003cstrong>Material und Form:\u003c/strong> Oberfläche, Proportion, Material und Qualität.\u003c/li>\u003cli>\u003cstrong>Funktion und Bedienung:\u003c/strong> Bedienelemente, Ergonomie, Abläufe und Verständlichkeit.\u003c/li>\u003cli>\u003cstrong>Information und Interface:\u003c/strong> Symbole, Screens, Struktur und Hierarchie.\u003c/li>\u003cli>\u003cstrong>Interaktion und Experience:\u003c/strong> Gesten, Feedback, Übergänge, Kontext und Emotionen.\u003c/li>\u003cli>\u003cstrong>Daten, Algorithmen und Verhalten:\u003c/strong> Datenflüsse, Regeln, Personalisierung, Automatisierung und KI.\u003c/li>\u003c/ol>\u003cp>Diese Ebenen erweitern einander. KI bringt Dialoge, Erwartungen, Vertrauen und Unsicherheit hinzu.\u003c/p>\u003cp class='recall'>Design vermittelt zwischen technischer Komplexität und menschlicher Nutzung. Konventionen können ihre ursprünglichen Technologien überdauern.\u003c/p>"}, "comparisons": [], "exam": {"de": {"lists": [{"title": "Fünf Ebenen des Designgegenstands", "items": ["Material und Form", "Funktion und Bedienung", "Information und Interface", "Interaktion und Experience", "Daten, Algorithmen und Verhalten"]}], "points": [["Material und Form", "Oberfläche, Proportion, Material und Qualität."], ["Funktion und Bedienung", "Bedienelemente, Ergonomie, Abläufe und Verständlichkeit."], ["Information und Interface", "Symbole, Screens, Struktur und Hierarchie."], ["Interaktion und Experience", "Gesten, Feedback, Übergänge, Kontext und Emotionen."]], "prompt": "Beschreibe den Wandel des Designgegenstands vom physischen Produkt zur KI.", "answer": "Material/Form → Funktion/Bedienung → Information/Interface → Interaktion/Experience → Daten/Algorithmen/Verhalten. Neue Ebenen erweitern Verantwortung statt ältere einfach zu ersetzen."}, "en": {"lists": [{"title": "Five layers of the design object", "items": ["Material and form", "Function and operation", "Information and interface", "Interaction and experience", "Data, algorithms and behavior"]}], "points": [["Trace the changing object of design from physical products to AI.", "Material/form → operation/function → information/interface → interaction/experience → data, algorithms and behavior. Explain accumulated responsibilities rather than simple replacement."]], "prompt": "Trace the changing object of design from physical products to AI.", "answer": "Material/form → operation/function → information/interface → interaction/experience → data, algorithms and behavior. Explain accumulated responsibilities rather than simple replacement."}}}, {"id": "industrial-reform", "lecture": 2, "slides": "10–18", "en": {"title": "Industrialization and reform movements", "content": "\u003ch3>Industrial Revolution and historicism\u003c/h3>\u003cp>The lecture places early industrialization around 1780 in England, spreading across Europe during the nineteenth century. Machine production replaced expensive handwork. Historicism borrowed earlier styles and added heavy ornament to mass-produced goods.\u003c/p>\u003cp>Industrial wealth encouraged representative interiors; cheap decoration spread similar styles to broader markets.\u003c/p>\u003ch3>Why reform?\u003c/h3>\u003cp>Poor-quality mass goods, social and environmental conditions, and weak competitiveness prompted reform. Workers called for simple, affordable, honest goods; reform also addressed housing, work and everyday life.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Movement\u003c/th>\u003cth>Lecture emphasis\u003c/th>\u003cth>Names / examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Arts and Crafts, c. 1860–1920\u003c/td>\u003ctd>Critique of industrialization; craftsmanship; links between aesthetic and social problems; natural forms.\u003c/td>\u003ctd>Craft-oriented reform.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Art Nouveau, c. 1880–1910\u003c/td>\u003ctd>Rich floral ornament.\u003c/td>\u003ctd>Hector Guimard; Paris Métro entrances.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>German Jugendstil\u003c/td>\u003ctd>More constructive or craft-based approaches; industrially producible forms.\u003c/td>\u003ctd>Richard Riemerschmid; machine furniture.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Viennese Secession / Austrian Jugendstil\u003c/td>\u003ctd>Modern artistic freedom and clearer forms; links to Glasgow influences.\u003c/td>\u003ctd>Klimt, Moser, Wagner are discussed; Vienna Secession, 1897; Wiener Werkstätte, 1903.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glasgow influence\u003c/td>\u003ctd>Restrained ornament, geometric clarity and Japanese aesthetic influences.\u003c/td>\u003ctd>Charles Rennie Mackintosh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Viennese modernism\u003c/td>\u003ctd>A more objective modern style.\u003c/td>\u003ctd>Otto Wagner.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deutscher Werkbund, 1907\u003c/td>\u003ctd>Cooperation between art, craft and industry; affordable quality mass goods.\u003c/td>\u003ctd>Lilly Reich; Mies van der Rohe and Reich’s chair work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Avant-garde\u003c/td>\u003ctd>Art as social and political reform; a new understanding of art.\u003c/td>\u003ctd>Rietveld’s Red and Blue Chair; Melnikov.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small\">Study the movements’ aims and contrasts. Some institutional histories and founder attributions in the slides are compressed; the reviewer does not treat them as precise founder-list quiz facts.\u003c/p>"}, "de": {"title": "Industrialisierung und Reformbewegungen", "content": "\u003ch3>Industrialisierung und Historismus\u003c/h3>\u003cp>Die Vorlesung beginnt um 1780 in England und beschreibt die Ausbreitung im 19. Jahrhundert. Maschinen ersetzten aufwendige Handarbeit. Historismus übernahm frühere Stile und überladene Ornamentik; repräsentative Ausstattung zeigte Wohlstand, günstige Dekoration verbreitete ähnliche Formen.\u003c/p>\u003ch3>Warum Reform?\u003c/h3>\u003cp>Schlechte Massenware, soziale und ökologische Bedingungen sowie Konkurrenzprobleme erzeugten Reformdruck. Arbeiter forderten einfache, erschwingliche und ehrliche Gegenstände. Wohnen und Arbeit gehörten ebenfalls dazu.\u003c/p>\u003cul>\u003cli>\u003cstrong>Arts and Crafts, etwa 1860–1920:\u003c/strong> Industrialisierungskritik, Handwerk, Naturformen und Verbindung ästhetischer mit sozialen Fragen.\u003c/li>\u003cli>\u003cstrong>Art Nouveau, etwa 1880–1910:\u003c/strong> Florale Ornamentik; Hector Guimard und Metroeingänge.\u003c/li>\u003cli>\u003cstrong>Deutscher Jugendstil:\u003c/strong> Konstruktive bzw. handwerkliche Ansätze; Riemerschmids Maschinenmöbel.\u003c/li>\u003cli>\u003cstrong>Wiener Secession/Jugendstil:\u003c/strong> Künstlerische Freiheit und klarere Formen; Klimt, Moser, Wagner; Secession 1897 und Wiener Werkstätte 1903 werden behandelt.\u003c/li>\u003cli>\u003cstrong>Glasgow:\u003c/strong> Mackintosh, reduzierte Ornamentik und japanische Einflüsse.\u003c/li>\u003cli>\u003cstrong>Wiener Moderne:\u003c/strong> Otto Wagner und sachlich-moderne Form.\u003c/li>\u003cli>\u003cstrong>Deutscher Werkbund 1907:\u003c/strong> Kunst, Handwerk und Industrie für hochwertige erschwingliche Massenware; Lilly Reich und Mies van der Rohe.\u003c/li>\u003cli>\u003cstrong>Avantgarde:\u003c/strong> Kunst als sozialpolitischer Reformimpuls; Rietveld und Melnikov.\u003c/li>\u003c/ul>\u003cp class='small'>Institutionengeschichte und Gründerangaben sind in den Folien verkürzt. Im Quiz werden daraus keine präzisen Gründerlisten abgeleitet.\u003c/p>"}, "comparisons": [{"slides": "15; 17", "de": {"title": "Arts and Crafts vs. Werkbund", "columns": [["Arts and Crafts", "Industrialisierungskritik; Handwerk und soziale wie ästhetische Qualität."], ["Werkbund", "Hochwertige erschwingliche Massenware durch Kunst, Handwerk und Industrie."]], "tradeoff": "Beide suchen Verbesserung, unterscheiden sich aber im Industrieverhältnis. Produktion und Zugang begründet vergleichen.", "question": "Vergleiche Ziele und Umgang mit industrieller Herstellung.", "answer": "Arts and Crafts verbindet schlechte Waren mit sozialen Problemen und erneuert Handwerk. Werkbund reformiert über industrielle Zusammenarbeit. Handwerksqualität und erschwingliche breite Produktion abwägen."}, "en": {"title": "Arts and Crafts vs. Werkbund", "columns": [["Arts and Crafts", "Critique of industrial effects and emphasis on craft and social/aesthetic quality."], ["Werkbund", "Quality affordable mass goods through collaboration between art, craft and industry."]], "tradeoff": "Both seek improvement, but differ in their relationship to industry. Discuss production approach and accessibility rather than calling one purely good.", "question": "Compare their aims and approaches to industrial production.", "answer": "Arts and Crafts links poor goods with social problems and renews craft. Werkbund pursues reform through industrial cooperation. Contrast craft quality with the challenge of affordable wider production."}}], "exam": {"de": {"lists": [{"title": "Reformbewegungen und Strömungen", "items": ["Arts and Crafts", "Art Nouveau und Jugendstil", "Wiener Secession und Wiener Moderne", "Glasgow School", "Deutscher Werkbund"]}], "points": [["Arts and Crafts, etwa 1860–1920", "Industrialisierungskritik, Handwerk, Naturformen und Verbindung ästhetischer mit sozialen Fragen."], ["Art Nouveau, etwa 1880–1910", "Florale Ornamentik; Hector Guimard und Metroeingänge."], ["Deutscher Jugendstil", "Konstruktive bzw. handwerkliche Ansätze; Riemerschmids Maschinenmöbel."], ["Wiener Secession/Jugendstil", "Künstlerische Freiheit und klarere Formen; Klimt, Moser, Wagner; Secession 1897 und Wiener Werkstätte 1903 werden behandelt."]], "prompt": "Vergleiche Arts and Crafts mit industrieorientierter Werkbund-Reform.", "answer": "Arts and Crafts betonte Handwerk und kritisierte Industrialisierung. Werkbund suchte Kooperation von Kunst, Handwerk und Industrie für hochwertige Massenware. Vergleiche Ziele, Produktion und Spannungen."}, "en": {"lists": [{"title": "Reform movements and currents", "items": ["Arts and Crafts", "Art Nouveau and Jugendstil", "Vienna Secession and Vienna Modernism", "Glasgow School", "Deutscher Werkbund"]}], "points": [["Compare Arts and Crafts with industry-oriented Werkbund reform.", "Arts and Crafts emphasized craftsmanship and criticized industrial effects. Werkbund sought cooperation of art, craft and industry for quality mass goods. Explain goals, production approaches and tensions."]], "prompt": "Compare Arts and Crafts with industry-oriented Werkbund reform.", "answer": "Arts and Crafts emphasized craftsmanship and criticized industrial effects. Werkbund sought cooperation of art, craft and industry for quality mass goods. Explain goals, production approaches and tensions."}}}, {"id": "modernism-styling", "lecture": 2, "slides": "19–24", "en": {"title": "Bauhaus, Streamline and Good Form", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Movement\u003c/th>\u003cth>Main idea\u003c/th>\u003cth>Recognize it by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bauhaus, 1919–1933\u003c/td>\u003ctd>Connect function, beauty, experimentation, craft, technology and industrial production.\u003c/td>\u003ctd>Clear lines; steel and glass; material, color and form exercises; workshops; later standardization.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Streamline, c. 1920–1950\u003c/td>\u003ctd>Use dynamic form and styling to communicate progress and support consumption.\u003c/td>\u003ctd>Teardrop forms; marketing-oriented redesign; US consumer products.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Good Form, from the 1950s\u003c/td>\u003ctd>Simple, objective, durable and timeless functional design.\u003c/td>\u003ctd>Reduced color, clear order, ergonomics and high usability.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Bauhaus:\u003c/strong> the lecture describes a move toward affordable mass products around 1925 and closure in 1933 under Nazi pressure.\u003c/p>\u003cp>\u003cstrong>Raymond Loewy:\u003c/strong> associated with market research, styling, Greyhound, Lucky Strike packaging and Shell identity. Styling emphasizes a product’s formal appearance for aesthetic and marketing purposes.\u003c/p>\u003cp>\u003cstrong>HfG Ulm:\u003c/strong> founded in 1953; Max Bill was its first rector. The lecture discusses Max Bill and Hans Gugelot’s stool, Nick Roericht’s TC 100 tableware, and design education combining functional and technical concerns.\u003c/p>\u003cp>\u003cstrong>Braun:\u003c/strong> Hans Gugelot, Dieter Rams and Herbert Hirche are linked with carefully ordered, usable and harmonious product design.\u003c/p>\u003cdetails>\u003csummary>Source wording to handle carefully\u003c/summary>\u003cp>Slide 22 says Bauhaus was re-established after the war. For revision, remember the postwar continuation of modernist and functionalist ideas; do not infer that the original 1919–1933 school reopened in its original form.\u003c/p>\u003c/details>"}, "de": {"title": "Bauhaus, Streamline und Gute Form", "content": "\u003cul>\u003cli>\u003cstrong>Bauhaus, 1919–1933:\u003c/strong> Funktion, Schönheit, Experimente, Handwerk, Technik und Industrie verbinden. Klare Linien, Stahl und Glas; Grundlagen mit Form, Farbe und Material vor der Werkstattwahl. Um 1925 stärker standardisierte erschwingliche Massenprodukte; Schließung 1933 unter NS-Druck.\u003c/li>\u003cli>\u003cstrong>Streamline, etwa 1920–1950:\u003c/strong> Tropfenform, Dynamik, Fortschritt und Zuversicht. Styling überarbeitet vor allem Erscheinung für Ästhetik und Marketing; Differenzierung und Konsumanregung.\u003c/li>\u003cli>\u003cstrong>Gute Form ab den 1950ern:\u003c/strong> Einfachheit, Sachlichkeit, Haltbarkeit, Zeitlosigkeit, reduzierte Farben, Ordnung und Ergonomie.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Raymond Loewy:\u003c/strong> Marktanalyse und Styling; Greyhound, Lucky Strike und Shell gehören zu den Beispielen.\u003c/p>\u003cp>\u003cstrong>HfG Ulm:\u003c/strong> 1953 gegründet, Max Bill als erster Rektor; Hocker von Bill/Gugelot und TC-100-Geschirr von Roericht. Funktionale, technische und ergonomische Ausbildung.\u003c/p>\u003cp>\u003cstrong>Braun:\u003c/strong> Gugelot, Rams und Hirche; Gebrauchstauglichkeit, funktionale Ordnung und sorgfältige Harmonie.\u003c/p>\u003cdetails>\u003csummary>Quellenformulierung beachten\u003c/summary>\u003cp>Folie 22 spricht von einer Wiedergründung des Bauhauses nach dem Krieg. Lerne die Fortführung modernistischer und funktionalistischer Ideen, ohne daraus die unveränderte Wiedereröffnung der ursprünglichen Schule abzuleiten.\u003c/p>\u003c/details>"}, "comparisons": [{"slides": "19–24", "de": {"title": "Bauhaus vs. Streamline vs. Gute Form", "columns": [["Bauhaus", "Experiment, Handwerk, Funktion, Technik und Serienproduktion verbinden."], ["Streamline", "Dynamisches Styling und Marketing vermitteln Fortschritt und Differenzierung."], ["Gute Form", "Reduzierte, sachliche, brauchbare und langlebige Funktionalität."]], "tradeoff": "Schwerpunkte überschneiden sich historisch. Styling beweist keine bessere Bedienung; funktionale Ordnung benötigt ebenfalls Emotion und Kontext.", "question": "Vergleiche Ziele, Formen sowie Produktions- und Marktkontext.", "answer": "Klare Linien/Materialien beim Bauhaus, Tropfendynamik bei Streamline und dauerhafte Ordnung bei Guter Form. Prioritäten statt nur Aussehen erläutern."}, "en": {"title": "Bauhaus vs. Streamline vs. Good Form", "columns": [["Bauhaus", "Connect experimentation, craft, function, technology and serial production."], ["Streamline", "Dynamic styling and marketing communicate progress and differentiate goods."], ["Good Form", "Restrained, objective, useful and long-lasting functional design."]], "tradeoff": "These emphases overlap historically. Styling can improve appeal without proving better operation; functional order still needs attention to emotion and context.", "question": "Compare their aims, forms and production/market context.", "answer": "Use clear lines and materials for Bauhaus, teardrop dynamism for Streamline, and reduced enduring order for Good Form. Explain what each prioritizes, not only its visual appearance."}}], "exam": {"de": {"lists": [{"title": "Drei Ansätze", "items": ["Bauhaus", "Streamline", "Gute Form"]}], "points": [["Bauhaus, 1919–1933", "Funktion, Schönheit, Experimente, Handwerk, Technik und Industrie verbinden. Klare Linien, Stahl und Glas; Grundlagen mit Form, Farbe und Material vor der Werkstattwahl. Um 1925 stärker standardisierte erschwingliche Massenprodukte; Schließung 1933 unter NS-Druck."], ["Streamline, etwa 1920–1950", "Tropfenform, Dynamik, Fortschritt und Zuversicht. Styling überarbeitet vor allem Erscheinung für Ästhetik und Marketing; Differenzierung und Konsumanregung."], ["Gute Form ab den 1950ern", "Einfachheit, Sachlichkeit, Haltbarkeit, Zeitlosigkeit, reduzierte Farben, Ordnung und Ergonomie."]], "prompt": "Vergleiche Bauhaus, Streamline und Gute Form.", "answer": "Bauhaus verbindet Funktion, Experiment, Handwerk und Industrie. Streamline nutzt dynamisches Styling und Vermarktung. Gute Form betont einfache, sachliche und dauerhafte Brauchbarkeit. Beziehe Produktion und gesellschaftlich-wirtschaftlichen Kontext ein."}, "en": {"lists": [{"title": "Three approaches", "items": ["Bauhaus", "Streamline", "Good Form"]}], "points": [["Compare Bauhaus, Streamline and Good Form.", "Bauhaus connects function, experimentation, craft and industrial production. Streamline uses dynamic styling and marketing. Good Form emphasizes simple, objective, lasting usefulness. Discuss technology, production and social/economic context."]], "prompt": "Compare Bauhaus, Streamline and Good Form.", "answer": "Bauhaus connects function, experimentation, craft and industrial production. Streamline uses dynamic styling and marketing. Good Form emphasizes simple, objective, lasting usefulness. Discuss technology, production and social/economic context."}}}, {"id": "postmodern-participatory", "lecture": 2, "slides": "25–32", "en": {"title": "Countermovements, branding and participation", "content": "\u003ch3>Alternative / anti-design\u003c/h3>\u003cp>From around 1968, movements challenged functionalism and mass consumption. Examples include recycling-oriented Des-in (1974), Pop Art’s plastics and kitsch, and Italian Radical Design.\u003c/p>\u003ch3>Postmodernism and New Design\u003c/h3>\u003cp>Color, signs, playful ornament, unusual materials and emotional or symbolic meaning challenged restrained Good Form. Studio Alchimia (1976), Memphis (1981) and Ettore Sottsass are central names in the lecture.\u003c/p>\u003cp>New Design also involved independent production, small series, urban culture, media visibility and museums. Forum Design in Linz (1980) is presented as a landmark design event.\u003c/p>\u003cp>\u003cstrong>New technical challenges:\u003c/strong> digitalization, miniaturization and multifunctionality shifted attention toward interaction and increasingly specific target groups.\u003c/p>\u003ch3>Brand design\u003c/h3>\u003cp>The product becomes part of an experience world, corporate strategy and identity. Limited editions and collectible products can carry symbolic and commercial value.\u003c/p>\u003ch3>Participatory design\u003c/h3>\u003cp>People contribute through workshops, communities and customization. Their culture, values and lifestyles influence design. IDEO is presented as an example of involving users in design processes.\u003c/p>\u003cp class=\"recall\">Functionalism emphasizes purposeful order. Postmodern approaches emphasize expressive, emotional and symbolic possibilities. Participatory approaches emphasize involvement.\u003c/p>\u003cdetails>\u003csummary>Chronology note\u003c/summary>\u003cp>The slides give Memphis’s founding as 1981 but also link its first presentation to Linz in 1980. Keep Forum Design 1980 and Memphis 1981 separate; the reviewer does not use the inconsistent presentation claim in quiz questions.\u003c/p>\u003c/details>"}, "de": {"title": "Gegenbewegungen, Marke und Partizipation", "content": "\u003ch3>Alternativ- und Anti-Design\u003c/h3>\u003cp>Ab etwa 1968 Kritik an Funktionalismus und Massenkonsum: Des-in 1974 mit Recycling, Pop Art mit Kunststoff und Kitsch sowie italienisches Radical Design.\u003c/p>\u003ch3>Postmoderne und Neues Design\u003c/h3>\u003cp>Farben, Zeichen, spielerische Ornamente, ungewöhnliche Materialien sowie emotionale und symbolische Bedeutungen hinterfragen die Gute Form. Studio Alchimia 1976, Memphis 1981 und Ettore Sottsass sind wichtige Namen.\u003c/p>\u003cp>Eigenproduktion, Kleinserien, urbane Kultur, Medien und Museen prägen Neues Design. Forum Design 1980 in Linz wird als bedeutendes Ereignis behandelt.\u003c/p>\u003cp>Digitalisierung, Miniaturisierung und Multifunktionalität verlagern den Fokus auf Interaktion und spezifischere Zielgruppen.\u003c/p>\u003ch3>Markendesign\u003c/h3>\u003cp>Produkte werden Teil von Erlebniswelt, Unternehmensstrategie und Identität. Sondereditionen und Sammelobjekte vermitteln symbolischen und wirtschaftlichen Wert.\u003c/p>\u003ch3>Partizipatives Design\u003c/h3>\u003cp>Workshops, Gemeinschaften und Customization beziehen Menschen ein. Kultur, Werte und Lebensstil prägen Gestaltung; IDEO wird als Beispiel genannt.\u003c/p>\u003cp class='recall'>Funktionalismus: zweckmäßige Ordnung. Postmoderne: Ausdruck, Emotion und Symbolik. Partizipation: Beteiligung.\u003c/p>\u003cdetails>\u003csummary>Chronologiehinweis\u003c/summary>\u003cp>Die Folien nennen Memphis 1981, verbinden eine erste Präsentation aber zugleich mit Linz 1980. Forum Design 1980 und Memphis 1981 werden getrennt gelernt; die widersprüchliche Präsentationsangabe wird nicht abgefragt.\u003c/p>\u003c/details>"}, "comparisons": [{"slides": "25–28", "de": {"title": "Funktionalismus vs. postmodernes Design", "columns": [["Funktionalismus/Gute Form", "Klarheit, Brauchbarkeit, Einfachheit und Haltbarkeit."], ["Postmoderne", "Ausdruck, Farbe, Zeichen, Ornament und emotionale/symbolische Beziehungen."]], "tradeoff": "Reduktion kann Ordnung unterstützen und einheitlich wirken; Ausdruck kann Bedeutung schaffen, garantiert aber keine Usability. Dies sind Abwägungen, keine universellen Eigenschaften.", "question": "Erkläre Unterschied sowie mögliche Stärken und Grenzen.", "answer": "Zweckorientierte Reduktion mit expressiven Kombinationen wie Memphis vergleichen. Funktionalismus ist nicht emotionslos, Postmoderne nicht funktionslos. Produkt und Kontext beurteilen."}, "en": {"title": "Functionalism vs. postmodern design", "columns": [["Functionalism / Good Form", "Clarity, usefulness, simplicity and durability."], ["Postmodern design", "Expression, color, signs, ornament and emotional/symbolic relationships."]], "tradeoff": "Reduction can support order yet feel uniform; expression can add meaning yet does not automatically ensure usability. These are study considerations, not universal properties.", "question": "Explain the difference and discuss possible strengths and limits.", "answer": "Contrast restrained purpose-led form with expressive combinations such as Memphis. Do not claim functional objects lack all emotion or postmodern objects lack function. Assess the product and context."}}, {"slides": "30–31", "de": {"title": "Produktdesign vs. Markendesign", "columns": [["Produktfokus", "Fähigkeiten, Gebrauch, Form und Interaktion eines Produkts."], ["Markenfokus", "Produkt als Teil von Identität, Erlebniswelt und Unternehmensstrategie."]], "tradeoff": "Markenkohärenz schafft Bedeutung, ersetzt aber keinen brauchbaren und verantwortlichen Betrieb. Das Produkt trägt die Marke.", "question": "Erkläre den Wandel vom Einzelprodukt zur Markenerfahrung.", "answer": "Identität, Image für Unternehmen und Kunden, Erlebnisse und Strategie behandeln. Interaktion und Service gehören dazu, nicht nur Logo oder Sonderedition."}, "en": {"title": "Product design vs. brand design", "columns": [["Product focus", "Capabilities, use, form and interaction of a product."], ["Brand focus", "Product as part of identity, experience world and business strategy."]], "tradeoff": "Brand coherence can add meaning, but image does not substitute for useful or responsible operation. The product carries the brand.", "question": "Explain the shift from an isolated product to a branded experience.", "answer": "Discuss identity, company/customer image, experience and strategic value. Include actual interactions and service decisions, not only a logo or limited edition."}}, {"slides": "32", "de": {"title": "Expertenorientiertes vs. partizipatives Design", "columns": [["Expertenorientiert", "Fachleute treffen Entscheidungen mit Spezialwissen."], ["Partizipativ", "Menschen gestalten durch Workshops, Gemeinschaften oder Customization mit."]], "tradeoff": "Fachwissen unterstützt Umsetzung, Beteiligung zeigt gelebte Bedürfnisse. Sie braucht Struktur und beseitigt Verzerrungen oder Konflikte nicht automatisch.", "question": "Diskutiere Vorteile und Grenzen der Beteiligung.", "answer": "Beteiligung kann Passung verbessern und Annahmen aufdecken, benötigt aber Zeit, geeignete Personen und Synthese. Fachwissen mit echter Mitwirkung verbinden; Befragung überträgt nicht alle Entscheidungen."}, "en": {"title": "Expert-led vs. participatory design", "columns": [["Expert-led", "Designers make decisions using specialist knowledge."], ["Participatory", "Users contribute through workshops, communities or customization."]], "tradeoff": "Expertise supports realization; participation can reveal lived needs and meanings. Involvement needs structure and does not automatically remove bias or conflicting interests.", "question": "Discuss advantages and limitations of participation.", "answer": "Participation can improve fit and expose assumptions but requires time, suitable participants and synthesis. Combine specialist skills with meaningful influence for users; consultation alone is not full transfer of decisions."}}], "exam": {"de": {"lists": [{"title": "Gegenbewegungen und Ansätze", "items": ["Alternativ- und Anti-Design", "Postmoderne und Neues Design", "Markendesign", "Partizipatives Design"]}], "points": [["Warum hinterfragte postmodernes Design den Funktionalismus?", "Erkläre Farbe, Ornament, Symbolik, Emotion und ungewöhnliche Kombinationen sowie Kritik an einheitlicher Reduktion. Nenne Alchimia/Memphis; Funktion wird dadurch nicht bedeutungslos."]], "prompt": "Warum hinterfragte postmodernes Design den Funktionalismus?", "answer": "Erkläre Farbe, Ornament, Symbolik, Emotion und ungewöhnliche Kombinationen sowie Kritik an einheitlicher Reduktion. Nenne Alchimia/Memphis; Funktion wird dadurch nicht bedeutungslos."}, "en": {"lists": [{"title": "Countermovements and approaches", "items": ["Alternative and Anti-Design", "Postmodernism and New Design", "Brand design", "Participatory design"]}], "points": [["Explain why postmodern design challenged functionalism.", "Discuss color, ornament, symbolism, emotion, unusual combinations and critiques of uniform restrained form. Mention Alchimia/Memphis and contrast with Good Form without assuming functional use becomes irrelevant."]], "prompt": "Explain why postmodern design challenged functionalism.", "answer": "Discuss color, ornament, symbolism, emotion, unusual combinations and critiques of uniform restrained form. Mention Alchimia/Memphis and contrast with Good Form without assuming functional use becomes irrelevant."}}}, {"id": "interface-theory", "lecture": 2, "slides": "33–41", "en": {"title": "Human Factors and interface theories", "content": "\u003cp>\u003cstrong>Technical perspective:\u003c/strong> How must a person be trained to operate the machine? \u003cstrong>Human Factors perspective:\u003c/strong> How must the system be designed so people can operate it reliably?\u003c/p>\u003cp>As internal mechanisms become less visible, design must communicate what matters, when it matters, possible actions, system state and warnings without overwhelming attention.\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Herbert Simon\u003c/h3>\u003cp>Artifacts connect an inner organization and an outer environment of use. Design transforms existing situations into preferred ones.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Gui Bonsiepe\u003c/h3>\u003cp>The interface connects the \u003cstrong>user, goal of action and tool\u003c/strong>. It makes purposeful action possible.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Klaus Krippendorff\u003c/h3>\u003cp>Design must fit users’ expectations and capabilities and account for social and cultural meaning.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Second-order understanding:\u003c/strong> designers should understand how stakeholders understand the artifact, rather than rely only on their own interpretation.\u003c/p>\u003cp class=\"recall\">The interface is more than a visual surface: it mediates between people, their goals and the system.\u003c/p>"}, "de": {"title": "Human Factors und Interfacetheorien", "content": "\u003cp>\u003cstrong>Technische Sicht:\u003c/strong> Wie muss der Mensch geschult werden? \u003cstrong>Human Factors:\u003c/strong> Wie muss das System für zuverlässige menschliche Bedienung gestaltet sein?\u003c/p>\u003cp>Wenn Mechanismen unsichtbarer werden, muss Design relevante Informationen, Handlungen, Zustände und Warnungen ohne Überlastung vermitteln.\u003c/p>\u003cul>\u003cli>\u003cstrong>Simon:\u003c/strong> Artefakte verbinden innere Organisation und äußere Gebrauchsumgebung. Design verändert Ist in Soll.\u003c/li>\u003cli>\u003cstrong>Bonsiepe:\u003c/strong> Das Interface verbindet Nutzer, Handlungsziel und Werkzeug.\u003c/li>\u003cli>\u003cstrong>Krippendorff:\u003c/strong> Erwartungen, Fähigkeiten sowie soziale und kulturelle Bedeutungen berücksichtigen.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Verstehen zweiter Ordnung:\u003c/strong> Verstehen, wie Stakeholder das Artefakt verstehen, statt nur der eigenen Interpretation zu folgen.\u003c/p>\u003cp class='recall'>Ein Interface vermittelt zwischen Mensch, Ziel und System – es ist mehr als eine sichtbare Oberfläche.\u003c/p>"}, "comparisons": [{"slides": "37", "de": {"title": "Frühere technische Perspektive vs. Human Factors", "columns": [["Technische Sicht", "Menschen für die Maschinenbedienung schulen."], ["Human-Factors-Sicht", "Das System für zuverlässige menschliche Bedienung gestalten."]], "tradeoff": "Schulung kann weiterhin nötig sein. Anforderungen sollen aber zu Fähigkeiten passen, statt Anpassung ausschließlich Menschen aufzubürden.", "question": "Erkläre den Perspektivwechsel an einem Interfacebeispiel.", "answer": "Nicht nur undurchsichtige Befehle anlernen, sondern verständliche Handlungen und Rückmeldungen für die Aufgabe gestalten. Zuverlässigkeit im Kontext evaluieren; Schulung wird nicht grundsätzlich überflüssig."}, "en": {"title": "Earlier technical view vs. Human Factors view", "columns": [["Earlier technical view", "Train people to operate the machine."], ["Human Factors view", "Design the system so people can operate it reliably."]], "tradeoff": "Training can still be needed. The shift is to making system demands fit human abilities instead of assigning adaptation entirely to people.", "question": "Explain the perspective shift with a concrete interface example.", "answer": "Instead of only teaching users to remember opaque commands, provide understandable actions and feedback appropriate to their task. Evaluate reliability in context; do not assume all training becomes unnecessary."}}], "exam": {"de": {"lists": [{"title": "Drei Perspektiven auf Interfaces", "items": ["Herbert Simon", "Gui Bonsiepe", "Klaus Krippendorff"]}], "points": [["Simon", "Artefakte verbinden innere Organisation und äußere Gebrauchsumgebung. Design verändert Ist in Soll."], ["Bonsiepe", "Das Interface verbindet Nutzer, Handlungsziel und Werkzeug."], ["Krippendorff", "Erwartungen, Fähigkeiten sowie soziale und kulturelle Bedeutungen berücksichtigen."]], "prompt": "Erkläre Simon, Bonsiepe und Krippendorff in Bezug auf Interfaces.", "answer": "Simon: innere Organisation, äußerer Kontext, bevorzugte Situationen. Bonsiepe: Nutzer–Handlungsziel–Werkzeug. Krippendorff: Stakeholderbedeutung und Verstehen zweiter Ordnung. Wende alle auf ein Produkt an."}, "en": {"lists": [{"title": "Three perspectives on interfaces", "items": ["Herbert Simon", "Gui Bonsiepe", "Klaus Krippendorff"]}], "points": [["Explain Simon, Bonsiepe and Krippendorff in relation to interfaces.", "Simon: inner organization and outer context, preferred situations. Bonsiepe: user–goal–tool connection. Krippendorff: stakeholders’ meanings and second-order understanding. Relate each to the same product."]], "prompt": "Explain Simon, Bonsiepe and Krippendorff in relation to interfaces.", "answer": "Simon: inner organization and outer context, preferred situations. Bonsiepe: user–goal–tool connection. Krippendorff: stakeholders’ meanings and second-order understanding. Relate each to the same product."}}}, {"id": "interface-evolution", "lecture": 2, "slides": "42–47", "en": {"title": "Interface evolution and coexistence", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Lecture generation\u003c/th>\u003cth>Key idea\u003c/th>\u003cth>Lecture anchors\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. Graphical interfaces\u003c/td>\u003ctd>Visible objects and WIMP instead of command syntax.\u003c/td>\u003ctd>Xerox Alto 1973; Xerox Star 1981; Apple Lisa 1983; Macintosh Finder 1984.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. Graphical web browsers\u003c/td>\u003ctd>Hyperlink navigation and broader access to the web.\u003c/td>\u003ctd>Mosaic 1993.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. Natural User Interfaces\u003c/td>\u003ctd>Touch, swipes, gestures and voice; mobile/personal internet.\u003c/td>\u003ctd>iPhone from 2007; responsive layouts across devices.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. Ubiquitous / tangible systems\u003c/td>\u003ctd>Networked objects, wearables, embedded computing and physical interaction.\u003c/td>\u003ctd>IoT; Tangible User Interfaces; reacTable 2005.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Evolution ≠ replacement\u003c/h3>\u003cul>\u003cli>\u003cstrong>CLI:\u003c/strong> enter commands.\u003c/li>\u003cli>\u003cstrong>GUI:\u003c/strong> manipulate visible objects.\u003c/li>\u003cli>\u003cstrong>Touch:\u003c/strong> interact directly with content.\u003c/li>\u003cli>\u003cstrong>Voice:\u003c/strong> express actions through language.\u003c/li>\u003cli>\u003cstrong>Generative AI:\u003c/strong> express goals and intentions.\u003c/li>\u003cli>\u003cstrong>Agent-based systems:\u003c/strong> delegate parts of achieving a goal.\u003c/li>\u003c/ul>\u003cp>These modes coexist. A newer interaction style does not make every older one unsuitable.\u003c/p>\u003cp class=\"recall\">Do not confuse these four interface generations with Lecture 03’s four HCI development phases. They organize related developments differently.\u003c/p>"}, "de": {"title": "Interfaceentwicklung und Koexistenz", "content": "\u003col>\u003cli>\u003cstrong>Grafische Interfaces:\u003c/strong> WIMP und sichtbare Objekte; Alto 1973, Star 1981, Lisa 1983 und Finder 1984.\u003c/li>\u003cli>\u003cstrong>Grafische Webbrowser:\u003c/strong> Hyperlinks und Internetzugang; Mosaic 1993.\u003c/li>\u003cli>\u003cstrong>Natural User Interfaces:\u003c/strong> Touch, Wischen, Gesten und Sprache; mobiles persönliches Internet, iPhone ab 2007 und responsives Design.\u003c/li>\u003cli>\u003cstrong>Ubiquitäre/greifbare Systeme:\u003c/strong> IoT, Wearables, eingebettete Computer und Tangible User Interfaces; reacTable 2005.\u003c/li>\u003c/ol>\u003ch3>Evolution ≠ Ersetzung\u003c/h3>\u003cul>\u003cli>CLI: Befehle eingeben.\u003c/li>\u003cli>GUI: Sichtbare Objekte manipulieren.\u003c/li>\u003cli>Touch: Direkt mit Inhalten interagieren.\u003c/li>\u003cli>Sprache: Handlungen sprachlich ausdrücken.\u003c/li>\u003cli>Generative KI: Ziele und Absichten formulieren.\u003c/li>\u003cli>Agentensysteme: Teile der Zielerreichung delegieren.\u003c/li>\u003c/ul>\u003cp>Diese Formen bestehen nebeneinander und eignen sich unterschiedlich für Menschen, Aufgaben und Kontexte.\u003c/p>\u003cp class='recall'>Die vier Interfacegenerationen aus Vorlesung 02 sind nicht dieselbe Einteilung wie die vier HCI-Phasen aus Vorlesung 03.\u003c/p>"}, "comparisons": [{"slides": "42–47", "de": {"title": "CLI vs. GUI vs. Touch vs. Sprache vs. KI/Agenten", "columns": [["CLI", "Befehle; nützlich für wiederholbare Expertenaufgaben, aber Syntax- und Lernanforderungen."], ["GUI/Touch", "Sichtbare Objekte bzw. direkte Berührung; Auffindbarkeit und Gerät begrenzen die Nutzung."], ["Sprache", "Sprachliche Eingabe; freihändige Nutzung möglich, aber Umgebung, Datenschutz und Erkennung wichtig."], ["Generative KI/Agenten", "Absichten formulieren oder Schritte delegieren; Vertrauen, Feedback und Kontrolle gestalten."]], "tradeoff": "Definitionen stammen aus den Folien; Stärken und Grenzen sind Übungsabwägungen. Keine Form ist für alle Menschen, Aufgaben und Kontexte die beste.", "question": "Vergleiche zwei Formen mit Stärken, Grenzen und passendem Kontext.", "answer": "Bei einer Datei passt sichtbare Auswahl, bei 500 regelhaften Umbenennungen kann ein Skript Wiederholung vermeiden. Erfahrung und Fehlerkorrektur erklären. Bei Sprache/Delegation Unsicherheit und Kontrolle behandeln."}, "en": {"title": "CLI vs. GUI vs. touch vs. voice vs. AI/agents", "columns": [["CLI", "Commands; efficient for repeatable expert operations, with syntax/learning demands."], ["GUI / touch", "Visible object manipulation or direct touch; discoverability and device constraints matter."], ["Voice", "Language-based input; hands-free potential but social, privacy and recognition constraints."], ["Generative AI / agents", "State intentions or delegate steps; trust, feedback and human control require design."]], "tradeoff": "The interaction definitions come from the slides; the strengths and limits are application considerations. No mode is best for every person/task/context.", "question": "Compare two modes: strengths, limitations and a suitable context.", "answer": "For one file, visible selection may be convenient; for 500 rule-based renamings, a command/script may reduce repeated work. Explain expertise and error recovery. For language/delegation, discuss uncertainty and confirmation rather than assuming universal superiority."}}, {"slides": "47", "de": {"title": "Evolution vs. Ersetzung", "columns": [["Evolution", "Neue Formen erweitern das Repertoire und verändern Handlungsmöglichkeiten."], ["Ersetzung", "Eine ältere Form wird vollständig verdrängt."]], "tradeoff": "Die Vorlesung warnt vor automatischer Gleichsetzung. Formen können nebeneinander bestehen und sich ergänzen.", "question": "Warum machen KI-Systeme GUI und CLI nicht automatisch überflüssig?", "answer": "Aufgabenstruktur, Erfahrung, Vorhersagbarkeit und Kontext unterscheiden sich. Befehl, sichtbare Handlung oder Delegation können jeweils passen. Eignung statt bloßer Neuheit bewerten."}, "en": {"title": "Evolution vs. replacement", "columns": [["Evolution", "New modes extend the repertoire and change how tasks can be done."], ["Replacement", "An older mode is completely displaced."]], "tradeoff": "The lecture warns against assuming total replacement. Different modes can coexist and complement one another.", "question": "Why does the arrival of AI not make GUI or CLI automatically obsolete?", "answer": "Task structure, expertise, predictability and context differ. A command, visible action or delegated goal may each fit different requirements. Evaluate suitability rather than ranking solely by novelty."}}], "exam": {"de": {"lists": [{"title": "Vier Interfacegenerationen", "items": ["Grafische Interfaces", "Grafische Webbrowser", "Natural User Interfaces", "Ubiquitäre und greifbare Systeme"]}], "points": [["Grafische Interfaces", "WIMP und sichtbare Objekte; Alto 1973, Star 1981, Lisa 1983 und Finder 1984."], ["Grafische Webbrowser", "Hyperlinks und Internetzugang; Mosaic 1993."], ["Natural User Interfaces", "Touch, Wischen, Gesten und Sprache; mobiles persönliches Internet, iPhone ab 2007 und responsives Design."], ["Ubiquitäre/greifbare Systeme", "IoT, Wearables, eingebettete Computer und Tangible User Interfaces; reacTable 2005."]], "prompt": "Vergleiche CLI, GUI, Touch, Sprache und Agenteninteraktion.", "answer": "Befehle, sichtbare Objekte, direktes Berühren, sprachliche Handlungen und delegierte Zielerreichung. Diskutiere Koexistenz, Feedback, Erfahrung, Kontrolle und Kontext."}, "en": {"lists": [{"title": "Four interface generations", "items": ["Graphical interfaces", "Graphical web browsers", "Natural user interfaces", "Ubiquitous and tangible systems"]}], "points": [["CLI", "enter commands."], ["GUI", "manipulate visible objects."], ["Touch", "interact directly with content."], ["Voice", "express actions through language."]], "prompt": "Compare CLI, GUI, touch, voice and agent interaction.", "answer": "Commands; manipulating visible objects; direct touch; language-based actions; delegated goal achievement. Discuss why modes coexist and what feedback, expertise, control and context each requires."}}}, {"id": "technology-control", "lecture": 2, "slides": "48–51", "en": {"title": "Complexity, control and mutual influence", "content": "\u003cp>Physical controls communicate through material, weight, friction and touch. Digital replacements may remove those clues, so design must provide other understandable signs and feedback.\u003c/p>\u003cp>Connected product–service ecosystems create more possibilities, but can also increase complexity. Technological change redistributes \u003cstrong>action, control and responsibility\u003c/strong> between people and systems.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Perspective\u003c/th>\u003cth>Question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Technology\u003c/td>\u003ctd>What is possible?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Design\u003c/td>\u003ctd>What should become possible?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Actual use\u003c/td>\u003ctd>What do people really do?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These influence each other through feedback, within society, culture, economy and regulation.\u003c/p>\u003cp class=\"recall\">Technology does not determine design in a single direction. Design choices and actual use also shape technological development.\u003c/p>"}, "de": {"title": "Komplexität, Kontrolle und Wechselwirkungen", "content": "\u003cp>Physische Bedienelemente vermitteln Hinweise durch Material, Gewicht, Reibung und Haptik. Digitale Alternativen verlieren möglicherweise solche Anzeichen und benötigen verständliche neue Hinweise und Rückmeldungen.\u003c/p>\u003cp>Vernetzte Produkt-Service-Ökosysteme schaffen Möglichkeiten, aber auch Komplexität. Technologischer Wandel verteilt \u003cstrong>Handlung, Kontrolle und Verantwortung\u003c/strong> neu zwischen Mensch und System.\u003c/p>\u003cul>\u003cli>\u003cstrong>Technologie:\u003c/strong> Was ist möglich?\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> Was soll möglich werden?\u003c/li>\u003cli>\u003cstrong>Nutzung:\u003c/strong> Was tun Menschen tatsächlich?\u003c/li>\u003c/ul>\u003cp>Alle drei beeinflussen einander durch Feedback innerhalb von Gesellschaft, Kultur, Wirtschaft und Regulierung.\u003c/p>\u003cp class='recall'>Technik bestimmt Design nicht einseitig. Design und tatsächliche Nutzung formen technische Entwicklung mit.\u003c/p>"}, "comparisons": [{"slides": "48", "de": {"title": "Mechanisch vs. digital: Möglichkeiten und Komplexität", "columns": [["Mechanisch/physisch", "Material, Form, Reibung und Gewicht können Gebrauch anzeigen."], ["Digital/vernetzt", "Flexible Funktionen und Services; physische Hinweise können fehlen und Optionen zunehmen."]], "tradeoff": "Mehr Möglichkeiten bedeuten nicht einfachere Nutzung. Zustände, Feedback und Auswahl verständlich gestalten.", "question": "Diskutiere Vor- und Nachteile des digitalen Ersatzes eines physischen Bedienelements.", "answer": "Digitale Flexibilität ermöglicht viele Funktionen, verliert aber möglicherweise Haptik und erzeugt versteckte Modi. Physische Steuerung kann Gebrauch unmittelbar zeigen, ist jedoch weniger flexibel. Nach Mensch, Aufgabe und Kontext entscheiden."}, "en": {"title": "Mechanical vs. digital: possibilities and complexity", "columns": [["Mechanical / physical", "Material, shape, friction and weight can indicate use."], ["Digital / connected", "Flexible functions and services, but physical clues can disappear and choices multiply."]], "tradeoff": "More possibilities do not guarantee easier use. Design legible states, meaningful feedback and manageable choices when replacing physical clues.", "question": "Discuss advantages and disadvantages of replacing a physical control with a digital one.", "answer": "Digital flexibility can enable many functions, yet lose tactile orientation and increase hidden modes. A physical control may communicate its operation directly but offer less flexibility. Choose according to user, task and context."}}], "exam": {"de": {"lists": [{"title": "Drei Teile des Wechselwirkungsmodells", "items": ["Technologie", "Design", "Nutzung"]}], "points": [["Technologie", "Was ist möglich?"], ["Design", "Was soll möglich werden?"], ["Nutzung", "Was tun Menschen tatsächlich?"]], "prompt": "Wie beeinflussen sich Technologie, Design und tatsächliche Nutzung?", "answer": "Technik eröffnet Möglichkeiten, Design wählt gewünschte Möglichkeiten, Menschen nutzen oder interpretieren sie. Feedback wirkt innerhalb von Kultur, Gesellschaft, Wirtschaft und Regulierung."}, "en": {"lists": [{"title": "Three parts of the interaction model", "items": ["Technology", "Design", "Use"]}], "points": [["Explain how technology, design and actual use influence each other.", "Technology opens possibilities; design selects what should be possible; people use or reinterpret the result. Feedback occurs within culture, society, economy and regulation."]], "prompt": "Explain how technology, design and actual use influence each other.", "answer": "Technology opens possibilities; design selects what should be possible; people use or reinterpret the result. Feedback occurs within culture, society, economy and regulation."}}}], "slide10": null}</script>

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("DDP-study-progress", 1);
    request.onupgradeneeded = () => request.result.createObjectStore(storeName);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Database upgrade is blocked"));
  });
}
function readProgress(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readonly");
    const request = transaction.objectStore(storeName).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
function writeProgress(db, progress) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readwrite");
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore(storeName).put(progress, key);
  });
}

function narration(chapter, lang, first) {
  const doc = new DOMParser().parseFromString(chapter[lang].content,"text/html");
  const blocks = Array.from(doc.body.querySelectorAll("h2,h3,h4,p,li,dt,dd,tr"),node =>
    node.matches("tr") ? Array.from(node.cells,cell=>cell.textContent.trim()).join(". ") :
    Array.from(node.childNodes,child=>child.nodeType===1 && child.matches("ul,ol") ? "" : child.textContent).join("").trim());
  const opening = [chapter[lang].title,...blocks];
  if (first && slide10) opening.push("WhatsApp",slide10[lang].answer);
  if (chapter.comparisons.length) opening.push(ui[lang].comparisons);
  const comparisons = chapter.comparisons.flatMap(comparison=>{
    const part = comparison[lang];
    return [part.title,...part.columns.map(([name,value])=>name+". "+value),part.tradeoff];
  });
  return [...opening,...comparisons].filter(Boolean).flatMap(block=>{
    const normalized = block.replace(/\s+/g," ").trim();
    const pieces = normalized.match(/.{1,220}(?:\s|$)|\S+/gu) || [];
    return pieces.map(piece=>piece.trim()).filter(Boolean);
  });
}
function ChapterAudio({chapter,lang,first}) {
  const t=audioUi[lang];
  const synth=window.speechSynthesis;
  const supported=Boolean(synth && window.SpeechSynthesisUtterance);
  const [status,setStatus]=useState("idle");
  const [rate,setRate]=useState(1);
  const session=useRef(0);
  const utterance=useRef(null);
  useEffect(()=>()=>{session.current++;if(utterance.current)synth?.cancel();utterance.current=null;},[synth]);
  function stop() {
    session.current++;
    synth.cancel();
    utterance.current=null;
    setStatus("idle");
  }
  function play() {
    stop();
    const segments=narration(chapter,lang,first);
    const id=session.current;
    const locale=lang==="de"?"de-DE":"en-GB";
    const voices=synth.getVoices();
    const voice=voices.find(candidate=>candidate.lang.toLowerCase()===locale.toLowerCase())
      || voices.find(candidate=>candidate.lang.toLowerCase().split(/[-_]/)[0]===lang);
    function speak(index) {
      if (id!==session.current) return;
      if (index>=segments.length) {utterance.current=null;setStatus("finished");return;}
      const next=new SpeechSynthesisUtterance(segments[index]);
      next.lang=voice?.lang||locale;
      if (voice) next.voice=voice;
      next.rate=rate;
      next.onend=()=>speak(index+1);
      next.onerror=()=>{if(id===session.current){utterance.current=null;setStatus("error");}};
      utterance.current=next;
      synth.speak(next);
    }
    setStatus("playing");
    speak(0);
  }
  const playing=status==="playing"||status==="paused";
  if (!supported) return h("p",{role:"status"},t.unsupported);
  return h("div",{className:"audio-player"},
    h("div",{className:"row"},
      h("button",{className:"primary",onClick:play,disabled:playing},t.play),
      h("button",{disabled:!playing,onClick:()=>{
        if(status==="paused"){synth.resume();setStatus("playing");}
        else{synth.pause();setStatus("paused");}
      }},status==="paused"?t.resume:t.pause),
      h("button",{onClick:stop,disabled:!playing},t.stop),
      h("label",{htmlFor:"speech-rate"},t.speed),
      h("select",{id:"speech-rate",value:rate,disabled:playing,onChange:event=>setRate(Number(event.target.value))},
        ...[0.75,1,1.25,1.5].map(speed=>h("option",{key:speed,value:speed},speed+"×")))),
    h("p",{role:"status",className:status==="error"?"warning":"progress"},t[status]||""));
}
function StudyNotes() {

          connection.close();
          db.current = null;

        const value = await readProgress(connection);
        if (live && value) {
          current.current = {
            lang:value.lang === "en" ? "en" : "de",
            active:Number.isInteger(value.active) && chapters[value.active] ? value.active : 0,
            read:value.read || {}
          };

        db.current?.close();
        db.current = null;
        if (live) setUnavailable(true);

        if (live) setReady(true);

    load();

  },[]);
  useEffect(() => {document.documentElement.lang=state.lang;},[state.lang]);

  function update(patch) {

  const {lang,active,read} = state;

  return h(React.Fragment,null,
    h("header",{className:"top"},h("div",{className:"shell"},
      h("span",{className:"brand"},"DDP · WS 2026/27"),
      h("div",{className:"languages",role:"group","aria-label":"Sprache / Language"},
        ...["de","en"].map(l=>h("button",{key:l,lang:l,disabled:!ready,"aria-label":l==="de"?"Deutsch":"English","aria-pressed":lang===l,onClick:()=>update({lang:l})},l.toUpperCase()))))),
    h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.subtitle),h("h1",null,t.title))),
    !ready ? h("main",{className:"shell",role:"status"},t.loading) :
    h("main",{className:"shell layout"},

        h("progress",{max:chapters.length,value:readCount,"aria-label":t.read}),
        unavailable&&h("p",{className:"progress warning",role:"status"},t.unavailable)),
      h("article",{className:"card chapter","aria-labelledby":"chapter-title"},
        h("div",{className:"meta"},t.slides+" "+chapter.slides),

          onKeyDown:event=>{

          ...modes.map(mode=>h("button",{key:mode,id:"mode-"+mode,role:"tab",tabIndex:mode===tab?0:-1,
            "aria-selected":mode===tab,"aria-controls":"chapter-mode",onClick:()=>setTab(mode)},mode==="review"?reviewUi[lang].tab:audio[mode]))),
        h("div",{id:"chapter-mode",role:"tabpanel","aria-labelledby":"mode-"+tab,tabIndex:0},
          tab==="listen" ? h(ChapterAudio,{key:chapter.id+":"+lang,chapter,lang,first:active===0}) :
          tab==="review" ? h(ExamReview,{key:chapter.id+":"+lang,chapter,lang}) :
          h(React.Fragment,null,
        h("div",{dangerouslySetInnerHTML:{__html:chapter[lang].content}}),
        active===0&&slide10&&h("section",{className:"response"},h("h3",null,"WhatsApp · "+t.slide+" 10"),h("p",null,slide10[lang].answer)),
        chapter.comparisons.length>0&&h("section",null,

          ...chapter.comparisons.map(c=>h("details",{key:c[lang].title},
            h("summary",null,c[lang].title),
            h("p",{className:"meta"},t.slides+" "+c.slides),
            h("table",{className:"comparison","aria-label":c[lang].title},
              h("tbody",null,...c[lang].columns.map(([name,value])=>h("tr",{key:name},h("th",{scope:"row"},name),h("td",null,value))))),
            h("p",null,c[lang].tradeoff)))))),
        h("button",{className:"primary","aria-pressed":isRead,onClick:()=>update({read:{...read,[chapter.id]:!isRead}})},isRead?t.unmark:t.mark),
        h("div",{className:"row between navigation"},
          h("button",{disabled:active===0,onClick:()=>openChapter(active-1)},"← "+t.previous),
          h("button",{disabled:active===chapters.length-1,onClick:()=>openChapter(active+1)},t.next+" →")))),
    h("footer",null,h("div",{className:"shell"},t.source)));
}
ReactDOM.createRoot(root).render(h(StudyNotes));
}

</script>
</body>
</html>
