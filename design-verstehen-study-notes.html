*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:.55rem .85rem;font-weight:650}button:hover:not(:disabled){border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true],button.primary{background:var(--green);border-color:var(--green);color:white}.shell{max-width:980px;margin:auto;padding:0 clamp(16px,4vw,32px)}.top{background:var(--card);border-bottom:1px solid var(--line)}.top .shell{display:flex;justify-content:space-between;align-items:center;padding-block:.75rem;gap:.5rem}.brand{font-size:.84rem;font-weight:750;letter-spacing:.04em}.languages,.row,.sets,.numbers{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.hero{background:var(--green);color:white;padding:clamp(1.8rem,6vw,3.6rem) 0}.hero p{margin:.5rem 0 0;color:#e0eee4}.eyebrow,.meta{font-size:.78rem;font-weight:700;letter-spacing:.065em;text-transform:uppercase}.eyebrow{color:#d0e4d4}h1,h2,h3{line-height:1.23;margin:0}h1{font:clamp(2.2rem,7vw,4rem)/1.08 Georgia,serif;margin:.5rem 0}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:1.3rem;padding-block:1.5rem}.panel,.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px}.panel{padding:1rem;align-self:start}.card{padding:clamp(1rem,4vw,2rem)}.card h2{font:clamp(1.45rem,4vw,2rem)/1.24 Georgia,serif;margin:.6rem 0 1.15rem;overflow-wrap:anywhere}.meta{color:var(--muted)}.between{justify-content:space-between}.sets{margin:.8rem 0}.sets button,.numbers button{min-width:40px;padding:.4rem .55rem}.numbers{margin:1rem 0}.numbers .done:not([aria-pressed=true]){background:var(--pale);border-color:#839e8c}.progress{font-size:.87rem;margin:.6rem 0;color:var(--muted)}progress{width:100%;accent-color:var(--green)}.option{display:flex;align-items:center;width:100%;text-align:left;margin:.55rem 0;gap:.7rem}.option strong{min-width:1.7rem;font-size:.8rem}.option.good{background:var(--pale);border-color:var(--green);color:var(--green)}.option.bad{background:var(--rose);border-color:var(--bad);color:var(--bad)}.response{margin:1rem 0;background:var(--pale);border-left:3px solid var(--green);padding:.75rem 1rem}.response.wrong{background:var(--rose);border-color:var(--bad)}.response p,.card p{margin:.45rem 0}.navigation{margin-top:1rem}textarea{display:block;width:100%;resize:vertical;margin:.4rem 0 .9rem;padding:.65rem;border:1px solid var(--line);background:var(--paper);border-radius:6px}label{font-weight:650}details{padding:1rem;margin:.75rem 0}summary{cursor:pointer;font-weight:700}details details{border-radius:6px}.comparison{width:100%;border-collapse:collapse;margin:.7rem 0}.comparison th,.comparison td{text-align:left;vertical-align:top;padding:.5rem;border-bottom:1px solid var(--line)}.comparison th{width:34%}.warning{color:var(--bad)}footer{border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;padding:1rem 0 2rem}a{color:var(--green)}.skip{position:absolute;left:-9999px}.skip:focus{top:.3rem;left:.3rem;background:white;padding:.5rem}

.notes-nav{display:grid;gap:.45rem;margin:.75rem 0}.notes-nav button{text-align:left}.chapter h3{margin:1.35rem 0 .45rem}.chapter .recall,.chapter .lead{font-weight:650}.chapter table{width:100%;border-collapse:collapse}.chapter td,.chapter th{padding:.45rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.chapter .tablewrap{overflow:auto}.chapter dl{margin:.8rem 0}.chapter dt{font-weight:700}.chapter dd{margin:0 0 .8rem}.chapter li{margin:.3rem 0}.chapter :is(p,ul,dl){max-width:72ch}.chapter progress{display:block}.mode-tabs{margin:0 0 1rem;padding-bottom:.7rem;border-bottom:1px solid var(--line)}.mode-tabs button[aria-selected=true]{background:var(--green);border-color:var(--green);color:white}.audio-player{padding:1rem;background:var(--pale);border-radius:8px;margin:0 0 1rem}.audio-player select{font:inherit;color:var(--ink);background:var(--card);padding:.5rem;border:1px solid var(--line);border-radius:6px}.audio-player p:empty{display:none}

<script type="application/json" id="study-data">{"chapters": [{"id": "design-scope", "lecture": 1, "slides": "2–21", "en": {"title": "Design is more than appearance", "content": "\u003cp class=\"lead\">Design shapes what people can do, what they notice, and the consequences that follow.\u003c/p>\u003cp>It includes appearance, functions, rules, workflows, content, priorities, target groups and impacts. A beautiful app that prevents task completion is poorly designed for that task. An easy-to-use app that manipulates people raises questions of responsibility.\u003c/p>\u003ch3>Five layers in the WhatsApp example\u003c/h3>\u003cul>\u003cli>\u003cstrong>Visible form:\u003c/strong> color, typography, hierarchy, icons, spacing and layout.\u003c/li>\u003cli>\u003cstrong>Interactions and functions:\u003c/strong> writing, sending, reacting, calling, editing, forwarding and archiving.\u003c/li>\u003cli>\u003cstrong>Rules and system behavior:\u003c/strong> check marks, read receipts, online status, notifications and group permissions.\u003c/li>\u003cli>\u003cstrong>Social relationships:\u003c/strong> reply expectations, social pressure, group dynamics and boundaries between work and private life.\u003c/li>\u003cli>\u003cstrong>Technical and organizational decisions:\u003c/strong> encryption, synchronization, contact matching, data storage, ecosystem connections and business models.\u003c/li>\u003c/ul>\u003cp class=\"recall\">A design decision is an explicit or implicit choice between possibilities. It pursues goals under constraints and can have intended and unintended effects.\u003c/p>\u003ch3>Trade-offs\u003c/h3>\u003cp>Read receipts can support accountability but create pressure. Voice messages help senders communicate quickly but may increase recipients’ effort. Group chats support coordination but create overload. Disappearing messages support privacy but reduce traceability.\u003c/p>"}, "de": {"title": "Design ist mehr als Aussehen", "content": "\u003cp class='lead'>Design gestaltet, was Menschen tun können, was sie wahrnehmen und welche Folgen daraus entstehen.\u003c/p>\u003cp>Es umfasst Aussehen, Funktionen, Regeln, Abläufe, Inhalte, Prioritäten, Zielgruppen und Auswirkungen. Eine schöne App kann an der Aufgabe scheitern; eine leicht bedienbare App kann trotzdem manipulativ sein.\u003c/p>\u003ch3>Fünf Ebenen am Beispiel WhatsApp\u003c/h3>\u003cul>\u003cli>\u003cstrong>Sichtbare Gestaltung:\u003c/strong> Hierarchie, Farben, Typografie, Icons, Abstände und Anordnung.\u003c/li>\u003cli>\u003cstrong>Interaktionen und Funktionen:\u003c/strong> Schreiben, Senden, Reagieren, Anrufen, Bearbeiten, Weiterleiten und Archivieren.\u003c/li>\u003cli>\u003cstrong>Regeln und Systemverhalten:\u003c/strong> Häkchen, Lesebestätigung, Online-Status, Benachrichtigungen und Gruppenrechte.\u003c/li>\u003cli>\u003cstrong>Soziale Beziehungen:\u003c/strong> Antworterwartungen, Druck, Gruppendynamik und Grenzen zwischen Beruf und Privatleben.\u003c/li>\u003cli>\u003cstrong>Technische und organisatorische Entscheidungen:\u003c/strong> Verschlüsselung, Synchronisierung, Kontaktabgleich, Datenspeicherung, Ökosystem und Geschäftsmodell.\u003c/li>\u003c/ul>\u003cp class='recall'>Eine Designentscheidung ist eine begründete oder implizite Auswahl zwischen Gestaltungsmöglichkeiten. Sie verfolgt Ziele unter Rahmenbedingungen und hat beabsichtigte sowie unbeabsichtigte Folgen.\u003c/p>\u003ch3>Zielkonflikte\u003c/h3>\u003cp>Lesebestätigungen unterstützen Verbindlichkeit, können aber Druck erzeugen. Sprachnachrichten entlasten Sender, belasten jedoch möglicherweise Empfänger. Gruppenchats ermöglichen Koordination und erzeugen Überlastung. Selbstlöschende Nachrichten stärken Privatsphäre und verringern Nachvollziehbarkeit.\u003c/p>"}, "comparisons": [{"slides": "5", "de": {"title": "Ästhetik vs. Funktion und Nutzen", "columns": [["Ästhetik", "Wahrnehmbare Form und visuell-emotionale Qualität: Farbe, Typografie, Layout und Konsistenz."], ["Funktion und Nutzen", "Was das Produkt ermöglicht und ob Menschen im Kontext sinnvolle Ziele erreichen."]], "tradeoff": "Attraktivität kann Orientierung und Freude fördern, ersetzt aber keine Aufgabenerledigung. Ziel ist das Zusammenspiel ästhetischer Qualität und sinnvoller, verständlicher Nutzung."}, "en": {"title": "Aesthetics vs. function and benefit", "columns": [["Aesthetics", "Perceivable form and visual/emotional quality: color, typography, layout and consistency."], ["Function and benefit", "What the product does and whether people can achieve useful goals in context."]], "tradeoff": "Attractiveness can support orientation and enjoyment, but cannot compensate for blocked tasks. The aim is to integrate aesthetic quality with useful, understandable operation."}}, {"slides": "5; 18–20", "de": {"title": "Usability vs. Verantwortung", "columns": [["Usability", "Bestimmte Menschen erreichen Ziele im Kontext effektiv, effizient und zufriedenstellend."], ["Verantwortung", "Autonomie, Privatsphäre, Manipulation und Folgen für Stakeholder, Gesellschaft, Umwelt und Zukunft berücksichtigen."]], "tradeoff": "Einfache Bedienung macht eine Handlung nicht automatisch verantwortungsvoll. Ein reibungsloser Ablauf kann helfen oder Manipulation erleichtern. Beide Dimensionen müssen geprüft werden."}, "en": {"title": "Usability vs. responsibility", "columns": [["Usability", "Specified people achieve goals effectively, efficiently and satisfactorily in context."], ["Responsibility", "Consider autonomy, privacy, manipulation and effects on stakeholders, society, environment and the future."]], "tradeoff": "Ease of use does not make an action ethically desirable. A frictionless flow can help people or make a manipulative choice easier. These dimensions must both be assessed."}}, {"slides": "20", "de": {"title": "Lesebestätigung: Verbindlichkeit vs. Druck", "columns": [["Vorteil", "Rückmeldung und Verbindlichkeit der Kommunikation."], ["Risiko", "Antwortdruck und geringere Privatsphäre über Leseverhalten."]], "tradeoff": "Beziehung, Kontext und echte Einstellungen entscheiden. Lesebestätigungen sind nicht grundsätzlich gut oder schlecht."}, "en": {"title": "Read receipts: accountability vs. pressure", "columns": [["Benefit", "Acknowledgment and a sense that communication has reached the other person."], ["Risk", "Response pressure and reduced privacy about reading behavior."]], "tradeoff": "Whether it helps depends on relationship, context and meaningful settings. This is a trade-off, not proof that receipts are always good or bad."}}, {"slides": "20", "de": {"title": "Sprachnachrichten: Senderkomfort vs. Empfängeraufwand", "columns": [["Vorteil", "Schnelle, ausdrucksstarke zeitversetzte Aufnahme."], ["Risiko", "Höraufwand, unpassende Umgebung und schwieriges Wiederfinden bestimmter Inhalte."]], "tradeoff": "Zeitersparnis einer Person kann Arbeit für eine andere sein. Rollen, Kontext und Barrierefreiheit prüfen."}, "en": {"title": "Voice messages: sender convenience vs. recipient effort", "columns": [["Benefit", "Fast expressive asynchronous recording for the sender."], ["Risk", "Listening effort, unsuitable surroundings and difficulty locating specific information."]], "tradeoff": "Time saved by one person can become work for another. Assess both roles and context; accessibility also matters."}}, {"slides": "20", "de": {"title": "Gruppenchats: Koordination vs. Informationsüberlastung", "columns": [["Vorteil", "Gemeinsame Kommunikation und Koordination."], ["Risiko", "Nachrichtenmenge, unklare Prioritäten und sozialer Druck."]], "tradeoff": "Mehr Aktivität kann koordinieren und zugleich überfordern. Administration und Organisation haben weitere Sichtweisen."}, "en": {"title": "Group chats: coordination vs. information overload", "columns": [["Benefit", "Shared communication and group coordination."], ["Risk", "Message volume, unclear priorities and social pressure."]], "tradeoff": "More activity can help coordination and still overwhelm members. Consider administrators’ and organizational perspectives as well."}}, {"slides": "20", "de": {"title": "Selbstlöschende Nachrichten: Privatsphäre vs. Nachvollziehbarkeit", "columns": [["Vorteil", "Weniger dauerhaft gespeicherter Verlauf kann Privatsphäre unterstützen."], ["Risiko", "Entscheidungen und Kontext sind später schwer rekonstruierbar."]], "tradeoff": "Der Gesprächszweck entscheidet. Aufbewahrungsregeln müssen klar sein."}, "en": {"title": "Disappearing messages: privacy vs. traceability", "columns": [["Benefit", "Less persistent conversation history can support privacy."], ["Risk", "Decisions or context become harder to reconstruct later."]], "tradeoff": "Appropriateness depends on the purpose of the conversation. Clear expectations about retention matter."}}], "exam": {"de": {"points": [["Designentscheidung", "Eine Auswahl zwischen Möglichkeiten, die unter bestimmten Bedingungen getroffen wird und Folgen hat."], ["Ästhetik und Funktion", "Ästhetik betrifft die Wahrnehmung. Funktion und Nutzen betreffen, was Menschen erreichen können."], ["Usability und Verantwortung", "Usability fragt, wie leicht etwas bedienbar ist. Verantwortung fragt, welche Folgen die Gestaltung hat."], ["WhatsApp, Folie 10", "Lesebestätigung = gewählte Systemregel. Antwortdruck = mögliche soziale Folge. Verschlüsselung = technische Entscheidung, die die Nutzung prägt."]], "prompt": "Warum kann eine leicht bedienbare App trotzdem schlecht gestaltet sein?", "answer": "Usability betrifft die einfache Bedienung. Verantwortung betrifft die Folgen einer Gestaltungsentscheidung. Wenn ein Kündigungsdialog leicht bedienbar ist, aber durch irreführende Beschriftungen zur Verlängerung drängt, schränkt er die Entscheidungsfreiheit ein.", "lists": [{"title": "Fünf Ebenen von Design (WhatsApp)", "items": ["Sichtbare Gestaltung", "Interaktionen und Funktionen", "Regeln und Systemverhalten", "Soziale Beziehungen", "Technische und organisatorische Entscheidungen"]}]}, "en": {"points": [["Design decision", "A choice among alternatives made under constraints that has consequences."], ["Aesthetics and function", "Aesthetics concerns perception. Function and benefit concern what people can achieve."], ["Usability and responsibility", "Usability asks how easy a product is to use. Responsibility asks what consequences its design has."], ["WhatsApp, slide 10", "Read receipts = chosen system rule. Pressure to reply = possible social effect. Encryption = technical choice that shapes use."]], "prompt": "Why can an easy-to-use app still be poorly designed?", "answer": "Usability concerns ease of use. Responsibility concerns the consequences of a design decision. If a cancellation dialog is easy to operate but uses misleading labels to push people toward renewal, it limits their freedom of choice.", "lists": [{"title": "Five levels of design (WhatsApp)", "items": ["Visible design", "Interactions and functions", "Rules and system behavior", "Social relationships", "Technical and organizational decisions"]}]}}}, {"id": "decision-areas", "lecture": 1, "slides": "12–18", "en": {"title": "Five areas of design decisions", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Core question\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Purpose and benefit\u003c/td>\u003ctd>Which problem or need should the product address, and for whom?\u003c/td>\u003ctd>Prioritize reliable coordination over constant engagement.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Functions\u003c/td>\u003ctd>What should people be able to do?\u003c/td>\u003ctd>Send messages, find information, call others.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interaction and behavior\u003c/td>\u003ctd>How does the system respond to an action?\u003c/td>\u003ctd>Explain failure when the connection is lost.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visibility and priority\u003c/td>\u003ctd>What is prominent, and what is hidden?\u003c/td>\u003ctd>Pin important chats or hide advanced settings.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rules and boundaries\u003c/td>\u003ctd>What is allowed, prevented or restricted?\u003c/td>\u003ctd>Determine who can add members or see online status.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>More features can add value but also increase complexity, development effort, maintenance, errors and cognitive load.\u003c/p>\u003cp class=\"recall\">More features ≠ a better product. Explain the benefit and the cost of each decision.\u003c/p>"}, "de": {"title": "Fünf Bereiche von Designentscheidungen", "content": "\u003cdl>\u003cdt>\u003cstrong>Zweck und Nutzen\u003c/strong>\u003c/dt>\u003cdd>Welches Problem oder Bedürfnis soll für wen bearbeitet werden? Welche Situationen und Prioritäten zählen?\u003c/dd>\u003cdt>\u003cstrong>Funktionen\u003c/strong>\u003c/dt>\u003cdd>Was können Menschen mit dem Produkt machen? Welche Funktionen braucht es dafür?\u003c/dd>\u003cdt>\u003cstrong>Interaktion und Verhalten\u003c/strong>\u003c/dt>\u003cdd>Wie reagiert das System? Beispiel: Rückmeldung bei Verbindungsverlust oder Fehlern.\u003c/dd>\u003cdt>\u003cstrong>Sichtbarkeit und Priorität\u003c/strong>\u003c/dt>\u003cdd>Was steht im Vordergrund, was bleibt schwer auffindbar? Beispiel: angepinnte Chats und Datenschutzeinstellungen.\u003c/dd>\u003cdt>\u003cstrong>Regeln und Grenzen\u003c/strong>\u003c/dt>\u003cdd>Was ist erlaubt oder eingeschränkt? Beispiel: Mitglieder hinzufügen oder Online-Status sehen.\u003c/dd>\u003c/dl>\u003cp>Weitere Funktionen können Nutzen, aber auch Komplexität, Entwicklungsaufwand, Wartung, Fehler und kognitive Belastung erhöhen.\u003c/p>\u003cp class='recall'>Mehr Funktionen ≠ besseres Produkt. Begründe jeweils Nutzen und Kosten.\u003c/p>"}, "comparisons": [{"slides": "15", "de": {"title": "Zweck und Nutzen vs. Funktionen", "columns": [["Zweck/Nutzen", "Warum das Produkt für wen welchen Wert schaffen soll."], ["Funktionen", "Was Menschen damit tun können."]], "tradeoff": "Eine Handlungsmöglichkeit schafft nicht automatisch genügend Nutzen. Mehr Funktionen können Komplexität, Wartung und kognitive Last erhöhen."}, "en": {"title": "Purpose and benefit vs. functions", "columns": [["Purpose/benefit", "Why a product should exist, for whom and toward what value."], ["Functions", "What people can do with it."]], "tradeoff": "A feature can enable an action without creating enough value. More functions may also increase complexity, maintenance and cognitive load."}}, {"slides": "16", "de": {"title": "Interaktion/Verhalten vs. Sichtbarkeit/Priorität", "columns": [["Interaktion/Verhalten", "Reaktionen, Rückmeldungen und Zustandsänderungen nach Handlungen."], ["Sichtbarkeit/Priorität", "Was zuerst sichtbar, hervorgehoben oder schwer auffindbar ist."]], "tradeoff": "Klares Feedback und auffindbare Bedienung ergänzen sich. Eine korrekt funktionierende, versteckte Datenschutzeinstellung hilft praktisch möglicherweise wenig."}, "en": {"title": "Interaction/behavior vs. visibility/priority", "columns": [["Interaction/behavior", "How actions produce responses, feedback and state changes."], ["Visibility/priority", "What becomes prominent, visible first or hard to find."]], "tradeoff": "Clear feedback and discoverable controls work together. A correctly functioning privacy control may still be ineffective in practice if hidden."}}], "exam": {"de": {"points": [["Zweck und Nutzen", "Für wen und wofür ist das Produkt da?"], ["Funktionen und Interaktion", "Funktion = was möglich ist. Interaktion = wie Handlung und Rückmeldung ablaufen."], ["Sichtbarkeit und Priorität", "Was fällt zuerst auf und was bleibt im Hintergrund?"], ["Regeln und Grenzen", "Wer darf was, wann und unter welchen Bedingungen?"]], "prompt": "Eine Gruppe erlaubt nur Admins, neue Mitglieder einzuladen. Welcher Bereich ist das?", "answer": "Regeln und Grenzen. Die Entscheidung legt fest, wer die Funktion nutzen darf.", "lists": [{"title": "Fünf Bereiche von Designentscheidungen", "items": ["Zweck und Nutzen", "Funktionen", "Interaktion und Verhalten", "Sichtbarkeit und Priorität", "Regeln und Grenzen"]}]}, "en": {"points": [["Purpose and value", "Who is the product for and what is it for?"], ["Functions and interaction", "Function = what is possible. Interaction = how action and feedback work."], ["Visibility and priority", "What gets noticed first and what stays in the background?"], ["Rules and limits", "Who can do what, when, and under what conditions?"]], "prompt": "A group lets only admins invite new members. Which area is this?", "answer": "Rules and limits. The choice determines who is allowed to use the feature.", "lists": [{"title": "Five areas of design decisions", "items": ["Purpose and value", "Functions", "Interaction and behavior", "Visibility and priority", "Rules and limits"]}]}}}, {"id": "problem-need-goal", "lecture": 1, "slides": "22–32", "en": {"title": "Problem, need, goal and solution", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Lecture example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Problem\u003c/td>\u003ctd>A situation is unsatisfactory for particular people.\u003c/td>\u003ctd>Students miss last-minute room changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Need\u003c/td>\u003ctd>What the affected people require.\u003c/td>\u003ctd>Reliable, timely information about changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Goal\u003c/td>\u003ctd>The desired state to achieve.\u003c/td>\u003ctd>Students notice relevant changes in time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solution\u003c/td>\u003ctd>A concrete way to reach that state.\u003c/td>\u003ctd>Push notifications, calendar updates, email, signs or a better organizational process.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A design problem is a situation worth improving without a single predetermined way to change it. It may involve frustration, wasted time, unmet needs, conflicting interests, new opportunities or unwanted effects.\u003c/p>\u003cp>\u003cstrong>Sequence:\u003c/strong> observe → understand the problem and affected people → question assumptions → formulate the desired change → develop alternatives → select and refine.\u003c/p>\u003cp>Problems depend on perspective. A group member may see overload, an administrator may see moderation work, and the organization may value growth or retention.\u003c/p>\u003cp class=\"recall\">Identify whose problem you are solving before choosing a solution. Solutions can create new problems, so design remains a learning process.\u003c/p>"}, "de": {"title": "Problem, Bedürfnis, Ziel und Lösung", "content": "\u003cul>\u003cli>\u003cstrong>Problem:\u003c/strong> Eine Situation funktioniert für bestimmte Menschen nicht zufriedenstellend. Beispiel: Studierende übersehen kurzfristige Raumänderungen.\u003c/li>\u003cli>\u003cstrong>Bedürfnis:\u003c/strong> Was benötigen Betroffene? Verlässliche und rechtzeitige Informationen.\u003c/li>\u003cli>\u003cstrong>Ziel:\u003c/strong> Welcher Zustand soll erreicht werden? Relevante Änderungen rechtzeitig wahrnehmen.\u003c/li>\u003cli>\u003cstrong>Lösung:\u003c/strong> Ein konkreter Weg dorthin: Push, Kalenderaktualisierung, E-Mail, Anzeige oder besserer organisatorischer Ablauf.\u003c/li>\u003c/ul>\u003cp>Ein Designproblem ist eine verbesserungswürdige Situation ohne bereits eindeutig festgelegte Veränderung. Es kann Frustration, Zeitverlust, unerfüllte Bedürfnisse, Interessenkonflikte, neue Möglichkeiten oder unerwünschte Folgen betreffen.\u003c/p>\u003cp>\u003cstrong>Vorgehen:\u003c/strong> Beobachten → Problem und Betroffene verstehen → Annahmen hinterfragen → gewünschte Veränderung formulieren → Alternativen entwickeln → auswählen und verbessern.\u003c/p>\u003cp>Mitglieder sehen möglicherweise Überlastung, Administration sieht Moderationsbedarf, die Organisation sieht Wachstum und Bindung.\u003c/p>\u003cp class='recall'>Kläre zuerst, aus wessen Perspektive das Problem besteht. Lösungen können neue Probleme schaffen: Design bleibt ein Lernprozess.\u003c/p>"}, "comparisons": [{"slides": "25–26", "de": {"title": "Problem vs. Bedürfnis vs. Ziel vs. Lösung", "columns": [["Problem", "Unbefriedigende bestehende Situation."], ["Bedürfnis", "Was Betroffene benötigen."], ["Ziel", "Gewünschter Zustand."], ["Lösung", "Konkrete Maßnahme zum Erreichen des Ziels."]], "tradeoff": "Gewünschte Veränderung und Umsetzung trennen. Mehrere digitale oder organisatorische Lösungen können dasselbe Bedürfnis adressieren."}, "en": {"title": "Problem vs. need vs. goal vs. solution", "columns": [["Problem", "An unsatisfactory existing situation."], ["Need", "What affected people require."], ["Goal", "The desired outcome."], ["Solution", "A concrete intervention to achieve the outcome."]], "tradeoff": "Separate the desired change from one implementation. Several digital or organizational solutions may address the same need."}}], "exam": {"de": {"points": [["Problem", "Was läuft für wen nicht gut? Studierende übersehen Raumänderungen."], ["Bedürfnis", "Was brauchen Betroffene? Rechtzeitige, verlässliche Informationen."], ["Ziel und Lösung", "Ziel = Änderungen rechtzeitig bemerken. Lösung = ein möglicher Weg, etwa Kalender oder Anzeige."], ["Vorgehen", "Situation beobachten → Betroffene verstehen → Annahmen prüfen → Ziel bestimmen → Lösungen vergleichen."]], "prompt": "Warum ist eine Push-Nachricht eine Lösung und das rechtzeitige Bemerken das Ziel?", "answer": "Die Push-Nachricht beschreibt das Mittel. Das Ziel beschreibt den gewünschten Zustand.", "lists": [{"title": "Vom Problem zur Lösung", "items": ["Problem", "Bedürfnis", "Ziel", "Lösung"]}, {"title": "Vorgehen", "items": ["Situation beobachten", "Betroffene verstehen", "Annahmen prüfen", "Ziel bestimmen", "Lösungen vergleichen"]}]}, "en": {"points": [["Problem", "What is going wrong, and for whom? Students miss room changes."], ["Need", "What do the people affected need? Timely, reliable information."], ["Goal and solution", "Goal = notice changes in time. Solution = one possible way, such as a calendar or display."], ["Process", "Observe the situation → understand those affected → question assumptions → define the goal → compare solutions."]], "prompt": "Why is a push notification a solution and noticing the change in time the goal?", "answer": "The notification is the means. The goal describes the desired situation.", "lists": [{"title": "From problem to solution", "items": ["Problem", "Need", "Goal", "Solution"]}, {"title": "Design process", "items": ["Observe the situation", "Understand the people affected", "Question assumptions", "Define the goal", "Compare solutions"]}]}}}, {"id": "definitions", "lecture": 1, "slides": "33–43", "en": {"title": "Definitions and ways of thinking about design", "content": "\u003cp>\u003cstrong>Word history in the lecture:\u003c/strong> Latin \u003cem>designare\u003c/em> and Italian \u003cem>disegnare\u003c/em> connect design with marking, drawing, planning and determining. Its industrial meaning developed with mass production in the nineteenth century.\u003c/p>\u003cdiv class=\"three\">\u003cdiv>\u003ch3>Craft\u003c/h3>\u003cp>Creating well-made, attractive objects that provide enjoyment.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>A way of thinking\u003c/h3>\u003cp>Investigating and rethinking situations with people and their lives at the center.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Strategic process\u003c/h3>\u003cp>Connecting creativity, research, technology, business and social or environmental value.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Herbert Simon:\u003c/strong> designing means devising actions that transform existing situations into preferred ones: current state → desired state.\u003c/p>\u003cp>\u003cstrong>Design Council:\u003c/strong> creativity is used to solve problems.\u003c/p>\u003cp>\u003cstrong>World Design Organization:\u003c/strong> design is a strategic, transdisciplinary problem-solving process connecting innovation, business success and quality of life.\u003c/p>\u003cp class=\"recall\">DDP working definition: Design deliberately shapes possibilities to change existing situations for people within technological, organizational and societal conditions.\u003c/p>\u003cp>Definitions are perspectives, not one final truth. Design can address problems, fulfill needs and create new possibilities.\u003c/p>"}, "de": {"title": "Definitionen und Denkweisen von Design", "content": "\u003cp>\u003cstrong>Begriffsgeschichte:\u003c/strong> Lateinisch \u003cem>designare\u003c/em> und italienisch \u003cem>disegnare\u003c/em> verbinden Design mit Bezeichnen, Umreißen, Zeichnen, Planen und Bestimmen. Die industrielle Bedeutung entwickelte sich mit der Massenproduktion im 19. Jahrhundert.\u003c/p>\u003cul>\u003cli>\u003cstrong>Handwerk:\u003c/strong> Gut gemachte, schöne und erfreuliche Dinge herstellen.\u003c/li>\u003cli>\u003cstrong>Denkweise:\u003c/strong> Situationen untersuchen und neu betrachten, mit Menschen und ihrer Lebenswelt im Mittelpunkt.\u003c/li>\u003cli>\u003cstrong>Strategischer Prozess:\u003c/strong> Kreativität, Forschung, Technik, Wirtschaft sowie sozialen und ökologischen Wert verbinden.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Herbert Simon:\u003c/strong> Handlungswege entwerfen, die bestehende in bevorzugte Situationen verwandeln: Ist → Soll.\u003c/p>\u003cp>\u003cstrong>Design Council:\u003c/strong> Kreativität zur Problemlösung einsetzen.\u003c/p>\u003cp>\u003cstrong>WDO:\u003c/strong> Strategischer, transdisziplinärer Problemlösungsprozess, der Innovation, Geschäftserfolg und Lebensqualität verbindet.\u003c/p>\u003cp class='recall'>DDP-Arbeitsdefinition: Design ist die bewusste Gestaltung von Möglichkeiten, um bestehende Situationen für Menschen innerhalb technologischer, organisatorischer und gesellschaftlicher Rahmenbedingungen zu verändern.\u003c/p>\u003cp>Definitionen sind Perspektiven statt einer endgültigen Wahrheit. Design bearbeitet Probleme, erfüllt Bedürfnisse und schafft Möglichkeiten.\u003c/p>"}, "comparisons": [{"slides": "37", "de": {"title": "Design als Handwerk vs. Design als Denkweise", "columns": [["Handwerk", "Sorgfältiges Herstellen mit Materialwissen und ästhetischen Qualitäten."], ["Denkweise", "Arbeits- und Lebenssituationen untersuchen, neu rahmen und gestalten."]], "tradeoff": "Handwerk schafft greifbare Qualität; die Denkweise erweitert den Gegenstand. Beide ergänzen einander."}, "en": {"title": "Design as craft vs. design as thinking", "columns": [["Craft", "Making objects with care, material knowledge and attractive qualities."], ["Thinking", "Investigating, reframing and shaping people’s working and living situations."]], "tradeoff": "Craft brings tangible quality; a thinking approach broadens what can be addressed. They complement each other rather than form an exclusive choice."}}], "exam": {"de": {"points": [["Herbert Simon", "Design entwirft Wege vom Ist-Zustand zum bevorzugten Soll-Zustand."], ["Drei Perspektiven", "Handwerk = gute Dinge herstellen. Denkweise = Situationen neu betrachten. Strategie = mehrere Disziplinen und Wertziele verbinden."], ["Design Council und WDO", "Design Council betont Kreativität zur Problemlösung. WDO verbindet Problemlösung mit Innovation, Geschäftserfolg und Lebensqualität."], ["DDP-Arbeitsdefinition", "Möglichkeiten bewusst gestalten, um Situationen für Menschen zu verändern. Technik, Organisation und Gesellschaft setzen den Rahmen."]], "prompt": "Was ist der gemeinsame Kern bei Simon und der DDP-Arbeitsdefinition?", "answer": "Beide verstehen Design als gezielte Veränderung einer bestehenden Situation. Simon betont den Übergang zu einem bevorzugten Zustand. Die DDP-Definition ergänzt den Fokus auf Menschen und ihre technologischen, organisatorischen und gesellschaftlichen Rahmenbedingungen.", "lists": [{"title": "Drei Perspektiven auf Design", "items": ["Handwerk", "Denkweise", "Strategischer Prozess"]}]}, "en": {"points": [["Herbert Simon", "Design devises ways to move from an existing situation to a preferred one."], ["Three perspectives", "Craft = make good things. Mindset = reframe situations. Strategy = connect disciplines and goals."], ["Design Council and WDO", "The Design Council emphasizes creative problem solving. WDO connects problem solving with innovation, business success and quality of life."], ["DDP working definition", "Deliberately shape possibilities to change situations for people. Technology, organization and society set the context."]], "prompt": "What do Simon and the DDP working definition have in common?", "answer": "Both see design as deliberately changing an existing situation. Simon emphasizes the move toward a preferred state. The DDP definition adds a focus on people and their technological, organizational and social constraints.", "lists": [{"title": "Three perspectives on design", "items": ["Craft", "Mindset", "Strategic process"]}]}}}, {"id": "disciplines-products", "lecture": 1, "slides": "44–51", "en": {"title": "Disciplines and the digital product", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Perspective\u003c/th>\u003cth>Typical question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Art\u003c/td>\u003ctd>What should be expressed, questioned or experienced?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Design\u003c/td>\u003ctd>How can a situation be meaningfully shaped or improved for people?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Computer science\u003c/td>\u003ctd>How can data and processes be implemented computationally?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Engineering\u003c/td>\u003ctd>How can the result operate reliably, securely and at scale?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These perspectives overlap and collaborate. Digital products also involve research, content, product management, marketing, law and security.\u003c/p>\u003ch3>A digital product has several layers\u003c/h3>\u003cul>\u003cli>\u003cstrong>Interface:\u003c/strong> what people see.\u003c/li>\u003cli>\u003cstrong>Interaction and behavior:\u003c/strong> actions and responses.\u003c/li>\u003cli>\u003cstrong>Content and information:\u003c/strong> what is communicated, organized and prioritized.\u003c/li>\u003cli>\u003cstrong>Technology and data:\u003c/strong> what makes it possible.\u003c/li>\u003cli>\u003cstrong>Service and organization:\u003c/strong> accounts, support, moderation, privacy and strategy.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Denzinger:\u003c/strong> products are artifacts that enable active use, whether physical or virtual. \u003cstrong>Oswald:\u003c/strong> design should examine use, interaction, social context, business models and societal impact.\u003c/p>\u003cp class=\"recall\">The product is more than the screen or the code: its use, service and organization matter too.\u003c/p>"}, "de": {"title": "Disziplinen und das digitale Produkt", "content": "\u003cul>\u003cli>\u003cstrong>Kunst:\u003c/strong> Was soll ausgedrückt, hinterfragt oder erfahrbar werden?\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> Wie wird eine Situation für Menschen sinnvoll gestaltet oder verändert?\u003c/li>\u003cli>\u003cstrong>Informatik:\u003c/strong> Wie werden Daten und Prozesse rechnerisch umgesetzt?\u003c/li>\u003cli>\u003cstrong>Engineering:\u003c/strong> Wie funktioniert die Umsetzung zuverlässig, sicher und skalierbar?\u003c/li>\u003c/ul>\u003cp>Die Perspektiven überschneiden sich. Forschung, Content, Produktmanagement, Marketing, Recht und Security tragen ebenfalls bei.\u003c/p>\u003ch3>Fünf Ebenen digitaler Produkte\u003c/h3>\u003col>\u003cli>Interface: Was Menschen sehen.\u003c/li>\u003cli>Interaktion und Verhalten: Handlungen und Reaktionen.\u003c/li>\u003cli>Inhalte und Informationen: Kommunikation, Ordnung und Priorisierung.\u003c/li>\u003cli>Technologie und Daten: Technische Grundlage.\u003c/li>\u003cli>Service und Organisation: Accounts, Support, Moderation, Datenschutz und Strategie.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Denzinger:\u003c/strong> Produkte ermöglichen aktive Nutzung, unabhängig von physischer oder virtueller Form. \u003cstrong>Oswald:\u003c/strong> Gestaltung muss Gebrauch, Interaktion, sozialen Kontext, Geschäftsmodell und gesellschaftliche Folgen betrachten.\u003c/p>\u003cp class='recall'>Ein digitales Produkt ist mehr als Bildschirm oder Code.\u003c/p>"}, "comparisons": [{"slides": "46–48", "de": {"title": "Kunst vs. Design vs. Informatik vs. Engineering", "columns": [["Kunst", "Ausdruck, Kritik, Bedeutung und ästhetische Erfahrung."], ["Design", "Sinnvolle Veränderung für Menschen, Bedürfnisse, Kontext und Folgen."], ["Informatik", "Algorithmen, Datenverarbeitung und Software."], ["Engineering", "Zuverlässige, sichere und wartbare technische Realisierung."]], "tradeoff": "Die Fragen überschneiden sich. Produkte benötigen Zusammenarbeit; keine Perspektive beantwortet alles."}, "en": {"title": "Art vs. design vs. computer science vs. engineering", "columns": [["Art", "Expression, critique, meaning and aesthetic experience."], ["Design", "Meaningful change for people, needs, context and consequences."], ["Computer science", "Algorithms, data processing and software."], ["Engineering", "Reliable, secure, maintainable technical realization."]], "tradeoff": "Different questions overlap. A working product requires collaboration; one perspective does not answer every question."}}], "exam": {"de": {"points": [["Kunst und Design", "Kunst fragt nach Ausdruck und Erfahrung. Design fragt nach Bedürfnissen, Nutzung und Folgen."], ["Informatik und Engineering", "Informatik fragt nach Verarbeitung von Daten. Engineering fragt nach zuverlässiger technischer Umsetzung."], ["Fünf Produktebenen", "Interface · Interaktion und Verhalten · Inhalte und Informationen · Technologie und Daten · Service und Organisation."], ["Zusammenspiel", "Eine Sprachnachricht muss im Alltag nützlich sein und technisch zuverlässig funktionieren."]], "prompt": "Ordne Audio-Kompression, zuverlässige Wiedergabe und Bedienung einer Sprachnachricht zu.", "answer": "Kompression → Informatik. Zuverlässige Wiedergabe → Engineering. Bedienung im Nutzungskontext → Design.", "lists": [{"title": "Vier Disziplinen", "items": ["Kunst", "Design", "Informatik", "Engineering"]}, {"title": "Fünf Ebenen eines digitalen Produkts", "items": ["Interface", "Interaktion und Verhalten", "Inhalte und Informationen", "Technologie und Daten", "Service und Organisation"]}]}, "en": {"points": [["Art and design", "Art asks about expression and experience. Design asks about needs, use and consequences."], ["Computer science and engineering", "Computer science asks how data is processed. Engineering asks how to make the implementation reliable."], ["Five product layers", "Interface · interaction and behavior · content and information · technology and data · service and organization."], ["Working together", "A voice message needs to be useful in context and technically reliable."]], "prompt": "Classify audio compression, reliable playback and the controls of a voice message.", "answer": "Compression → computer science. Reliable playback → engineering. Controls in context → design.", "lists": [{"title": "Four disciplines", "items": ["Art", "Design", "Computer science", "Engineering"]}, {"title": "Five layers of a digital product", "items": ["Interface", "Interaction and behavior", "Content and information", "Technology and data", "Service and organization"]}]}}}, {"id": "product-language", "lecture": 1, "slides": "52–58", "en": {"title": "Product functions and product language", "content": "\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>What it concerns\u003c/th>\u003cth>WhatsApp example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Practical–technical\u003c/td>\u003ctd>What the product enables in practice.\u003c/td>\u003ctd>Sending messages or making encrypted calls.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Economic\u003c/td>\u003ctd>Business purpose and commercial value.\u003c/td>\u003ctd>Retention, reach and business offerings.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ecological\u003c/td>\u003ctd>Resources, production and disposal.\u003c/td>\u003ctd>Consider device and infrastructure impacts; this is a practice application.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aesthetic / formal-aesthetic\u003c/td>\u003ctd>Perceivable form, color, material, layout and visual order.\u003c/td>\u003ctd>Green color scheme, chat bubbles, typography and spacing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Indicative — Anzeichenfunktion\u003c/td>\u003ctd>Clues to state, function or use.\u003c/td>\u003ctd>Check marks signal sent/delivered/read; a microphone indicates voice messaging.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Symbolic\u003c/td>\u003ctd>Social, cultural or emotional meanings.\u003c/td>\u003ctd>Closeness, identity, belonging and availability.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>The Offenbach approach\u003c/h3>\u003cp>Between the user and the product, the lecture distinguishes practical–technical, product-language/sensory and economic functions. Product-language functions include formal-aesthetic and sign-related functions; sign-related functions include \u003cstrong>indicative\u003c/strong> and \u003cstrong>symbolic\u003c/strong> functions.\u003c/p>\u003cp>\u003cstrong>Semiotics\u003c/strong> studies signs and meaning. Symbolic meaning is shaped by the people and contexts involved, not fixed completely by the designer.\u003c/p>\u003cp class=\"recall\">A check mark tells you a system state: indicative. A product standing for belonging or status: symbolic.\u003c/p>"}, "de": {"title": "Produktfunktionen und Produktsprache", "content": "\u003cul>\u003cli>\u003cstrong>Praktisch-technisch:\u003c/strong> Was ermöglicht das Produkt? Beispiele: Nachrichten senden, verschlüsselt telefonieren; Ergonomie, Handhabung, Haltbarkeit, Qualität und Sicherheit.\u003c/li>\u003cli>\u003cstrong>Ökonomisch:\u003c/strong> Wirtschaftlicher Zweck, Bindung, Reichweite und Geschäftsangebote.\u003c/li>\u003cli>\u003cstrong>Ökologisch:\u003c/strong> Ressourcen, Produktion und Entsorgung. Geräte- und Infrastruktureffekte sind eine Übungsanwendung.\u003c/li>\u003cli>\u003cstrong>Ästhetisch/formalästhetisch:\u003c/strong> Form, Farbe, Material, Layout und Ordnung; etwa Chat-Bubbles und Typografie.\u003c/li>\u003cli>\u003cstrong>Anzeichenfunktion:\u003c/strong> Hinweise auf Zustand, Funktion und Gebrauch; etwa Häkchen oder Mikrofon.\u003c/li>\u003cli>\u003cstrong>Symbolfunktion:\u003c/strong> Soziale, kulturelle und emotionale Bedeutung; etwa Identität, Nähe und Zugehörigkeit.\u003c/li>\u003c/ul>\u003ch3>Offenbacher Ansatz\u003c/h3>\u003cp>Zwischen Nutzer und Produkt unterscheidet die Vorlesung praktisch-technische, produktsprachlich-sinnliche und ökonomische Funktionen. Produktsprachliche Funktionen umfassen formalästhetische und zeichenhafte Funktionen; zeichenhafte Funktionen umfassen Anzeichen- und Symbolfunktion.\u003c/p>\u003cp>\u003cstrong>Semiotik\u003c/strong> untersucht Zeichen und Bedeutung. Symbolik entsteht mit den beteiligten Menschen und Kontexten.\u003c/p>\u003cp class='recall'>Häkchen als Zustandsanzeige: Anzeichenfunktion. Produkt als Zeichen von Zugehörigkeit: Symbolfunktion.\u003c/p>"}, "comparisons": [{"slides": "55–58", "de": {"title": "Anzeichenfunktion vs. Symbolfunktion", "columns": [["Anzeichen", "Hinweis auf Zustand, Funktion oder Gebrauch."], ["Symbolik", "Soziale, kulturelle oder emotionale Bedeutung."]], "tradeoff": "Beide kommunizieren auf unterschiedlichen Ebenen. Zustandszeichen müssen verständlich sein; Symbolik hängt auch von Menschen und Kultur ab."}, "en": {"title": "Indicative vs. symbolic function", "columns": [["Indicative", "A cue about state, function or use."], ["Symbolic", "Social, cultural or emotional meaning."]], "tradeoff": "Both communicate, but at different levels. A state cue should be understandable; symbolic interpretation also depends on people and culture."}}], "exam": {"de": {"points": [["Praktisch-technisch, ökonomisch, ökologisch", "Was leistet das Produkt? Welchen wirtschaftlichen Zweck erfüllt es? Welche Umweltwirkungen hat es?"], ["Formalästhetik", "Wie sind Form, Farbe, Layout oder Typografie gestaltet?"], ["Anzeichen und Symbol", "Anzeichen zeigen Zustand, Funktion oder Gebrauch. Symbole vermitteln soziale oder kulturelle Bedeutung."], ["Offenbacher Ansatz", "Produktsprache umfasst Formalästhetik und Zeichenfunktionen. Zeichenfunktionen umfassen Anzeichen und Symbole."]], "prompt": "Häkchen zeigen Zustellung. Eine App steht für Zugehörigkeit. Wie heißen die Funktionen?", "answer": "Zustellung → Anzeichenfunktion. Zugehörigkeit → Symbolfunktion.", "lists": [{"title": "Produktfunktionen und Produktsprache", "items": ["Praktisch-technische Funktion", "Ökonomische Funktion", "Ökologische Funktion", "Formalästhetische Funktion", "Anzeichenfunktion", "Symbolfunktion"]}]}, "en": {"points": [["Practical, economic and ecological", "What does the product do? What economic purpose does it serve? What environmental effects does it have?"], ["Formal aesthetics", "How are form, color, layout or typography designed?"], ["Indicator and symbol", "Indicators show a state, function or use. Symbols communicate social or cultural meaning."], ["Offenbach approach", "Product language includes formal aesthetics and sign functions. Sign functions include indicators and symbols."]], "prompt": "Checkmarks show delivery. An app represents belonging. What are the functions?", "answer": "Delivery → indicator function. Belonging → symbolic function.", "lists": [{"title": "Product functions and product language", "items": ["Practical and technical function", "Economic function", "Ecological function", "Formal aesthetic function", "Indicator function", "Symbolic function"]}]}}}, {"id": "good-design", "lecture": 1, "slides": "59–63", "en": {"title": "Good design and Dieter Rams", "content": "\u003cp>Good design makes the product understandable and usable, addresses the relationship between person and object, supports problem solving, and considers resource conservation, reuse and longevity.\u003c/p>\u003cp>Rams contrasts calm, unobtrusive design with aggressive stimulation that adds to confusion.\u003c/p>\u003ch3>Ten principles in the lecture’s order\u003c/h3>\u003col>\u003cli>\u003cstrong>Innovative:\u003c/strong> develops with technological possibilities.\u003c/li>\u003cli>\u003cstrong>Useful:\u003c/strong> supports the product’s purpose.\u003c/li>\u003cli>\u003cstrong>Understandable:\u003c/strong> explains the product.\u003c/li>\u003cli>\u003cstrong>Aesthetic:\u003c/strong> contributes to use and well-being.\u003c/li>\u003cli>\u003cstrong>Honest:\u003c/strong> does not pretend to have capabilities it lacks.\u003c/li>\u003cli>\u003cstrong>Unobtrusive:\u003c/strong> allows the product to recede into the background.\u003c/li>\u003cli>\u003cstrong>Long-lasting:\u003c/strong> avoids dependence on passing fashion.\u003c/li>\u003cli>\u003cstrong>Thorough down to the last detail:\u003c/strong> careful and consistent.\u003c/li>\u003cli>\u003cstrong>Environmentally friendly:\u003c/strong> conserves resources and reduces physical and visual pollution.\u003c/li>\u003cli>\u003cstrong>As little design as possible:\u003c/strong> simple and focused on essentials.\u003c/li>\u003c/ol>\u003cp class=\"recall\">Do more than recite the list: explain a principle using a product decision.\u003c/p>"}, "de": {"title": "Gutes Design und Dieter Rams", "content": "\u003cp>Gutes Design macht Funktion und Handhabung verständlich, unterstützt Problemlösung und betrachtet Mensch–Objekt-Beziehungen sowie Ressourcenschonung, Wiederverwendung und Langlebigkeit.\u003c/p>\u003cp>Rams stellt ruhiges, unaufdringliches Design einer reizintensiven Gestaltung gegenüber, die Verwirrung verstärkt.\u003c/p>\u003ch3>Zehn Thesen in der Reihenfolge der Folien\u003c/h3>\u003col>\u003cli>\u003cstrong>Innovativ:\u003c/strong> mit technischen Möglichkeiten weiterentwickeln.\u003c/li>\u003cli>\u003cstrong>Brauchbar:\u003c/strong> den Produktzweck unterstützen.\u003c/li>\u003cli>\u003cstrong>Verständlich:\u003c/strong> das Produkt erklären.\u003c/li>\u003cli>\u003cstrong>Ästhetisch:\u003c/strong> Gebrauch und Wohlbefinden fördern.\u003c/li>\u003cli>\u003cstrong>Ehrlich:\u003c/strong> keine Funktionalität vortäuschen.\u003c/li>\u003cli>\u003cstrong>Unaufdringlich:\u003c/strong> das Produkt zurücktreten lassen.\u003c/li>\u003cli>\u003cstrong>Langlebig:\u003c/strong> kurzfristige Mode vermeiden.\u003c/li>\u003cli>\u003cstrong>Konsequent:\u003c/strong> gründlich und genau bis ins Detail.\u003c/li>\u003cli>\u003cstrong>Umweltfreundlich:\u003c/strong> Ressourcen und physische wie visuelle Umwelt schonen.\u003c/li>\u003cli>\u003cstrong>So wenig Design wie möglich:\u003c/strong> einfach und wesentlich.\u003c/li>\u003c/ol>\u003cp class='recall'>Erkläre Prinzipien an konkreten Entscheidungen, statt nur die Liste aufzusagen.\u003c/p>"}, "comparisons": [], "exam": {"de": {"points": [["Rams, 1–3", "Innovativ · brauchbar · verständlich."], ["Rams, 4–6", "Ästhetisch · ehrlich · unaufdringlich."], ["Rams, 7–10", "Langlebig · konsequent bis ins Detail · umweltfreundlich · so wenig Design wie möglich."], ["Prüfungsbeispiel", "Eine klare Fehlermeldung mit nächstem Schritt macht die Bedienung verständlich."]], "prompt": "Wie zeigst du im Prüfungsbeispiel, dass du eine Rams-These verstanden hast?", "answer": "Gutes Design macht ein Produkt verständlich. Bei einer fehlgeschlagenen Zahlung zeigt die App, was passiert ist und wie man es erneut versucht. So erkennen Nutzer*innen den Zustand und wissen, was sie als Nächstes tun können.", "lists": [{"title": "Dieter Rams: Zehn Thesen für gutes Design", "items": ["Innovativ", "Brauchbar", "Verständlich", "Ästhetisch", "Ehrlich", "Unaufdringlich", "Langlebig", "Konsequent bis ins Detail", "Umweltfreundlich", "So wenig Design wie möglich"]}]}, "en": {"points": [["Rams, 1–3", "Innovative · useful · understandable."], ["Rams, 4–6", "Aesthetic · honest · unobtrusive."], ["Rams, 7–10", "Long-lasting · thorough down to the last detail · environmentally friendly · as little design as possible."], ["Exam example", "A clear error message with a next step makes the product easier to understand."]], "prompt": "How do you show in an exam example that you understand one of Rams’s principles?", "answer": "Good design makes a product understandable. When a payment fails, the app explains what happened and how to try again. Users can identify the current state and know what to do next.", "lists": [{"title": "Dieter Rams: Ten principles for good design", "items": ["Innovative", "Useful", "Understandable", "Aesthetic", "Honest", "Unobtrusive", "Long-lasting", "Thorough down to the last detail", "Environmentally friendly", "As little design as possible"]}]}}}], "slide10": {"slides": "9–13, 19–20", "de": {"prompt": "Sind das alles gestalterische Entscheidungen? Ordne die Beispiele zu WhatsApp auf Folie 10 ein.", "answer": "Im weiteren Sinn gestalten technische, organisatorische und gestalterische Entscheidungen gemeinsam das Produkt. Eine bewusst gewählte Lesebestätigung ist eine Entscheidung über Systemverhalten. Erwartungsdruck durch Lesebestätigungen ist eine mögliche soziale Folge. Ende-zu-Ende-Verschlüsselung ist eine technische und strategische Entscheidung, die den Datenschutz und damit die Nutzung prägt. Unterscheide die gewählte Regel, ihre technische Umsetzung und ihre Auswirkungen."}, "en": {"prompt": "Are all the WhatsApp examples on slide 10 design decisions? Classify them.", "answer": "In the broad sense, design, technical and organizational choices jointly shape the product. Choosing to show a read receipt is a decision about system behavior. Pressure to reply is a possible social effect. End-to-end encryption is a technical and strategic choice that shapes privacy and use. Distinguish the chosen rule, its implementation and its effects."}}}</script>
<script>
"use strict";
const root = document.getElementById("root");
if (!window.React || !window.ReactDOM) {
  root.textContent = "React konnte nicht geladen werden. Prüfe die Internetverbindung und lade neu. / React could not load. Check your internet connection and reload.";
} else {
const {createElement:h,useEffect,useRef,useState} = React;
const {chapters,slide10} = JSON.parse(document.getElementById("study-data").textContent);
const storeName = "progress";
const key = "design-verstehen:study-notes";
const initial = {lang:"de", active:0, read:{}};
const ui = {
  de:{title:"Design verstehen", subtitle:"Lernskript · Vorlesung 01", contents:"Kapitel", slides:"Folien", slide:"Folie", comparisons:"Unterschiede und Zielkonflikte", mark:"Als gelesen markieren", unmark:"Als ungelesen markieren", read:"gelesen", previous:"Vorheriges Kapitel", next:"Nächstes Kapitel", loading:"Lernstand wird geladen …", unavailable:"Lokales Speichern ist in diesem Browser gerade nicht verfügbar.", source:"Quelle: Victoria Kaiselgruber, Design digitaler Produkte – Design verstehen, WS 2026/27."},
  en:{title:"Understanding design", subtitle:"Study notes · Lecture 01", contents:"Chapters", slides:"Slides", slide:"Slide", comparisons:"Differences and trade-offs", mark:"Mark as read", unmark:"Mark as unread", read:"read", previous:"Previous chapter", next:"Next chapter", loading:"Loading progress …", unavailable:"Local storage is currently unavailable in this browser.", source:"Source: Victoria Kaiselgruber, Design digitaler Produkte – Design verstehen, WS 2026/27."}
};
const audioUi = {
  de:{read:"Lesen", listen:"Hörversion", play:"Kapitel vorlesen", pause:"Pause", resume:"Fortsetzen", stop:"Stopp", speed:"Tempo", unsupported:"Dieser Browser unterstützt das Vorlesen nicht.", error:"Die Wiedergabe konnte nicht gestartet oder fortgesetzt werden. Prüfe, ob eine deutsche Stimme im Browser verfügbar ist.", playing:"Wiedergabe", paused:"Pausiert", finished:"Kapitel fertig vorgelesen"},
  en:{read:"Read", listen:"Listen", play:"Read chapter aloud", pause:"Pause", resume:"Resume", stop:"Stop", speed:"Speed", unsupported:"This browser does not support text to speech.", error:"Playback could not start or continue. Check whether an English voice is available in your browser.", playing:"Playing", paused:"Paused", finished:"Chapter finished"}
};
const reviewUi = {
  de:{tab:"Kurzreview", views:"Lernansicht", points:"Das solltest du dir merken", recall:"Mögliche Prüfungsfrage", answer:"Musterantwort"},
  en:{tab:"Exam Review", views:"Study view", points:"What to memorize", recall:"Possible exam question", answer:"Model answer"}
};
const modes = ["read","listen","review"];
function ExamReview({chapter,lang}) {
  const t=reviewUi[lang];
  const review=chapter.exam[lang];
  return h(React.Fragment,null,
    ...review.lists.map(({title,items})=>h("section",{key:title},
      h("h3",null,title),
      h("ol",null,...items.map(item=>h("li",{key:item},item))))),
    h("h3",null,t.points),
    h("dl",null,...review.points.map(([term,definition])=>h(React.Fragment,{key:term},
      h("dt",null,term),h("dd",null,definition)))),
    h("section",{className:"response"},
      h("h3",null,t.recall),h("p",null,review.prompt),
      h("h3",null,t.answer),h("p",null,review.answer)));
}
function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("DDP-study-progress", 1);
    request.onupgradeneeded = () => request.result.createObjectStore(storeName);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Database upgrade is blocked"));
  });
}
function readProgress(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readonly");
    const request = transaction.objectStore(storeName).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
function writeProgress(db, progress) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, "readwrite");
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore(storeName).put(progress, key);
  });
}

function narration(chapter, lang, first) {
  const doc = new DOMParser().parseFromString(chapter[lang].content,"text/html");
  const blocks = Array.from(doc.body.querySelectorAll("h2,h3,h4,p,li,dt,dd,tr"),node =>
    node.matches("tr") ? Array.from(node.cells,cell=>cell.textContent.trim()).join(". ") :
    Array.from(node.childNodes,child=>child.nodeType===1 && child.matches("ul,ol") ? "" : child.textContent).join("").trim());
  const opening = [chapter[lang].title,...blocks];
  if (first) opening.push("WhatsApp",slide10[lang].answer);
  if (chapter.comparisons.length) opening.push(ui[lang].comparisons);
  const comparisons = chapter.comparisons.flatMap(comparison=>{
    const part = comparison[lang];
    return [part.title,...part.columns.map(([name,value])=>name+". "+value),part.tradeoff];
  });
  return [...opening,...comparisons].filter(Boolean).flatMap(block=>{
    const normalized = block.replace(/\s+/g," ").trim();
    const pieces = normalized.match(/.{1,220}(?:\s|$)|\S+/gu) || [];
    return pieces.map(piece=>piece.trim()).filter(Boolean);
  });
}
function ChapterAudio({chapter,lang,first}) {
  const t=audioUi[lang];
  const synth=window.speechSynthesis;
  const supported=Boolean(synth && window.SpeechSynthesisUtterance);
  const [status,setStatus]=useState("idle");
  const [rate,setRate]=useState(1);
  const session=useRef(0);
  const utterance=useRef(null);
  useEffect(()=>()=>{session.current++;if(utterance.current)synth?.cancel();utterance.current=null;},[synth]);
  function stop() {
    session.current++;
    synth.cancel();
    utterance.current=null;
    setStatus("idle");
  }
  function play() {
    stop();
    const segments=narration(chapter,lang,first);
    const id=session.current;
    const locale=lang==="de"?"de-DE":"en-GB";
    const voices=synth.getVoices();
    const voice=voices.find(candidate=>candidate.lang.toLowerCase()===locale.toLowerCase())
      || voices.find(candidate=>candidate.lang.toLowerCase().split(/[-_]/)[0]===lang);
    function speak(index) {
      if (id!==session.current) return;
      if (index>=segments.length) {utterance.current=null;setStatus("finished");return;}
      const next=new SpeechSynthesisUtterance(segments[index]);
      next.lang=voice?.lang||locale;
      if (voice) next.voice=voice;
      next.rate=rate;
      next.onend=()=>speak(index+1);
      next.onerror=()=>{if(id===session.current){utterance.current=null;setStatus("error");}};
      utterance.current=next;
      synth.speak(next);
    }
    setStatus("playing");
    speak(0);
  }
  const playing=status==="playing"||status==="paused";
  if (!supported) return h("p",{role:"status"},t.unsupported);
  return h("div",{className:"audio-player"},
    h("div",{className:"row"},
      h("button",{className:"primary",onClick:play,disabled:playing},t.play),
      h("button",{disabled:!playing,onClick:()=>{
        if(status==="paused"){synth.resume();setStatus("playing");}
        else{synth.pause();setStatus("paused");}
      }},status==="paused"?t.resume:t.pause),
      h("button",{onClick:stop,disabled:!playing},t.stop),
      h("label",{htmlFor:"speech-rate"},t.speed),
      h("select",{id:"speech-rate",value:rate,disabled:playing,onChange:event=>setRate(Number(event.target.value))},
        ...[0.75,1,1.25,1.5].map(speed=>h("option",{key:speed,value:speed},speed+"×")))),
    h("p",{role:"status",className:status==="error"?"warning":"progress"},t[status]||""));
}
function StudyNotes() {
  const [state,setState] = useState(initial);
  const [tab,setTab] = useState("read");
  const [ready,setReady] = useState(false);
  const [unavailable,setUnavailable] = useState(false);
  const db = useRef(null);
  const current = useRef(initial);
  const heading = useRef(null);
  const focus = useRef(false);
  useEffect(() => {
    let live = true;
    async function load() {
      try {
        const connection = await openDb();
        if (!live) { connection.close(); return; }
        db.current = connection;
        connection.onversionchange = () => {
          connection.close();
          db.current = null;
          if (live) setUnavailable(true);
        };
        const value = await readProgress(connection);
        if (live && value) {
          current.current = {
            lang:value.lang === "en" ? "en" : "de",
            active:Number.isInteger(value.active) && chapters[value.active] ? value.active : 0,
            read:value.read || {}
          };
          setState(current.current);
        }
      } catch {
        db.current?.close();
        db.current = null;
        if (live) setUnavailable(true);
      } finally {
        if (live) setReady(true);
      }
    }
    load();
    return () => {live=false;db.current?.close();};
  },[]);
  useEffect(() => {document.documentElement.lang=state.lang;},[state.lang]);
  useEffect(() => {
    if (focus.current) {heading.current?.focus();focus.current=false;}
  },[state.active]);
  function update(patch) {
    current.current = {...current.current,...patch};
    setState(current.current);
    if (db.current) writeProgress(db.current,current.current).catch(() => setUnavailable(true));
  }
  function openChapter(index) {
    if (index === state.active || !chapters[index]) return;
    focus.current=true;
    update({active:index});
  }
  const {lang,active,read} = state;
  const t=ui[lang];
  const audio=audioUi[lang];
  const chapter=chapters[active];
  const readCount=chapters.filter(c=>read[c.id]).length;
  const isRead=Boolean(read[chapter.id]);

  return h(React.Fragment,null,
    h("header",{className:"top"},h("div",{className:"shell"},
      h("span",{className:"brand"},"DDP · WS 2026/27"),
      h("div",{className:"languages",role:"group","aria-label":"Sprache / Language"},
        ...["de","en"].map(l=>h("button",{key:l,lang:l,disabled:!ready,"aria-label":l==="de"?"Deutsch":"English","aria-pressed":lang===l,onClick:()=>update({lang:l})},l.toUpperCase()))))),
    h("section",{className:"hero"},h("div",{className:"shell"},h("div",{className:"eyebrow"},t.subtitle),h("h1",null,t.title))),
    !ready ? h("main",{className:"shell",role:"status"},t.loading) :
    h("main",{className:"shell layout"},
      h("aside",{className:"panel"},
        h("h2",{className:"meta"},t.contents),
        h("nav",{className:"notes-nav","aria-label":t.contents},
          ...chapters.map((c,i)=>h("button",{key:c.id,"aria-current":active===i?"true":undefined,"aria-pressed":active===i,onClick:()=>openChapter(i)},read[c.id]?"✓ ":"",c[lang].title))),
        h("p",{className:"progress"},readCount+" / "+chapters.length+" "+t.read),
        h("progress",{max:chapters.length,value:readCount,"aria-label":t.read}),
        unavailable&&h("p",{className:"progress warning",role:"status"},t.unavailable)),
      h("article",{className:"card chapter","aria-labelledby":"chapter-title"},
        h("div",{className:"meta"},t.slides+" "+chapter.slides),
        h("h2",{id:"chapter-title",ref:heading,tabIndex:-1},chapter[lang].title),
        h("div",{className:"row mode-tabs",role:"tablist","aria-label":reviewUi[lang].views,
          onKeyDown:event=>{
            if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
            event.preventDefault();
            const step=event.key==="ArrowRight"?1:-1;
            const next=event.key==="Home"?modes[0]:event.key==="End"?modes.at(-1):
              modes[(modes.indexOf(tab)+step+modes.length)%modes.length];
            setTab(next);
            document.getElementById("mode-"+next)?.focus();
          }},
          ...modes.map(mode=>h("button",{key:mode,id:"mode-"+mode,role:"tab",tabIndex:mode===tab?0:-1,
            "aria-selected":mode===tab,"aria-controls":"chapter-mode",onClick:()=>setTab(mode)},mode==="review"?reviewUi[lang].tab:audio[mode]))),
        h("div",{id:"chapter-mode",role:"tabpanel","aria-labelledby":"mode-"+tab,tabIndex:0},
          tab==="listen" ? h(ChapterAudio,{key:chapter.id+":"+lang,chapter,lang,first:active===0}) :
          tab==="review" ? h(ExamReview,{key:chapter.id+":"+lang,chapter,lang}) :
          h(React.Fragment,null,
        h("div",{dangerouslySetInnerHTML:{__html:chapter[lang].content}}),
        active===0&&h("section",{className:"response"},h("h3",null,"WhatsApp · "+t.slide+" 10"),h("p",null,slide10[lang].answer)),
        chapter.comparisons.length>0&&h("section",null,
          h("h3",null,t.comparisons),
          ...chapter.comparisons.map(c=>h("details",{key:c[lang].title},
            h("summary",null,c[lang].title),
            h("p",{className:"meta"},t.slides+" "+c.slides),
            h("table",{className:"comparison","aria-label":c[lang].title},
              h("tbody",null,...c[lang].columns.map(([name,value])=>h("tr",{key:name},h("th",{scope:"row"},name),h("td",null,value))))),
            h("p",null,c[lang].tradeoff)))))),
        h("button",{className:"primary","aria-pressed":isRead,onClick:()=>update({read:{...read,[chapter.id]:!isRead}})},isRead?t.unmark:t.mark),
        h("div",{className:"row between navigation"},
          h("button",{disabled:active===0,onClick:()=>openChapter(active-1)},"← "+t.previous),
          h("button",{disabled:active===chapters.length-1,onClick:()=>openChapter(active+1)},t.next+" →")))),
    h("footer",null,h("div",{className:"shell"},t.source)));
}
ReactDOM.createRoot(root).render(h(StudyNotes));
}

</script>
</body>
</html>
